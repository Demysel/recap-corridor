    const J=list.flatMap(a=>a.jours.filter(j=>!j.horsPeriode).map(j=>({j,a}))).sort((x,y)=>x.j.date.localeCompare(y.j.date));
    const isRepos=j=>j.kind==='CODE'&&!j.rpDouble&&FAM_REPOS.includes(j.family);
    const p={pk,nom:last.nom,prenom:last.prenom,agence:last.agence,metier:last.metier,jours:J.length,
      reposPris:0,reposDus:null,doublesDus:0,weDus:0,doublesWE:0,weekends:0,weekendsPossibles:0,periodesRepos:0,reposDoubles:0,reposCourts:[],
      joursService:0,tte:0,heuresSup:0,absences:0,absParCode:{},
      hCmd:0,neutre:0,neutreVoy:0,nbCourtes:0,nbTraj:0,hTraj:0,joursTrajSeul:0,jb:0,autresVides:0,dispo:0,atcmd:0,
      nbRHR:0,rhrNuits:0,rhrLong:0,rhrLieux:{},ecartsPrise:[],alternances:0,enchainements:0};
    for(const a of list){
      p.tte+=a.heuresPlanifiees||0; p.heuresSup+=a.heuresSup||0; p.jb+=a.journeesBlanches||0;
      p.autresVides+=Math.max(0,(a.joursVides||0)-(a.journeesBlanches||0)); p.dispo+=a.nbDISPO||0; p.atcmd+=a.nbATCMD||0;
      p.absences+=a.joursAbsence||0;
      for(const [k,v] of Object.entries(a.codeCounts||{})) if(!FAM_REPOS.includes(k)&&!FAM_CONGES.includes(k)&&k!=='HORS') p.absParCode[k]=(p.absParCode[k]||0)+v;
      for(const r of a.rhr||[]){ p.nbRHR++; p.rhrNuits+=r.nuits||0; if(r.dureeH!=null&&r.dureeH>(R.rhrMaxAbsence||44)) p.rhrLong++; if(r.lieu) p.rhrLieux[r.lieu]=(p.rhrLieux[r.lieu]||0)+1; }
      const wd=a.jours; if(!wd[5].horsPeriode&&!wd[6].horsPeriode){ p.weekendsPossibles++; if(isRepos(wd[5])&&isRepos(wd[6])) p.weekends++; }
    }
    // repos : pris (codes choisis dans Réglages), dus au prorata des jours présents dans les fichiers
    // repos dus : nombre réglé à la main, sinon l'accord (117 RP / an conducteurs, 113 AFR et coordinateurs), au prorata des jours présents
    const Acc=accordOf(R), rpAn=isAFR(last.metier)?Acc.continuite.rpAn:Acc.roulant.rpAn;
    const nDus=nDusDe(last.metier);
    p.reposDus=nDus?J.reduce((s,{j})=>s+nDus*partJour(j.date),0):J.reduce((s,{j})=>s+rpAn/diy(j.date),0);
    p.doublesDus=J.reduce((s,{j})=>s+Acc.rdAn/diy(j.date),0); p.weDus=J.reduce((s,{j})=>s+Acc.rdWeAn/diy(j.date),0);
    let run=0, prev=null, prevSvc=null;
    const resSet=a=>new Set([a.residence,...(a.rattachement||a.residencePerso?[]:((R.lieuxResidence||{})[a.agence]||[]))].filter(Boolean).map(normLieu));
    for(const {j,a} of J){
      if(j.kind==='CODE'&&!j.rpDouble&&codesR.includes(j.family)) p.reposPris++;
      // périodes de repos : jours de repos consécutifs (RP, RF, JF, RCL, RCC), « doubles » à partir de 2 jours
      const suite=prev&&jDiff(prev,j.date)===1, rp=j.kind==='CODE'&&j.family==='RP';
      // repos double : au moins deux RP d'affilée (RP seulement, choix de l'utilisateur) ; samedi-dimanche compté à part
      if(rp){ run=suite&&run?run+1:1; if(run===1) p.periodesRepos++; if(run===2){ p.reposDoubles++; if(new Date(Date.parse(j.date+'T00:00:00Z')).getUTCDay()===0) p.doublesWE++; } } else run=0;
      prev=j.date;
      if(j.kind!=='SERVICE'||!j.missions||!j.missions.length) continue;
      p.joursService++;
      const ms=[...j.missions].sort((x,y)=>Date.parse(x.start)-Date.parse(y.start));
      for(const m of ms){
        if(tts(m)){ p.nbTraj++; p.hTraj+=reel(m); }
        if(isATCMD(m)||/DISPO/i.test(m.label||'')) p.hCmd+=missionMinutes(m).amp/60;
        if(missionCourte(m,R)){ const d=Math.max(0,R.minMission-reel(m)); p.nbCourtes++; p.neutre+=d; if(tts(m)) p.neutreVoy+=d; }
      }
      if(ms.every(tts)) p.joursTrajSeul++;
      const cur={date:j.date,prise:hOf(ms[0].start),start:ms[0].start,end:ms[ms.length-1].end,to:ms[ms.length-1].to,nuit:((a.parJour||[])[j.d]||{}).nuit>0,a};
      if(prevSvc&&jDiff(prevSvc.date,cur.date)===1){
        let e=Math.abs(cur.prise-prevSvc.prise); e=Math.min(e,24-e); p.ecartsPrise.push(e);
        p.enchainements++; if(cur.nuit!==prevSvc.nuit) p.alternances++;
      }
      // repos journalier à la résidence plus court que le minimum réglé (entre deux jours de service)
      if(resMin&&prevSvc&&jDiff(prevSvc.date,cur.date)<=2&&resSet(prevSvc.a).has(normLieu(prevSvc.to))){
        const g=(Date.parse(cur.start)-Date.parse(prevSvc.end))/H; if(g>=0&&g<resMin) p.reposCourts.push({fin:prevSvc.end,reprise:cur.start,h:rM(g)});
      }
      prevSvc=cur;
    }
    p.ecartPrise=p.ecartsPrise.length?p.ecartsPrise.reduce((s,x)=>s+x,0)/p.ecartsPrise.length:null;
    for(const k of ['tte','heuresSup','neutre','neutreVoy','hTraj','hCmd']) p[k]=rM(p[k]);
    personnes.push(p);
  }
  // rééquilibrage : même agence, même métier, même semaine — heures sup d'un côté, heures sous le seuil de l'autre
  // (agents présents toute la semaine, sans congé ni absence)
  const reeq=[];
  for(const [k,l] of groupBy(rows.filter(a=>!a.partiel),a=>a.agence+'|'+a.metier+'|'+a.weekId)){
    const hs=l.reduce((s,a)=>s+(a.heuresSup||0),0);
    const libres=l.filter(a=>!a.joursCP&&!a.joursAbsence&&!(a.codeCounts||{}).HORS&&(a.heuresPlanifiees||0)<R.seuilHebdo);
    const dispo=libres.reduce((s,a)=>s+(R.seuilHebdo-(a.heuresPlanifiees||0)),0);
    if(hs>0&&dispo>0){ const [agence,metier,weekId]=k.split('|'); reeq.push({agence,metier,weekId,hs:rM(hs),dispo:rM(dispo),possible:rM(Math.min(hs,dispo)),nbSup:l.filter(a=>a.heuresSup>0).length,nbLibres:libres.length}); }
  }
  // optimisation des plannings (idée de l'utilisateur) : un trajet seul X → Y aurait-il pu être remplacé par un train
  // productif X → Y assuré par un autre agent du même métier, qui part entre l'arrivée de l'agent à X et le départ
  // prévu du trajet seul + la fenêtre réglée ? Piste à vérifier (habilitations, connaissance de ligne, repos).
  const trains=new Map(), fen=(Number(P.optiFenetre)||0)*H;
  for(const a of pool||[]) for(const j of a.jours||[]) if(j.kind==='SERVICE') for(const m of j.missions||[]){
    if(!productif(m)||!m.from||!m.to) continue;
    const k=normLieu(m.from)+'>'+normLieu(m.to); if(!trains.has(k)) trains.set(k,[]);
    trains.get(k).push({m,a,pk:personKey(a),j});
  }
  const pistes=[];
  for(const a of rows){
    const ms=a.jours.filter(j=>j.kind==='SERVICE').flatMap(j=>(j.missions||[]).map(m=>({m,j}))).sort((x,y)=>Date.parse(x.m.start)-Date.parse(y.m.start));
    ms.forEach(({m,j},i)=>{
      if(j.horsPeriode||!tts(m)||!m.from||!m.to||normLieu(m.from)===normLieu(m.to)) return;
      const t0=Date.parse(m.start), pr=ms[i-1];
      const dispo=pr&&normLieu(pr.m.to)===normLieu(m.from)&&t0-Date.parse(pr.m.end)<=12*H?Date.parse(pr.m.end):t0;
      const c=(trains.get(normLieu(m.from)+'>'+normLieu(m.to))||[]).filter(x=>x.pk!==personKey(a)&&isAFR(x.a.metier)===isAFR(a.metier)
        &&Date.parse(x.m.start)>=dispo&&Date.parse(x.m.start)<=t0+fen).sort((x,y)=>Math.abs(Date.parse(x.m.start)-t0)-Math.abs(Date.parse(y.m.start)-t0))[0];
      if(!c) return;
      const bMs=(c.j.missions||[]), cs=Date.parse(c.m.start);
      const venuEnVoy=bMs.some(n=>tts(n)&&normLieu(n.to)===normLieu(c.m.from)&&Date.parse(n.end)<=cs&&cs-Date.parse(n.end)<=6*H);
      pistes.push({pk:personKey(a),nom:`${a.nom} ${a.prenom}`.trim(),agence:a.agence,metier:a.metier,date:j.date,
        traj:{label:m.label,from:m.from,to:m.to,start:m.start,end:m.end,h:rM(reel(m))},
        train:{label:c.m.label,from:c.m.from,to:c.m.to,start:c.m.start,end:c.m.end,nom:`${c.a.nom} ${c.a.prenom}`.trim(),agence:c.a.agence},
        venuEnVoy, journeeEco:venuEnVoy&&bMs.every(n=>n===c.m||tts(n))});
    });
  }
  pistes.sort((x,y)=>x.traj.start.localeCompare(y.traj.start));
  // ATCMD (attente de la commande) et DISPO (disponible à l'agence) : temps payé sans train, à faire disparaître (objectif de
  // l'utilisateur). Piste : un train productif qui part du lieu de l'agent pendant sa plage, assuré par un autre agent du même
  // métier — de préférence un agent venu en trajet seul pour ce train (son trajet, voire sa journée, serait économisé).
  const depuis=new Map();
  for(const [k,l] of trains){ const f=k.split('>')[0]; if(!depuis.has(f)) depuis.set(f,[]); depuis.get(f).push(...l); }
  const pistesCmd=[];
  for(const a of rows) for(const j of a.jours) if(j.kind==='SERVICE'&&!j.horsPeriode) for(const m of j.missions||[]){
    if(!(isATCMD(m)||/DISPO/i.test(m.label||''))) continue;
    const lieu=normLieu(m.from||m.to||a.residence||''), t0=Date.parse(m.start), t1=Date.parse(m.end);
    const cands=(depuis.get(lieu)||[]).filter(x=>x.pk!==personKey(a)&&isAFR(x.a.metier)===isAFR(a.metier)&&Date.parse(x.m.start)>=t0&&Date.parse(x.m.start)<t1)
      .map(x=>{ const cs=Date.parse(x.m.start), ms=x.j.missions||[], voy=ms.some(n=>tts(n)&&normLieu(n.to)===lieu&&Date.parse(n.end)<=cs&&cs-Date.parse(n.end)<=6*H);
        return {...x,voy,eco:voy&&ms.every(n=>n===x.m||tts(n))}; })
      .sort((x,y)=>(y.eco-x.eco)||(y.voy-x.voy)||(Date.parse(x.m.start)-Date.parse(y.m.start)));
    const c=cands[0];
    pistesCmd.push({pk:personKey(a),nom:`${a.nom} ${a.prenom}`.trim(),agence:a.agence,metier:a.metier,date:j.date,
      slot:{label:m.label,lieu:m.from||m.to||'',start:m.start,end:m.end,h:rM(missionMinutes(m).amp/60)},nbTrains:cands.length,
      train:c?{label:c.m.label,from:c.m.from,to:c.m.to,start:c.m.start,end:c.m.end,nom:`${c.a.nom} ${c.a.prenom}`.trim(),agence:c.a.agence}:null,
      venuEnVoy:!!(c&&c.voy),journeeEco:!!(c&&c.eco)});
  }
  pistesCmd.sort((x,y)=>x.slot.start.localeCompare(y.slot.start));
  return {personnes,reeq,pistes,pistesCmd,P};
}

/** Vue Coco (copain covoit) : missions et RHR de la semaine des agents choisis par l'admin, jour par jour, rien d'autre
    (ni codes, ni heures sup, ni paniers). Calculés avec les règles du site (cocoCalcul : applyRules + reconcile sur la
    semaine et ses voisines, pour les RHR commencés la semaine précédente). Une mission ou un RHR à cheval sur minuit
    apparaît sur chaque jour touché (morceau du jour, `suite` le lendemain). */
function cocoSemaine(meta,agents,sel,autres){
  const days=meta.days, idx=new Map((sel||[]).map((x,i)=>[x.pk,i])), D=days.map(d=>Date.parse(d+'T00:00:00Z'));
  const out=(sel||[]).map(x=>({pk:x.pk,nom:x.nom||'',metier:x.metier||'',couleur:x.couleur,missions:[],rhr:[],jours:days.map(()=>({m:[],r:[]}))}));
  const place=(o,list,kind,x)=>{ const S0=Date.parse(x.start||x.debut), E0=x.fin===null?D[6]+DAY:Date.parse(x.end||x.fin);
    D.forEach((d,k)=>{ if(S0<d+DAY&&E0>d) o.jours[k][kind].push({i:list.length-1,s:Math.max(S0,d),e:Math.min(E0,d+DAY),suite:S0<d}); }); };
  for(const a of agents||[]){ const i=idx.get(personKey(a)); if(i==null) continue; const o=out[i];
    o.nom=`${a.nom} ${a.prenom}`.trim()||o.nom; o.metier=a.metier||o.metier;
    for(const j of a.jours||[]) if(j.kind==='SERVICE') for(const m of j.missions||[]){
      if(o.missions.some(x=>x.start===m.start&&x.label===m.label)) continue;
      o.missions.push({label:m.label,from:m.from||'',to:m.to||'',start:m.start,end:m.end,amplitude:m.amplitude??null,pauseMin:m.pauseMin||0,pauses:(m.pauses||[]).filter(Array.isArray).map(([a,b])=>[a,b])});
      place(o,o.missions,'m',m); } }
  // RHR de la semaine, et ceux d'une semaine voisine qui débordent sur celle-ci
  for(const a of [...(agents||[]),...(autres||[])]){ const i=idx.get(personKey(a)); if(i==null) continue; const o=out[i];
    for(const r of a.rhr||[]){ if(o.rhr.some(x=>x.debut===r.debut)) continue;
      const S0=Date.parse(r.debut), E0=r.fin?Date.parse(r.fin):D[6]+DAY; if(!(S0<D[6]+DAY&&E0>D[0])) continue;
      o.rhr.push({lieu:r.lieu||'',debut:r.debut,fin:r.fin||null,dureeH:r.dureeH??null}); place(o,o.rhr,'r',{start:r.debut,end:r.fin||new Date(D[6]+DAY).toISOString()}); } }
  for(const o of out) for(const j of o.jours){ j.m.sort((x,y)=>x.s-y.s); j.r.sort((x,y)=>x.s-y.s); }
  return {weekId:meta.weekId,monday:meta.monday,sunday:meta.sunday,days,agents:out};
}
function cocoCalcul(weeks,rulesIn,id,sel){
  const R=rulesIn||{}, rules={...R,agencesAlias:{...autoAliasFrom(weeks.flatMap(w=>w.agents.map(a=>a.agence))),...(R.agencesAlias||{})}};
  const map=new Map();
  for(const w of [...weeks].sort((a,b)=>a.meta.weekId.localeCompare(b.meta.weekId))){ const v=applyRules(w,rules); v.agents.forEach(a=>a.weekId=w.meta.weekId); map.set(w.meta.weekId,v); }
  reconcile(map,rules);
  const v=map.get(id); if(!v) return null;
  return cocoSemaine(v.meta,v.agents.filter(a=>!a.exclu),sel,[...map.entries()].filter(([k])=>k!==id).flatMap(([,x])=>x.agents));
}

/* ==========================================================================
   5. VITRINE — statistiques anonymes du code visiteur (calculées sur le serveur)
   Aucun nom, matricule ni ligne individuelle ne sort : chaque cellule publiée réunit au moins
   VITRINE_K agents d'une même semaine. Les petits groupes sont fusionnés (« Autres métiers »,
   « Tous métiers », « Autres agences ») ou écartés s'ils restent trop petits.
   ========================================================================== */
const VITRINE_K=5;
const V_AMP=[6,8,9,10,11], V_HP=[20,30,35,40,45];
const binOf=(v,b)=>{let i=0; while(i<b.length&&v>=b[i]) i++; return i;};
const H24=()=>Array(24).fill(0), D7=()=>Array.from({length:7},H24);
function cellStats(list,w,ag,me){
  const c={w,ag,me,n:list.length,rhrApp:0,avecRHR:0,avecJB:0,avecSup:0,s:{},
    heat:{presence:H24(),prise:H24(),fin:H24(),rhr:H24()}, dow:{presence:D7(),prise:D7()},
    dist:{amp:Array(6).fill(0),hp:Array(6).fill(0),rhrB:[0,0,0],rhrN:Array(5).fill(0),jbN:Array(4).fill(0)}};
  for(const f of FIELDS) c.s[f.k]=0;
  for(const a of list){
    for(const f of FIELDS) c.s[f.k]+=a[f.k]||0;
    if(a.rhrApplicable){ c.rhrApp++; if(a.nbRHR>0) c.avecRHR++; c.dist.rhrN[Math.min(4,a.nbRHR)]++;
      for(const x of a.rhr){ if(x.dureeH!=null) c.dist.rhrB[x.dureeH<12?0:x.dureeH<24?1:2]++; c.heat.rhr[new Date(x.debut).getUTCHours()]++; } }
    if(a.journeesBlanches>0) c.avecJB++; if(a.heuresSup>0) c.avecSup++;
    c.dist.jbN[Math.min(3,a.journeesBlanches)]++;
    if(a.joursService) c.dist.hp[binOf(a.heuresPlanifiees,V_HP)]++;
    for(const j of a.jours){ if(j.kind!=='SERVICE'||j.horsPeriode) continue;
      c.dist.amp[binOf(j.amplitude,V_AMP)]++;
      const p=new Date(j.missions[0].start), e=new Date(j.missions[j.missions.length-1].end);
      c.heat.prise[p.getUTCHours()]++; c.dow.prise[(p.getUTCDay()+6)%7][p.getUTCHours()]++; c.heat.fin[e.getUTCHours()]++;
      for(const m of j.missions) for(const [s0,s1] of workSegments(m)) for(let t=Math.floor(s0/H)*H;t<s1;t+=H){
        const o=ovl(t,t+H,s0,s1)/H; if(o<=0) continue; const d=new Date(t);
        c.heat.presence[d.getUTCHours()]+=o; c.dow.presence[(d.getUTCDay()+6)%7][d.getUTCHours()]+=o; } }
  }
  for(const f of FIELDS) c.s[f.k]=r2(c.s[f.k]);
  c.heat.presence=c.heat.presence.map(r2); c.dow.presence=c.dow.presence.map(r=>r.map(r2));
  return c;
}
/** weeks : lectures brutes [{meta, agents}] ; rules : règles chargées (loadRules) */
function vitrineData(weeks,rulesIn,K=VITRINE_K){
  const rules={...rulesIn,agencesAlias:{...autoAliasFrom(weeks.flatMap(w=>w.agents.map(a=>a.agence))),...(rulesIn.agencesAlias||{})}};
  const map=new Map();
  for(const w of [...weeks].sort((a,b)=>a.meta.weekId.localeCompare(b.meta.weekId))){
    const v=applyRules(w,rules); v.agents.forEach(a=>a.weekId=w.meta.weekId); map.set(w.meta.weekId,v); }
  reconcile(map,rules);
  const cells=[], flux=[]; let ecartes=0;
  for(const [id,v] of map){
    const autres=[];
    v.agents=v.agents.filter(a=>!a.exclu);
    // semaine à cheval sur deux mois : en plus de la semaine entière, une cellule par mois (mêmes groupes, mêmes
    // agents, chiffres coupés au jour près) pour les mois et années civils (demandé par l'utilisateur)
    const parts=[...new Set([v.meta.monday.slice(0,7),v.meta.sunday.slice(0,7)])], cellsW=cells;
    const cellStatsW=(list,w,ag,me)=>{ if(parts.length>1) for(const m of parts){
        const sl=list.map(a=>sliceAgent(a,m+'-01',m+'-31')).filter(Boolean); if(sl.length) cellsW.push({...cellStats(sl,w,ag,me),p:m}); }
      return cellStats(list,w,ag,me); };
    for(const [ag,l] of groupBy(v.agents,a=>a.agence)){
      if(l.length<K){ autres.push(...l); continue; }
      const byMe=[...groupBy(l,a=>a.metier)], big=byMe.filter(([,x])=>x.length>=K), small=byMe.filter(([,x])=>x.length<K).flatMap(([,x])=>x);
      if(!small.length) big.forEach(([me,x])=>cells.push(cellStatsW(x,id,ag,me)));
      else if(small.length>=K){ big.forEach(([me,x])=>cells.push(cellStatsW(x,id,ag,me))); cells.push(cellStatsW(small,id,ag,'Autres métiers')); }
      else cells.push(cellStatsW(l,id,ag,'Tous métiers'));
    }
    if(autres.length>=K) cells.push(cellStatsW(autres,id,'Autres agences','Tous métiers')); else ecartes+=autres.length;
    // flux entre lieux et lieux de RHR : publiés seulement si au moins K agents différents y passent
    const E=new Map(), R=new Map(), RS=new Set(Object.values(v.meta.residences||{}).filter(Boolean).map(normLieu));
    for(const a of v.agents){ const pk=personKey(a);
      for(const j of a.jours) if(j.kind==='SERVICE') for(const m of j.missions){ if(!m.from||!m.to) continue;
        const x=normLieu(m.from), y=normLieu(m.to); if(x===y) continue; const k=x<y?x+'|'+y:y+'|'+x;
        if(!E.has(k)) E.set(k,{n:0,p:new Set()}); const e=E.get(k); e.n++; e.p.add(pk); }
      for(const x of a.rhr){ const l=normLieu(x.lieu); if(!R.has(l)) R.set(l,{n:0,p:new Set()}); const r=R.get(l); r.n++; r.p.add(pk); } }
    flux.push({w:id,res:[...RS],edges:[...E].filter(([,e])=>e.p.size>=K).map(([k,e])=>{const [a,b]=k.split('|');return {a,b,n:e.n};}),
      rhr:[...R].filter(([,r])=>r.p.size>=K).map(([l,r])=>({l,n:r.n}))});
  }
  return {k:K, ecartes, cells, flux,
    semaines:[...map.values()].map(v=>({weekId:v.meta.weekId,year:v.meta.year,week:v.meta.week,monday:v.meta.monday,sunday:v.meta.sunday})),
    regles:{rhrMinHours:rules.rhrMinHours,seuilHebdo:rules.seuilHebdo,heuresATCMD:rules.heuresATCMD,nuitAFR:rules.nuitAFR,nuitCDR:rules.nuitCDR}};
}

/* ==========================================================================
   6. ÉCRITURE DE CLASSEURS EXCEL (.xlsx) — sans dépendance
   ========================================================================== */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; }

/** Lignes agent-semaine du périmètre (une par personne et par semaine, doublons du fichier déjà fusionnés) */
function scopeAgents(opts={}){
  const out=[], rg=opts.allWeeks?null:periodRange(S.selWeek);
  for(const id of (opts.allWeeks?S.weeks.map(w=>w.weekId):activeWeeks())){
    const w=S.loaded.get(id); if(!w) continue;
    for(const a of w.agents){
      if(a.exclu&&!opts.exclus) continue;
      if(S.selAgences&&!S.selAgences.includes(a.agence)) continue;
      if(S.selMetiers&&!S.selMetiers.includes(a.metier)) continue;
      if(S.search&&!deacc(`${a.nom} ${a.prenom} ${a.matricule}`).toLowerCase().includes(deacc(S.search).toLowerCase())) continue;
      if(!opts.tousAgents&&S.selAgents&&S.selAgents.length&&!S.selAgents.includes(personKey(a))) continue;
      if(!a.weekId) a.weekId=id;
      const x=rg?sliceAgent(a,rg[0],rg[1]):a; if(x) out.push(x);
    }
  }
  return out;
}

/** Cache local des semaines (demandé par l'utilisateur : le site rame sur certaines données) : le détail de chaque semaine
    est gardé dans le navigateur (IndexedDB) avec la signature de son import (date d'import + nombre de lignes) ; une
    semaine réimportée change de signature et est retéléchargée, une semaine supprimée est retirée du cache. Seulement
    pour les comptes qui voient le détail (jamais le visiteur) ; vidé à la déconnexion. Toute erreur : on passe par le serveur. */
const cacheSem={
  db:null,
  ouvrir(){ if(this.db!==null) return Promise.resolve(this.db);
    return new Promise(ok=>{ try{ const r=indexedDB.open('recap-cache',1);
      r.onupgradeneeded=()=>{ try{ r.result.createObjectStore('semaines'); }catch(e){} };
      r.onsuccess=()=>{ this.db=r.result; ok(this.db); }; r.onerror=()=>{ this.db=false; ok(false); }; r.onblocked=()=>{ this.db=false; ok(false); };
    }catch(e){ this.db=false; ok(false); } }); },
  sig(id){ const w=S.weeks.find(x=>x.weekId===id); return w?`${w.importedAt||''}|${w.nbAgents||''}`:null; },
  async op(mode,f){ const db=await this.ouvrir(); if(!db) return null;
    return new Promise(ok=>{ try{ const tx=db.transaction('semaines',mode), st=tx.objectStore('semaines'), r=f(st);
      tx.oncomplete=()=>ok(r&&'result' in r?r.result:true); tx.onerror=tx.onabort=()=>ok(null); }catch(e){ ok(null); } }); },
  async lire(id){ const sg=this.sig(id); if(!sg) return null; const v=await this.op('readonly',st=>st.get(id)); return v&&v.sig===sg&&Array.isArray(v.docs)?v.docs:null; },
  ecrire(id,docs){ const sg=this.sig(id); if(!sg) return Promise.resolve(null); return this.op('readwrite',st=>st.put({sig:sg,docs},id)); },
  async nettoyer(){ const ids=new Set(S.weeks.map(w=>w.weekId)), cles=await this.op('readonly',st=>st.getAllKeys());
    if(Array.isArray(cles)) for(const k of cles) if(!ids.has(k)) await this.op('readwrite',st=>st.delete(k)); },
  vider(){ return this.op('readwrite',st=>st.clear()); }
};
async function ensureLoaded(ids){
  if(backend.mode!=='artifact'&&S.role!=='admin') return;   // visiteur : statistiques anonymes uniquement, jamais le détail
  // d'abord le cache local du navigateur, puis le serveur pour le reste (6 semaines à la fois), puis traitement dans l'ordre
  const manq=[...new Set(ids)].filter(id=>!S.loaded.has(id)), recus=new Map();
  const web=backend.mode==='web';
  if(web&&manq.length){ const l=await Promise.all(manq.map(id=>cacheSem.lire(id).catch(()=>null))); manq.forEach((id,i)=>{ if(l[i]) recus.set(id,{docs:l[i]}); }); }
  const aDemander=manq.filter(id=>!recus.has(id));
  for(let k=0;k<aDemander.length;k+=6) await withLoad(Promise.all(aDemander.slice(k,k+6).map(id=>api.semaine(id).then(r=>{ recus.set(id,r); if(web&&r&&Array.isArray(r.docs)&&r.docs.length) cacheSem.ecrire(id,r.docs).catch(()=>{}); }))));
  for(const id of manq){
    if(S.loaded.has(id)) continue;
    const {docs}=recus.get(id)||{};
    if(!docs||!docs.length) continue;
    const dd=docs.filter(d=>Array.isArray(d.agents)); if(!dd.length) continue;
    const meta=dd[0].meta;
    const agents=dd.flatMap(d=>d.agents);
    S.parsedCache.set(id,{meta,agents});
    const v=applyRules({meta,agents},effRules()); v.agents.forEach(a=>a.weekId=id);
    S.loaded.set(id,v);
  }
  reconcile(new Map([...S.loaded.entries()].sort((a,b)=>a[0].localeCompare(b[0]))),S.rules);
}
function recomputeLoaded(){
  S.rv=(S.rv||0)+1;
  const R=effRules();
  for(const [id,p] of S.parsedCache){ const v=applyRules(p,R); v.agents.forEach(a=>a.weekId=id); S.loaded.set(id,v); }
  reconcile(new Map([...S.loaded.entries()].sort((a,b)=>a[0].localeCompare(b[0]))),S.rules);
}
/** L'évolution hebdomadaire et l'historique portent sur toutes les semaines enregistrées */
const needsAll=()=>['graphiques','exports','stats','verifier','comparer'].includes(S.tab);
/** Semaines à charger : celles affichées, plus leurs voisines — un RHR ouvert le dimanche se referme avec la
    semaine suivante, quel que soit l'affichage, pour que les chiffres d'une semaine ne dépendent pas de la vue */
const toLoad=()=>{ if(needsAll()) return S.weeks.map(w=>w.weekId);
  const ids=S.weeks.map(w=>w.weekId).sort(), out=new Set(activeWeeks());
  // Agents, Synthèse, Production : toute l'année de la période (CP de l'année, décalage des RP depuis le 1er janvier)
  if(['agents','synthese','production'].includes(S.tab)) for(const id of periodWeeks('y:'+anneeCP(),S.weeks)) out.add(id);
  // Production : planning type de S+1 — la dernière semaine, ses 3 précédentes et toute son année (repos pris depuis le 1er janvier)
  if(S.tab==='production'&&ids.length){ const l=S.weeks.find(w=>w.weekId===ids[ids.length-1]); ids.slice(-4).forEach(x=>out.add(x)); for(const id of periodWeeks('y:'+l.sunday.slice(0,4),S.weeks)) out.add(id); }
  { const t=isoD(new Date(nowW())); for(const w of S.weeks) if(w.monday<=t&&t<=w.sunday){ out.add(w.weekId); const i=ids.indexOf(w.weekId); if(i>0) out.add(ids[i-1]); } }
  for(const id of activeWeeks()){ const i=ids.indexOf(id); if(i>0) out.add(ids[i-1]); if(i>=0&&i<ids.length-1) out.add(ids[i+1]); }
  return [...out]; };

const niceStep=m=>{const raw=m/4,p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p;};

/** Courbes multi-séries avec repère et infobulle */
function lineChart(series,labels,fmt){
  if(!labels.length||!series.length) return '<p class="mut sm">Pas encore assez de semaines pour tracer une évolution.</p>';
  const W=720,Hh=240,ml=46,mr=58,mt=14,mb=28;
  const maxV=Math.max(1,...series.flatMap(s=>s.values.filter(v=>v!=null)));
  const step=niceStep(maxV), top=Math.ceil(maxV/step)*step||step;
  const X=i=>ml+(labels.length===1?(W-ml-mr)/2:i*(W-ml-mr)/(labels.length-1));
  const Y=v=>mt+(1-v/top)*(Hh-mt-mb);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step)
    g+=`<line class="grid-l" x1="${ml}" y1="${Y(v).toFixed(1)}" x2="${W-mr}" y2="${Y(v).toFixed(1)}"/>`
      +`<text class="cv" x="${ml-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${nf(v)}</text>`;
  labels.forEach((l,i)=>{ if(labels.length>10&&i%Math.ceil(labels.length/10)!==0&&i!==labels.length-1) return;
    g+=`<text class="ct" x="${X(i).toFixed(1)}" y="${Hh-9}" text-anchor="middle">${esc(l)}</text>`;});
  let p='';
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length) return;
    p+=`<path d="${pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(q=>p+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`);
    const last=pts[pts.length-1];
    p+=`<text class="cvb" x="${(last[0]+8).toFixed(1)}" y="${(last[1]+4).toFixed(1)}">${esc(s.short||s.name)}</text>`;
  });
  let hz='';
  labels.forEach((l,i)=>{
    const w=(W-ml-mr)/Math.max(1,labels.length-1);
    const rows=series.map(s=>({n:s.name,c:s.color,v:s.values[i]})).filter(r=>r.v!=null);
    hz+=`<rect class="hovz" x="${(X(i)-w/2).toFixed(1)}" y="${mt}" width="${w.toFixed(1)}" height="${Hh-mt-mb}"
      data-tip="${esc(`<b>${l}</b>`+rows.map(r=>`<span class="tr"><span><i class="cdot" style="background:${r.c}"></i>${r.n}</span><b>${fmt?fmt(r.v):nf(r.v)}</b></span>`).join(''))}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" preserveAspectRatio="xMidYMid meet">
    ${g}<line class="axis-l" x1="${ml}" y1="${mt}" x2="${ml}" y2="${Hh-mb}"/>${p}${hz}</svg></div>`;
}
/** Barres horizontales avec infobulle */
function barChart(items,opts={}){
  if(!items.length) return '<p class="mut sm">Aucune donnée sur ce périmètre.</p>';
  const max=Math.max(1,...items.map(i=>i.v));
  const f=opts.fmt||(v=>nf(v,opts.dec||0));
  return `<div class="bars">${items.map(i=>`
    <div class="bar" data-tip="${esc(`<b>${i.l}</b><span class="tr"><span>${opts.label||'Valeur'}</span><b>${f(i.v)}</b></span>${i.sub?`<span class="tr"><span>${i.sub2||''}</span><b>${i.sub}</b></span>`:''}`)}">
      <span class="bl">${esc(i.l)}</span>
      <span class="bt"><i style="width:${(i.v/max*100).toFixed(1)}%;background:${i.c||'var(--s1)'}"></i></span>
      <span class="bv">${f(i.v)}</span></div>`).join('')}</div>`;
}

/** Statut « en ce moment » : l'heure de l'appareil comparée aux missions et aux RHR des semaines chargées.
    Les horaires du fichier sont des heures locales : « maintenant » est lu de la même façon. */
const nowW=()=>{const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes());};
let LIVE=null;
function liveIndex(){
  const t=nowW(), key=Math.floor(t/6e4)+'|'+S.loaded.size+'|'+(S.rv||0);
  if(LIVE&&LIVE.key===key) return LIVE.m;
  const m=new Map();
  for(const v of S.loaded.values()) for(const a of v.agents){
    if(a.exclu) continue; const k=personKey(a);
    for(const j of a.jours||[]) if(j.kind==='SERVICE') for(const x of j.missions) if(Date.parse(x.start)<=t&&t<Date.parse(x.end)) m.set(k,{t:'svc',l:x.label,fin:x.end});
    if(!m.has(k)) for(const r of a.rhr||[]){ const d0=Date.parse(r.debut), d1=r.fin?Date.parse(r.fin):null;
      if(d0<=t&&(d1?t<d1:true)&&(d1||t<Date.parse(v.meta.sunday+'T00:00:00Z')+8*DAY)) m.set(k,{t:'rhr',l:r.lieu,fin:r.fin}); }
  }
  LIVE={key,m}; return m;
}
/** Synthèse : qui est en service ou en RHR en ce moment, sur le périmètre (agences, métiers, agents) */
function liveNote(){
  const m=liveIndex(), seen=new Map();
  for(const v of S.loaded.values()) for(const a of v.agents){ const k=personKey(a);
    if(!m.has(k)||seen.has(k)) continue;
    if(S.selAgences&&!S.selAgences.includes(a.agence)||S.selMetiers&&!S.selMetiers.includes(a.metier)||selAg().length&&!selAg().includes(k)) continue;
    seen.set(k,{a,x:m.get(k)}); }
  if(!seen.size) return '';
  const L=[...seen.values()].sort((p,q)=>p.a.nom.localeCompare(q.a.nom,'fr')), sv=L.filter(z=>z.x.t==='svc'), rh=L.filter(z=>z.x.t==='rhr');
  const nm=z=>`${esc(z.a.nom)} ${esc(z.a.prenom)}${z.x.t==='rhr'?` (${esc(z.x.l)})`:''}`;
  return `<div class="note"><b>En ce moment</b> (${hm(new Date(nowW()).toISOString())}) : ${nf(sv.length)} en service · ${nf(rh.length)} en RHR
    <details class="qd"><summary>voir les noms</summary>${sv.length?`<div class="mt"><b>En service</b> : ${sv.map(nm).join(' · ')}</div>`:''}${rh.length?`<div class="mt"><b>En RHR</b> : ${rh.map(nm).join(' · ')}</div>`:''}</details></div>`;
}

/** Année du compte « CP de l'année » : celle du dernier jour de la période sélectionnée (dimanche de la dernière semaine) */
/** Nombre de jours de la période sélectionnée couverts par les semaines importées (mois et années au jour près) */
const joursDePeriode=()=>{ const r=periodRange(S.selWeek); let n=0;
  for(const id of activeWeeks()){ const w=S.weeks.find(x=>x.weekId===id); if(!w) continue;
    for(let i=0;i<7;i++){ const d=isoD(new Date(Date.parse(w.monday+'T00:00:00Z')+i*DAY)); if(!r||(d>=r[0]&&d<=r[1])) n++; } }
  return n; };
/** Dernier jour de la période choisie : fin du mois / de l'année, sinon dimanche de la dernière semaine */
const debutPeriode=()=>{ const r=periodRange(S.selWeek); if(r) return r[0];
  const ids=activeWeeks(), w=S.weeks.find(x=>x.weekId===ids[0]); return w?w.monday:isoD(new Date()); };
/** Toutes les semaines chargées (agents non exclus), pour les calculs qui remontent au 1er janvier ou enjambent deux semaines */
const lignesChargees=()=>{ const out=[]; for(const [id,v] of S.loaded) for(const a of v.agents) if(!a.exclu){ a.weekId=a.weekId||id; out.push(a); } return out; };
/** Décalage des RP de chaque agent à la fin de la période (numéro RP-n lu face à l'avancement normal de l'année) */
const decalagesRP=()=>decalageRP(lignesChargees(),finPeriode(),S.rules);
const fmtDecal=x=>x==null?'—':(x>0?'+':x<0?'−':'')+nf(Math.abs(x),1);
const finPeriode=()=>{ const r=periodRange(S.selWeek); if(r) return r[1];
  const ids=activeWeeks(), w=S.weeks.find(x=>x.weekId===ids[ids.length-1]); return w?w.sunday:isoD(new Date()); };
const anneeCP=()=>{ const r=periodRange(S.selWeek); if(r) return r[1].slice(0,4);
  const ids=activeWeeks(), w=S.weeks.find(x=>x.weekId===ids[ids.length-1]); return w?w.sunday.slice(0,4):String(new Date().getUTCFullYear()); };
function sortAgents(list){
  const {k,dir}=S.sort, col=COLS.find(c=>c.k===k);
  const val=a=>col&&col.t?col.t(a):(typeof a[k]==='number'?pv(a,k):a[k]);
  return [...list].sort((a,b)=>{const x=val(a),y=val(b);
    const r=(typeof x==='number'&&typeof y==='number')?x-y:String(x??'').localeCompare(String(y??''),'fr');
    return dir==='asc'?r:-r;});
}
/** Détail des colonnes de contrôle du tableau des agents (demandé par l'utilisateur) : à quoi correspond chaque jour compté
    dans « Autres cases vides », « Hors fichier » et « Non classés » */
function detailControle(kind,pk){
  const a=(S.rows_agents||[]).find(x=>personKey(x)===pk); if(!a) return;
  const rows=(a.parSemaine||[a]), jr=[], W=id=>S.weeks.find(w=>w.weekId===id)||{week:'?',year:''};
  const ligne=(date,id,txt)=>`<tr><td class="l mono">${JS[(new Date(date+'T00:00:00Z').getUTCDay()+6)%7]} ${dFull(date)}</td><td class="l mono">${esc(weekLabel(W(id)))}</td><td class="l">${txt}</td></tr>`;
  if(kind==='autres'){
    for(const x of rows) for(const j of x.jours) if(!j.horsPeriode&&j.kind==='VIDE'&&!j.blanche){
      const cv=(x.casesVides||[]).find(c=>c.date===j.date), r=(cv&&cv.raison)||j.jbRaison||'';
      jr.push(ligne(j.date,x.weekId,`Case vide dans le fichier — non comptée en journée blanche : ${r?esc(r):j.horsResidence?'agent hors résidence (pendant un RHR)':'non encadrée par deux services'}`)); } }
  if(kind==='nonclasses'){
    for(const x of rows) for(const j of x.jours){ if(j.horsPeriode) continue;
      if(j.kind==='CODE'&&j.rpDouble) jr.push(ligne(j.date,x.weekId,`Code « ${esc(j.code)} » : numéro de RP déjà lu le ${dFull(j.rpDouble.date)} (${esc(weekLabel(W(j.rpDouble.weekId)))}), non recompté`));
      else if(j.kind==='CODE'&&j.family==='HORS') jr.push(ligne(j.date,x.weekId,`Case « hors colonne » : ${(j.horsColonne||[]).map(m=>`${esc(m.label)} daté du ${dISO(m.start)}`).join(', ')||'mission datée d’un autre jour'} — ligne d’une autre semaine recopiée, non comptée`)); } }
  if(kind==='hors'){
    const r=periodRange(S.selWeek), pres=new Set(rows.flatMap(x=>x.jours.filter(j=>!j.horsPeriode).map(j=>j.date)));
    for(const id of activeWeeks()){ const w=S.weeks.find(x=>x.weekId===id); if(!w) continue;
      const jours=Array.from({length:7},(_,i)=>isoD(new Date(Date.parse(w.monday+'T00:00:00Z')+i*DAY))).filter(d=>(!r||(d>=r[0]&&d<=r[1]))&&!pres.has(d)); if(!jours.length) continue;
      const v=S.loaded.get(id), b=v&&v.agents.find(y=>personKey(y)===pk), brut=S.parsedCache.get(id), c=brut&&brut.agents.find(y=>personKey(y)===pk);
      let pq;
      if(!v) pq='semaine non chargée';
      else if(b&&b.exclu) pq=`agent exclu des chiffres${b.exclu.motif?` : ${esc(b.exclu.motif)}`:''}`;
      else if(b&&S.selAgences&&!S.selAgences.includes(b.agence)) pq=`dans le fichier, mais à l’agence ${esc(b.agence)} (hors du filtre d’agence)`;
      else if(b&&S.selMetiers&&!S.selMetiers.includes(b.metier)) pq=`dans le fichier, mais en ${esc(b.metier)} (hors du filtre de métier)`;
      else if(!b&&c) pq=`dans le fichier à l’agence ${esc(c.agence)}, retirée des chiffres (agence hors production, Réglages)`;
      else if(!c) pq=`absent du fichier de cette semaine (arrivée, départ ou mutation)`;
      else pq='non retrouvé';
      jr.push(`<tr><td class="l mono">${jours.length===7?'toute la semaine':jours.map(d=>`${JS[(new Date(d+'T00:00:00Z').getUTCDay()+6)%7]} ${dISO(d)}`).join(', ')}</td><td class="l mono">${esc(weekLabel(w))}</td><td class="l">${pq}</td></tr>`); } }
  if(['rjmin','rjsous'].includes(kind)){ for(const x of (a.rjListe||{minimum:[],sous:[]})[{rjmin:'minimum',rjsous:'sous'}[kind]]){ const id=(rows.find(r=>r.jours.some(j=>j.date===x.date))||{}).weekId;
      jr.push(ligne(x.date,id,`<b>${fmtH(x.h)}</b> de repos à résidence : fin ${dtISO(x.fin)} → reprise ${dtISO(x.reprise)} (minimum ${fmtH(x.normal)}${x.sousPlancher?` — <b class="warn">sous la réduction exceptionnelle de l’accord (${fmtH(x.plancher)}${x.nuit?' après une journée de nuit':''})</b>`:''})`)); } }
  const T={autres:'Autres cases vides',hors:'Hors fichier',nonclasses:'Non classés',rjmin:'Repos journaliers au minimum',rjsous:'Repos journaliers sous le minimum'}[kind];
  openPanel(`${T} — ${a.nom} ${a.prenom}`,`${esc(periodLabel(S.selWeek,S.weeks))} · ${a[{autres:'autresVides',hors:'horsFichier',nonclasses:'nonClasses',rjmin:'rjMin',rjsous:'rjSous'}[kind]]} ${kind.startsWith('rj')?'repos':'jour(s)'}`,
    `<section class="card"><div class="card-b">${jr.length?`<div class="tw"><table><thead><tr><th class="l">Jour</th><th class="l">Semaine</th><th class="l">À quoi correspond la case</th></tr></thead><tbody>${jr.join('')}</tbody></table></div>`
      :'<p class="mut">Aucun jour à détailler (écart de calcul : cases de service ou de code comptées ailleurs).</p>'}</div></section>`);
}

  const yr=anneeCP(), finCP=finPeriode(), debCP=yr+'-01-01', cpY=new Map();
  for(const [id,v] of S.loaded){ const w=S.weeks.find(x=>x.weekId===id); if(!w||w.sunday<debCP||w.monday>finCP) continue;
    for(const a of v.agents){ if(a.exclu) continue; const x=sliceAgent(a,debCP,finCP); if(!x) continue;
      const k=personKey(x); cpY.set(k,(cpY.get(k)||0)+((x.codeCounts||{}).CP||0)); } }
  const jp=joursDePeriode(), dRP=decalagesRP(), bRP=rpSemaines(lignesChargees()), d0=debutPeriode(), d1=finPeriode();

    o.rpInfo=dRP.get(pk)||null; o.rpDecal=o.rpInfo?o.rpInfo.ecart:null; o.rp3=bl.filter(b=>b.n===3).length; o.rp4=bl.filter(b=>b.n===4).length; o.rp5=bl.filter(b=>b.n>=5).length; for(const c of [...FAM_REPOS,'CP']) o['c_'+c]=(a.codeCounts||{})[c]||0; o.cpAnnee=cpY.get(personKey(a))||0;
    const presents=(a.parSemaine||[a]).reduce((s,x)=>s+(x.jours||[]).filter(j=>!j.horsPeriode).length,0);
    o.joursPeriode=jp; o.totalJours=(a.joursService||0)+(a.joursRepos||0)+(a.journeesBlanches||0)+(a.joursCP||0)+(a.joursAbsence||0);
    o.autresVides=Math.max(0,(a.joursVides||0)-(a.journeesBlanches||0));

    const rj=reposJournaliersCourts(a.parSemaine||[a],S.rules); o.rjListe=rj; o.rjMin=rj.minimum.length; o.rjSous=rj.sous.length; return o; });

      <div class="chipset">${Object.entries(GRP).map(([k,l])=>
        `<button class="chip chip-mini" data-col="${k}" aria-pressed="${!!S.cols[k]}">${l}</button>`).join('')}</div></div>
    <div class="card-b"><div class="tw tall"><table class="sticky1">

/** Frise horaire d'une semaine d'agent : une ligne par jour, de 0 h à 24 h.
    Services pleins, pauses hachurées, plage de nuit ombrée, repos hors résidence en pointillés ambre. */
function weekTimeline(x){
  const W=760, L=78, R=12, top=22, rh=24, gap=6, n=x.jours.length;
  const Hh=top+n*(rh+gap)+4, cw=W-L-R, X=h=>L+h/24*cw;
  const D0=x.jours.map(j=>Date.parse(j.date+'T00:00:00Z'));
  const nuit=isAFR(x.metier)?S.rules.nuitAFR:S.rules.nuitCDR;
  const Y=d=>top+d*(rh+gap);
  /** découpe un intervalle [a,b] (ms) sur les lignes jour */
  const cut=(a,b)=>{const o=[];D0.forEach((d0,i)=>{const s=Math.max(a,d0),e=Math.min(b,d0+DAY);if(e>s)o.push([i,(s-d0)/H,(e-d0)/H]);});return o;};
  let g=`<defs><pattern id="tlHatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><rect width="2" height="5" fill="var(--accent-line)"/></pattern></defs>`;
  for(let h=0;h<=24;h+=3) g+=`<text class="tl-h" x="${X(h).toFixed(1)}" y="12" text-anchor="middle">${String(h).padStart(2,'0')}h</text>`;
  x.jours.forEach((j,i)=>{
    const y=Y(i);
    g+=`<rect class="tl-row" x="${L}" y="${y}" width="${cw}" height="${rh}" rx="5"/>`;
    const [n0,n1]=nuit; const bands=n1>n0?[[n0,n1]]:[[0,n1],[n0,24]];
    bands.forEach(([a,b])=>g+=`<rect class="tl-nuit" x="${X(a).toFixed(1)}" y="${y}" width="${(X(b)-X(a)).toFixed(1)}" height="${rh}"/>`);
    for(let h=6;h<24;h+=6) g+=`<line class="tl-g" x1="${X(h).toFixed(1)}" y1="${y}" x2="${X(h).toFixed(1)}" y2="${y+rh}"/>`;
    g+=`<text class="tl-day" x="0" y="${y+11}">${JS[i]}</text><text class="tl-date" x="0" y="${y+22}">${dISO(j.date)}</text>`;
  });
  const end=D0[n-1]+DAY;
  for(const r of x.rhr||[]){
    const a=Date.parse(r.debut), b=r.fin?Date.parse(r.fin):end;
    cut(a,b).forEach(([i,h0,h1],k)=>{ g+=`<rect class="tl-rhr" x="${X(h0).toFixed(1)}" y="${Y(i)+2}" width="${(X(h1)-X(h0)).toFixed(1)}" height="${rh-4}" rx="4"
      data-tip="${esc(`<b>Repos hors résidence</b><span class="tr"><span>Lieu</span><b>${esc(r.lieu)}</b></span><span class="tr"><span>Du</span><b>${dtISO(r.debut)}</b></span><span class="tr"><span>Au</span><b>${r.fin?dtISO(r.fin):'semaine suivante'}</b></span>${r.dureeH!=null?`<span class="tr"><span>Durée</span><b>${fmtH(r.dureeH)}</b></span>`:''}`)}"/>`;
      if(k===0&&X(h1)-X(h0)>70) g+=`<text class="ts" x="${(X(h0)+6).toFixed(1)}" y="${Y(i)+rh/2+4}" style="font-size:10px;font-weight:700;fill:var(--signal-ink)">RHR · ${esc(r.lieu)}</text>`;
    });
  }
  x.jours.forEach((j,i)=>{
    const y=Y(i);
    if(j.kind==='CODE') g+=`<text class="tl-code" x="${X(12).toFixed(1)}" y="${y+rh/2+4}" text-anchor="middle">${esc(j.family==='HORS'?'Non compté (hors colonne)':j.code)}${j.family!=='HORS'&&CODEL[j.family]&&j.family!=='AUTRE'?' · '+CODEL[j.family]:''}</text>`;
    else if(j.kind==='VIDE'&&j.blanche) g+=`<rect class="tl-bl" x="${L+1}" y="${y+1}" width="${cw-2}" height="${rh-2}" rx="5"/><text class="tl-blt" x="${X(12).toFixed(1)}" y="${y+rh/2+4}" text-anchor="middle">Journée blanche${j.horsResidence?' · hors résidence':''}</text>`;
    else if(j.kind==='VIDE') g+=`<text class="tl-h" x="${X(12).toFixed(1)}" y="${y+rh/2+4}" text-anchor="middle">case vide${j.jbRaison?' · '+esc(j.jbRaison):''}</text>`;
    if(j.kind==='SERVICE') for(const m of j.missions){
      const a=Date.parse(m.start), b=Date.parse(m.end);
      const tip=esc(`<b>${esc(m.label)}</b><span class="tr"><span>${esc(m.from||'?')} → ${esc(m.to||'?')}</span></span><span class="tr"><span>Horaire</span><b>${dtISO(m.start)} – ${hm(m.end)}</b></span><span class="tr"><span>Amplitude</span><b>${fmtH(m.amplitude)}</b></span>${m.pauseMin?`<span class="tr"><span>Pauses</span><b>${m.pauseMin} min</b></span>`:''}`);
      cut(a,b).forEach(([ii,h0,h1],k)=>{
        const yy=Y(ii)+4, w=X(h1)-X(h0);
        g+=`<rect class="tl-pause" x="${X(h0).toFixed(1)}" y="${yy}" width="${w.toFixed(1)}" height="${rh-8}" rx="3" data-tip="${tip}"/>`;
        workSegments(m).forEach(([s0,s1])=>cut(s0,s1).filter(c=>c[0]===ii).forEach(([,p0,p1])=>{ if(p1>h0-1e-9&&p0<h1+1e-9)
          g+=`<rect class="tl-svc" x="${X(p0).toFixed(1)}" y="${yy}" width="${Math.max(1.5,X(p1)-X(p0)).toFixed(1)}" height="${rh-8}" rx="3" data-tip="${tip}"/>`; }));
        if(k===0&&w>56) g+=`<text class="tl-lab" x="${(X(h0)+5).toFixed(1)}" y="${yy+rh/2}">${esc(String(m.label).slice(0,Math.floor(w/6.4)))}</text>`;
      });
    }
    if(j.horsColonne) g+=`<rect class="tl-hc" x="${L-3}" y="${y-2}" width="${cw+6}" height="${rh+4}" rx="6"><title>Mission datée hors de sa colonne, non comptée</title></rect>`;
  });
  return `<div class="tl-w"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Frise horaire de la semaine">${g}</svg></div>`;
}

    {k:'nbDISPO',l:'DISPO',v:r=>r.g.nbDISPO,f:r=>nf(r.g.nbDISPO)},

  const foot=c=>({agence:'Total',nbAgents:nf(gT.nbAgents),agentsAvecRHR:nf(gT.agentsAvecRHR),nbRHR:nf(gT.nbRHR),

    nbDISPO:nf(gT.nbDISPO),nbATCMD:nf(gT.nbATCMD),heuresSup:fmtH(gT.heuresSup),

  const perCols=[
    {k:'nom',l:'Agent',cls:'l',st:1,v:p=>p.nom+' '+p.prenom,f:p=>`<span class="nm">${esc(p.nom)}</span> ${esc(p.prenom)}${livePill(p)}`},

/** Heures sup par semaine et repos (demandé par l'utilisateur) : dans quelles semaines tombent surtout les heures sup, avec
    en regard les repos triples / quadruples / 5 et + (RP d'affilée, jonction entre semaines comprise), les CP, RCL et RCC ;
    filtre d'agence propre ; coût approximatif des heures sup (taux saisis dans Réglages → Production). Deux échelles
    séparées alignées semaine par semaine (heures d'un côté, nombres de l'autre), jamais un double axe. */
function hsSemainesCard(sc){
  const ags=[...new Set(sc.map(a=>a.agence))].sort(), fa=ags.includes(S.prHsAg)?S.prHsAg:'', rows=sc.filter(a=>!fa||a.agence===fa);
  const pks=new Set(rows.map(personKey)), ids=[...new Set(rows.map(a=>a.weekId))].sort(), W=id=>S.weeks.find(w=>w.weekId===id);
  const bl=[...rpSemaines(lignesChargees()).entries()].filter(([k])=>pks.has(k)).flatMap(([,l])=>l);
  const d0=debutPeriode(), d1=finPeriode();
  const sem=ids.map(id=>{ const w=W(id)||{}, r=rows.filter(a=>a.weekId===id), cc=k=>r.reduce((n,a)=>n+((a.codeCounts||{})[k]||0),0);
    const b=bl.filter(x=>x.lundi===w.monday);
    return {id,w,hs:r.reduce((n,a)=>n+(a.heuresSup||0),0),ag:new Set(r.filter(a=>a.heuresSup>0).map(personKey)).size,
      rp3:b.filter(x=>x.n===3).length,rp4:b.filter(x=>x.n===4).length,rp5:b.filter(x=>x.n>=5).length,CP:cc('CP'),RCL:cc('RCL'),RCC:cc('RCC')}; });
  if(!sem.length) return '';
  const lab=x=>x.w.week?`S${String(x.w.week).padStart(2,'0')}`:x.id, maxH=Math.max(1e-9,...sem.map(x=>x.hs)), n=sem.length;
  const top=[...sem].sort((a,b)=>b.hs-a.hs).filter(x=>x.hs>0).slice(0,3);
  const LIG=[['rp3','RP triples','agents avec 3 RP dans la semaine'],['rp4','RP quadruples','agents avec 4 RP dans la semaine'],['rp5','RP 5 et +','agents avec 5 RP ou plus dans la semaine'],
    ['CP','CP','jours de CP'],['RCL','RCL','jours de RCL'],['RCC','RCC','jours de RCC']];
  const cells=LIG.map(([k,l,t])=>{ const mx=Math.max(1e-9,...sem.map(x=>x[k]));
    return `<div class="hw-r"><span class="hw-l" title="${esc(t)}">${l}</span>${sem.map(x=>`<span class="hw-c" style="background:${x[k]?`color-mix(in srgb,var(--accent) ${Math.round(15+85*x[k]/mx)}%,var(--surface-2))`:'var(--surface-2)'}" data-tip="${esc(`<b>${lab(x)} · ${weekRange(x.w)}</b><span class="tr"><span>${t}</span><b>${nf(x[k])}</b></span><span class="tr"><span>Heures sup</span><b>${fmtH(x.hs)}</b></span>`)}">${x[k]?nf(x[k]):''}</span>`).join('')}</div>`; }).join('');
  const barres=`<div class="hw-r hw-b"><span class="hw-l">Heures sup</span>${sem.map(x=>`<span class="hw-bar" data-tip="${esc(`<b>${lab(x)} · ${weekRange(x.w)}</b><span class="tr"><span>Heures sup</span><b>${fmtH(x.hs)}</b></span><span class="tr"><span>Agents concernés</span><b>${nf(x.ag)}</b></span>`)}"><i style="height:${(x.hs/maxH*100).toFixed(1)}%"></i></span>`).join('')}</div>`;
  const axe=`<div class="hw-r hw-x"><span class="hw-l"></span>${sem.map((x,i)=>`<span>${n<=26||i%2===0?lab(x):''}</span>`).join('')}</div>`;
  // coût approximatif des heures sup
  const c=(S.rules.production||{}).coutHS||{}, ok=c.afr>0||c.cdr>0;
  const grp=[...groupBy(rows,a=>a.agence+'|'+famMetier(a.metier))].map(([k,l])=>{ const h=l.reduce((n,a)=>n+(a.heuresSup||0),0);
    return {ag:k.split('|')[0],me:k.split('|')[1]==='AFR'?'AFR et coordo':'Conducteurs',h,c:l.reduce((n,a)=>{ const x=coutHeuresSup(a.heuresSup||0,a.metier,S.rules); return x==null?n:n+x; },0)}; }).filter(x=>x.h>0);
  const tot=grp.reduce((n,x)=>n+x.c,0), totH=grp.reduce((n,x)=>n+x.h,0);
  const eur=v=>v.toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
  const cout=ok?`<div class="kpis"><div class="kpi hot"><div class="k">Coût approximatif des heures sup</div><div class="v">${eur(tot)}</div><div class="n">${fmtH(totH)} · taux AFR ${c.afr>0?eur(c.afr)+'/h':'non saisi'} · conducteurs ${c.cdr>0?eur(c.cdr)+'/h':'non saisi'}${c.maj?` · majoration ${nf(c.maj)} %`:''}</div></div></div>
      ${grp.length?`<div class="tw"><table><thead><tr><th class="l">Agence</th><th class="l">Métier</th><th>Heures sup</th><th>Coût</th></tr></thead><tbody>${grp.sort((a,b)=>b.c-a.c).map(x=>`<tr><td class="l nm">${esc(x.ag)}</td><td class="l">${x.me}</td><td>${fmtH(x.h)}</td><td>${eur(x.c)}</td></tr>`).join('')}</tbody></table></div>`:''}`
    :`<div class="note">Coût des heures sup : saisissez un taux horaire AFR et un taux conducteur (et la majoration) dans <button class="lnk" data-goto="reglages">Réglages → Production</button>.</div>`;
  return `<section class="card"><div class="card-h"><div><h2>Heures sup et repos, semaine par semaine</h2><p class="card-s">${esc(periodLabel(S.selWeek,S.weeks))} · ${fa?esc(fa):'toutes les agences du filtre'}${top.length?` · semaines les plus chargées : ${top.map(x=>`${lab(x)} (${fmtH(x.hs)})`).join(', ')}`:''}</p></div>
    <label class="fld"><span class="flabel">Agence</span><select data-prhsag><option value="">Toutes (filtre du haut)</option>${ags.map(a=>`<option${a===fa?' selected':''}>${esc(a)}</option>`).join('')}</select></label></div>
    <div class="card-b stack">${cout}
      <div class="tw"><div class="hw" style="--hwn:${n}">${barres}${axe}${cells}</div></div>
      <p class="mut sm">Barres : heures sup de la semaine (au-delà de ${nf(S.rules.seuilHebdo||35)} h par agent). Cellules : nombre d’agents ayant 3, 4, 5 RP ou plus dans la semaine (lundi → dimanche, qu’ils se suivent ou non) et jours de CP, RCL, RCC ; chaque ligne a sa propre échelle de couleur (plus foncé = plus fréquent). Survolez pour le détail.</p></div></section>`;
}

/** Semaines proposées : toutes les semaines importées et les 4 qui suivent la dernière */
function planifSemaines(){ const ids=S.weeks.map(w=>w.weekId).sort(); if(!ids.length) return [];

  for(let i=1;i<=4;i++){ const x=isoWeek(new Date(Date.parse(l.monday+'T00:00:00Z')+i*7*DAY)); out.push(`${x.year}-S${String(x.week).padStart(2,'0')}`); }

const plMission=m=>({id:plId(),label:m.label,from:m.from||'',to:m.to||'',start:m.start,end:m.end,pauses:(m.pauses||[]).filter(Array.isArray),...(m.regulier?{regulier:true}:{})});
/** Contexte de la planification automatique : résidences (règles du site), état de chaque agent à la fin de la semaine
    précédente (lieu, heure de fin, GPT en cours, repos d'affilée) et horaires observés entre deux lieux (toutes les semaines chargées) */
async function planifContexte(id){

    const l=[a.residence,...(a.rattachement||a.residencePerso?[]:((R.lieuxResidence||{})[a.agence]||[]))].filter(Boolean).map(normLieu);
    if(l.length) ctx.res[personKey(a)]=l; if(a.residence&&!a.residencePerso&&!a.rattachement&&!ctx.resAg[a.agence]) ctx.resAg[a.agence]=[normLieu(a.residence)]; }   // résidence propre d'un agent : jamais celle de son agence

    if(ms.length){ const l=ms[ms.length-1]; ctx.fins[pk]=Date.parse(l.end); if(l.to) ctx.lieux[pk]=normLieu(l.to); }

/** Premier brouillon d'une semaine : missions du fichier si la semaine est importée, sinon planning type (S+1) ;

async function construirePlanif(id,seuil){
  seuil=seuil||2;
  const ids=S.weeks.map(w=>w.weekId).sort(), importee=ids.includes(id), avant=ids.filter(x=>x<id).slice(-4), refId=importee?id:ids[ids.length-1];
  await ensureLoaded([...new Set([refId,...avant])]);
  const meta=metaSemaine(id), ref=S.loaded.get(refId), brut=S.parsedCache.get(refId); if(!ref||!brut) return null;
  // toutes les agences : les filtres de la page choisissent seulement ce qu'on voit
  const rows=new Map(ref.agents.filter(a=>!a.exclu).map(a=>[personKey(a),a]));
  const agents=[];
  for(const b of brut.agents){ const pk=personKey(b), a=rows.get(pk); if(!a||agents.some(x=>personKey(x)===pk)) continue;
    const tag=m=>({...plMission(m),agence:a.agence,fam:famMetier(a.metier)});
    agents.push({matricule:b.matricule||'',nom:b.nom,prenom:b.prenom||'',agence:a.agence,metier:a.metier,
      jours:importee?b.jours.map(j=>j.kind==='SERVICE'?{c:'',m:(j.missions||[]).map(tag)}:{c:j.kind==='CODE'?j.code:'',m:[]}):meta.days.map(()=>({c:'',m:[]}))}); }
  // semaine qui suit la dernière importée : jours de repos du planning type
  if(!importee&&id===planifSemaines()[ids.length]){ const rowsAll=[...S.loaded.entries()].flatMap(([w,v])=>v.agents.filter(a=>!a.exclu).map(a=>{ a.weekId=a.weekId||w; return a; }));
    const t=trameSemaine(rowsAll,refId,new Set(agents.map(personKey)),S.rules);
    if(t) for(const x of t.agents){ const a=agents.find(y=>personKey(y)===x.pk); if(a) x.cases.forEach((c,d)=>{ if(c.t==='RP'){ a.jours[d].c='RP'; a.jours[d].cAuto=true; } }); } }

  const info=new Map(); for(const x of avant) for(const a of (S.loaded.get(x)||{agents:[]}).agents) info.set(personKey(a),{agence:a.agence,metier:a.metier});
  const prec=S.parsedCache.get(importee?ids[ids.indexOf(id)-1]:avant[avant.length-1]), fins={};
  if(prec) for(const b of prec.agents){ const e=b.jours.flatMap(j=>j.missions||[]).map(m=>Date.parse(m.end)); if(e.length) fins[personKey(b)]=Math.max(...e); }

      const deja=brut.agents.some(b=>(b.jours[t.d].missions||[]).some(x=>normLieu(x.label)===normLieu(t.label)&&normLieu(x.from)===normLieu(t.from)&&normLieu(x.to)===normLieu(t.to)));

/** Déplacement d'une mission : src « a|d|i » (case) ou « R|i » (réserve) ; dest « a|d » (case) ou « R|d » (réserve du jour) */
function planifDeplacer(src,dest){

  const visA=a=>(!f.pAg||a.agence===f.pAg)&&(!f.pMet||famMetier(a.metier)===f.pMet)&&(!f.pRhr||ST.get(a).nuits>0);
  // tableau des missions : placées (chez un agent) et à placer (réserve)
  const toutes=[...P.agents.flatMap((a,ai)=>a.jours.flatMap((j,d)=>j.m.map((m,i)=>({m,d,key:`${ai}|${d}|${i}`,agent:a,agence:m.agence||a.agence,fam:m.fam||famMetier(a.metier)})).filter(x=>!x.m.ajout))),
    ...P.reserve.map((m,i)=>({m,d:m.d,key:'R|'+i,agent:null,agence:m.agence||'',fam:m.fam||''}))];
  const visM=x=>(!f.mAg||x.agence===f.mAg)&&(!f.mMet||x.fam===f.mMet)&&(f.mStat==='toutes'||(f.mStat==='aplacer')===!x.agent)&&(f.mJour===''||x.d===+f.mJour);
  const lm=toutes.filter(visM).sort((a,b)=>a.d-b.d||a.m.start.localeCompare(b.m.start));
  const nAPl=toutes.filter(x=>!x.agent&&(!f.mAg||x.agence===f.mAg)&&(!f.mMet||x.fam===f.mMet)).length;
  const missions=`<div class="pl-pane pl-left" data-pdrop="R|x"><div class="pl-ph"><h3>Missions</h3><span class="mut sm">${nf(lm.length)} affichée${lm.length>1?'s':''} · déposez ici pour retirer une mission d’un agent</span></div>
    <div class="pl-f"><select data-plf="mAg">${optAg(f.mAg)}</select><select data-plf="mMet">${optMet(f.mMet)}</select>
      <select data-plf="mStat">${[['aplacer','À placer'],['placees','Placées'],['toutes','Toutes']].map(([k,l])=>`<option value="${k}"${k===f.mStat?' selected':''}>${l}</option>`).join('')}</select>
      <select data-plf="mJour"><option value="">Tous les jours</option>${P.meta.days.map((d,i)=>`<option value="${i}"${String(i)===f.mJour?' selected':''}>${JC[i]} ${dISO(d)}</option>`).join('')}</select></div>
    <div class="pl-f"><button class="btn btn-pri btn-sm" id="plAuto"${nAPl?'':' disabled'}>Remplir automatiquement (${nf(nAPl)})</button><button class="btn btn-sm" id="plVider">Tout remettre à placer</button><button class="btn btn-sm" id="plUndo"${(S.plHist||[]).length?'':' disabled'} title="Annule le dernier changement (remplissage, déplacement, code…)">Annuler${(S.plHist||[]).length?` (${S.plHist.length})`:''}</button></div>
    <div class="pl-list">${lm.length?lm.map(x=>`<div class="pl-row${S.plSel===x.key?' sel':''}${x.m.regulier?' reg':''}" draggable="true" data-pm="${x.key}">
        <span class="pl-d">${JC[x.d]} ${dISO(P.meta.days[x.d])}</span><b>${esc(x.m.label)}</b><span class="pl-h">${hm(x.m.start)}–${hm(x.m.end)}</span>
        <span class="pl-od">${esc(x.m.from||'?')} → ${esc(x.m.to||'?')}</span>
        <span class="pl-st">${x.agent?`<span class="pill">${esc(x.agent.nom)} ${esc(x.agent.prenom)}</span>`:'<span class="pill pill-w">à placer</span>'} <span class="mut">${esc(x.agence)} · ${x.fam==='AFR'?'AFR':x.fam==='CDR'?'CDR':''}${x.m.semaines?` · ${x.m.semaines}/4 sem.`:''}</span><button class="pl-q" data-plwhy="${x.key}" title="Pourquoi ? (choix de l’agent, ou raisons pour lesquelles personne ne convient)">?</button></span>
        ${!x.agent&&x.m.raisons?`<span class="pl-why">${esc(plResume(x.m.raisons))}</span>`:''}</div>`).join('')
      :'<p class="mut sm">Aucune mission pour ce filtre.</p>'}</div>
    <details class="qd"><summary>Ajouter une mission</summary><div class="pl-f" style="margin-top:8px">
      <select id="plNd">${P.meta.days.map((d,i)=>`<option value="${i}">${JC[i]} ${dISO(d)}</option>`).join('')}</select>
      <input type="text" id="plNl" placeholder="Intitulé (TRAIN 8605)"><input type="text" id="plNf" placeholder="Départ"><input type="text" id="plNt" placeholder="Arrivée">
      <input type="time" id="plNs" title="Début"><input type="time" id="plNe" title="Fin">
      <select id="plNa">${agences.map(a=>`<option${a===(f.mAg||f.pAg)?' selected':''}>${esc(a)}</option>`).join('')}</select>
      <select id="plNm">${optMet(f.mMet||f.pMet||'CDR').replace('<option value="">Tous métiers</option>','')}</select>
      <button class="btn btn-pri btn-sm" id="plAdd">Ajouter</button></div></details></div>`;
  // tableau de planification
  const al=S.plAl||[], parCase=new Map(); for(const x of al){ const k=x.pk+'|'+x.date; if(!parCase.has(k)) parCase.set(k,[]); parCase.get(k).push(x); }
  const ags=P.agents.map((a,ai)=>({a,ai})).filter(({a})=>visA(a));
  const chip=(m,key)=>m.ajout?`<div class="pl-m ajout" title="${esc(`Trajet seul ajouté automatiquement (horaire déjà vu dans les fichiers) · ${m.from} → ${m.to}`)}"><b>Trajet seul</b><small>${hm(m.start)}–${hm(m.end)} · ${esc(m.from)} → ${esc(m.to)}</small><button class="pl-q" data-plwhy="${key}" title="Pourquoi ?">?</button></div>`
    :`<div class="pl-m${m.regulier?' reg':''}${S.plSel===key?' sel':''}" draggable="true" data-pm="${key}" title="${esc(`${m.label} · ${m.from||'?'} → ${m.to||'?'} · ${hm(m.start)}–${hm(m.end)}${m.regulier?' · train régulier':''}`)}"><b>${esc(m.label)}</b><small>${hm(m.start)}–${hm(m.end)} · ${esc(m.from||'?')} → ${esc(m.to||'?')}</small><button class="pl-q" data-plwhy="${key}" title="Pourquoi cet agent ?">?</button></div>`;
  const seuilH=S.rules.seuilHebdo||35, barre=st=>{ const k=Math.min(100,st.tte/seuilH*100), c=st.tte>seuilH+1e-9?'sur':st.tte<seuilH-1e-9?'sous':'';
    return `<span class="pl-h35">${fmtH(st.tte)} / ${seuilH} h${st.nuits?` · ${st.nuits} RHR`:''}${st.ajouts?` · ${st.ajouts} trajet${st.ajouts>1?'s':''} seul${st.ajouts>1?'s':''} ajouté${st.ajouts>1?'s':''}`:''}<span class="pl-bar"><i class="${c}" style="width:${k}%"></i></span></span>`; };
  const grps=[...new Set(ags.map(({a})=>a.agence+'|'+a.metier))].sort();
  const lignes=grps.map(g=>`<tr class="tr-g"><td class="l" colspan="8"><b>${esc(g.split('|')[0])}</b> · ${esc(g.split('|')[1])}</td></tr>`+ags.filter(({a})=>a.agence+'|'+a.metier===g).map(({a,ai})=>`<tr><td class="l"><span class="nm">${esc(a.nom)}</span> ${esc(a.prenom)}${barre(ST.get(a))}</td>${a.jours.map((j,d)=>{ const st=ST.get(a), veille=d?st.dehors[d-1]:(E.lieu(a)&&!plEstMaison(E,a,E.lieu(a))?E.lieu(a):null);
      const l=parCase.get(personKey(a)+'|'+P.meta.days[d])||[], nc=l.filter(x=>x.niveau==='nc');
      return `<td data-pdrop="${ai}|${d}" class="${nc.length?'pl-al':l.length?'pl-info':''}${j.c?' pl-code':''}"><select class="pl-c" data-plc="${ai}|${d}">${[...new Set([...PL_CODES,j.c])].map(c=>`<option value="${esc(c)}"${c===j.c?' selected':''}>${c||'—'}</option>`).join('')}</select>
        ${veille?`<div class="pl-dep">depuis ${esc(veille)} (RHR)</div>`:''}${j.m.map((m,i)=>[m,i]).sort((x,y)=>x[0].start.localeCompare(y[0].start)).map(([m,i])=>chip(m,`${ai}|${d}|${i}`)).join('')}
        ${st.dehors[d]?`<div class="pl-rhrc" title="L’agent finit la journée à ${esc(st.dehors[d])}, hors de sa résidence : repos hors résidence (RHR)">☾ RHR · ${esc(st.dehors[d])}</div>`:''}${l.map(x=>`<div class="pl-a ${x.niveau}">${esc(x.texte)}</div>`).join('')}</td>`; }).join('')}</tr>`).join('')).join('');
  const visPk=new Set(ags.map(({a})=>personKey(a))), alV=al.filter(x=>visPk.has(x.pk)), nNc=alV.filter(x=>x.niveau==='nc').length;
  const planning=`<div class="pl-pane"><div class="pl-ph"><h3>Planning</h3><span class="mut sm">${nf(ags.length)} agent${ags.length>1?'s':''} · <b class="${nNc?'warn':''}">${nf(nNc)} alerte${nNc>1?'s':''}</b></span></div>
    <div class="pl-f"><select data-plf="pAg">${optAg(f.pAg)}</select><select data-plf="pMet">${optMet(f.pMet)}</select><label class="mut sm" style="display:inline-flex;gap:5px;align-items:center;flex:0 0 auto"><input type="checkbox" data-plrhr${f.pRhr?' checked':''}> seulement les agents en RHR</label></div>
    <div class="tw tall"><table class="planif"><thead><tr><th class="l">Agent</th>${P.meta.days.map((d,i)=>`<th>${JC[i]} ${dISO(d)}</th>`).join('')}</tr></thead><tbody>${lignes||'<tr><td colspan="8" class="mut">Aucun agent pour ce filtre.</td></tr>'}</tbody></table></div></div>`;
  return `<section class="card"><div class="card-h"><div><h2>Planification — ${weekLabel(P.meta)}</h2><p class="card-s">${dFull(P.meta.monday)} au ${dFull(P.meta.sunday)} · départ : ${P.source==='fichier'?'missions du fichier importé':'planning type'} · ${nf(P.nbReguliers||0)} trains réguliers repérés (toutes agences)</p></div></div>
    <div class="card-b stack">${sel}
      <details class="qd"><summary>Mode d’emploi</summary><div class="note">À gauche les missions, à droite le planning, chacun avec ses filtres (agence, métier ; pour les missions aussi « à placer / placées » et le jour ; pour le planning, « seulement les agents en RHR »). Glissez une mission de la liste vers une case, d’une case à l’autre, ou vers la liste pour la retirer ; sur téléphone : touchez la mission puis la case. Le bouton « ? » de chaque mission explique le choix de l’agent, ou pourquoi personne ne convient. « Annuler » défait le dernier changement.<br><br><b>Remplissage automatique</b> (trains réguliers des 4 semaines précédentes pour une semaine à venir, puis « Remplir automatiquement » pour les missions à placer du filtre) : une mission ne va qu’à un agent de son agence et de son métier, <b>déjà sur place</b> (fin de la veille, RHR ou résidence) ; sinon un <b>trajet seul</b> est ajouté en dernier recours, sur un horaire déjà vu dans les fichiers entre ces deux lieux ; 30 min au moins entre deux missions. Contrôlés : repos journalier à résidence (13 h conducteurs, 12 h AFR), RHR de 9 h au moins, amplitude et TTE de la journée, 48 h dans la semaine. Les <b>AFR rentrent chaque soir</b> ; un conducteur peut découcher (☾ RHR dans la case), sauf la veille d’un repos, le dimanche ou pour une 3e nuit. Parmi les agents possibles : d’abord ceux qui restent sous 35 h, puis ceux qui n’ont pas besoin de trajet seul, puis le moins d’heures dans la semaine (objectif 35 h), puis l’agent habituel. Si tous sont en repos, le repos posé par le planning type est déplacé quand la GPT (6 jours) et les repos d’affilée (3) le permettent. La barre sous chaque nom montre ses heures face aux 35 h (ambre : en dessous, rouge : au-dessus). Chaque changement est contrôlé avec toutes les règles de l’accord (avec les semaines précédentes) ; alerte dans la case et message immédiat. Brouillon enregistré sur le serveur (admins seulement).</div></details>
      ${plSynthese(P,ags.map(x=>x.a),toutes,ST,alV)}
      <div class="pl-2c">${missions}${planning}</div>
    </div></section>`;
}
/* ---------- journées blanches ---------- */
function viewBlanches(){
  const sc=scopeAgents(); if(!sc.length) return emptyScope();
  const rows=[]; sc.forEach(a=>a.blanches.forEach(b=>rows.push({a,b})));
  const byAg=[...groupBy(rows,x=>x.a.agence+'||'+x.a.metier)].sort((a,b)=>a[0].localeCompare(b[0]));
  const parJour=JS.map((j,i)=>({l:j,v:rows.filter(x=>x.b.d===i).length}));
  // toutes les cases vides du périmètre, pour vérifier et corriger
  const all=[]; sc.forEach(a=>(a.casesVides||[]).forEach(c=>all.push({a,c})));
  // une seule liste : journées blanches comptées et cases vides non comptées (à valider ou corriger), plus les corrections
  const F=[['comptees','Journées blanches',()=>true],['manuelles','Corrigées à la main',x=>!!x.c.manuel]];
  const fl=F.find(f=>f[0]===S.jbFiltre)||F[0];
  const list=all.filter(fl[2]).sort((x,y)=>x.a.nom.localeCompare(y.a.nom,'fr')||String(x.c.date).localeCompare(String(y.c.date)));
  S.rows_jbl=list;
  const mis=(m,t)=>m?`<span class="mono">${esc(m.label)}</span> <span class="mut sm">${t==='a'?`fin ${hmD(m.end)} à ${esc(m.to||'?')}`:`début ${hmD(m.start)} de ${esc(m.from||'?')}`}</span>`:'<span class="z">—</span>';
  return `<section class="card">
    <div class="card-h"><div><h2>Journées blanches</h2><p class="card-s">${nf(rows.length)} journée${rows.length>1?'s':''} sur le périmètre</p></div>
      <button class="btn btn-sm" data-goto="exports">Exporter</button></div>
    <div class="card-b">
      <div class="note mb">Journée sans mission ni code — ni RP, ni congé — encadrée par deux services dans la semaine. ${S.rules.jbExcludeNightOverlap?"Les lendemains de service de nuit, où l'agent est encore en service jusqu'au matin, sont exclus. ":'Le lendemain d’un service de nuit compte aussi. '}Chaque case peut être corrigée ci-dessous ; la correction est mémorisée.</div>
      ${rows.length?`<div class="cols2">
        <div class="tw"><table><thead><tr><th class="l">Agence</th><th class="l">Métier</th><th>Journées</th><th>Agents</th></tr></thead>
          <tbody>${byAg.map(([k,l])=>{const[ag,me]=k.split('||');
            return `<tr><td class="l nm">${esc(ag)}</td><td class="l">${esc(me)}</td><td>${l.length}</td>
            <td>${new Set(l.map(x=>personKey(x.a))).size}</td></tr>`;}).join('')}</tbody></table></div>
        <div>${barChart(parJour,{label:'Journées blanches'})}</div></div>`:''}
    </div></section>
  <section class="card">
    <div class="card-h"><div><h2>Vérifier jour par jour</h2><p class="card-s">${nf(list.length)} case${list.length>1?'s':''} · missions qui encadrent chaque jour · filtrez un agent avec la recherche en haut · cliquez un nom pour sa fiche</p></div>
      <div class="seg">${F.map(([k,l])=>`<button class="sg" data-jbf="${k}" aria-pressed="${fl[0]===k}">${l}</button>`).join('')}</div></div>
    <div class="card-b">${list.length?`<div class="tw tall"><table class="sticky1"><thead><tr><th class="l st">Agent</th><th class="l">Agence</th><th class="l">Jour</th><th class="l">Mission avant</th><th class="l">Mission après</th><th class="l">Statut</th>${admin()?'<th class="l">Correction</th>':''}</tr></thead><tbody>
      ${list.map(({a,c},i)=>{const k=kJour(personKey(a),c.date);
        return `<tr><td class="l st"><button class="lnk" data-jbl="${i}"><span class="nm">${esc(a.nom)}</span> ${esc(a.prenom)}</button></td><td class="l">${esc(a.agence)}</td>
        <td class="l"><b>${JS[c.d]}</b> <span class="mono mut">${dISO(c.date)}</span></td>
        <td class="l">${mis(c.avant,'a')}</td><td class="l">${mis(c.apres,'p')}</td>
        <td class="l">${c.compte?'<span class="pill pill-w">journée blanche</span>':'<span class="pill pill-n">non comptée</span>'}${c.horsResidence?' <span class="pill pill-a">hors résidence</span>':''} <span class="mut sm">${esc(c.raison||'')}</span></td>
        ${admin()?`<td class="l">${c.manuel?`<button class="btn btn-sm" data-cjb="${esc(k)}" data-v="">Annuler</button>`
          :c.compte?`<button class="btn btn-sm" data-cjb="${esc(k)}" data-v="non">Pas une journée blanche</button>`
          :`<button class="btn btn-sm" data-cjb="${esc(k)}" data-v="oui">Journée blanche</button>`}</td>`:''}</tr>`;}).join('')}
      </tbody></table></div>`:'<p class="mut">Aucune case pour ce filtre.</p>'}</div></section>`;
}

/* ---------- graphiques ---------- */
function viewGraphiques(){
  if(!S.weeks.length) return emptyScope();
  const sc=scopeAgents(); if(!sc.length) return emptyScope();
  const c=S.chart, M=METRICS.find(m=>m.k===c.metric)||METRICS[0], k=M.k, mode=S.mode;
  const isRHR=k==='nbRHR';
  const base=l=>isRHR?l.filter(a=>a.rhrApplicable):l;     // les AFR n'entrent pas dans les statistiques RHR
  const fm=v=>M.f(v);
  const rows=base(sc);
  const byAg=[...groupBy(rows,a=>a.agence)].map(([l,list])=>{const g=agg(list);return {l,v:modeVal(g,k,mode),c:agenceColor(l),sub:nf(g.nbAgents),sub2:'Agents'};}).sort((a,b)=>b.v-a.v);
  const byMe=[...groupBy(rows,a=>a.metier)].map(([l,list])=>{const g=agg(list);return {l,v:modeVal(g,k,mode),sub:nf(g.nbAgents),sub2:'Agents'};}).sort((a,b)=>b.v-a.v);
  // répartition par agent : une ligne par personne (pour le RHR, uniquement ceux qui en ont eu)
  const persons=mergeAcrossWeeks(rows).filter(p=>!isRHR||p.nbRHR>0);
  const pers=persons.map(p=>({l:`${p.nom} ${p.prenom.slice(0,1)}.`,v:mode==='total'?p[k]:r2(p[k]/(p.nbSemaines||1)),c:agenceColor(p.agence),sub:p.agence,sub2:'Agence'})).sort((a,b)=>b.v-a.v);
  const avgP=pers.length?pers.reduce((s,x)=>s+x.v,0)/pers.length:0;
  // évolution hebdomadaire et moyennes par semaine : toutes les semaines enregistrées
  const all=base(scopeAgents({allWeeks:true}));
  const ids=S.weeks.map(w=>w.weekId).sort();
  const labels=ids.map(id=>`S${String(S.weeks.find(x=>x.weekId===id).week).padStart(2,'0')}`);
  const shown=scopeAgences().slice(0,8);
  const series=shown.map(ag=>({name:ag,short:ag.slice(0,3).toUpperCase(),color:agenceColor(ag),
    values:ids.map(id=>{const l=all.filter(a=>a.weekId===id&&a.agence===ag); return l.length?modeVal(agg(l),k,mode==='agent'?'agent':'total'):null;})}));
  const legend=shown.map(ag=>`<span class="lg"><span class="cdot" style="background:${agenceColor(ag)}"></span>${esc(ag)}</span>`).join('');
  // moyennes par semaine : tous métiers du périmètre ; le RHR ne porte que sur les conducteurs
  const allRows=scopeAgents({allWeeks:true}), nWall=new Set(allRows.map(a=>a.weekId)).size;
  const wval=(l,mk)=>{ if(mk!=='nbRHR') return agg(l)[mk+'_sem']; const w=new Set(l.map(a=>a.weekId)).size||1;
    return r2(l.filter(a=>a.rhrApplicable).reduce((s,a)=>s+a.nbRHR,0)/w); };
  const wk=[...groupBy(allRows,a=>a.agence)].map(([agence,l])=>{const g=agg(l),o={agence,ag:r2(g.nbLignes/g.nbSemaines)}; METRICS.forEach(m=>o[m.k]=wval(l,m.k)); return o;});
  const gW=(()=>{const g=agg(allRows),o={ag:r2(g.nbLignes/g.nbSemaines)}; METRICS.forEach(m=>o[m.k]=wval(allRows,m.k)); return o;})();
  const wCols=[{k:'agence',l:'Agence',cls:'l nm',f:r=>esc(r.agence)},
    {k:'ag',l:'Agents / sem.',f:r=>nf(r.ag,1)},
    ...METRICS.map(m=>({k:m.k,l:m.c+' / sem.',f:r=>m.f(r[m.k])}))];
  const tops=[15,25,50,100,0];
  return `
  <section class="card"><div class="card-b"><div class="ctrls" style="margin-bottom:0;border-bottom:0;padding-bottom:0">
    <div class="fld"><span class="flabel">Mesure</span><div class="seg">${METRICS.map(m=>`<button class="sg" data-cm="${m.k}" aria-pressed="${m.k===k}">${m.c}</button>`).join('')}</div></div>
    <div class="fld"><span class="flabel">Valeur</span>${modeSeg()}</div></div>
    <p class="hint">${esc(modeHint())} · les filtres de semaine, d'agence et de métier s'appliquent${isRHR?' · RHR : conducteurs uniquement':''}</p></div></section>
  <div class="charts">
    <section class="card"><div class="card-h"><div><h2>${esc(M.l)} par agence</h2><p class="card-s">${esc(modeHint())}</p></div></div>
      <div class="card-b">${barChart(byAg,{fmt:fm,label:M.l})}</div></section>
    <section class="card"><div class="card-h"><div><h2>${esc(M.l)} par métier</h2><p class="card-s">${esc(modeHint())}</p></div></div>
      <div class="card-b">${barChart(byMe,{fmt:fm,label:M.l})}</div></section>
  </div>
  <section class="card"><div class="card-h"><div><h2>Répartition par agent</h2>
    <p class="card-s">${esc(M.l)}${mode==='total'?'':' par semaine'} · ${nf(pers.length)} agent${pers.length>1?'s':''}${isRHR?' ayant eu au moins un RHR':''} · moyenne ${fm(avgP)}</p></div>
    <label class="fld"><span class="flabel">Afficher</span><select id="cTop">${tops.map(n=>`<option value="${n}"${c.top===n?' selected':''}>${n?n+' premiers':'tous'}</option>`).join('')}</select></label></div>
    <div class="card-b">${barChart(c.top?pers.slice(0,c.top):pers,{fmt:fm,label:M.l})}</div></section>
  <section class="card"><div class="card-h"><div><h2>Évolution hebdomadaire</h2>
    <p class="card-s">${esc(M.l)} — une courbe par agence${mode==='agent'?', moyenne par agent':''} · toutes les semaines enregistrées</p></div></div>
    <div class="card-b">${lineChart(series,labels,fm)}<div class="clg">${legend}</div>
    ${S.weeks.length<2?'<p class="hint">Une seule semaine enregistrée : la courbe prendra son sens dès la deuxième.</p>':''}</div></section>

/* ---------- à vérifier : toutes les alertes au même endroit, avec leur suivi ---------- */
const AL_TYPES={lecture:'Lecture du fichier',horscol:'Mission hors colonne',long:'RHR de plus de 44 h',ailleurs:'Agent basé ailleurs',
  jamais:'Jamais en résidence',chevauche:'Missions qui se chevauchent',residence:'Résidence à confirmer',ecart:'Écart inhabituel (agent)',ecartag:'Écart inhabituel (agence)',fichier:'Fichier suspect',rpdouble:'Numéro de RP en double'};
const AL_NIV={haute:['Haute','pill-c'],moyenne:['Moyenne','pill-w'],info:['Info','pill-n']};
/** Écarts à sa propre habitude : valeur d'une semaine à plus de 2 écarts-types de la moyenne, avec un écart minimal */
const ECARTS=[['nbRHR','RHR',2,nf],['heuresSup','Heures sup',4,fmtH],['heuresPlanifiees','TTE',8,fmtH],['journeesBlanches','Journées blanches',2,nf]];
function ecartsDe(series,key,label,minD,f){
  if(series.length<4) return [];
  const v=series.map(x=>x.v), m=v.reduce((s,x)=>s+x,0)/v.length, sd=Math.sqrt(v.reduce((s,x)=>s+(x-m)**2,0)/v.length);
  return series.filter(x=>sd>0&&Math.abs(x.v-m)>2*sd&&Math.abs(x.v-m)>=minD).map(x=>({...x,m,txt:`${label} : ${f(x.v)} cette semaine, ${f(r2(m))} en moyenne sur ${series.length} semaines`}));
}
/** Comparaison d'une semaine importée à la précédente : fichier incomplet ou inhabituel */
function suspicions(cur,prev){
  const out=[], nA=cur.nbAgents, pA=prev&&prev.nbAgents;
  if(pA&&Math.abs(nA-pA)/pA>0.2) out.push(`effectif ${nA>pA?'en hausse':'en baisse'} de ${nf(Math.abs(100*(nA-pA)/pA),0)} % (${nf(pA)} → ${nf(nA)} lignes)`);
  if(prev&&prev.agences&&cur.agences){ const miss=prev.agences.filter(a=>!cur.agences.includes(a)), neu=cur.agences.filter(a=>!prev.agences.includes(a));
    if(miss.length) out.push(`agence${miss.length>1?'s':''} absente${miss.length>1?'s':''} : ${miss.join(', ')}`);
    if(neu.length&&prev.agences.length) out.push(`nouvelle${neu.length>1?'s':''} agence${neu.length>1?'s':''} : ${neu.join(', ')}`); }
  if(cur.fusions&&cur.nbAgents&&cur.fusions/cur.nbAgents>0.05) out.push(`${cur.fusions} agents sur plusieurs lignes (${nf(100*cur.fusions/cur.nbAgents,0)} %)`);
  if(cur.vides!=null&&cur.nbAgents&&cur.vides/cur.nbAgents>0.1) out.push(`${cur.vides} lignes entièrement vides (${nf(100*cur.vides/cur.nbAgents,0)} %)`);
  if(cur.extractDate&&cur.monday){ const d=(Date.parse(cur.extractDate)-Date.parse(cur.monday))/DAY; if(d>14||d<-60) out.push(`date d’extraction ${dFull(cur.extractDate)} éloignée de la semaine`); }
  return out;
}
function collectAlertes(){
  const out=[], add=a=>out.push(a), cH=(S.rules.corrections||{}).horaires||{};
  const ids=[...S.loaded.keys()].sort(), W=id=>S.weeks.find(w=>w.weekId===id);
  for(const w of S.weeks){ const c=w.controle; if(!c||!c.anomalies) continue;
    for(const a of c.anomalies){
      const lab=(/^mission sans horaire « (.*) »$/.exec(a.message)||[])[1];
      // réparé : horaire saisi pour cette mission (ou, pour un horaire illisible, pour une mission de la même case)
      if(a.pk&&Object.keys(cH).some(k=>lab!=null?k===kHoraire(a.pk,a.date,lab):k.startsWith(a.pk+'|'+a.date+'|'))) continue;
      add({key:`lec|${w.weekId}|${a.agent}|${a.jour}|${a.message}`,type:'lecture',niv:'moyenne',w:w.weekId,titre:`${a.agent} · ${a.jour}`,detail:a.message,
        brut:a.brut, pk:a.pk, date:a.date, fix:a.pk&&lab!=null&&!/\d{1,2}\s*\/\s*\S*:\S*\d/.test(lab)?{hor:{pk:a.pk,date:a.date,label:lab,agent:a.agent,jour:a.jour}}:{reimport:!a.pk}}); } }
  let prevR=null;
  for(const id of ids){ const v=S.loaded.get(id), w=W(id);
    for(const h of v.meta.horsColonne||[]) add({key:`hc|${id}|${h.agent}|${h.start}`,type:'horscol',niv:'moyenne',w:id,ag:h.agence,pk:h.pk,fix:h.pk?{hc:{pk:h.pk,start:h.start,label:h.label}}:null,titre:`${h.agent} · ${h.jour}`,detail:`${h.label} daté du ${dtISO(h.start)} : écartée du calcul`});
    for(const a of v.agents){ if(a.exclu) continue; const pk=personKey(a), nm=`${a.nom} ${a.prenom}`;
      // un arrêt déjà tranché à la main (compté ou écarté) ne remonte plus
      for(const c of a.coupures||[]) if(c.long&&!c.manuel) add({key:`long|${c.key}`,type:'long',niv:'haute',w:id,ag:a.agence,pk,titre:nm,detail:`arrêt de ${fmtH(c.dureeH)} à ${c.lieu} (${dtISO(c.debut)} → ${dtISO(c.fin)}) : au-delà de l’absence maximale de l’accord`,fix:{coupure:c.key}});
      for(const c of a.chevauchements||[]) add({key:`chev|${pk}|${c.debut}`,type:'chevauche',niv:'haute',w:id,ag:a.agence,pk,titre:nm,fix:c.aStart?{chev:{pk,a:c.a,aStart:c.aStart,b:c.b,bStart:c.bStart}}:null,
        detail:`« ${c.a} » et « ${c.b} » se chevauchent de ${fmtH(c.min/60)} (${dtISO(c.debut)} → ${hm(c.fin)}) : ce temps est compté deux fois en amplitude et en TTE ; vérifiez le fichier`});
      for(const j of a.jours||[]) if(j.rpDouble) add({key:`rpd|${pk}|${j.date}`,type:'rpdouble',niv:'info',w:id,ag:a.agence,pk,titre:nm,
        detail:`${j.code} inscrit le ${dFull(j.date)} alors qu’il a déjà été lu le ${dFull(j.rpDouble.date)} (${j.rpDouble.weekId}) : compté une seule fois`});
      const fr=a.lieuHabituel&&!a.rattachement?{res:{pk,w:id,lieu:a.lieuHabituel}}:null;
      if(a.jamaisEnResidence) add({key:`jr|${pk}|${id}`,type:'jamais',niv:'haute',w:id,ag:a.agence,pk,titre:nm,detail:`aucune mission ne passe par la résidence ${a.residence} : tous ses arrêts comptent en RHR`,fix:fr});
      else if(a.basAilleurs) add({key:`ail|${pk}|${id}`,type:'ailleurs',niv:'moyenne',w:id,ag:a.agence,pk,titre:nm,detail:`surtout à ${a.lieuHabituel}, résidence ${a.residence} : détachement ou rattachement temporaire ?`,fix:fr}); }
    for(const [ag,src] of Object.entries(v.meta.residenceSource||{})) if(src==='manuel'){
      // résidence saisie à la main mais absente des missions de cette semaine (ex. « BORDEAUX » saisi, fichier écrit « BX »)
      const lc=(v.meta.locCounts||{})[ag]||{}, res=[v.meta.residences[ag],...((S.rules.lieuxResidence||{})[ag]||[])].map(normLieu);
      const top=Object.entries(lc).sort((x,y)=>y[1]-x[1])[0];
      if(top&&!res.some(r=>lc[r])) add({key:`resman|${ag}|${id}`,type:'residence',niv:'haute',w:id,ag,titre:ag,detail:`la résidence saisie « ${v.meta.residences[ag]} » n’apparaît dans aucune mission de la semaine ; le lieu le plus fréquent est « ${top[0]} » : s’il s’agit de la même résidence, ajoutez cette écriture (fiche d’un agent, bouton « … = résidence ») ; sinon corrigez la résidence dans les Réglages. D’ici là, les RHR de cette agence sont surestimés.`,fix:{lieures:{ag,lieu:top[0]},reglages:1}}); }
    for(const [ag,src] of Object.entries(v.meta.residenceSource||{})) if(src==='indéterminée') add({key:`res|${ag}`,type:'residence',niv:'haute',w:id,ag,titre:ag,detail:'aucune résidence connue : aucun RHR ne peut être compté',fix:{reglages:1}});
    const cur={...(w||{}),nbAgents:v.agents.length,agences:[...new Set(v.agents.map(a=>a.agence))],fusions:v.meta.fusions,
      vides:v.agents.filter(a=>a.jours.every(j=>j.kind==='VIDE')).length,extractDate:v.meta.extractDate,monday:v.meta.monday};
    const prevW=prevR&&Date.parse(cur.monday)-Date.parse(prevR.monday)===7*DAY?prevR:null;
    for(const m of suspicions(cur,prevW)) add({key:`susp|${id}|${m.replace(/\d+/g,'#')}`,type:'fichier',niv:'moyenne',w:id,titre:w?weekLabel(w):id,detail:m,fix:{import:1}});
    prevR=cur; }

function alFix(a,i){

  if(f.hor) return B(`data-alhor="${i}"`,'Voir et corriger',1);
  if(f.hc) return B(`data-hcgarde="${esc(f.hc.pk+'|'+f.hc.start)}"`,'Compter quand même',1);
  if(f.chev) return B(`data-ign="${esc(f.chev.pk+'|'+f.chev.aStart+'|'+f.chev.a)}"`,`Ignorer « ${esc(f.chev.a)} »`,1)+B(`data-ign="${esc(f.chev.pk+'|'+f.chev.bStart+'|'+f.chev.b)}"`,`Ignorer « ${esc(f.chev.b)} »`,1);
  if(f.reimport) return `<span class="hint" style="margin:0 6px 0 0" title="Les semaines importées avant cette version ne gardent pas la mission : réimportez le fichier pour pouvoir saisir son horaire ici.">réimporter pour réparer</span>`;

  if(f.res) return B(`data-ratt="${esc(f.res.pk+'|'+f.res.w)}" data-val="${esc(f.res.lieu)}" title="Rattachement temporaire (accord art. 8), pour cette semaine seulement"`,`Rattacher à ${esc(f.res.lieu)} cette semaine`,1)
    +B(`data-resagv="${esc(f.res.pk)}" data-w="${esc(f.res.w)}" data-lieu="${esc(f.res.lieu)}" title="Mouvement d’agence : cette semaine et les suivantes"`,`Résidence ${esc(f.res.lieu)} dès ${esc(String(f.res.w).replace(/^\d+-/,''))}`);
  let h='';

  return h;
