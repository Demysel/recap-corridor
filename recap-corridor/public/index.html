<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Extraction hebdomadaire des fichiers Récap National Corridor : repos hors résidence, journées blanches, heures, paniers et données par agent, métier et agence.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090A" media="(prefers-color-scheme: dark)">
<title>Récap Corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=Overpass+Mono:wght@400;500;600&display=swap">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/icons/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Récap Corridor">
<meta name="application-name" content="Récap Corridor">
<style>
/* ==========================================================================
   Jetons de conception
   Identité : rouge ferroviaire (DB Cargo) sur blanc ou noir, sans dégradé ;
   la « ligne » ferroviaire marque la section active ; ambre pour ce qui
   demande attention, chiffres en police à chasse fixe.
   ========================================================================== */
:root{--cov:#00B86B;--cc-gris:#8A8A93;--cc-gris-t:#fff;
  --ground:#F4F4F5; --surface:#FFFFFF; --surface-2:#F8F8F9; --surface-3:#EDEDEF;
  --line:#E4E4E7; --line-2:#D1D1D6;
  --ink:#131316; --ink-2:#4B4B53; --ink-3:#74747D;
  --accent:#EC0016; --accent-2:#C00012; --accent-soft:#FDECEE; --accent-line:#F6B7BE; --on-accent:#fff;
  --signal:#F2A900; --signal-ink:#8A5A00; --signal-soft:#FDF4DC; --signal-line:#EDC77A;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#8a8a93;
  --good:#1B7A4B; --good-soft:#E1F1E8;
  --warn:#8A5A00; --warn-soft:#FDF4DC; --warn-line:#EDC77A;
  --crit:#A5000F; --crit-soft:#FBE3E5;
  --night:rgba(40,40,60,.07);
  --shadow:0 1px 2px rgba(19,19,22,.05), 0 4px 16px -8px rgba(19,19,22,.10);
  --shadow-lg:0 24px 60px -18px rgba(19,19,22,.30);
  --r:14px; --r-s:10px;
  --sans:"Overpass",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --cond:"Overpass",-apple-system,"Segoe UI",sans-serif;
  --mono:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --side:252px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#09090A; --surface:#131315; --surface-2:#18181B; --surface-3:#222226;
  --line:#26262B; --line-2:#36363D;
  --ink:#F4F4F5; --ink-2:#B6B6BD; --ink-3:#86868F;
  --accent:#F0152A; --accent-2:#FF3B4E; --accent-soft:#2B0D11; --accent-line:#5E1820; --on-accent:#fff;
  --signal:#F2B233; --signal-ink:#F5C766; --signal-soft:#2B2210; --signal-line:#6A5020;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9e2f; --s7:#9085e9; --s8:#8a8a93;
  --good:#5FC48D; --good-soft:#10291B;
  --warn:#F5C766; --warn-soft:#2B2210; --warn-line:#6A5020;
  --crit:#FF6B76; --crit-soft:#34110F;
  --night:rgba(160,160,200,.07);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}}
/* Site de test (APP_ENV=dev, marqué par le serveur) : bleu électrique au lieu du rouge, bandeau permanent */
html[data-env="dev"]{--accent:#1F4BFF; --accent-2:#1435C8; --accent-soft:#E6EBFF; --accent-line:#AFC0FF}
@media (prefers-color-scheme:dark){html[data-env="dev"]:not([data-theme="light"]){--accent:#4F7BFF; --accent-2:#7C9DFF; --accent-soft:#0D1638; --accent-line:#24387A}}
html[data-env="dev"][data-theme="dark"]{--accent:#4F7BFF; --accent-2:#7C9DFF; --accent-soft:#0D1638; --accent-line:#24387A}
html[data-env="dev"] body{box-shadow:inset 0 4px 0 #FFD400}
html[data-env="dev"] body::after{content:"SITE DE TEST · base de test";position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:9999;
  pointer-events:none;background:#FFD400;color:#111;font:800 11px/1 var(--sans);letter-spacing:.12em;padding:7px 12px;border-radius:999px;
  box-shadow:0 2px 10px rgba(0,0,0,.35)}
:root[data-theme="dark"]{
  --ground:#09090A; --surface:#131315; --surface-2:#18181B; --surface-3:#222226;
  --line:#26262B; --line-2:#36363D;
  --ink:#F4F4F5; --ink-2:#B6B6BD; --ink-3:#86868F;
  --accent:#F0152A; --accent-2:#FF3B4E; --accent-soft:#2B0D11; --accent-line:#5E1820; --on-accent:#fff;
  --signal:#F2B233; --signal-ink:#F5C766; --signal-soft:#2B2210; --signal-line:#6A5020;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9e2f; --s7:#9085e9; --s8:#8a8a93;
  --good:#5FC48D; --good-soft:#10291B;
  --warn:#F5C766; --warn-soft:#2B2210; --warn-line:#6A5020;
  --crit:#FF6B76; --crit-soft:#34110F;
  --night:rgba(160,160,200,.07);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{padding:0;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px);transition:background .25s}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
.sm{font-size:12.5px}.mut{color:var(--ink-3)}.mt{margin-top:12px}.mb{margin-bottom:14px}
.nb{font-weight:400}.z{color:var(--ink-3);opacity:.5}
.mono{font-family:var(--mono);font-size:12px}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink-3);background:var(--surface)}

/* ---------- ossature : menu latéral groupé + contenu ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh;transition:grid-template-columns .25s var(--ease)}
.app.mini{--side:68px}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:18px 14px 14px;
  border-right:1px solid var(--line);background:var(--surface);overflow:hidden}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.side-nav{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.brand{display:flex;align-items:center;gap:11px;min-width:0;padding-left:2px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);flex:none;display:grid;place-items:center}
.mark svg{width:21px;height:21px;display:block}
.bt-t{min-width:0}
.brand h1{font-size:15.5px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.brand p{margin-top:1px;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:9px;color:var(--ink-2);transition:background .15s,color .15s,border-color .15s}
.ib:hover{background:var(--surface-3);color:var(--ink)}
.ib .ic{width:17px;height:17px}
.m-only{display:none}
.side-f{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.sf-b{display:flex;gap:0}
.side-f .ib{width:30px;height:30px}
/* nom ou e-mail du compte : coupé (…) pour ne jamais repousser les boutons, dont « Se déconnecter » */
#rolebadge{flex:1 1 auto;min-width:0}#rolebadge .badge{max-width:100%}#rolebadge .bl-t{overflow:hidden;text-overflow:ellipsis}#rolebadge .badge::before{flex-shrink:0}.side-f .sf-b{flex-shrink:0}
.main{min-width:0;padding:0 32px 70px}

/* navigation : sections regroupées ; la section active est marquée par un rail rouge */
.tabs{display:flex;flex-direction:column;gap:14px;margin:0 -4px;padding:0 4px;overflow-y:auto;scrollbar-width:thin;min-height:0}
.ngrp{display:flex;flex-direction:column;gap:1px}
.nglab{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 5px;white-space:nowrap}
.tab{position:relative;display:flex;align-items:center;gap:11px;border:0;background:none;padding:7px 10px;min-height:36px;
  font-size:13.5px;font-weight:500;color:var(--ink-2);border-radius:9px;text-align:left;transition:color .15s,background .15s;white-space:nowrap}
.tab .ti{width:17px;height:17px;flex:none;color:var(--ink-3);transition:color .15s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab:hover .ti{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);font-weight:700;background:var(--accent-soft)}
.tab[aria-selected=true] .ti{color:var(--accent)}
.tab[aria-selected=true]::before{content:"";position:absolute;left:-4px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.tab .tl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tab .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);border-radius:999px;padding:0 6px;min-width:20px;text-align:center}
.tab .cnt.hot{background:var(--accent);color:var(--on-accent);font-weight:600}
.tab[aria-selected=true] .cnt:not(.hot){color:var(--accent)}
/* menu réduit : icônes seules */
.app.mini .side{padding-inline:12px}
.app.mini .bt-t,.app.mini .tab .tl,.app.mini .srchbtn .st-l,.app.mini .srchbtn kbd,.app.mini #rolebadge{display:none}
.app.mini .nglab{font-size:0;padding:0;height:1px;background:var(--line);margin:0 8px 6px}
.app.mini .ngrp:first-child .nglab{display:none}
.app.mini .tab{justify-content:center;padding:9px 0}
.app.mini .tab .cnt{position:absolute;top:2px;right:0;font-size:9.5px;padding:0 4px;min-width:0;line-height:15px}
.app.mini .tab .cnt:not(.hot){display:none}
.app.mini .srchbtn{justify-content:center;padding:8px 0}
.app.mini .side-f{flex-direction:column}
.app.mini .sf-b{flex-direction:column}
.app.mini [data-act=mini] .ic{transform:scaleX(-1)}

/* barre de filtres */
.top{position:sticky;top:0;z-index:40;margin:0 -28px;padding:14px 28px 12px;
  background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.top.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 20px -18px rgba(0,0,0,.5)}
.crumb{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.crumb h2{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.crumb .ctx{font-size:12.5px;color:var(--ink-3)}
.fbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.grow{flex:1}
.flabel{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
select,input[type=text],input[type=search],input[type=password],input[type=email]{font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:10px;padding:7px 11px;max-width:100%;transition:border-color .15s,box-shadow .15s}
select:hover,input:hover{border-color:var(--ink-3)}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.srch{position:relative}
.srch input{width:230px;padding-left:32px;padding-right:34px}
.srch::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;margin-top:-7px;border:2px solid var(--ink-3);border-radius:50%}
.srch::after{content:"";position:absolute;left:21px;top:50%;width:6px;height:2px;margin-top:4px;background:var(--ink-3);transform:rotate(45deg);border-radius:2px}
.srch kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.srch input:focus+kbd,.srch input:not(:placeholder-shown)+kbd{display:none}
.sel{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:7px 12px;font-size:13.5px;
  display:inline-flex;align-items:center;gap:9px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color .15s}
.sel:hover{border-color:var(--ink-3)}
.sel .car{color:var(--ink-3);font-size:10px;transition:transform .2s}
.sel[aria-expanded=true]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel[aria-expanded=true] .car{transform:rotate(180deg)}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  background:var(--surface-3);color:var(--ink-2);border-radius:999px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.badge.ro::before{background:var(--ink-3)}
.scope{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);animation:drop .22s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.sgrp{display:flex;flex-direction:column;gap:7px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;
  font-weight:500;color:var(--ink-2);transition:all .15s var(--ease);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.chip:active{transform:none}
.chip-mini{font-size:11.5px;padding:3px 10px}
.chip.ghost{border-style:dashed}
.chipset{display:flex;gap:5px;flex-wrap:wrap}

/* boutons */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 4px 14px -6px var(--accent)}
.btn-pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.dgr{border-color:var(--crit);color:var(--crit)}
.btn.dgr:hover{background:var(--crit-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn .ic{width:15px;height:15px;flex:none}

/* ---------- cartes & vue ---------- */
.stack{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:16px 19px 0}
.card-h h2{font-size:15.5px;letter-spacing:-.015em}
.card-s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.card-b{padding:13px 19px 19px}
.card-h .btns{align-items:center}
.prose{max-width:78ch}
.prose p{margin-bottom:11px}.prose p:last-child{margin-bottom:0}
.mn h3{margin:16px 0 6px;font-size:15px}.mn h3:first-child{margin-top:0}
.mnf{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 14px}.mnf .mnw{grid-column:1/-1}
.mnf input,.mnf textarea{width:100%}.mnf textarea{font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:7px 11px;resize:vertical}.mnprev{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:8px}
.mnfoot{text-align:center;margin:18px 0 6px;font-size:13px}
.cc-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}.cc-li{display:inline-flex;align-items:center;gap:6px}
.cc-dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;margin-right:4px}
.cc-ax,.cc-r{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:10px;align-items:start}
.cc-axt{position:relative;height:14px;margin-top:2px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}.cc-axt span{position:absolute;transform:translateX(-50%)}.cc-axt span:first-child{transform:none}
.cc-j{border-top:1px solid var(--line);padding-top:8px}.cc-jh{font-weight:700;font-size:13.5px;margin-bottom:6px}
.cc-n{font-size:13px;font-weight:600;display:flex;align-items:center;min-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-t{position:relative;height:22px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px}
.cc-t i{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.55}.cc-t i.f{opacity:1;background:var(--line-2)}
.cc-r{margin-bottom:6px}.cc-nm{overflow:hidden;text-overflow:ellipsis}
.cc-live{margin-left:6px;font-size:10px;padding:1px 6px}
.cc-now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--accent);z-index:3}
.cc-rhr{position:absolute;top:3px;bottom:3px;border:2px dashed var(--ink-3);border-radius:4px;font:600 10px/14px var(--mono);color:var(--ink-2);padding:0 4px;overflow:hidden;white-space:nowrap;background:var(--surface)}
.cc-b{z-index:2;cursor:default;background:var(--cc-gris);color:var(--cc-gris-t)}.cc-b.cov{z-index:3;color:#fff;outline:3px solid var(--cg);outline-offset:2px;box-shadow:0 0 0 6px color-mix(in srgb,var(--cg) 30%,transparent),0 0 14px 2px color-mix(in srgb,var(--cg) 65%,transparent)}
.cc-b .cc-tx{position:relative;z-index:1}.cc-p{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.75) 0 2px,transparent 2px 5px);border-left:1px solid rgba(255,255,255,.8);border-right:1px solid rgba(255,255,255,.8)}
.cc-pause-ex{display:inline-block;width:18px;height:10px;border-radius:3px;background:var(--cc-gris) repeating-linear-gradient(135deg,rgba(255,255,255,.75) 0 2px,transparent 2px 5px);margin-right:6px;vertical-align:middle}
.cc-r.cov{margin:10px 0 12px}.cc-r.cov .cc-t{background:color-mix(in srgb,var(--cov) 8%,var(--surface-2))}

/* entrée d'onglet : les blocs arrivent en cascade, une seule fois par changement d'onglet */

.pl-od{grid-column:2/4;color:var(--ink-3);font-size:11.5px}.pl-st{grid-column:1/4;font-size:11px}.pl-left.pl-over{outline:2px dashed var(--accent)}

.planif{table-layout:fixed;min-width:1000px}.planif th:first-child,.planif td:first-child{width:150px}.planif td{vertical-align:top;text-align:left!important}.planif td[data-pdrop]{transition:background .15s}.planif td.pl-over{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.pl-m{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:6px;padding:4px 6px;margin:4px 0;cursor:grab;text-align:left;font-size:12px;line-height:1.3}
.pl-m{overflow:hidden}.pl-m b{display:block;overflow-wrap:anywhere}.pl-m small{display:block;color:var(--ink-3);font-size:10.5px;white-space:normal;overflow-wrap:anywhere}.pl-m.reg{border-left-color:var(--signal)}.pl-m.sel{outline:2px solid var(--accent)}
.pl-c{display:block;font-size:11px;padding:1px 4px;width:auto;margin:0 0 2px auto}.planif td.pl-code{background:color-mix(in srgb,var(--accent) 8%,var(--surface))!important}
.planif td.pl-al{box-shadow:inset 0 0 0 2px var(--crit,#D00)}.pl-a{font-size:10.5px;line-height:1.3;margin-top:3px;color:var(--crit,#B00);white-space:normal;overflow-wrap:anywhere}.pl-a.info{color:var(--ink-3)}
.pl-m.ajout{border-style:dashed;border-left-style:dashed;border-left-color:var(--ink-3);background:transparent;opacity:.85;cursor:default}

.pl-h35{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-3)}.pl-bar{display:block;height:4px;border-radius:2px;background:var(--surface-3);margin-top:2px;overflow:hidden}

.pl-kpi{display:flex;flex-wrap:wrap;gap:8px}.pl-kpi>div{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:110px;background:var(--surface)}
.pl-kpi b{display:block;font-size:17px}.pl-kpi span{font-size:11px;color:var(--ink-3)}
.pl-why{grid-column:1/4;font-size:11px;color:var(--crit,#B00)}
.pl-res td{background:color-mix(in srgb,var(--signal) 10%,var(--surface))!important}
.prod-h3{font-size:14px;margin:6px 0 0}

.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 16px;min-width:0;
  box-shadow:var(--shadow);overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}

table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums;background:var(--surface)}

td{font-feature-settings:"tnum"}

  background:var(--surface-2);position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line-2)}

  .vddp.open{position:static;width:auto;margin-top:8px;box-shadow:none;background:var(--surface-2)}}

/* frise horaire d'une semaine (lecture de la semaine) */

/* tiroir agent */

<script>
/* ==========================================================================
   1. LECTURE DU FICHIER .XLSX  (ZIP + XML, sans dépendance externe)
   Seules les parties utiles du classeur sont décompressées : les fichiers
   lourds (images, autres feuilles) ne ralentissent plus la lecture.
   ========================================================================== */
async function inflateRaw(bytes){
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function readZip(ab){
  const by=new Uint8Array(ab), dv=new DataView(ab);
  let eo=-1; const max=Math.min(by.length,66000);
  for(let i=by.length-22;i>=by.length-max&&i>=0;i--) if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0) throw new Error("Ce fichier n'est pas un classeur Excel (.xlsx) lisible.");
  let n=dv.getUint16(eo+10,true), cd=dv.getUint32(eo+16,true);
  if(cd===0xffffffff||n===0xffff){
    for(let i=eo-20;i>=0;i--) if(dv.getUint32(i,true)===0x07064b50){
      const z=Number(dv.getBigUint64(i+8,true));
      if(dv.getUint32(z,true)===0x06064b50){n=Number(dv.getBigUint64(z+32,true));cd=Number(dv.getBigUint64(z+48,true));}

  }
  const dec=new TextDecoder('utf-8'), ent=[]; let p=cd;

    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true); let cs=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    let off=dv.getUint32(p+42,true);

    has:k=>out.has(k),
    async text(k){ const e=out.get(k); if(!e) return null;
      return dec.decode(e.method===0?e.raw:await inflateRaw(e.raw)); },
  };
}
const ENT={lt:'<',gt:'>',amp:'&',quot:'"',apos:"'"};
const unesc=s=>s.replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d))
  .replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCharCode(parseInt(h,16)))
  .replace(/&(lt|gt|amp|quot|apos);/g,(_,e)=>ENT[e]);
const normTxt=s=>s.replace(/_x000D_/g,'').replace(/_x000A_/g,'\n').replace(/\r\n?/g,'\n');

function parseSS(x){const o=[];for(const m of x.matchAll(/<si(?:\s[^>]*)?>([\s\S]*?)<\/si>/g)){let t='';for(const q of m[1].matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g))t+=unesc(q[1]);o.push(normTxt(t));}return o;}

function parseSheet(x,ss,maxCols=60){
  const rows=[];
  const reRow=/<row\b([^>]*)>([\s\S]*?)<\/row>|<row\b([^>]*)\/>/g;
  const reCell=/<c\b([^>]*?)\/>|<c\b([^>]*)>([\s\S]*?)<\/c>/g;
  let r;
  while((r=reRow.exec(x))){
    const attrs=r[1]||r[3]||'';
    const rm=/\br="(\d+)"/.exec(attrs);
    const ri=rm?+rm[1]-1:rows.length, cells=[], body=r[2]||'';
    reCell.lastIndex=0; let c;
    while((c=reCell.exec(body))){
      const at=c[1]||c[2]||'', bd=c[3]||'';
      const cm=/\br="([A-Z]+)\d+"/.exec(at), tm=/\bt="([^"]+)"/.exec(at);
      const ix=cm?colIdx(cm[1]):cells.length;
      if(ix>=maxCols) continue;
      const ty=tm?tm[1]:'n';
      let v=null;
      if(ty==='inlineStr'){let t='';for(const q of bd.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g))t+=unesc(q[1]);v=normTxt(t);}
      else{const vm=/<v[^>]*>([\s\S]*?)<\/v>/.exec(bd);
        if(vm){const raw=unesc(vm[1]);
          v = ty==='s' ? (ss[+raw]??'') : (ty==='str'||ty==='e') ? normTxt(raw) : (raw===''?null:Number(raw));}}
      cells[ix]=(typeof v==='string'&&v.trim()==='')?null:v;
    }

}
const serialDate=n=>{ if(typeof n!=='number'||!isFinite(n))return null;
  const d=new Date(Math.round((n-25569)*864e5));
  return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); };

/** Onglet « Extract » (anciens fichiers, S01 à S19) : une ligne par agent et par jour. Pause de la journée = WorkDuration (T)
    − WorkDurationEffective (U), précisé par l'utilisateur. Clé : matricule|date → [T, U] en minutes. */
function readExtract(rows){
  const low=r=>(r||[]).map(c=>c==null?'':String(c).toLowerCase().replace(/\s+/g,''));
  let h=-1; for(let i=0;i<Math.min(rows.length,10);i++){ const r=low(rows[i]); if(r.includes('workduration')&&r.includes('workdurationeffective')){h=i;break;} }
  if(h<0) return null;
  const hd=low(rows[h]), cT=hd.indexOf('workduration'), cU=hd.indexOf('workdurationeffective'), cId=hd.indexOf('id'), cD=hd.indexOf('date');
  if(cId<0||cD<0) return null;
  const dur=v=>{ if(typeof v==='number'&&isFinite(v)) return Math.round(v*1440);
    const m=/^\s*(\d+):(\d{2})(?::\d{2})?\s*$/.exec(String(v??'')); return m?+m[1]*60+ +m[2]:null; };
  const out={};
  for(let i=h+1;i<rows.length;i++){ const r=rows[i]; if(!r||!r.length) continue;
    const id=String(r[cId]??'').trim(), d=typeof r[cD]==='number'?serialDate(r[cD]):(Date.parse(r[cD])?new Date(Date.parse(String(r[cD]).slice(0,10)+'T00:00:00Z')):null);
    const T=dur(r[cT]), U=dur(r[cU]);
    if(id&&d&&T!=null&&U!=null) out[id+'|'+isoD(d)]=[T,U]; }

async function readRecapSheet(ab){
  const zip=await readZip(ab);
  const wb=await zip.text('xl/workbook.xml');
  if(!wb) throw new Error("Classeur Excel (.xlsx) attendu — le fichier ne contient pas de feuille.");
  const rels=(await zip.text('xl/_rels/workbook.xml.rels'))||'', rm={};
  for(const m of rels.matchAll(/<Relationship\b([^>]*)\/?>/g)){
    const id=/\bId="([^"]+)"/.exec(m[1])?.[1], tg=/\bTarget="([^"]+)"/.exec(m[1])?.[1];
    if(id&&tg) rm[id]=tg.replace(/^\/?xl\//,'').replace(/^\//,'');
  }
  const sheets=[];
  for(const m of wb.matchAll(/<sheet\b([^>]*)\/?>/g))
    sheets.push({name:unesc(/\bname="([^"]*)"/.exec(m[1])?.[1]??''), path:rm[/\br:id="([^"]+)"/.exec(m[1])?.[1]]});
  if(!sheets.length) throw new Error("Aucune feuille trouvée dans le classeur.");
  /* Les feuilles « Récap… » puis « Corridor… » d'abord, puis les autres dans l'ordre :
     on retient la première dont l'en-tête (Matricule, Nom, jours de la semaine) est reconnu. */
  const nm=s=>deacc(s.name).toLowerCase().trim();
  const order=[...sheets.filter(s=>nm(s).startsWith('recap')),...sheets.filter(s=>!nm(s).startsWith('recap')&&nm(s).includes('corridor')),
    ...sheets.filter(s=>!nm(s).startsWith('recap')&&!nm(s).includes('corridor'))];
  const ss=zip.has('xl/sharedStrings.xml')?parseSS(await zip.text('xl/sharedStrings.xml')):[];
  let first=null;
  for(const tgt of order){
    const sx=(await zip.text('xl/'+tgt.path))||(await zip.text(tgt.path));
    if(!sx) continue;
    const rows=parseSheet(sx,ss);
    if(!first) first={sheetName:tgt.name,rows};
    if(findLayout(rows)){
      // anciens fichiers : l'onglet « Extract » donne WorkDuration (T) et WorkDurationEffective (U) de chaque journée
      const ex=sheets.find(x=>nm(x)==='extract'&&x!==tgt); let extract=null;
      if(ex){ const xx=(await zip.text('xl/'+ex.path))||(await zip.text(ex.path)); if(xx) extract=readExtract(parseSheet(xx,ss,40)); }
      return {sheetName:tgt.name,rows,extract};
    }
  }
  if(!first) throw new Error("Aucune feuille lisible dans le classeur.");
  return first;   // parseWeek expliquera ce qui manque
}

/* ==========================================================================

const JN=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const JS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const CODEF=[
  {k:'RP',t:c=>/^RP(-|\b)/i.test(c)}, {k:'CP',t:c=>/^CP$/i.test(c)}, {k:'CPAT',t:c=>/^CPAT/i.test(c)},
  {k:'RCL',t:c=>/^RCL/i.test(c)}, {k:'RCC',t:c=>/^RCC/i.test(c)}, {k:'MAL',t:c=>/^MAL/i.test(c)},
  {k:'JF',t:c=>/^JF$/i.test(c)}, {k:'RF',t:c=>/^RF$/i.test(c)}, {k:'AT',t:c=>/^AT$/i.test(c)},
  {k:'CSS',t:c=>/^(CSS|CPAR)$/i.test(c)}, {k:'CFAM',t:c=>/^CFAM$/i.test(c)}, {k:'CPRCL',t:c=>/^CPRCL$/i.test(c)},
];
const CODEL={RP:'Repos périodique',CP:'Congé payé',CPAT:'Congé CPAT',RCL:'Repos compensatoire légal',RCC:'Repos compensateur conventionnel',MAL:'Maladie',JF:'Jour férié',
  RF:'Repos férié',AT:'Accident du travail',CSS:'Congé sans solde',CFAM:'Congé familial',CPRCL:'CPRCL (non défini)',AUTRE:'Autre code',HORS:'Mission datée hors de sa colonne'};
/** Classement validé par l'utilisateur : repos, congés ; tout le reste (MAL, AT, CPRCL, autres) = absences */
const FAM_REPOS=['RP','RF','JF','RCL','RCC'], FAM_CONGES=['CP','CPAT','CFAM','CSS'];

const codeFam=c=>{const s=String(c).trim().split('/')[0].trim().replace(/[\s,.;:]+$/,'');for(const f of CODEF)if(f.t(s))return f.k;return 'AUTRE';};

const normLieu=s=>deacc(String(s??'')).toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();

function normMetier(m){
  const u=deacc(String(m??'')).toUpperCase().replace(/\s+/g,' ').trim();
  if(!u) return '';

const RE_PF=/^P\d?\s*:\s*(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*-\s*(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*$/i;

const rM=h=>Math.round(h*60)/60;

/** Une cellule jour -> {kind:'VIDE'|'CODE'|'SERVICE'}

function parseDayCell(raw,mon){

  for(const m of ok){
    if(m.end-m.start>=DAY) anom.push(`mission « ${m.label} » de 24 h ou plus : horaire à vérifier`);
    for(const [ps,pe] of m.pauses) if(pe<=m.start||ps>=m.end||ps<m.start||pe>m.end) anom.push(`pause ${hhmm(ps.toISOString())}–${hhmm(pe.toISOString())} en dehors de la mission « ${m.label} » : seule la partie comprise dans la mission est déduite`);

    const ps=m.pauses.map(([s,e])=>[new Date(Math.max(s,m.start)),new Date(Math.min(e,m.end))]).filter(([s,e])=>e>s);

function isoWeek(dt){

  ft.setUTCDate(ft.getUTCDate()-((ft.getUTCDay()+6)%7)+3);
  return {year:d.getUTCFullYear(), week:1+Math.round((d-ft)/(7*864e5))};

const MOIS=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
/** Une cellule date : nombre Excel, ou texte « 29.12.2025 », « 29/12/2025 », « 2025-12-29 », « 28 décembre 2025 » */
function cellDate(v){
  if(typeof v==='number') return v>20000&&v<80000?serialDate(v):null;
  if(v==null) return null;
  const t=deacc(String(v)).toLowerCase().trim();
  let m=/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/.exec(t);
  if(m){const y=+m[3]<100?2000+ +m[3]:+m[3]; return new Date(Date.UTC(y,+m[2]-1,+m[1]));}
  m=/^(\d{4})-(\d{2})-(\d{2})/.exec(t); if(m) return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  m=/(\d{1,2})(?:er)? (janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre) (\d{4})/.exec(t);
  if(m) return new Date(Date.UTC(+m[3],MOIS.indexOf(m[2]),+m[1]));

/** Repère la disposition de la feuille, quel que soit le format :
    - récent : ligne 1 = dates, ligne 2 = Matricule, Nom… Lundi…Dimanche ;
    - ancien : ligne 1 = Lundi…Dimanche, ligne 2 = Matricule, Prénom, Nom, Région, Résidence, Commentaires, dates.
    Renvoie null si aucun en-tête n'est reconnu. */
function findLayout(rows){
  const low=r=>(r||[]).map(c=>c==null?'':deacc(String(c)).toLowerCase().trim());
  let h=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){ const r=low(rows[i]);
    if(r.some(c=>c.startsWith('matric'))&&r.some(c=>c==='nom'||c.startsWith('nom '))){h=i;break;} }
  if(h<0) return null;
  const hd=low(rows[h]);
  const fc=(...t)=>{for(const x of t){const i=hd.findIndex(c=>typeof x==='string'?c===x:x.test(c));if(i>=0)return i;}return -1;};
  // colonne du lundi : intitulé « Lundi » sur la ligne d'en-tête ou juste autour, sinon 7 dates qui se suivent
  let cLun=-1, dayRow=-1;
  for(const i of [h,h-1,h+1,h-2]){ if(i<0||i>=rows.length) continue; const r=low(rows[i]);
    const j=r.findIndex(c=>c==='lundi'||c.startsWith('lundi '));
    if(j>=0&&(r[j+6]||'').startsWith('dimanche')||j>=0&&r[j+1]&&r[j+1].startsWith('mardi')){cLun=j;dayRow=i;break;} }
  let mon=null, dateRow=-1;
  const scan=(i,c0)=>{ const r=rows[i]||[]; for(let k=0;k<7;k++){const d=cellDate(r[c0+k]); if(d) return new Date(d.getTime()-k*DAY);} return null; };
  if(cLun>=0){ for(const i of [h-1,h,h+1,h-2,h+2]){ if(i<0||i>=rows.length) continue; const d=scan(i,cLun); if(d){mon=d;dateRow=i;break;} } }
  else for(const i of [h,h-1,h+1]){ if(i<0||i>=rows.length) continue; const r=rows[i]||[];
    for(let j=0;j<r.length-6&&cLun<0;j++){ const ds=[0,1,2,3,4,5,6].map(k=>cellDate(r[j+k]));
      if(ds.every(Boolean)&&ds.every((d,k)=>!k||d-ds[k-1]===DAY)){cLun=j;mon=new Date(ds[0].getTime());dateRow=i;} }
    if(cLun>=0) break; }

  if(!mon) return {h,cLun,err:'date'};

  const start=Math.max(h,dayRow,dateRow)+1;
  if(cMet<0){   // ancien format : le métier est dans « Commentaires » — on reconnaît la colonne à ses valeurs
    let best=-1,bn=0;
    for(let j=0;j<cLun;j++){ let n=0; for(let i=start;i<Math.min(rows.length,start+60);i++){const v=rows[i]?.[j]; if(v!=null&&/^(CDR|AFR|CONDUCTEUR|COORDO)/i.test(String(v).trim())) n++;}
      if(n>bn){bn=n;best=j;} }
    cMet=best;
  }
  const ex=cellDate((rows[0]||[]).find((c,j)=>j<cLun&&cellDate(c)))||null;
  return {h,start,cMat,cNom,cPre,cCor,cAge,cMet,cLun,mon,ex};
}
/** Feuille Récap -> structure de semaine brute (sans règles) */
/** Nettoyage à l'import (demandé par l'utilisateur) : retire les lignes ajoutées par erreur dans le fichier, avant lecture.
    1. Ligne d'une autre semaine : toutes ses cases datées portent un autre jour que celui de leur colonne (au moins deux
       cases, ou la personne a une autre ligne dans le fichier) — ligne d'une ancienne semaine recopiée.
    2. Ligne en double sans horaire : la personne a déjà une ligne plus haut, et celle-ci n'a que des codes ou des cases
       vides (la première ligne, plus haut dans le fichier, est gardée).
    Les autres lignes en double (deux lignes avec des services de la semaine) restent fusionnées jour par jour. */
function nettoyerFeuille(rows){
  const L=findLayout(rows);
  if(!L||L.err||L.cMat<0||L.cNom<0) return {rows,retraits:[]};
  const {cMat,cNom,cLun,mon}=L, cPre=L.cPre<0?cNom+1:L.cPre;
  const jourCol=d=>new Date(mon.getTime()+d*864e5).getUTCDate();
  const RE=/(?:^|\n)\s*(\d{1,2})\s*\/\s*\d{1,2}:\d{2}\s*-/;
  const lignes=[];
  for(let i=L.start;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.length) continue;
    const mat=r[cMat], nom=r[cNom]; if(mat==null&&nom==null) continue;
    const pk=personKey({matricule:mat==null?'':String(mat).trim(),nom:String(nom??'').trim(),prenom:String(r[cPre]??'').trim()});
    let datees=0, bonnes=0;
    for(let d=0;d<7;d++){ const t=normTxt(String(r[cLun+d]??'')); const m=RE.exec(t.split('\n').filter(x=>!/^P\d?\s*:/i.test(x.trim())).join('\n'));
      if(m){ datees++; if(+m[1]===jourCol(d)) bonnes++; } }
    lignes.push({i,pk,agent:`${nom??''} ${r[cPre]??''}`.trim(),datees,bonnes});
  }
  const parPk=groupBy(lignes,x=>x.pk), retirer=new Map();
  for(const [,l] of parPk) for(const x of l){
    if(x.datees&&!x.bonnes&&(x.datees>=2||l.length>1)) retirer.set(x.i,{ligne:x.i+1,agent:x.agent,raison:`ligne d’une autre semaine : ${x.datees} case${x.datees>1?'s':''} datée${x.datees>1?'s':''} d’autres jours que ceux de la semaine`});
  }
  for(const [,l] of parPk){ const gardees=l.filter(x=>!retirer.has(x.i)); if(gardees.length<2) continue;
    for(const x of gardees.slice(1)) if(!x.datees) retirer.set(x.i,{ligne:x.i+1,agent:x.agent,raison:`ligne en double sans horaire (ligne ${gardees[0].i+1} gardée)`}); }
  return {rows:rows.filter((_,i)=>!retirer.has(i)),retraits:[...retirer.values()].sort((a,b)=>a.ligne-b.ligne)};
}
function parseWeek(rows,extract){
  if(!rows.length) throw new Error('Feuille vide.');
  const L=findLayout(rows);
  if(!L) throw new Error("En-têtes introuvables : aucune ligne ne contient « Matricule » et « Nom » dans les 15 premières lignes de la feuille.");
  if(L.err==='jours') throw new Error(`Colonnes des jours introuvables : ni « Lundi »…« Dimanche », ni sept dates qui se suivent autour de la ligne ${L.h+1}.`);
  if(L.err==='date') throw new Error(`Date du lundi introuvable : aucune date au-dessus ou en dessous de « Lundi » (lignes ${L.h}–${L.h+2}).`);
  if(L.cMat<0||L.cNom<0) throw new Error("Colonnes Matricule ou Nom introuvables.");
  let {cMat,cNom,cPre,cCor,cAge,cMet,cLun,mon}=L;
  if(cPre<0)cPre=cNom+1;
  const ex=L.ex;
  const days=Array.from({length:7},(_,i)=>new Date(mon.getTime()+i*864e5));
  const {year,week}=isoWeek(mon);

  const anomalies=[], agents=[];
  for(let i=L.start;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.length) continue;
    const mat=r[cMat], nom=r[cNom];
    if((mat==null)&&(nom==null)) continue;
    if(!nom&&!mat) continue;
    if(mat==null&&!r.slice(cLun,cLun+7).some(v=>v!=null)) continue;   // lignes de légende ou de totaux en bas de feuille
    const jours=[];
    for(let d=0;d<7;d++){
      const c=parseDayCell(r[cLun+d],mon);
      const pkA=personKey({matricule:mat==null?'':String(mat).trim(),nom:String(nom??'').trim(),prenom:String(r[cPre]??'').trim()});
      (c.anom||[]).forEach(a=>anomalies.push({agent:`${nom??''} ${r[cPre]??''}`.trim(),jour:JN[d],message:a,pk:pkA,date:isoD(days[d]),brut:normTxt(String(r[cLun+d]??'')).slice(0,600)}));
      delete c.anom;
      if(extract&&c.kind==='SERVICE'){ const e=extract[String(mat??'').trim()+'|'+isoD(days[d])]; if(e) c.tu=e; }   // Extract : [T, U] du jour
      jours.push(c);
    }
    agents.push({
      matricule: mat==null?'':String(mat).trim(),
      nom:String(nom??'').trim(), prenom:String(r[cPre]??'').trim(),
      corridor:cCor>=0?String(r[cCor]??'').trim():'',
      agence:(cAge>=0?String(r[cAge]??'').trim():'')||'(sans agence)',
      metier:(cMet>=0?normMetier(r[cMet]):'')||'(SANS MÉTIER)',
      jours
    });
  }
  if(!agents.length) throw new Error("Aucune ligne d'agent trouvée sous les en-têtes.");
  return {
    meta:{format:2, weekId:`${year}-S${String(week).padStart(2,'0')}`, year, week,
      monday:isoD(mon), sunday:isoD(days[6]), days:days.map(isoD),
      extractDate:ex?isoD(ex):null, nbAgents:agents.length,
      corridors:[...new Set(agents.map(a=>a.corridor).filter(Boolean))]},
    agents, anomalies};
}

/** Missions dont la date écrite dans la case ne correspond pas à la colonne

function splitHorsColonne(agents,days,rules){
  const tol=(Number(rules.horsColonneTolerance)||0)*H, liste=[];

function withHC(cell,cells){
  const seen=new Set(), hc=[];

      for(const l of [m.from,m.to]) if(l){ const k=normLieu(l); cnt[a.agence][k]=(cnt[a.agence][k]||0)+1; }

    seul (isTrajetSeul : l'écart T − U y est souvent un coefficient, pas une pause → horaire complet) ; une mission mixte

function applyRules(parsed, rulesIn){

/** Parties d'une ligne agent-semaine par mois civil (une semaine touche au plus deux mois) */

/** Paniers : 1 h en service (horaire de la mission, pauses comprises) entre 11h30 et 13h30, 1 h entre 18h30 et 20h30, 3 h entre 22h et 5h,

function computePaniers(all,rhr,days,rules){
  const got=new Map();

  const segs=all.map(m=>[m.S.getTime(),m.E.getTime()]);
  const t0=all.length?Math.floor(all[0].S.getTime()/DAY)*DAY-DAY:days[0].getTime();
  const t1=all.length?Math.floor(Math.max(...all.map(m=>m.E.getTime()))/DAY)*DAY:days[6].getTime();
  const plages=[['midi',rules.panierMidi],['soir',rules.panierSoir],['nuit',rules.panierNuit]];
  for(let d=t0;d<=t1;d+=DAY) for(const [nom,[de,a,min]] of plages){
    const [w0,w1]=windowOf(d,de,a); if(segOvl(segs,w0,w1)/H>=min-1e-9) add(d,nom,'travail');
  }

/** Clôture les RHR ouverts grâce à la première mission de la semaine suivante */
function reconcile(weeks,rulesIn){

    const c=weeks.get(ids[i]), n=weeks.get(ids[i+1]);

    if(new Date(n.meta.monday+'T00:00:00Z')-new Date(c.meta.sunday+'T00:00:00Z')!==864e5) continue;
    const idx=new Map(n.agents.map(a=>[personKey(a),a]));
    for(const a of c.agents){
      const p=a.rhr.find(x=>x.enCours&&!x.fin);
      if(!p) continue;
      const na0=idx.get(personKey(a)), pm=(na0||{}).premiereMission;
      if(!pm){

        if(na0&&rules.rhrCoupeParRepos&&p.manuel!=='oui'&&(na0.jours||[]).some(j=>j.kind==='CODE'&&j.family!=='HORS')){
          a.rhr.splice(a.rhr.indexOf(p),1); a.nbRHR=a.rhr.length; a.rhrEnCours=0; a.rhrLieux=[...new Set(a.rhr.map(x=>x.lieu))];
          const cp0=(a.coupures||[]).find(x=>x.fin==null&&x.debut===p.debut); if(cp0){cp0.statut='repos';cp0.compte=false;}
          setBands(a); a.rhrHeures=rM(a.rhr.reduce((s2,x)=>s2+(x.dureeH||0),0)); a.rhrNuits=a.rhr.reduce((s2,x)=>s2+(x.nuits||0),0);
        }

      a.rhrEnCours=0;
      const cp=(a.coupures||[]).find(x=>x.fin==null&&x.debut===p.debut);
      if(cp){ cp.fin=pm.start; cp.dureeH=p.dureeH; cp.retour=pm.label; if(cp.statut==='ouvert') cp.statut='rhr'; }
      // la durée n'est connue qu'ici : un arrêt plus court que le minimum n'est pas un RHR
      const na=idx.get(personKey(a));
      const reposApres=rules.rhrCoupeParRepos&&(na.jours||[]).some((j,d)=>j.kind==='CODE'&&j.family!=='HORS'&&new Date(n.meta.monday+'T00:00:00Z').getTime()+d*DAY<fin.getTime());
      const court=p.dureeH<rules.rhrMinHours&&p.manuel!=='oui';
      const repos=!court&&reposApres&&p.manuel!=='oui';
      if(court||repos){ a.rhr.splice(a.rhr.indexOf(p),1); a.nbRHR=a.rhr.length; a.rhrLieux=[...new Set(a.rhr.map(x=>x.lieu))]; if(cp){cp.statut=court?'court':'repos';cp.compte=false;} }
      else if(cp) cp.long=p.dureeH>(rules.rhrMaxAbsence||44);

      a.rhrHeures=rM(a.rhr.reduce((s,x)=>s+(x.dureeH||0),0));
      a.rhrNuits=a.rhr.reduce((s,x)=>s+(x.nuits||0),0);
      if(court||repos) continue;
      if(rules.panierRHR){   // paniers pris pendant la partie du RHR qui déborde sur la semaine suivante
        const seen=new Set(a.paniers.map(q=>q.date+'|'+q.plage));
        const sun1=new Date(c.meta.sunday+'T00:00:00Z').getTime()+DAY, e=fin.getTime(), s=deb.getTime();
        for(let d=sun1;d<=e;d+=DAY) for(const [nom,[de,aa]] of [['midi',rules.panierMidi],['soir',rules.panierSoir]]){

        }

/** Numéro de RP du fichier (« RP-24 ») : lu une seule fois par agent et par année civile (le compteur ARP repart en janvier).
    Le même numéro inscrit une seconde fois (même semaine ou autre semaine) n'est pas recompté : le jour est marqué

    let n=0; const pk=personKey(a);

      const num=j.family==='RP'?rpNum(j.code):null; if(num==null) continue;

function reconcileJB(weeks,rules){
  if(!rules.jbRequireFramed) return;
  const ids=[...weeks.keys()].sort(), mon=w=>Date.parse(w.meta.monday+'T00:00:00Z');
  for(let i=0;i<ids.length;i++){
    const c=weeks.get(ids[i]), p=i>0?weeks.get(ids[i-1]):null, n=i<ids.length-1?weeks.get(ids[i+1]):null;
    const P=p&&mon(c)-mon(p)===7*DAY?new Map(p.agents.map(a=>[personKey(a),a])):null;
    const N=n&&mon(n)-mon(c)===7*DAY?new Map(n.agents.map(a=>[personKey(a),a])):null;
    for(const a of c.agents){
      const cvs=(a.casesVides||[]).filter(cv=>cv.horsCadre&&!cv.compte);
      if(!cvs.length) continue;
      const pa=P&&P.get(personKey(a)), na=N&&N.get(personKey(a));
      const lastP=pa&&pa.missions&&pa.missions.length?pa.missions[pa.missions.length-1]:null, firstN=na&&na.missions&&na.missions.length?na.missions[0]:null;
      for(const cv of cvs){
        const ds=Date.parse(cv.date+'T00:00:00Z'), de=ds+DAY;
        const avant=cv.horsCadre==='apres'?true:!!lastP, apres=cv.horsCadre==='avant'?true:!!firstN;
        if(!avant||!apres){
          const manque=[!avant&&(P?'aucun service la semaine précédente':'semaine précédente non importée'),!apres&&(N?'aucun service la semaine suivante':'semaine suivante non importée')].filter(Boolean).join(', ');
          cv.raison=`${cv.raisonBase} — ${manque}`; a.jours[cv.d].jbRaison=cv.raison; continue;
        }
        if(cv.horsCadre!=='apres'&&lastP) cv.avant={label:lastP.label,from:lastP.from,to:lastP.to,start:lastP.start,end:lastP.end};
        if(cv.horsCadre!=='avant'&&firstN) cv.apres={label:firstN.label,from:firstN.from,to:firstN.to,start:firstN.start,end:firstN.end};
        let raison='';
        if(rules.jbExcludeNightOverlap&&lastP&&Date.parse(lastP.end)>ds) raison=`fin du service de nuit à ${hm(lastP.end)}`;
        const span=x=>{const s0=Date.parse(x.debut), e0=x.fin?Date.parse(x.fin):Infinity; return s0<de&&e0>ds;};
        const hors=a.rhr.some(span)||(pa?pa.rhr.some(span):false);
        cv.horsResidence=hors;
        if(!raison&&hors&&rules.jbExcludeHorsResidence) raison='agent hors résidence ce jour-là (RHR)';
        cv.raison=raison||'encadrée par la semaine voisine'; a.jours[cv.d].jbRaison=cv.raison;

      }
    }

}

/** Noms d'agence des anciens fichiers (« Agence Bordeaux ») rattachés au nom récent qui commence pareil

const RHR_KEYS=new Set(['nbRHR','rhrNuits','rhrHeures']);
function agg(list){
  const persons=new Set(list.map(personKey)), withRHR=list.filter(a=>a.nbRHR>0);
  const o={nbLignes:list.length, nbAgents:persons.size,
    nbSemaines:new Set(list.map(a=>a.weekId)).size||1,
    agentsAvecRHR:new Set(withRHR.map(personKey)).size, lignesAvecRHR:withRHR.length,
    agentsAvecBlanche:new Set(list.filter(a=>a.journeesBlanches>0).map(personKey)).size,
    agentsHeuresSup:new Set(list.filter(a=>a.heuresSup>0).map(personKey)).size,
    rhrEnCours:list.reduce((s,a)=>s+a.rhr.filter(x=>x.enCours&&!x.fin).length,0)};
  for(const f of FIELDS){
    const v=list.map(a=>a[f.k]||0), t=v.reduce((s,x)=>s+x,0);
    const den=RHR_KEYS.has(f.k)?withRHR.length:list.length;
    const R=f.u==='h'?rM:r2;   // heures : totaux gardés en minutes exactes
    o[f.k]=R(t); o[f.k+'_moy']=den?r2(t/den):0; o[f.k+'_max']=v.length?R(Math.max(...v)):0;
    o[f.k+'_sem']=r2(t/o.nbSemaines);
  }
  const svc=list.filter(a=>a.joursService>0);
  o.amplitudeParJour=svc.length?r2(svc.reduce((s,a)=>s+a.amplitudeTotale,0)/svc.reduce((s,a)=>s+a.joursService,0)):0;
  o.ratioPanierJS=o.joursService?r2(o.nbPaniers/o.joursService):0;
  return o;
}
/** Valeur d'une mesure selon le mode choisi : total, moyenne par agent (par ligne agent-semaine), moyenne par semaine */
const modeVal=(g,k,mode)=>mode==='agent'?g[k+'_moy']:mode==='semaine'?g[k+'_sem']:g[k];
const groupBy=(l,f)=>{const m=new Map();for(const x of l){const k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x);}return m;};
/** Une ligne par personne sur toutes les semaines sélectionnées : un nom n'apparaît jamais deux fois */
function mergeAcrossWeeks(rows){
  const out=[];
  for(const [,list] of groupBy(rows,personKey)){
    list.sort((a,b)=>String(a.weekId).localeCompare(String(b.weekId)));
    const last=list[list.length-1];
    const p={...last, parSemaine:list, nbSemaines:list.length, semaines:list.map(a=>a.weekId),
      agences:[...new Set(list.map(a=>a.agence))],
      rhr:list.flatMap(a=>a.rhr.map(r=>({...r,weekId:a.weekId}))),
      blanches:list.flatMap(a=>a.blanches.map(b=>({...b,weekId:a.weekId}))),
      rhrLieux:[...new Set(list.flatMap(a=>a.rhrLieux))],
      rhrApplicable:list.some(a=>a.rhrApplicable), fusion:list.some(a=>a.fusion)?list.find(a=>a.fusion).fusion:null,
      jamaisEnResidence:list.every(a=>a.jamaisEnResidence), warnings:list.flatMap(a=>a.warnings)};
    for(const f of FIELDS) p[f.k]=(f.u==='h'?rM:r2)(list.reduce((s,a)=>s+(a[f.k]||0),0));
    for(const k of ['pauseTotaleMin','joursVides','nbHorsColonne','pausesInconnues']) p[k]=list.reduce((s,a)=>s+(a[k]||0),0);
    p.rhrEnCours=p.rhr.filter(x=>x.enCours&&!x.fin).length;
    p.amplitudeMoyenne=p.joursService?r2(p.amplitudeTotale/p.joursService):0;
    p.amplitudeMax=rM(Math.max(0,...list.map(a=>a.amplitudeMax||0)));
    const pr=list.map(a=>a.priseServicePlusTot).filter(x=>x!=null), fi=list.map(a=>a.finServicePlusTard).filter(x=>x!=null);
    p.priseServicePlusTot=pr.length?Math.min(...pr):null; p.finServicePlusTard=fi.length?Math.max(...fi):null;
    const sumObj=k=>list.reduce((o,a)=>{for(const [x,v] of Object.entries(a[k]||{})) o[x]=(o[x]||0)+v; return o;},{});
    p.codeCounts=sumObj('codeCounts'); p.typesMission=sumObj('typesMission'); p.destinations=sumObj('destinations');
    p.ratioPanierJS=p.joursService?r2(p.nbPaniers/p.joursService):0;
    out.push(p);
  }
  return out;
}

/** Règles de l'accord d'entreprise ECR 2018 (PDF fourni par l'utilisateur), pré-remplies et réglables.
    roulant = conducteurs (chapitre 3) ; continuite = AFR et COORDO AFR (chapitre 4, titre 2) — correspondance validée. */
const ACCORD_DEF={
  roulant:{tteMax:10,tteMaxNuit:9,nuit:[22,5],nuitSeuil:2.5,ampMax:11,ampMaxNuit:9.5,rj:13,rjReduit:11,rjApresNuit:12,rpAn:117},      // art. 12, 17, 19
  continuite:{tteMax:10,tteMaxNuit:8.5,nuit:[22,7],nuitSeuil:2.5,ampMax:12,ampMaxNuit:12,rj:12,rjReduit:10,rjApresNuit:10,rpAn:113}, // art. 28, 29, 30
  rdAn:39,rdWeAn:12,rpMois:8,rpConsecMax:3,simplesSuccMax:2,veilleSimple:22,lendemainSimple:5,veilleDouble:23,lendemainDouble:3,    // art. 19–20, 30–31
  gptMax:6,gpt6Par4sem:2,hebdoMax:48,moy4sem:44,                                                                                  // art. 3, 19
  rhrMin:9,rhrComp:11,rhrLongRj:15,rhrSuccParGpt:1,                                                                               // art. 18
  pauseSeuil:6,pauseMin:20,                                                                                                       // art. 22, 32
  commandes:true,atcmdSem:2,dispoSem:2,cmdTotalSem:3    // art. 15–16, 36–37 : ATCMD = attente de la commande, DISPO = disponible à l'agence (confirmé par l'utilisateur)
};
const accordOf=rules=>{ const A=(rules&&rules.accord)||{}; return {...ACCORD_DEF,...A,roulant:{...ACCORD_DEF.roulant,...(A.roulant||{})},continuite:{...ACCORD_DEF.continuite,...(A.continuite||{})}}; };
const CONF_TYPES={
  tte:['TTE de la journée au-delà du maximum','art. 12 / 28'],amp:['Amplitude au-delà du maximum','art. 12 / 28'],
  pause:['Pas de pause de 20 min pour plus de 6 h de travail','art. 22 / 32'],
  rj:['Repos journalier à résidence trop court','art. 17 / 29'],rjRed:['Repos journalier réduit plus d’une fois dans la GPT','art. 17 / 29'],
  rhr:['RHR de moins de 9 h','art. 18'],rhrComp:['RHR de moins de 11 h : repos compensateur dû','art. 18'],
  rhrSucc:['Deux RHR successifs plus d’une fois dans la GPT','art. 18'],rhrLong:['Après un RHR de plus de 24 h, pas de repos à résidence de 15 h dans la GPT suivante','art. 18'],
  rp:['Repos périodique trop court (24 h × jours + repos journalier)','art. 19 / 30'],rpVeille:['Fin de service trop tardive la veille d’un repos périodique','art. 19 / 30'],
  rpLendemain:['Reprise trop tôt le lendemain d’un repos périodique','art. 19 / 30'],rpConsec:['Plus de 3 repos périodiques consécutifs','art. 19 / 30'],
  simples:['Plus de 2 repos simples successifs','art. 19 / 30'],rpMois:['Moins de 8 repos périodiques dans le mois','art. 19 / 30'],
  weMois:['Aucun repos double samedi-dimanche dans le mois','art. 20 / 31'],
  gpt:['Grande période de travail de plus de 6 jours','art. 3'],gptDouble:['GPT de 6 jours non suivie d’un repos double','art. 19 / 30'],
  gpt6:['Plus de 2 GPT de 6 jours sur 4 semaines glissantes','art. 19 / 30'],
  hebdo:['Plus de 48 h dans la semaine','art. 3'],moy4:['Plus de 44 h en moyenne sur 4 semaines','art. 3'],
  cmd:['Attente de la commande / disposition à l’agence au-delà du maximum hebdomadaire','art. 15–16 / 36–37'],
};
/** Contrôle de conformité à l'accord, agent par agent, sur les lignes agent-semaine du périmètre (planning seulement).
    GPT = jours consécutifs sans repos (RP, RF, JF, RCL, RCC) ; repos périodique = RP seulement (choix de l'utilisateur). */
function conformiteData(rows,rulesIn){
  const R={...DEFAULT_RULES,...(rulesIn||{})}, A=accordOf(R), out=[], tts=m=>isTrajetSeul(m.label,R.trajetTypes||[]);
  const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const jDiff=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/DAY), D0=d=>Date.parse(d+'T00:00:00Z');
  const isRP=j=>j.kind==='CODE'&&j.family==='RP', isRepos=j=>j.kind==='CODE'&&FAM_REPOS.includes(j.family);
  for(const [pk,list] of groupBy(rows,personKey)){
    list.sort((x,y)=>String(x.weekId).localeCompare(String(y.weekId)));
    const last=list[list.length-1], afr=isAFR(last.metier), C=afr?A.continuite:A.roulant;
    const who={pk,nom:`${last.nom} ${last.prenom}`.trim(),agence:last.agence,metier:last.metier};
    const add=(type,date,detail,niveau='nc')=>out.push({...who,type,date,detail,niveau});
    const resSet=a=>new Set([a.residence,...(a.rattachement||a.residencePerso?[]:((R.lieuxResidence||{})[a.agence]||[]))].filter(Boolean).map(normLieu));
    const J=list.flatMap(a=>a.jours.filter(j=>!j.horsPeriode).map(j=>({j,a}))).sort((x,y)=>x.j.date.localeCompare(y.j.date));
    // journées de service : prise, fin, TTE réel, heures de nuit (plage de l'accord), dernier lieu
    const svc=[];
    for(const {j,a} of J){
      if(j.kind!=='SERVICE'||!j.missions||!j.missions.length) continue;
      const ms=[...j.missions].sort((x,y)=>Date.parse(x.start)-Date.parse(y.start));
      let tte=0,nuit=0,pauseOk=false;
      for(const m of ms){ const x=missionMinutes(m); tte+=isATCMD(m)?R.heuresATCMD*60:x.amp-x.pause;
        const S=Date.parse(m.start),E=Date.parse(m.end); nuit+=hoursInDailyWindow(workSegments(m),C.nuit[0],C.nuit[1],Math.floor(S/DAY)*DAY-DAY,Math.floor(E/DAY)*DAY);
        if((m.pauses||[]).some(p=>Array.isArray(p)&&(Date.parse(p[1])-Date.parse(p[0]))/6e4>=A.pauseMin)) pauseOk=true; }
      const s=Date.parse(ms[0].start), e=Math.max(...ms.map(m=>Date.parse(m.end))), o={date:j.date,s,e,tte:tte/60,amp:(e-s)/H,nuit,to:ms[ms.length-1].to,a,ms,
        atcmd:ms.some(isATCMD),dispo:ms.some(m=>/DISPO/i.test(m.label||'')),res:resSet(a).has(normLieu(ms[ms.length-1].to))};
      const nuitJ=nuit>C.nuitSeuil;
      if(o.tte>(nuitJ?C.tteMaxNuit:C.tteMax)+1e-9) add('tte',j.date,`${fmtH(o.tte)} de TTE (max ${fmtH(nuitJ?C.tteMaxNuit:C.tteMax)}${nuitJ?', journée de nuit':''})`);
      if(o.amp>(nuitJ?C.ampMaxNuit:C.ampMax)+1e-9) add('amp',j.date,`${fmtH(o.amp)} d’amplitude (max ${fmtH(nuitJ?C.ampMaxNuit:C.ampMax)}${nuitJ?', journée de nuit':''})`);
      if(o.tte>A.pauseSeuil&&!pauseOk&&!ms.every(m=>isATCMD(m)||tts(m))) add('pause',j.date,`${fmtH(o.tte)} de travail sans pause d’au moins ${A.pauseMin} min dans le planning`);
      o.nuitJ=nuitJ; svc.push(o);
    }
    // GPT : jours consécutifs connus sans repos ; un jour hors fichier coupe la suite
    const gpts=[]; let g=null, prev=null;
    for(const {j} of J){ const suite=prev&&jDiff(prev,j.date)===1; prev=j.date;
      if(isRepos(j)){ if(g) gpts.push(g); g=null; continue; }
      if(g&&suite) g.fin=j.date,g.n++; else { if(g) gpts.push(g); g={debut:j.date,fin:j.date,n:1}; } }
    if(g) gpts.push(g);
    const gptDe=date=>gpts.find(x=>x.debut<=date&&date<=x.fin);
    // périodes de repos RP (RP seulement) : longueur, jours
    const runs=[]; let r=null; prev=null;
    for(const {j} of J){ const suite=prev&&jDiff(prev,j.date)===1; prev=j.date;
      if(isRP(j)){ if(r&&suite) r.fin=j.date,r.n++; else { if(r) runs.push(r); r={debut:j.date,fin:j.date,n:1}; } } else { if(r) runs.push(r); r=null; } }
    if(r) runs.push(r);
    for(const x of gpts){
      if(x.n>A.gptMax) add('gpt',x.debut,`${x.n} jours de suite sans repos, du ${dFull(x.debut)} au ${dFull(x.fin)}`);
      if(x.n===A.gptMax){ const nx=J.find(({j})=>j.date>x.fin); if(nx&&jDiff(x.fin,nx.j.date)===1){ const rr=runs.find(y=>y.debut===nx.j.date);
        if(!rr||rr.n<2) add('gptDouble',x.fin,`GPT du ${dFull(x.debut)} au ${dFull(x.fin)}, suivie d’un repos ${rr?'simple':'autre qu’un RP'}`); } }
    }
    const g6=gpts.filter(x=>x.n>=A.gptMax); let g6fait=false;
    for(const x of g6){ const n=g6.filter(y=>y.debut>=x.debut&&jDiff(x.debut,y.debut)<28).length; if(n>A.gpt6Par4sem&&!g6fait){ g6fait=true; add('gpt6',x.debut,`${n} GPT de ${A.gptMax} jours en 4 semaines à partir du ${dFull(x.debut)}`); } }
    for(const x of runs) if(x.n>A.rpConsecMax) add('rpConsec',x.debut,`${x.n} RP de suite`);
    let simples=0; for(const x of runs){ simples=x.n===1?simples+1:0; if(simples===A.simplesSuccMax+1) add('simples',x.debut,`${simples} repos simples de suite`); }
    // repos entre deux journées de service
    const redParGpt={}, succParGpt={}, rjParGpt={}, longs=[];
    for(let i=1;i<svc.length;i++){
      const a=svc[i-1], b=svc[i], gap=(b.s-a.e)/H; if(gap<0) continue;
      const entre=J.filter(({j})=>j.date>a.date&&j.date<b.date).map(({j})=>j), rp=entre.filter(isRP).length;
      const gp=gptDe(b.date), kg=gp?gp.debut:b.date;
      if(!entre.length&&jDiff(a.date,b.date)===1){
        if(!afr&&!a.res){   // repos journalier hors résidence (conducteurs)
          if(gap<A.rhrMin) add('rhr',a.date,`${fmtH(gap)} à ${a.to||'?'} entre ${dtISO(new Date(a.e).toISOString())} et ${dtISO(new Date(b.s).toISOString())}`);
          else if(gap<A.rhrComp) add('rhrComp',a.date,`${fmtH(gap)} à ${a.to||'?'}`,'info');
          const p2=svc[i-2]; if(p2&&!p2.res&&jDiff(p2.date,a.date)===1){ succParGpt[kg]=(succParGpt[kg]||0)+1; if(succParGpt[kg]===A.rhrSuccParGpt+1) add('rhrSucc',a.date,`RHR successifs à ${p2.to||'?'} puis ${a.to||'?'}`); }
        }else{
          const plancher=a.nuitJ&&!afr?C.rjApresNuit:C.rjReduit;
          if(gap<plancher) add('rj',a.date,`${fmtH(gap)} de repos (minimum ${fmtH(plancher)}${a.nuitJ&&!afr?' après une journée de nuit':''})`);
          else if(gap<C.rj){ redParGpt[kg]=(redParGpt[kg]||0)+1; if(redParGpt[kg]===2) add('rjRed',a.date,`repos réduit à ${fmtH(gap)}, deuxième réduction dans la GPT du ${dFull(kg)}`); }
          (rjParGpt[kg]=rjParGpt[kg]||[]).push(gap);
        }
      }else if(rp&&a.res&&entre.every(j=>isRP(j))){
        const need=24*rp+C.rj; if(gap<need-1e-9) add('rp',a.date,`${fmtH(gap)} pour ${rp} RP (minimum ${fmtH(need)})`);
        const r0=D0(entre[0].date), r1=D0(entre[entre.length-1].date)+DAY, dbl=rp>=2;
        if(a.e>r0-(24-(dbl?A.veilleDouble:A.veilleSimple))*H) add('rpVeille',a.date,`fin à ${hm(new Date(a.e).toISOString())} avant un repos ${dbl?'double':'simple'} (au plus tard ${dbl?A.veilleDouble:A.veilleSimple} h)`);
        if(b.s<r1+(dbl?A.lendemainDouble:A.lendemainSimple)*H) add('rpLendemain',b.date,`reprise à ${hm(new Date(b.s).toISOString())} après un repos ${dbl?'double':'simple'} (au plus tôt ${dbl?A.lendemainDouble:A.lendemainSimple} h)`);
      }
    }
    // RHR de plus de 24 h : un repos journalier à résidence d'au moins 15 h dans la GPT suivante (art. 18)
    for(const a of list) for(const r of a.rhr||[]) if(!afr&&r.fin&&r.dureeH>24){ const g=gptDe(r.fin.slice(0,10)); if(g) longs.push({date:r.debut.slice(0,10),gap:r.dureeH,kg:g.debut}); }
    for(const x of longs){ const gi=gpts.findIndex(y=>y.debut===x.kg), nx=gi>=0?gpts[gi+1]:null, l=nx?rjParGpt[nx.debut]:null;
      if(l&&l.length&&Math.max(...l)<A.rhrLongRj) add('rhrLong',x.date,`RHR de ${fmtH(x.gap)} ; dans la GPT suivante (du ${dFull(nx.debut)}), repos à résidence de ${fmtH(Math.max(...l))} au plus`); }
    // mois entiers présents : 8 RP et un repos double samedi-dimanche
    const parMois=groupBy(J,({j})=>j.date.slice(0,7));
    for(const [m,l] of parMois){ const nj=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)).getUTCDate(); if(l.length<nj) continue;
      const nrp=l.filter(({j})=>isRP(j)).length; if(nrp<A.rpMois) add('rpMois',m+'-01',`${nrp} RP en ${MOIS[+m.slice(5)-1]} ${m.slice(0,4)}`);
      const we=l.some(({j})=>isRP(j)&&new Date(D0(j.date)).getUTCDay()===6&&runs.some(x=>x.debut<=j.date&&jDiff(j.date,x.fin)>=1));
      if(!we) add('weMois',m+'-01',`${MOIS[+m.slice(5)-1]} ${m.slice(0,4)}`); }
    // semaines : 48 h, moyenne de 44 h sur 4 semaines consécutives, attente de la commande / disposition
    const sem=list.filter(a=>!a.partiel).map(a=>({w:a.weekId,lundi:a.jours[0].date,h:a.heuresPlanifiees||0,a}));
    for(const s of sem){ if(s.h>A.hebdoMax) add('hebdo',s.lundi,`${fmtH(s.h)} en ${s.w}`);
      if(A.commandes){ const d=s.a.jours.filter(j=>j.kind==='SERVICE'), at=d.filter(j=>(j.missions||[]).some(isATCMD)).length, di=d.filter(j=>(j.missions||[]).some(m=>/DISPO/i.test(m.label||''))).length;
        if(at>A.atcmdSem||di>A.dispoSem||at+di>A.cmdTotalSem) add('cmd',s.lundi,`${at} ATCMD et ${di} DISPO en ${s.w}`); } }
    for(let i=3;i<sem.length;i++){ const q=sem.slice(i-3,i+1); if(jDiff(q[0].lundi,q[3].lundi)!==21) continue; const moy=q.reduce((t,x)=>t+x.h,0)/4;
      if(moy>A.moy4sem) add('moy4',q[0].lundi,`${fmtH(moy)} en moyenne de ${q[0].w} à ${q[3].w}`); }
  }
  out.sort((x,y)=>x.date.localeCompare(y.date)||x.nom.localeCompare(y.nom));

}
/** Repos journaliers à résidence courts (demandé par l'utilisateur, tableau des agents) : entre deux jours de service qui se
    suivent (aucun jour entre les deux), quand la journée précédente finit à la résidence (conducteurs ; AFR / coordo : toujours).
    Minimum = 13 h conducteurs, 12 h AFR / coordo (précisé par l'utilisateur) : « au minimum » = égal à la minute près,
    « sous le minimum » = plus court ; `sousPlancher` si en plus sous la réduction exceptionnelle de l'accord (11 h conducteurs,
    12 h après une journée de nuit ; 10 h AFR). Les RHR ne sont pas comptés (choix de l'utilisateur). */
function reposJournaliersCourts(rows,rulesIn){
  const R={...DEFAULT_RULES,...(rulesIn||{})}, A=accordOf(R), out={reduits:[],minimum:[],sous:[]};
  if(!rows.length) return out;
  const afr=isAFR(rows[rows.length-1].metier), C=afr?A.continuite:A.roulant;
  const svc=[];
  for(const a of [...rows].sort((x,y)=>String(x.weekId).localeCompare(String(y.weekId)))){
    const rs=new Set([a.residence,...(a.rattachement||a.residencePerso?[]:((R.lieuxResidence||{})[a.agence]||[]))].filter(Boolean).map(normLieu));
    for(const j of a.jours){ if(j.horsPeriode||j.kind!=='SERVICE'||!(j.missions||[]).length) continue;
      const ms=[...j.missions].sort((x,y)=>Date.parse(x.start)-Date.parse(y.start)); let nuit=0;
      for(const m of ms){ const S=Date.parse(m.start),E=Date.parse(m.end); nuit+=hoursInDailyWindow(workSegments(m),C.nuit[0],C.nuit[1],Math.floor(S/DAY)*DAY-DAY,Math.floor(E/DAY)*DAY); }
      const last=ms.reduce((b,m)=>Date.parse(m.end)>Date.parse(b.end)?m:b,ms[0]);
      svc.push({date:j.date,s:Date.parse(ms[0].start),e:Date.parse(last.end),to:last.to,res:afr||rs.has(normLieu(last.to)),nuit:nuit>C.nuitSeuil}); } }
  svc.sort((x,y)=>x.date.localeCompare(y.date));
  for(let i=1;i<svc.length;i++){ const a=svc[i-1], b=svc[i];
    if(Math.round((Date.parse(b.date)-Date.parse(a.date))/DAY)!==1||!a.res) continue;
    const g=(b.s-a.e)/H; if(g<0) continue;
    const plancher=a.nuit&&!afr?C.rjApresNuit:C.rjReduit, x={date:a.date,fin:new Date(a.e).toISOString(),reprise:new Date(b.s).toISOString(),h:rM(g),plancher,normal:C.rj,nuit:a.nuit};
    // minimum = durée du repos journalier de l'accord (13 h conducteurs, 12 h AFR / coordo — précisé par l'utilisateur), à la minute près
    const gm=Math.round(g*60), nm=Math.round(C.rj*60); x.sousPlancher=gm<Math.round(plancher*60);
    if(gm<nm) out.sous.push(x); else if(gm===nm) out.minimum.push(x); }
  return out;
}
/** Équité (demandé par l'utilisateur) : répartition, par semaine de présence, des jours de service, nuit, RHR, DISPO, journées
    blanches, ATCMD, heures sup et week-ends travaillés, comparée à la moyenne de l'agence et du métier de l'agent. */
const EQUITE=[['joursService','Jours de service'],['heuresNuit','Heures de nuit','h'],['nbRHR','RHR'],['nbDISPO','DISPO'],
  ['journeesBlanches','Journées blanches'],['nbATCMD','ATCMD'],['heuresSup','Heures sup','h'],['weekendTravaille','Jours de week-end travaillés']];
function equiteData(rows){
  const pers=[];
  for(const [pk,l] of groupBy(rows,personKey)){ const last=l[l.length-1], jours=l.reduce((s,a)=>s+a.jours.filter(j=>!j.horsPeriode).length,0), sem=jours/7||1;
    const p={pk,nom:last.nom,prenom:last.prenom,agence:last.agence,metier:last.metier,semaines:sem,v:{}};
    for(const [k] of EQUITE) p.v[k]=l.reduce((s,a)=>s+(a[k]||0),0)/sem; pers.push(p); }
  const groupes=[];
  for(const [k,l] of groupBy(pers,p=>p.agence+'|'+p.metier)){
    const st={}; for(const [m] of EQUITE){ const v=l.map(p=>p.v[m]), moy=v.reduce((s,x)=>s+x,0)/v.length, et=Math.sqrt(v.reduce((s,x)=>s+(x-moy)**2,0)/v.length);
      st[m]={moy,et,min:Math.min(...v),max:Math.max(...v),cv:moy?et/moy:0}; }
    l.forEach(p=>p.g=st); const [agence,metier]=k.split('|'); groupes.push({agence,metier,n:l.length,st});
  }
  return {pers,groupes};
}
/** Décalage des RP (demandé par l'utilisateur) : avancement normal = RP dus par an (accord : 117 conducteurs, 113 AFR /
    coordo) / 52 × semaines écoulées à la date `fin` (fin de la semaine 20 : 117 / 52 × 20 = 45). RP réalisés = dernier
    numéro « RP-n » lu dans le fichier depuis le 1er janvier de l'année de `fin` (choix de l'utilisateur) ; sans numéro,
    nombre de RP comptés. Écart = réalisés − attendus : positif = en avance, négatif = en retard. */
function semainesEcoulees(fin){
  const an=+fin.slice(0,4), d=new Date(Date.parse(fin+'T00:00:00Z')), w=isoWeek(d), dow=(d.getUTCDay()+6)%7;
  const s=w.year===an?w.week-1+(dow+1)/7:(Date.parse(fin+'T00:00:00Z')-Date.UTC(an,0,1))/DAY/7+1/7;
  return Math.min(52,Math.max(0,s));

function decalageRP(rows,fin,rulesIn){
  const A=accordOf({...DEFAULT_RULES,...(rulesIn||{})}), deb=fin.slice(0,4)+'-01-01', sem=semainesEcoulees(fin), out=new Map();
  for(const [pk,l] of groupBy(rows,personKey)){ let num=null, nDate=null, cnt=0, met=null, md='';
    for(const a of l) for(const j of a.jours||[]){ if(!j.date||j.date<deb||j.date>fin) continue;
      if(j.date>=md){ md=j.date; met=a.metier; }
      if(j.kind!=='CODE'||j.family!=='RP') continue; if(!j.rpDouble) cnt++;
      const n=rpNum(j.code); if(n!=null&&(num==null||n>num)){ num=n; nDate=j.date; } }
    if(!met) continue;
    const rpAn=isAFR(met)?A.continuite.rpAn:A.roulant.rpAn, attendu=rpAn/52*sem, reel=num!=null?num:cnt;
    out.set(pk,{reel,source:num!=null?'numero':'compte',date:nDate,attendu,ecart:reel-attendu,rpAn,sem}); }
  return out;
}
/** RP par semaine (demandé par l'utilisateur ; règle précisée : triple / quadruple = 3 / 4 RP dans la même semaine civile,
    du lundi au dimanche, qu'ils se suivent ou non ; 5 et plus à part ; RP seulement, numéro déjà lu non recompté).
    Renvoie personne → [{lundi, dimanche, n}] (semaines avec au moins un RP). */
function rpSemaines(rows){
  const out=new Map();
  for(const [pk,l] of groupBy(rows,personKey)){ const sem=new Map(), vus=new Set();
    for(const a of l) for(const j of a.jours||[]){ if(!j.date||vus.has(j.date)) continue; vus.add(j.date);
      if(j.kind!=='CODE'||j.family!=='RP'||j.rpDouble) continue;
      const d=Date.parse(j.date+'T00:00:00Z'), lun=isoD(new Date(d-((new Date(d).getUTCDay()+6)%7)*DAY));
      if(!sem.has(lun)) sem.set(lun,{lundi:lun,dimanche:isoD(new Date(Date.parse(lun+'T00:00:00Z')+6*DAY)),n:0}); sem.get(lun).n++; }
    out.set(pk,[...sem.values()].sort((x,y)=>x.lundi.localeCompare(y.lundi))); }

/** Coût approximatif des heures sup (demandé par l'utilisateur) : heures × taux horaire de son métier (AFR / coordo ou
    conducteur) × (1 + majoration %) ; taux saisis dans Réglages → Production, vides par défaut (null = non calculé) */
function coutHeuresSup(h,metier,rulesIn){
  const c=((rulesIn||{}).production||{}).coutHS||{}, t=isAFR(metier)?c.afr:c.cdr;
  return t>0?h*t*(1+(c.maj||0)/100):null;

/** Planification (demandé par l'utilisateur) : semaine au choix, missions dans les cases, trains réguliers pré-placés,
    ajout à la main par glisser-déposer, alertes de l'accord à chaque changement ; brouillon enregistré sur le serveur.
    Train régulier : même intitulé, même trajet (départ → arrivée, demandé par l'utilisateur), même jour de semaine, présent au moins `seuil` fois sur les semaines données (2 sur 4,
    choix de l'utilisateur) ; horaire, trajet et pauses = ceux qui reviennent le plus ; agent habituel = celui qui l'a fait le plus. */

    for(const a of w.agents||[]) (a.jours||[]).forEach((j,d)=>{ if(j.kind!=='SERVICE') return;
      for(const m of j.missions||[]){ if(!m.start||!m.end||isATCMD(m)||/DISPO/i.test(m.label||'')) continue;   // ATCMD / DISPO : pas des trains (objectif 0)
        const k=normLieu(m.label)+'|'+normLieu(m.from)+'>'+normLieu(m.to)+'|'+d, s=Date.parse(m.start), e=Date.parse(m.end), base=d0+d*DAY;
        const x={w:w.meta.weekId,pk:personKey(a),nom:`${a.nom||''} ${a.prenom||''}`.trim(),label:m.label,from:m.from||'',to:m.to||'',

    const h=top(l,x=>x.s+'|'+x.dur), ref=l.find(x=>x.s+'|'+x.dur===h), pk=top(l,x=>x.pk), od=top(l,x=>x.from+'>'+x.to);
    const pks={}; for(const x of l) pks[x.pk]=(pks[x.pk]||0)+1;
    out.push({key:k,d:+k.split('|').pop(),label:ref.label,from:od.split('>')[0],to:od.split('>')[1],s:ref.s,dur:ref.dur,pauses:ref.pauses,semaines:n,pk,nom:l.find(x=>x.pk===pk).nom,pks}); }

/** Mission d'un train régulier posée sur un jour donné (horaire du train régulier) */
function missionDuJour(t,date,id){
  const base=Date.parse(date+'T00:00:00Z'), iso=x=>new Date(base+x*6e4).toISOString();
  return {id,label:t.label,from:t.from,to:t.to,start:iso(t.s),end:iso(t.s+t.dur),pauses:t.pauses.map(([p,q])=>[iso(p),iso(q)]),regulier:true};
}
/** Pré-remplissage d'une semaine à venir (demandé par l'utilisateur) : chaque train régulier appartient à l'agence et à la
    famille de métier (AFR / conducteurs) des agents qui l'ont assuré les semaines précédentes, et ne va qu'à un agent de
    cette agence et de ce métier (un agent de Hendaye ne reçoit pas une mission de Vaires). Agent choisi : celui qui l'a fait
    le plus souvent, sinon un collègue libre ce jour-là (pas de code, pas de chevauchement), dont l'amplitude du jour et le
    repos avec la journée précédente et la suivante restent dans les minimums de l'accord, le moins chargé à égalité.
    Sinon : réserve (avec son agence). Trains d'agences absentes de la grille : ignorés. `info` : personne → {agence, metier}

function planifRattacher(reg,info){

/** Pré-remplissage d'une semaine à venir : trains réguliers rattachés à leur agence, placés par planifAuto ; les trains

  const fa=finsAvant instanceof Map?Object.fromEntries(finsAvant):(finsAvant||{});

/* ---------- Planification automatique (demandée par l'utilisateur : « un vrai outil de planification automatisé ») ----------

  rj:'repos journalier à résidence trop court',rhr:'RHR trop court',suite:'ne s’enchaîne pas avec sa mission suivante',amp:'amplitude de la journée dépassée',
  tte:'TTE de la journée dépassé',pause:'plus de 6 h de travail sans pause de 20 min',hebdo:'dépasserait 48 h dans la semaine',retour:'ne pourrait pas rentrer à sa résidence',
  rp:'repos périodique non respecté (fin la veille d’un repos, reprise le lendemain, ou durée du repos)',

const plNuitMin=(s,e,[a,b])=>{ let n=0; for(let d=Math.floor(s/DAY)-1;d<=Math.floor(e/DAY);d++){ const x=d*DAY+a*H, y=d*DAY+(b<a?24+b:b)*H;
  n+=Math.max(0,Math.min(e,y)-Math.max(s,x)); } return n/6e4; };
/** Horaires observés dans les fichiers entre deux lieux (tous les trains vus, trajets seuls compris) : durée la plus fréquente

function planifTrajets(weeks){
  const G=new Map();

    if(!m.start||!m.end||!m.from||!m.to||isATCMD(m)||/DISPO/i.test(m.label||'')) continue;

/** Contexte de la planification : état de chaque agent à la fin de la semaine précédente et résidences */
function planifEtat(pl,ctx){

const plEstMaison=(E,a,l)=>{ const r=E.res(a); return !r.size||!l||r.has(normLieu(l)); };
/** Trajet seul entre deux lieux sur un horaire observé : départ au plus tôt `tMin`, arrivée au plus tard `tMax` ;

function plTrajet(E,de,a,tMin,tMax,tot){

const plTl=a=>a.jours.flatMap((j,d)=>(j.m||[]).map(m=>({m,d,s:Date.parse(m.start),e:Date.parse(m.end)}))).sort((x,y)=>x.s-y.s);

function planifRelier(pl,ctx,rulesIn){

/** Écarts d'une semaine d'agent (trajets seuls déjà refaits) : liaisons impossibles, chevauchements (30 min de battement),
