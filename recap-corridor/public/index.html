    const smp=(S.rows_agents||[])[0]||{};
    S.sort=S.sort.k===k?{k,dir:S.sort.dir==='asc'?'desc':'asc'}
      :{k,dir:['nom','matricule','agence','metier','residence','rhrLieux'].includes(k)||typeof smp[k]!=='number'&&!['priseServicePlusTot','finServicePlusTard'].includes(k)?'asc':'desc'};
    render(); return; }
  if(t.dataset.tsort){ const [id,k]=t.dataset.tsort.split('|'); const cur=S.sorts[id];
    const txt=['ag','me','agence','metier','nom','rhrLieux','dates'].includes(k);
    S.sorts[id]=cur&&cur.k===k?{k,dir:cur.dir==='asc'?'desc':'asc'}:{k,dir:txt?'asc':'desc'}; render(); return; }
  if(t.dataset.agent!=null){ S.drawer=(S.rows_agents||[])[+t.dataset.agent]; renderDrawer(); return; }
  if(t.dataset.wk){ S.selWeek=t.dataset.wk; await ensureLoaded(toLoad()); render(); return; }
  if(t.dataset.trow){ const [id,i]=t.dataset.trow.split('|'); const r=(S['rows_'+id]||[])[+i]; if(r&&r.jours){ S.drawer=r; renderDrawer(); } return; }
  if(t.dataset.ag!=null){ const ags=allAgences(); let c=S.selAgences||ags.slice();
    c=c.includes(t.dataset.ag)?c.filter(x=>x!==t.dataset.ag):[...c,t.dataset.ag];
    S.selAgences=c.length?c:null; savePrefs(); render(); return; }
  if(t.id==='agAll'){ S.selAgences=null; savePrefs(); render(); return; }
  if(t.id==='agHeBx'){ S.selAgences=['Hendaye','Bordeaux-St-Jean']; savePrefs(); render(); return; }
  if(t.dataset.me!=null){ const ms=allMetiers(); let c=S.selMetiers||ms.slice();
    c=c.includes(t.dataset.me)?c.filter(x=>x!==t.dataset.me):[...c,t.dataset.me];
    S.selMetiers=c.length?c:null; savePrefs(); render(); return; }
  if(t.id==='meAll'){ S.selMetiers=null; savePrefs(); render(); return; }
  if(t.id==='pick'){ el('file').click(); return; }
  if(t.dataset.qdel!=null){ S.queue.splice(+t.dataset.qdel,1); render(); return; }
  if(t.id==='clearQ'){ S.queue=[]; S.err=null; render(); return; }
  if(t.id==='saveAll'){ saveAll(); return; }
  if(t.dataset.del){ S.delAsk=t.dataset.del; render(); return; }
  if(t.dataset.delno){ S.delAsk=null; render(); return; }
  if(t.dataset.delok){ const id=t.dataset.delok; S.delAsk=null;
    try{ await api.delSemaine(id); S.msg={m:`${id.replace('-',' ')} supprimée.`}; }catch(err){ S.msg={m:err.message,t:'c'}; }
    S.loaded.delete(id); S.parsedCache.delete(id); S.vit=null;
    const {weeks}=await api.etat(); S.weeks=weeks; recomputeLoaded();
    if(S.selWeek===id) S.selWeek=S.weeks[0]?S.weeks[0].weekId:'__all__';
    await ensureLoaded(toLoad()); render(); setTimeout(()=>{S.msg=null;render();},4000); return; }
  if(t.id==='saveRules'){
    const avantR=structuredClone(S.rules), avant=totaux();
    const num=(id,d)=>{const v=parseFloat(String(el(id)?.value??'').replace(',','.'));return isFinite(v)?v:d;};
    S.rules={...S.rules,
      rhrMetiers: el('rMet').checked?['CONDUCTEUR']:allMetiers(),
      rhrCountPending: el('rPend').checked,
      jbExcludeNightOverlap: el('rNight').checked,
      jbRequireFramed: el('rFramed').checked,
      jbExcludeHorsResidence: el('rJBHR').checked,
      panierRHR: el('rPRHR').checked,
      horsColonne: el('rHC').checked?'ecarter':'garder',
      rhrMinHours: Math.max(0,num('rMin',8)), rhrMaxAbsence: Math.max(1,num('rMax',44)), rhrCoupeParRepos: el('rCRP').checked,
      seuilHebdo: num('rSeuil',35), heuresATCMD: num('rATCMD',5),
      nuitAFR:[num('rNA0',22),num('rNA1',7)], nuitCDR:[num('rNC0',22),num('rNC1',5)],
      trajetTypes: String(el('rTraj').value).split(/[,;]/).map(x=>x.trim().toUpperCase()).filter(Boolean),
      // une résidence déduite automatiquement reste automatique (elle peut s'écrire BX une semaine, BORDEAUX une autre) :
      // seule une valeur déjà manuelle, ou modifiée à la main, est enregistrée
      residences: Object.fromEntries([...document.querySelectorAll('[data-res]')]
        .filter(i=>i.dataset.man||i.value.trim()!==i.dataset.init)
        .map(i=>[i.dataset.res,i.value.trim()]).filter(([,v])=>v)),
      agencesAlias: (()=>{ const auto=autoAlias(), o={...(S.rules.agencesAlias||{})};
        document.querySelectorAll('[data-agal]').forEach(i=>{ const k=i.dataset.agal, v=i.value.trim();
          if(!v||v===auto[k]) delete o[k]; else o[k]=v; }); return o; })()};
    recomputeLoaded(); S.vit=null;
    const ch=rulesDiff(avantR,S.rules);
    try{ await persistRules(ch.length?ch:['Règles enregistrées sans changement'],avant); S.msg={m:'Règles enregistrées — elles s’appliquent à tous les utilisateurs.'}; }
    catch(err){ S.msg={m:err.message,t:'c'}; }
    render(); setTimeout(()=>{S.msg=null;render();},5000); return; }
});

document.addEventListener('keydown',e=>{

/* ==========================================================================
   15. DÉMARRAGE
   ========================================================================== */
async function login(code){
  const v=code||el('codeIn')?.value||'';
  if(!v.trim()) return;
  S.busy=true; S.err=null; render();
  api.code=v.trim();
  try{
    const {role}=await withLoad(api.session());
    S.role=role; S.busy=false; S.err=null;
    savePrefs(); await boot();
  }catch(e){
    S.busy=false; api.code=''; S.role=null;
    S.err=e.status===401?"Code d'accès non reconnu.":('Connexion impossible : '+e.message);
    render();
  }
}
async function boot(){
  try{
    const {weeks,regles,suivi,journal}=await withLoad(api.etat());
    S.weeks=weeks||[]; S.suivi=suivi||{alertes:{}}; S.journal=journal||[];
    S.rules=loadRules(regles);
    const p=prefs();
    if(p.selAgences) S.selAgences=p.selAgences.filter(a=>allAgences().includes(a));
    if(S.selAgences&&!S.selAgences.length) S.selAgences=null;
    if(p.selMetiers) S.selMetiers=p.selMetiers.filter(m=>allMetiers().includes(m));
    if(S.selMetiers&&!S.selMetiers.length) S.selMetiers=null;
    if(!S.selAgences){ const pr=['Hendaye','Bordeaux-St-Jean'].filter(a=>allAgences().includes(a)); if(pr.length) S.selAgences=pr; }
    if(S.weeks.length&&S.selWeek==='__all__') S.selWeek=S.weeks[0].weekId;
    if(S.role!=='admin'){ if(S.tab!=='lecture') S.tab='vitrine'; render(); await loadVitrine(true); }
    else if(S.tab==='vitrine'){ render(); await loadVitrine(true); }
    else await ensureLoaded(toLoad());
  }catch(e){ S.msg={m:'Chargement impossible : '+e.message,t:'c'}; }
  render();
}
(async function start(){
  const p=prefs();
  const qs=new URLSearchParams(location.search).get('semaine');
  if(qs&&/^\d{4}-S\d{2}$/.test(qs)){ S.vf.w=qs; p.tab='vitrine'; }
  if(p.theme) document.documentElement.dataset.theme=p.theme;
  if(p.cols) S.cols={...S.cols,...p.cols};
  if(p.chart) S.chart={...S.chart,...p.chart};
  if(p.st) S.st={...S.st,...p.st};
  if(p.auteur) S.auteur=p.auteur;
  if(p.mode) S.mode=p.mode;
  if(p.tab) S.tab=p.tab;
  render();
  await backend.detect();
  if(backend.mode==='artifact'){
    document.getElementById('btnOut')?.remove();
    S.role='admin'; await boot(); return;
  }
  if(p.code) login(p.code); else render();
})();

  };
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8">
