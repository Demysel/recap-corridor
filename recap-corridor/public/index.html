/* ---------- 3. en bref : la semaine racontée en quelques phrases ---------- */
function enBref(){
  const sc=scopeAgents(); if(!sc.length) return '';
  const ids=[...new Set(sc.map(a=>a.weekId))].sort(), g=agg(sc), P=[];
  const nW=ids.length, wl=nW===1?(()=>{const w=S.weeks.find(x=>x.weekId===ids[0]);return w?weekLabel(w):ids[0];})():`${nW} semaines`;
  let evo='';
  if(nW===1){ const all=S.weeks.map(w=>w.weekId).sort(), i=all.indexOf(ids[0]), pid=all[i-1], pv=pid&&S.loaded.get(pid);
    if(pv){ const pl=pv.agents.filter(a=>(!S.selAgences||S.selAgences.includes(a.agence))&&(!S.selMetiers||S.selMetiers.includes(a.metier))), pg=agg(pl);
      if(pg.nbRHR){ const d=100*(g.nbRHR-pg.nbRHR)/pg.nbRHR; evo=` (${d>=0?'+':''}${nf(d,0)} % par rapport à la semaine précédente)`; } } }
  const byAg=[...groupBy(sc.filter(a=>a.rhrApplicable),a=>a.agence)].map(([ag,l])=>[ag,agg(l)]).sort((x,y)=>y[1].nbRHR-x[1].nbRHR);
  P.push(`<b>${esc(wl)}</b> : ${nf(g.nbAgents)} agents, ${nf(g.joursService)} journées de service et <b>${nf(g.nbRHR)} repos hors résidence</b>${evo}.`);
  if(byAg[0]&&byAg[0][1].nbRHR) P.push(`${esc(byAg[0][0])} en compte le plus (${nf(byAg[0][1].nbRHR)}, soit ${nf(byAg[0][1].nbRHR_moy,1)} par conducteur concerné)${byAg[1]&&byAg[1][1].nbRHR?`, devant ${esc(byAg[1][0])} (${nf(byAg[1][1].nbRHR)})`:''}.`);
  P.push(`${g.journeesBlanches?`<b>${nf(g.journeesBlanches)} journée${g.journeesBlanches>1?'s':''} blanche${g.journeesBlanches>1?'s':''}</b> pour ${nf(g.agentsAvecBlanche)} agent${g.agentsAvecBlanche>1?'s':''}`:'Aucune journée blanche'} ; ${g.heuresSup?`<b>${fmtH(g.heuresSup)} d’heures sup</b> pour ${nf(g.agentsHeuresSup)} agent${g.agentsHeuresSup>1?'s':''}`:'aucune heure sup'} ; TTE moyen ${fmtH(g.heuresPlanifiees/(sc.filter(a=>a.joursService).length||1))} par agent en service et par semaine.`);
  const h=H24(); for(const a of sc) for(const j of a.jours) if(j.kind==='SERVICE') for(const m of j.missions) for(const [s0,s1] of workSegments(m)) for(let t=Math.floor(s0/H)*H;t<s1;t+=H) h[new Date(t).getUTCHours()]+=ovl(t,t+H,s0,s1)/H;
  const pk=h.indexOf(Math.max(...h));
  P.push(`Heure la plus chargée : ${String(pk).padStart(2,'0')}h–${String(pk+1).padStart(2,'0')}h ; ${nf(100*g.heuresNuit/(g.heuresPlanifiees||1),0)} % du temps de travail se fait de nuit.`);
  if(S.alN) P.push(`<a href="#" data-goto="verifier">${nf(S.alN)} alerte${S.alN>1?'s':''} à vérifier</a>.`);
  return `<section class="card bref"><div class="card-b"><span class="flabel">En bref</span><p>${P.join(' ')}</p></div></section>`;
}

function qualite(){
  const ids=activeWeeks().filter(id=>S.loaded.has(id)), out=[];

  const withC=res.filter(w=>w.controle);
  if(withC.length){
    const cel=withC.reduce((s,w)=>s+w.controle.cellules,0), bad=withC.reduce((s,w)=>s+w.controle.illisibles,0);
    const pc=cel?100*(1-bad/cel):100;
    out.push({lvl:bad===0?'ok':pc>=99?'mid':'lo',t:`Cases lues : ${nf(pc,pc===100?0:1)} %`,d:bad?`${nf(bad)} case${bad>1?'s':''} sur ${nf(cel)} contien${bad>1?'nent':'t'} un horaire illisible ou une mission sans horaire. Le détail est dans l’onglet Import.`:`Les ${nf(cel)} cases jour ont été lues sans anomalie.`});
  } else out.push({lvl:'mid',t:'Cases lues : non mesuré',d:'Les semaines affichées ont été importées avant le contrôle de lecture. Les réimporter donne la mesure.'});
  const ags=scopeAgences(), src={};
  for(const id of ids){ const m=S.loaded.get(id).meta; for(const a of ags) if(m.residenceSource[a]) src[a]=src[a]==='auto'||!src[a]?m.residenceSource[a]:src[a]; }
  const auto=ags.filter(a=>src[a]==='auto'), ind=ags.filter(a=>src[a]==='indéterminée');
  out.push({lvl:ind.length?'lo':auto.length?'mid':'ok',t:`Résidences : ${auto.length+ind.length?`${auto.length+ind.length} à confirmer`:'toutes confirmées'}`,

  const sc=scopeAgents(), hc=sc.reduce((s,a)=>s+a.nbHorsColonne,0), jr=mergeAcrossWeeks(sc).filter(a=>a.jamaisEnResidence).length;

  out.push({lvl:ail?'mid':'ok',t:`Semaines passées surtout hors résidence : ${nf(ail)}`,d:ail?'Le lieu le plus fréquent de l’agent n’est pas la résidence de son agence : détachement ou résidence mal réglée. Voir les Points de vigilance de la Synthèse.':'Chaque conducteur passe surtout par sa résidence.'});
  out.push({lvl:jr?'lo':'ok',t:`Agents jamais en résidence : ${nf(jr)}`,d:jr?'Tous leurs services comptent comme hors résidence : le signe le plus fréquent d’une résidence mal réglée.':'Tous les conducteurs passent au moins une fois par leur résidence.'});

/* ---------- 4. carte des flux : lieux reliés par les missions, taille = passages, anneau ambre = RHR ---------- */
function fluxLayout(nodes,edges,W,Hh){
  const N=nodes.length, idx=new Map(nodes.map((n,i)=>[n.id,i]));
  const P=nodes.map((n,i)=>{const a=2*Math.PI*i/N;return {x:W/2+Math.cos(a)*W/3,y:Hh/2+Math.sin(a)*Hh/3};});
  const k=Math.sqrt(W*Hh/Math.max(1,N))*0.55, E=edges.map(e=>[idx.get(e.a),idx.get(e.b),Math.log(1+e.n)]).filter(e=>e[0]!=null&&e[1]!=null);
  for(let it=0;it<400;it++){
    const t=(1-it/400)*W/12, D=P.map(()=>({x:0,y:0}));
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){ let dx=P[i].x-P[j].x, dy=P[i].y-P[j].y, d=Math.max(1,Math.hypot(dx,dy)), f=k*k/d;
      D[i].x+=dx/d*f; D[i].y+=dy/d*f; D[j].x-=dx/d*f; D[j].y-=dy/d*f; }
    for(const [i,j,w] of E){ const dx=P[i].x-P[j].x, dy=P[i].y-P[j].y, d=Math.max(1,Math.hypot(dx,dy)), f=d*d/k*(0.4+w/4);
      D[i].x-=dx/d*f; D[i].y-=dy/d*f; D[j].x+=dx/d*f; D[j].y+=dy/d*f; }
    for(let i=0;i<N;i++){ D[i].x+=(W/2-P[i].x)*0.02*k; D[i].y+=(Hh/2-P[i].y)*0.02*k;
      const l=Math.max(1,Math.hypot(D[i].x,D[i].y)); P[i].x+=D[i].x/l*Math.min(l,t); P[i].y+=D[i].y/l*Math.min(l,t); }
  }
  const xs=P.map(p=>p.x), ys=P.map(p=>p.y), x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys), m=60;
  return P.map(p=>({x:m+(x1>x0?(p.x-x0)/(x1-x0):.5)*(W-2*m),y:m*.7+(y1>y0?(p.y-y0)/(y1-y0):.5)*(Hh-1.4*m)}));
}
function fluxMap(edges,rhr,res,opt={}){
  if(!edges.length) return `<p class="mut">${opt.vide||'Aucun trajet entre deux lieux sur ce périmètre.'}</p>`;
  const W=780, Hh=440, deg=new Map(), R=new Map(rhr.map(r=>[r.l,r.n])), RS=new Set(res);
  for(const e of edges){ deg.set(e.a,(deg.get(e.a)||0)+e.n); deg.set(e.b,(deg.get(e.b)||0)+e.n); }
  const nodes=[...deg].map(([id,n])=>({id,n,rhr:R.get(id)||0,res:RS.has(id)})).sort((a,b)=>b.n-a.n).slice(0,28);
  const ids=new Set(nodes.map(n=>n.id)), E=edges.filter(e=>ids.has(e.a)&&ids.has(e.b));
  const P=fluxLayout(nodes,E,W,Hh), at=new Map(nodes.map((n,i)=>[n.id,P[i]]));
  const maxN=Math.max(...nodes.map(n=>n.n)), maxE=Math.max(...E.map(e=>e.n)), maxR=Math.max(1,...nodes.map(n=>n.rhr));
  const rad=n=>6+14*Math.sqrt(n.n/maxN);
  let g='';
  for(const e of E.sort((a,b)=>a.n-b.n)){ const a=at.get(e.a), b=at.get(e.b);
    g+=`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="var(--accent)" stroke-opacity="${(0.18+0.6*e.n/maxE).toFixed(2)}" stroke-width="${(1+7*e.n/maxE).toFixed(1)}" stroke-linecap="round"
      data-tip="${esc(`<b>${esc(e.a)} ↔ ${esc(e.b)}</b><span class="tr"><span>Missions</span><b>${nf(e.n)}</b></span>`)}"/>`; }
  for(const n of nodes){ const p=at.get(n.id), r=rad(n);
    if(n.rhr) g+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(r+3+9*Math.sqrt(n.rhr/maxR)).toFixed(1)}" fill="var(--signal-soft)" stroke="var(--signal)" stroke-width="1.5"/>`;
    g+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${n.res?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"
      data-tip="${esc(`<b>${esc(n.id)}</b>${n.res?' <span class="mut">résidence</span>':''}<span class="tr"><span>Passages</span><b>${nf(n.n)}</b></span><span class="tr"><span>RHR à ce lieu</span><b>${nf(n.rhr)}</b></span>`)}"${opt.click?` data-flieu="${esc(n.id)}" style="cursor:pointer"`:''}/>`;
    g+=`<text x="${p.x.toFixed(1)}" y="${(p.y+r+14).toFixed(1)}" text-anchor="middle" class="fx-l">${esc(n.id)}</text>`; }
  return `<div class="fx"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Carte des flux entre lieux">${g}</svg>
    <div class="legend"><span class="lg"><span class="sw" style="background:var(--accent);border-radius:50%"></span>Résidence d’agence</span><span class="lg"><span class="sw" style="border-radius:50%;border:2px solid var(--accent)"></span>Autre lieu · taille = passages</span>
    <span class="lg"><span class="sw" style="border-radius:50%;background:var(--signal-soft);border:1.5px solid var(--signal)"></span>Anneau = repos hors résidence</span><span class="lg">Trait = missions entre deux lieux</span></div></div>`;
}
/** Carte des flux du périmètre administrateur */
function fluxAdmin(sc){
  const E=new Map(), R=new Map(), res=new Set();
  for(const a of sc){ if(a.residence) res.add(normLieu(a.residence));
    for(const m of a.missions||[]){ if(!m.from||!m.to) continue; const x=normLieu(m.from), y=normLieu(m.to); if(x===y) continue; const k=x<y?x+'|'+y:y+'|'+x; E.set(k,(E.get(k)||0)+1); }

const MED=v=>{const a=[...v].sort((x,y)=>x-y), n=a.length; return n?(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2):0;};
const RHR_ALL=new Set(['nbRHR','rhrNuits','rhrHeures','rhr8_12','rhr12_24','rhr24','rhrSuccessifs']);
const ST_MODES=[['total','Total'],['agent','Moyenne par agent'],['semaine','Moyenne par semaine'],['jour','Par jour de service'],['mediane','Médiane par agent']];
const ST_ECH=[['semaine','Semaine'],['mois','Mois'],['trimestre','Trimestre'],['annee','Année']];
const ST_GRP=[['agence','Agence'],['metier','Métier'],['agmet','Agence et métier']];
const MOISL=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

/** Valeur d'une mesure sur une liste de lignes agent-semaine.
    Les mesures RHR ne portent que sur les métiers concernés ; leurs moyennes par agent, sur les agents qui en ont eu. */
function statVal(list,k,mode){
  if(!list.length) return null;
  const rh=RHR_ALL.has(k), base=rh?list.filter(a=>a.rhrApplicable):list;
  if(rh&&!base.length) return null;
  const t=base.reduce((s,a)=>s+(a[k]||0),0);
  if(mode==='total') return r2(t);
  if(mode==='semaine') return r2(t/(new Set(list.map(a=>a.weekId)).size||1));
  if(mode==='jour'){ const js=base.reduce((s,a)=>s+a.joursService,0); return js?r2(t/js):0; }
  const pop=rh?base.filter(a=>a.nbRHR>0):base, v=pop.map(a=>a[k]||0);
  if(mode==='agent') return v.length?r2(v.reduce((s,x)=>s+x,0)/v.length):0;
  return r2(MED(v));
}
const stGroup=g=>g==='metier'?a=>a.metier:g==='agmet'?a=>a.agence+' · '+a.metier:a=>a.agence;
function perKey(a,e){

function vAgg(cells){
  const o={n:0,rhrApp:0,avecRHR:0,avecJB:0,avecSup:0,s:{},w:new Set(cells.map(c=>c.w)).size||1,
    heat:{presence:H24(),prise:H24(),fin:H24(),rhr:H24()},dow:{presence:D7(),prise:D7()},dist:{amp:Array(6).fill(0),hp:Array(6).fill(0),rhrB:[0,0,0],rhrN:Array(5).fill(0),jbN:Array(4).fill(0)}};
  for(const f of FIELDS) o.s[f.k]=0;
  for(const c of cells){ o.n+=c.n; o.rhrApp+=c.rhrApp; o.avecRHR+=c.avecRHR; o.avecJB+=c.avecJB; o.avecSup+=c.avecSup;
    for(const f of FIELDS) o.s[f.k]+=c.s[f.k]||0;
    for(const k in o.heat) o.heat[k]=o.heat[k].map((v,i)=>v+c.heat[k][i]);
    for(const k in o.dow) o.dow[k]=o.dow[k].map((r,d)=>r.map((v,i)=>v+c.dow[k][d][i]));
    for(const k in o.dist) o.dist[k]=o.dist[k].map((v,i)=>v+c.dist[k][i]); }
  return o;
}

function spark(vals){
  const v=vals.map(x=>x==null?null:+x), ok=v.filter(x=>x!=null); if(ok.length<2) return '';
  const mn=Math.min(...ok), mx=Math.max(...ok), W=110, Hs=30, X=i=>2+i*(W-4)/(v.length-1), Y=x=>mx===mn?Hs/2:Hs-3-(x-mn)/(mx-mn)*(Hs-6);
  const pts=v.map((x,i)=>x==null?null:`${X(i).toFixed(1)},${Y(x).toFixed(1)}`).filter(Boolean);
  const li=v.length-1-[...v].reverse().findIndex(x=>x!=null);
  return `<svg class="spk" viewBox="0 0 ${W} ${Hs}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(li).toFixed(1)}" cy="${Y(v[li]).toFixed(1)}" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/></svg>`;
}

/* ---------- 5 et 6. comparer : deux périodes, deux agences, deux agents ---------- */
const CMP_MODES=[['periodes','Deux périodes'],['agences','Deux agences'],['agents','Agents']];
function cmpTable(labA,labB,la,lb,mode){
  return `<div class="tw tall"><table class="sticky1 cmp"><thead><tr><th class="l st">Mesure</th><th>${esc(labA)}</th><th>${esc(labB)}</th><th>Écart</th><th>Évolution</th></tr></thead><tbody>
    ${FIELDS.map(f=>{ const a=statVal(la,f.k,mode), b=statVal(lb,f.k,mode), F=stFmt(f.k), d=a!=null&&b!=null?b-a:null, ev=d!=null&&a?100*d/a:null;
      return `<tr><td class="l st">${esc(f.l)}</td><td>${F(a)}</td><td>${F(b)}</td>
        <td>${d==null||!d?'<span class="z">—</span>':`<span class="${d>0?'up':'dn'}">${d>0?'+':'−'}${F(Math.abs(r2(d)))}</span>`}</td>
        <td>${ev==null||!d?'<span class="z">—</span>':`<span class="${ev>0?'up':'dn'}">${ev>0?'▲ +':'▼ '}${nf(ev,1)} %</span>`}</td></tr>`;}).join('')}
  </tbody></table></div>`;
}
function profilH(list){ const h=H24(); const nW=new Set(list.map(a=>a.weekId)).size||1;
  for(const a of list) for(const j of a.jours) if(j.kind==='SERVICE') for(const m of j.missions) for(const [s0,s1] of workSegments(m)) for(let t=Math.floor(s0/H)*H;t<s1;t+=H) h[new Date(t).getUTCHours()]+=ovl(t,t+H,s0,s1)/H;
  return h.map(x=>r2(x/(nW*7))); }
function viewComparer(){
  if(!S.weeks.length) return emptyScope();
  const c=S.cmp, ids=S.weeks.map(w=>w.weekId).sort(), W=id=>S.weeks.find(w=>w.weekId===id);
  const wOpt=(sel)=>ids.map(id=>`<option value="${id}"${sel===id?' selected':''}>${weekLabel(W(id))} · ${weekRange(W(id))}</option>`).join('');
  const seg=`<div class="seg">${CMP_MODES.map(([k,l])=>`<button class="sg" data-cmpm="${k}" aria-pressed="${c.mode===k}">${l}</button>`).join('')}</div>`;
  const modeSel=`<div class="seg">${ST_MODES.map(([k,l])=>`<button class="sg" data-cmpv="${k}" aria-pressed="${c.val===k}">${l}</button>`).join('')}</div>`;
  const all=scopeAgents({allWeeks:true});
  let body='', ctrls='';
  if(c.mode==='periodes'){
    const last=ids[ids.length-1], prev=ids[ids.length-2]||last;
    c.a0=c.a0&&ids.includes(c.a0)?c.a0:prev; c.a1=c.a1&&ids.includes(c.a1)?c.a1:prev; c.b0=c.b0&&ids.includes(c.b0)?c.b0:last; c.b1=c.b1&&ids.includes(c.b1)?c.b1:last;
    c.pa=c.pa||'perso'; c.pb=c.pb||'perso';
    const inR=(id,x,y)=>id>=(x<y?x:y)&&id<=(x<y?y:x);
    const wsOf=(p,x,y)=>p==='perso'?ids.filter(id=>inR(id,x,y)):periodWeeks(p,S.weeks);
    const wa=new Set(wsOf(c.pa,c.a0,c.a1)), wb=new Set(wsOf(c.pb,c.b0,c.b1));
    const la=c.pa==='perso'?all.filter(a=>wa.has(a.weekId)):rowsOfPeriod(all,c.pa), lb=c.pb==='perso'?all.filter(a=>wb.has(a.weekId)):rowsOfPeriod(all,c.pb);
    const lab0=(x,y)=>x===y?weekLabel(W(x)):`${weekLabel(W(x<y?x:y))} → ${weekLabel(W(x<y?y:x))}`;
    const labP=(p,x,y)=>p==='perso'?lab0(x,y):(p==='__all__'||/^[nr]:/.test(p))?(ECHANT.find(e=>e[0]===p)||[,''])[1]:p.startsWith('y:')?p.slice(2):p.startsWith('m:')?`${MOISF[+p.slice(7)-1]} ${p.slice(2,6)}`:weekLabel(W(p.replace(/^w:/,'')));
    const la_=labP(c.pa,c.a0,c.a1), lb_=labP(c.pb,c.b0,c.b1);
    const pSel=(f,v)=>`<select data-cmpf="${f}"><option value="perso"${v==='perso'?' selected':''}>Du… au… (semaines au choix)</option>${periodOptions(v,S.weeks)}</select>`;
    const du=(p,f0,f1)=>p==='perso'?`<div class="fld"><span class="flabel">du</span><select data-cmpf="${f0}">${wOpt(c[f0])}</select></div><div class="fld"><span class="flabel">au</span><select data-cmpf="${f1}">${wOpt(c[f1])}</select></div>`:'';
    ctrls=`<div class="fld"><span class="flabel">Période A</span>${pSel('pa',c.pa)}</div>${du(c.pa,'a0','a1')}
      <div class="fld"><span class="flabel">Période B</span>${pSel('pb',c.pb)}</div>${du(c.pb,'b0','b1')}`;
    body=`<section class="card"><div class="card-h"><div><h2>${esc(la_)} comparée à ${esc(lb_)}</h2><p class="card-s">périmètre d’agences et de métiers sélectionné · ${nf(new Set(la.map(a=>a.weekId)).size)} et ${nf(new Set(lb.map(a=>a.weekId)).size)} semaine(s)</p></div></div>
      <div class="card-b">${la.length&&lb.length?cmpTable(la_,lb_,la,lb,c.val):'<p class="mut">Une des deux périodes est vide sur ce périmètre.</p>'}</div></section>`;
  } else if(c.mode==='agences'){
    const ags=[...new Set(all.map(a=>a.agence))].sort();
    c.gA=ags.includes(c.gA)?c.gA:ags[0]; c.gB=ags.includes(c.gB)&&c.gB!==c.gA?c.gB:(ags.find(x=>x!==c.gA)||ags[0]);
    const act=rowsOfPeriod(all,S.selWeek), la=act.filter(a=>a.agence===c.gA), lb=act.filter(a=>a.agence===c.gB);
    const o=v=>ags.map(a=>`<option${a===v?' selected':''}>${esc(a)}</option>`).join('');
    ctrls=`<div class="fld"><span class="flabel">Agence A</span><select data-cmpf="gA">${o(c.gA)}</select></div><div class="fld"><span class="flabel">Agence B</span><select data-cmpf="gB">${o(c.gB)}</select></div>`;
    const hA=profilH(la), hB=profilH(lb);
    body=`<section class="card"><div class="card-h"><div><h2>${esc(c.gA)} et ${esc(c.gB)}</h2><p class="card-s">semaine(s) sélectionnée(s) en haut · les moyennes rendent comparables deux agences de tailles différentes</p></div></div>
      <div class="card-b">${cmpTable(c.gA,c.gB,la,lb,c.val)}</div></section>
      <section class="card"><div class="card-h"><div><h2>Profil horaire</h2><p class="card-s">agents en service en moyenne, heure par heure, jour moyen</p></div></div>
      <div class="card-b">${lineChart([{name:c.gA,short:c.gA.slice(0,10),color:'var(--s1)',values:hA},{name:c.gB,short:c.gB.slice(0,10),color:'var(--s2)',values:hB}],Array.from({length:24},(_,h)=>String(h).padStart(2,'0')+'h'),v=>nf(v,1))}
        <div class="clg"><span class="lg"><span class="cdot" style="background:var(--s1)"></span>${esc(c.gA)}</span><span class="lg"><span class="cdot" style="background:var(--s2)"></span>${esc(c.gB)}</span></div></div></section>`;
  } else {
    // agents choisis dans le sélecteur « Agent » du haut, tous côte à côte, sur une période au choix (mêmes options que le filtre)
    const per=c.per||S.selWeek, wk=new Set(periodWeeks(per,S.weeks));
    const rows=rowsOfPeriod(all,per), G=groupBy(rows,personKey), ks=selAg().filter(k=>G.has(k));
    const who=k=>{const a=G.get(k)[0];return `${a.nom} ${a.prenom}`;};
    ctrls=`<div class="fld"><span class="flabel">Période</span><select data-cmpf="per" style="max-width:300px">${periodOptions(per,S.weeks)}</select></div>
      <div class="fld"><span class="flabel">Agents</span><span class="mut sm" style="padding-top:8px">choisis dans « Agent » en haut (${nf(selAg().length)})</span></div>`;
    if(ks.length<2) body=`<section class="card"><div class="card-b"><p class="mut">Choisissez au moins deux agents dans le sélecteur « Agent » en haut de la page${selAg().length&&ks.length<selAg().length?` (certains n’ont aucune semaine sur ${esc(periodLabel(per,S.weeks))})`:''}.</p></div></section>`;
    else {
      body=`<section class="card"><div class="card-h"><div><h2>${ks.length} agents</h2><p class="card-s">${esc(periodLabel(per,S.weeks))} · en ambre la valeur la plus haute, en rose la plus basse</p></div></div>
        <div class="card-b"><div class="tw tall"><table class="sticky1 cmp"><thead><tr><th class="l st">Mesure</th>${ks.map(k=>`<th>${esc(who(k))}</th>`).join('')}</tr></thead><tbody>
        ${FIELDS.map(f=>{const v=ks.map(k=>statVal(G.get(k),f.k,c.val)), F=stFmt(f.k), nn=v.filter(x=>x!=null), mx=nn.length>1?Math.max(...nn):null, mn=nn.length>1?Math.min(...nn):null;
          return `<tr><td class="l st">${esc(f.l)}</td>${v.map(x=>`<td class="${x!=null&&mx!==mn&&x===mx?'hi':x!=null&&mx!==mn&&x===mn?'lo':''}">${x==null?'<span class="z">—</span>':F(x)}</td>`).join('')}</tr>`;}).join('')}
        </tbody></table></div></div></section>`;
      // une seule semaine : le planning de chaque agent, l'un sous l'autre
      if(wk.size===1) body+=ks.map(k=>{const x=G.get(k)[0];return `<section class="card"><div class="card-h"><div><h2>${esc(who(k))}</h2><p class="card-s">${esc(x.agence)} · ${esc(x.metier)} · ${fmtH(x.heuresPlanifiees)} de TTE · ${x.rhrApplicable?x.nbRHR+' RHR · ':''}${x.journeesBlanches} journée(s) blanche(s)</p></div></div>
        <div class="card-b">${weekTimeline(x)}</div></section>`;}).join('')+`<div style="margin-top:-6px">${legendTimeline()}</div>`;
    }
  }
  return `<section class="card"><div class="card-b"><div class="ctrls" style="margin-bottom:0;border-bottom:0;padding-bottom:0">
    <div class="fld"><span class="flabel">Comparer</span>${seg}</div>${ctrls}<div class="fld"><span class="flabel">Valeur</span>${modeSel}</div></div></div></section>${body}`;
}

/* ---------- 13. export détaillé : une ligne par RHR, par arrêt, par case vide, par mission ---------- */
function detailSheets(){
  const R0={...DEFAULT_RULES,...S.rules};
  const sc=scopeAgents().slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr')||String(a.weekId).localeCompare(String(b.weekId)));
  const id=a=>[a.matricule,a.nom,a.prenom,a.agence,a.metier,String(a.weekId).replace(/^\d+-/,'')];
  const idc=[{t:'Matricule',w:10},{t:'Nom',w:18},{t:'Prénom',w:13},{t:'Agence',w:18},{t:'Métier',w:12},{t:'Semaine',w:8}];
  const d=s=>s?dtISO(s)+' '+new Date(s).getUTCFullYear():'';
  const ST={rhr:'RHR',force:'RHR (corrigé)',lien:'RHR (missions liées)',ouvert:'RHR ouvert',residence:'à la résidence',court:'trop court',repos:'repos pendant l’arrêt',ecarte:'écarté (corrigé)'};
  const rhr=[], arr=[], vides=[], mis=[];
  for(const a of sc){
    for(const x of a.rhr) rhr.push([...id(a),a.residence||'',x.lieu,d(x.debut),d(x.fin),x.dureeH,x.nuits,x.dureeH==null?'':x.dureeH<12?'8–12 h':x.dureeH<24?'12–24 h':'24 h et plus',x.aller,x.retour||'',x.manuel?'oui':'']);
    for(const c of a.coupures||[]) arr.push([...id(a),c.lieu||'',d(c.debut),d(c.fin),c.dureeH,ST[c.statut]||c.statut,c.compte?'oui':'non',c.long?'oui':'',c.aller,c.retour||'',c.manuel?'oui':'']);
    for(const c of a.casesVides||[]) vides.push([...id(a),`${JN[c.d]} ${dFull(c.date)}`,c.compte?'oui':'non',c.raison||'',c.avant?`${c.avant.label} (fin ${d(c.avant.end)})`:'',c.apres?`${c.apres.label} (début ${d(c.apres.start)})`:'',c.horsResidence?'oui':'',c.manuel?'oui':'']);
    for(const j of a.jours) if(j.kind==='SERVICE') for(const m of j.missions)
      mis.push([...id(a),`${JN[j.d]} ${dFull(j.date)}`,m.label,m.note||'',missionType(m.label),m.from||'',m.to||'',d(m.start),d(m.end),missionAmp(m,R0),m.pauseMin,missionTTE(m,R0)]);
  }

/* ---------- 15. une carte de la page en image PNG ---------- */
async function nodeToPng(node,scale=2){
  const z=parseFloat(getComputedStyle(node).zoom)||1;   // les diapositives sont affichées réduites : l'image, elle, est en taille réelle
  const w=Math.round(node.getBoundingClientRect().width/z), h=Math.round(node.getBoundingClientRect().height/z), cs=getComputedStyle(document.documentElement);
  const q=v=>String(v).replace(/"/g,"'");   // valeurs placées dans un attribut style="…"
  const vars=[...cs].filter(p=>p.startsWith('--')).map(p=>`${p}:${q(cs.getPropertyValue(p))}`).join(';');
  const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const clone=node.cloneNode(true); clone.querySelectorAll('.pngb,button[data-png]').forEach(b=>b.remove());
  clone.style.margin='0'; clone.style.width=w+'px'; clone.style.zoom='1';
  const html=`<div xmlns="http://www.w3.org/1999/xhtml" style="${vars};background:${getComputedStyle(document.body).backgroundColor};color:${cs.getPropertyValue('--ink')};font-family:${q(getComputedStyle(document.body).fontFamily)};font-size:14px;line-height:1.5;padding:0"><style>${css}
*,*::before,*::after{animation:none!important;transition:none!important}</style>${new XMLSerializer().serializeToString(clone)}</div>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%">${html}</foreignObject></svg>`;
  const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); await img.decode();
  const c=document.createElement('canvas'); c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  const x=c.getContext('2d'); x.fillStyle=getComputedStyle(document.body).backgroundColor; x.fillRect(0,0,c.width,c.height); x.scale(scale,scale); x.drawImage(img,0,0);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}

async function dl(name,data,mime){
  if(backend.mode==='artifact'){
    const d=await window.claude?.use?.('downloads');
    if(!d){ S.msg={m:"Le téléchargement n'est pas disponible dans cette vue.",t:'w'}; render(); return; }
    try{ await d.save({filename:name,data:new Blob([data],{type:mime})}); }
    catch(e){ if(e&&e.code!=='declined'){ S.msg={m:'Export impossible : '+(e.message||e.code),t:'c'}; render(); } }
    return;
  }
  const u=URL.createObjectURL(new Blob([data],{type:mime})), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const scopeTag=()=>{
  const w=S.selWeek==='__all__'?'toutes-semaines':slug(S.selWeek.replace(':','-'));
  const a=S.selAgences&&S.selAgences.length<=2?'-'+S.selAgences.map(x=>slug(x)).join('-'):'';

function exportXlsx(which){
  if(which==='detail'){ dl(`recap-corridor-detail-${scopeTag()}.xlsx`,buildXlsx(detailSheets()),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); return; }
  const t=tables();
  const sheets=(which==='tout'?['synthese','agents','rhr','blanches','historique']:[which]).map(k=>t[k]);
  dl(`recap-corridor-${which}-${scopeTag()}.xlsx`, buildXlsx(sheets),
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function exportCsv(which){
  const t=tables()[which];
  const q=v=>{const s=v==null?'':(typeof v==='number'?String(v).replace('.',','):String(v));
    return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const csv='﻿'+[t.cols.map(c=>q(c.t)).join(';'),...t.rows.map(r=>r.map(q).join(';'))].join('\r\n');
  dl(`recap-corridor-${which}-${scopeTag()}.csv`,csv,'text/csv;charset=utf-8');
}

/** Part des cases jour lues sans anomalie */
function gauge(c){
  if(!c||!c.cellules) return '<span class="gauge mut">Contrôle de lecture non mesuré — réimporter la semaine pour l’obtenir</span>';
  const pc=100*(1-c.illisibles/c.cellules), col=c.illisibles===0?'var(--good)':pc>=99?'var(--signal)':'var(--crit)';
  return `<span class="gauge"><span class="gt"><i style="width:${pc.toFixed(1)}%;background:${col}"></i></span>${nf(pc,pc===100?0:1)} % des cases lues sans anomalie${c.illisibles?` · ${nf(c.illisibles)} à vérifier`:''}</span>`;
}
const anomList=l=>`<details class="qd" style="margin-top:6px"><summary>Voir les ${nf(l.length)} anomalie${l.length>1?'s':''} de lecture</summary>
  <ul>${l.slice(0,300).map(a=>`<li><b>${esc(a.agent)}</b> · ${esc(a.jour)} — ${esc(a.message)}</li>`).join('')}${l.length>300?'<li>…</li>':''}</ul></details>`;
/** Mesure de lecture enregistrée avec la semaine (aucun changement de schéma : elle voyage dans le résumé) */
function controleOf(parsed){
  const cells=new Set(parsed.anomalies.map(a=>a.agent+'|'+a.jour));
  return {cellules:parsed.agents.length*7, illisibles:cells.size, anomalies:parsed.anomalies.slice(0,300)};
}

/* ---------- Coco (copain covoit) : missions de la semaine des agents choisis, une ligne par agent et par jour ---------- */
/** Couleurs Coco (demandé par l'utilisateur) : nuances de rouge pour les AFR, nuances de jaune pour les conducteurs ;
    une nuance par agent, attribuée à la sélection et gardée d'une semaine à l'autre */
const COCO_ROUGES=['#D50000','#FF6F61','#8E0000','#FF1744','#C2185B','#E57373','#B71C1C','#FF8A80','#AD1457','#F4511E'];
const COCO_JAUNES=['#FFD600','#F9A825','#FFEE58','#FFB300','#E6B800','#FFF176','#FF8F00','#FBC02D','#C6A700','#FFCA28'];
const cocoFam=m=>isAFR(m)?COCO_ROUGES:COCO_JAUNES;
/** Couleur de chaque agent choisi : la sienne si elle est de la bonne famille et libre, sinon la première libre de sa famille */
function cocoCouleurs(sel){
  const pris=new Set(), out=[];
  for(const x of sel||[]){ const fam=cocoFam(x.metier), c=fam.includes(x.couleur)&&!pris.has(x.couleur)?x.couleur:(fam.find(k=>!pris.has(k))||fam[out.length%fam.length]);
    pris.add(c); out.push({...x,couleur:c}); }
  return out;
}
const cocoTexte=c=>COCO_JAUNES.includes(c)?'#1a1a1a':'#fff';
/** Missions en gris neutre ; chaque groupe de covoiturage (missions reliées entre elles) prend une même couleur vive (demandé) */
const COCO_PAIRES=['#00B86B','#1E88E5','#8E24AA','#FF6D00','#00ACC1','#D81B60','#43A047','#5E35B1','#F4511E','#3949AB'];
function cocoGroupes(sel,cov){
  const par=new Map(), f=k=>{ while(par.get(k)!==k) k=par.get(k); return k; };
  for(const p of cov.paires){ const a=p.i+'|'+p.k, b=p.j+'|'+p.l; if(!par.has(a)) par.set(a,a); if(!par.has(b)) par.set(b,b); par.set(f(a),f(b)); }
  const racines=[...new Set([...par.keys()].map(f))].sort((x,y)=>{ const d=k=>{ const [i,m]=k.split('|'); return Date.parse(sel[i].missions[m].start); }; return d(x)-d(y); });
  const coul=new Map(racines.map((r,n)=>[r,COCO_PAIRES[n%COCO_PAIRES.length]]));
  return new Map([...par.keys()].map(k=>[k,coul.get(f(k))]));
}
/** Semaine affichée : celle choisie, sinon celle d'aujourd'hui, sinon la dernière importée */
function cocoSemaineParDefaut(){
  const W=S.weeks.slice().sort((a,b)=>a.weekId.localeCompare(b.weekId)), t=isoD(new Date(nowW()));
  return (W.find(w=>w.monday<=t&&t<=w.sunday)||W[W.length-1]||{}).weekId||null;
}
async function loadCoco(){

  try{ const r=await withLoad(api.coco(S.cocoW)); S.cocoData=r; if(r&&Array.isArray(r.agents)&&S.role!=='admin') S.coco={agents:r.agents};
    if(S.role==='admin'&&r&&r.semaine){ const met=new Map(r.semaine.agents.map(a=>[a.pk,a.metier])), cur=S.coco.agents||[];
      const neuf=cocoCouleurs(cur.map(x=>({...x,metier:x.metier||met.get(x.pk)||''})));
      if(neuf.some((x,k)=>x.couleur!==cur[k].couleur||x.metier!==cur[k].metier)){ S.coco={agents:neuf}; api.saveCoco(S.coco).catch(()=>{}); } } }

/** Missions compatibles pour covoiturer : deux agents dont la prise ET la fin de service sont à 30 min près (demandé) */
const COCO_TOL=30*6e4;
function cocoCovoit(agents){
  const res=new Map(); res.paires=[];
  agents.forEach((a,i)=>a.missions.forEach((m,k)=>agents.forEach((b,j)=>{ if(j<=i) return;
    b.missions.forEach((n,l)=>{ if(Math.abs(Date.parse(m.start)-Date.parse(n.start))<=COCO_TOL&&Math.abs(Date.parse(m.end)-Date.parse(n.end))<=COCO_TOL){
      (res.get(i+'|'+k)||res.set(i+'|'+k,[]).get(i+'|'+k)).push(b.nom); (res.get(j+'|'+l)||res.set(j+'|'+l,[]).get(j+'|'+l)).push(a.nom);
      res.paires.push({i,k,j,l}); } }); })));
  return res;
}

    ...Object.entries(c.metierAgent||{}).map(([k,v])=>{const i=k.lastIndexOf('|'), pk=k.slice(0,i);return {t:`Métier corrigé : ${v}`,q:nm(pk),d:perLab(k.slice(i+1)),del:['metierAgent',k]};}),
    ...Object.entries(c.exclus||{}).map(([k,v])=>{const [pk,w]=k.split('|');return {t:`Exclu des chiffres${v.motif?' — '+v.motif:''}`,q:nm(pk),d:w||'toutes les semaines',del:['exclus',k]};}),
    ...Object.keys(c.ignorees||{}).map(k=>{const p=k.split('|'), l=p.pop(), st=p.pop(), pk=p.join('|');return {t:`Mission ignorée : ${l}`,q:nm(pk),d:dtISO(st),del:['ignorees',k]};}),
    ...Object.keys(c.garderHC||{}).map(k=>{const p=k.split('|'), st=p.pop(), pk=p.join('|');return {t:'Mission hors colonne comptée',q:nm(pk),d:dtISO(st),del:['garderHC',k]};}),
    ...Object.entries(c.horaires||{}).map(([k,v])=>{const p=k.split('|'), i=p.findIndex(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)), pk=p.slice(0,i).join('|'), d=p[i], l=p.slice(i+1);return {t:`Horaire saisi : ${l.join('|')} ${v.debut}–${v.fin}`,q:nm(pk),d:dFull(d),del:['horaires',k]};})];
  return `<section class="card"><div class="card-h"><div><h2>Corrections mémorisées</h2>
    <p class="card-s">${nf(rows.length)} correction${rows.length>1?'s':''} — rejouées à chaque affichage, même après un réimport</p></div></div>
    <div class="card-b">${rows.length?`<div class="tw"><table><thead><tr><th class="l">Correction</th><th class="l">Agent</th><th class="l">Quand</th>${admin()?'<th></th>':''}</tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="l">${esc(r.t)}</td><td class="l nm">${esc(r.q)}</td><td class="l mono">${esc(r.d)}</td>${admin()?`<td><button class="btn btn-sm" data-corrdel="${esc(JSON.stringify(r.del))}">Supprimer</button></td>`:''}</tr>`).join('')}
    </tbody></table></div>`:'<p class="mut">Aucune correction. Ouvrez la fiche d’un agent (onglet Agents) pour corriger une coupure ou une case vide, ou lier deux missions.</p>'}</div></section>`;
}

        <div class="rule"><span class="sp"></span><span style="flex:1"><span class="rn">Accord d'entreprise (conformité, onglet Production)</span>

          <div class="tw"><table class="acc-t"><thead><tr><th class="l">Règle</th><th>Conducteurs</th><th>AFR / coordo</th></tr></thead><tbody>
          ${[['tteMax','TTE max par journée (h)'],['tteMaxNuit','TTE max, journée de nuit (h)'],['ampMax','Amplitude max (h)'],['ampMaxNuit','Amplitude max, journée de nuit (h)'],
            ['nuitSeuil','Journée de nuit : plus de … h dans la plage de nuit'],['rj','Repos journalier à résidence (h)'],['rjReduit','Repos journalier réduit, minimum (h)'],['rjApresNuit','Repos après une journée de nuit, minimum (h)'],['rpAn','Repos périodiques par an']]
            .map(([k,l])=>`<tr><td class="l">${l}</td>${['roulant','continuite'].map(c=>`<td><input type="text" data-acc="${c}.${k}" value="${esc(String(ac[c][k]).replace('.',','))}" inputmode="decimal" style="width:70px"></td>`).join('')}</tr>`).join('')}
          ${[['rdAn','Repos doubles par an'],['rdWeAn','dont samedi-dimanche, au minimum'],['rpMois','Repos périodiques par mois'],['gptMax','GPT : jours de suite au maximum'],['gpt6Par4sem','GPT de 6 jours sur 4 semaines, au maximum'],

            .map(([k,l])=>`<tr><td class="l">${l}</td><td colspan="2" class="l"><input type="text" data-acc="${k}" value="${esc(String(ac[k]).replace('.',','))}" inputmode="decimal" style="width:70px"></td></tr>`).join('')}
          </tbody></table></div>

  <section class="card"><div class="card-h"><div><h2>Résidence de chaque agence</h2>

  <section class="card"><div class="card-h"><h2>Comment les chiffres sont calculés</h2></div>
    <div class="card-b prose">
      <p><b>Repos hors résidence.</b> Les missions de chaque agent sont remises dans l'ordre chronologique. Quand une mission se termine ailleurs qu'à la résidence de son agence et que la suivante commence au moins ${nfa(r.rhrMinHours)} h plus tard, cet arrêt compte pour un RHR (repos journalier hors résidence, accord d'entreprise art. 18), de jour comme de nuit — même si les deux missions sont dans la même case${r.rhrCoupeParRepos?'. Un arrêt qui contient un jour de repos ou d’absence n’en est pas un : le repos périodique se prend à résidence (art. 19)':''}. Les lieux sont comparés sans tenir compte des majuscules ni des accents. Un séjour de deux nuits avec un service sur place au milieu compte donc deux coupures. Les AFR sont exclus, et les moyennes RHR ne portent que sur les agents qui en ont eu au moins un.</p>
      <p><b>Journée blanche.</b> Une journée sans mission et sans code, située entre deux services de la semaine. ${r.jbExcludeNightOverlap?"Le lendemain d'un service de nuit terminé au petit matin n'en est pas une":"Le lendemain d'un service de nuit en est une aussi"}${r.jbExcludeHorsResidence?" ; une journée passée hors résidence (pendant un RHR) n'en est pas une":''}. La veille d'une reprise juste après minuit en est une si l'agent est à sa résidence.</p>
      <p><b>Amplitude.</b> De la prise de service à la fin de service, coupures incluses.</p>
      <p><b>TTE (temps de travail effectif) et heures sup.</b> Amplitude moins les pauses « P: » et « P2: » ; une ATCMD compte ${nf(r.heuresATCMD)} h (son amplitude reste l’horaire réel) ; une autre mission de moins de ${nf(r.minMission??5)} h d’amplitude compte ${nf(r.minMission??5)} h d’amplitude et de TTE. Les absences ne comptent aucune heure. Les heures sup sont le TTE au-delà de ${nf(r.seuilHebdo)} h, agent par agent et semaine par semaine.</p>
      <p><b>Heures de nuit.</b> Temps travaillé hors pauses entre ${r.nuitAFR[0]}h et ${r.nuitAFR[1]}h pour les AFR, entre ${r.nuitCDR[0]}h et ${r.nuitCDR[1]}h pour les conducteurs. Heures du dimanche : temps travaillé hors pauses le dimanche. Pour une ATCMD, ces deux compteurs sont ramenés à ses ${nf(r.heuresATCMD)} h, au prorata de l’horaire réel.</p>
      <p><b>Comptages.</b> MHIS, DISPO et ATCMD : toute mission dont l'intitulé contient ces lettres, même combinées à autre chose (« VS+MHIS » compte comme MHIS). DISPO et ATCMD sont comptés séparément. Trajet seul : l’intitulé contient ${esc((r.trajetTypes||[]).join(' ou '))} comme mot à part (VOY-541, 541-VOY, VS 12), jamais collé à un « + » (CSE+VOY, VOY+PREPA : pas un trajet seul).</p>
      <p><b>Paniers repas.</b> Horaire de la mission, pauses comprises : ${nf(r.panierMidi[2])} h en service entre ${h(r.panierMidi[0])} et ${h(r.panierMidi[1])}, ${nf(r.panierSoir[2])} h entre ${h(r.panierSoir[0])} et ${h(r.panierSoir[1])}, ${nf(r.panierNuit[2])} h entre ${h(r.panierNuit[0])} et ${h(r.panierNuit[1])}${r.panierRHR?', ou un RHR qui touche la plage du midi et/ou du soir (un panier par plage)':''}. Un panier au plus par plage et par jour. Le ratio rapporte les paniers aux jours de service travaillés.</p>
      <p><b>Agents en double.</b> Une personne présente sur plusieurs lignes d'un fichier est fusionnée jour par jour : un service l'emporte sur un code, un code sur une case vide. Sur plusieurs semaines, chaque agent n'apparaît qu'une fois dans les tableaux.</p>
      <p><b>Semaine.</b> Identifiée par la date du lundi en ligne 1 du fichier, pas par son nom. Réimporter une semaine déjà présente remplace ses données.</p>
    </div></section>`;
}

/** Les chiffres clés défilent jusqu'à leur valeur à l'arrivée sur un onglet */
function countUp(root){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('[data-count]').forEach(n=>{
    const to=+n.dataset.count; if(!isFinite(to)||to<=0||!Number.isInteger(to)) return;
    const t0=performance.now(), d=650;
    const f=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); n.textContent=nf(Math.round(to*e)); if(k<1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

/** Import : numéros de RP de la semaine déjà lus dans une autre semaine enregistrée (ou deux fois dans le fichier) */
async function rpDejaLus(view){
  const id=view.meta.weekId, y=new Set([view.meta.monday.slice(0,4),view.meta.sunday.slice(0,4)]);
  await ensureLoaded(S.weeks.filter(w=>w.weekId!==id&&(y.has(w.monday.slice(0,4))||y.has(w.sunday.slice(0,4)))).map(w=>w.weekId));
  const m=new Map([...S.loaded.entries()].filter(([k])=>k!==id).map(([k,v])=>[k,{agents:v.agents.map(a=>({...a,jours:(a.jours||[]).map(j=>({...j}))}))}]));
  m.set(id,{agents:view.agents.map(a=>({...a,jours:(a.jours||[]).map(j=>({...j}))}))});
  reconcileRP(new Map([...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]))));
  const out=[];
  for(const [k,v] of m) for(const a of v.agents) for(const j of a.jours) if(j.rpDouble&&(k===id||j.rpDouble.weekId===id)) out.push(`${a.nom} ${a.prenom} : ${j.code} le ${dFull(j.date)}, déjà lu le ${dFull(j.rpDouble.date)}`);
  return out;
}
/** « Relire » : refait la lecture du fichier conservé avec les règles de lecture actuelles (nettoyage, pauses « P: » et Extract),
    et le place dans la file d'import avec l'écart avant / après ; rien n'est enregistré sans « Enregistrer ». */
async function relireSemaines(ids){
  S.err=null; S.msg=null; const sans=[];
  await ensureLoaded(ids);
  for(const id of ids){
    const w=S.weeks.find(x=>x.weekId===id); if(!w) continue;
    S.queue=S.queue.filter(q=>!(q.relecture&&q.parsed&&q.parsed.meta.weekId===id));
    try{
      const {source}=await withLoad(api.source(id));
      if(!source||!source.rows){ sans.push(weekLabel(w)); continue; }
      const net=nettoyerFeuille(source.rows), parsed=parseWeek(net.rows,source.extract||null);
      const view=applyRules(parsed,effRules([...new Set(parsed.agents.map(a=>a.agence))])); view.agents.forEach(a=>a.weekId=id);
      const avant=agg((S.loaded.get(id)?.agents||[]).filter(a=>!a.exclu));
      const pe=view.agents.reduce((s,a)=>s+a.jours.reduce((t,j)=>t+(j.missions||[]).filter(m=>m.pauseExtract).length,0),0);
      S.queue.push({name:w.fileName||weekLabel(w),size:w.taille??null,state:'pret',parsed,view,anom:parsed.anomalies.length,stats:agg(view.agents.filter(a=>!a.exclu)),
        existe:true,retraits:net.retraits,source,relecture:{avant,pausesExtract:pe}});
    }catch(e){ S.queue.push({name:weekLabel(w),state:'erreur',err:`${weekLabel(w)} — ${e.message||e}`}); }
  }
  if(sans.length) S.msg={m:`Fichier non conservé pour ${sans.join(', ')} (importée${sans.length>1?'s':''} avant cette version) : réimportez-${sans.length>1?'les':'la'} une fois, la relecture sera ensuite possible.`,t:'w'};
  S.tab='import'; render();
}
async function handleFiles(list){
  S.err=null; S.msg=null;
  const files=[...list].filter(Boolean);
  if(!files.length) return;
  for(const f of files){
    const q={name:f.name,size:f.size,state:'lecture'}; S.queue.push(q); render();
    if(!/\.xlsx$/i.test(f.name)){ q.state='erreur'; q.err=`${f.name} — seuls les .xlsx sont lus.`; render(); continue; }
    try{
      const {rows:brutes,extract,sheetName}=await readRecapSheet(await f.arrayBuffer());
      const net=nettoyerFeuille(brutes), rows=net.rows;
      const parsed=parseWeek(rows,extract); q.retraits=net.retraits;
      q.source=sourceDe(brutes,extract,parsed,sheetName);
      const view=applyRules(parsed,effRules([...new Set(parsed.agents.map(a=>a.agence))]));
      view.agents.forEach(a=>a.weekId=parsed.meta.weekId);
      q.parsed=parsed; q.view=view; q.anom=parsed.anomalies.length;
      q.stats=agg(view.agents);
      q.existe=S.weeks.some(w=>w.weekId===parsed.meta.weekId);
      // fichier suspect : comparé à la semaine précédente enregistrée (effectif, agences, doublons, lignes vides, date)
      const pm=isoD(new Date(Date.parse(parsed.meta.monday)-7*DAY)), prevW=S.weeks.find(w=>w.monday===pm);
      q.susp=suspicions({nbAgents:parsed.agents.length,agences:[...new Set(parsed.agents.map(a=>a.agence))],fusions:view.meta.fusions,
        vides:parsed.agents.filter(a=>a.jours.every(j=>j.kind==='VIDE')).length,extractDate:parsed.meta.extractDate,monday:parsed.meta.monday},prevW||null);
      q.rpd=await rpDejaLus(view);
      const dup=S.queue.find(o=>o!==q&&o.view&&o.view.meta.weekId===parsed.meta.weekId);
      if(dup){ q.state='erreur'; q.err=`${f.name} — ${weekLabel(parsed.meta)} est déjà dans la liste.`; }
      else q.state='pret';
    }catch(e){ q.state='erreur'; q.err=`${f.name} — ${e.message||e}`; }
    render();
  }
}
/** Fichier conservé avec la semaine (pour « Relire ») : lignes de la feuille lue (sans colonnes vides en fin de ligne)
    et, pour les anciens fichiers, les durées T / U de l'Extract limitées aux jours de la semaine */
function sourceDe(rows,extract,parsed,sheetName){
  const trim=r=>{ const x=(r||[]).slice(0,60); let n=x.length; while(n&&x[n-1]==null) n--; return x.slice(0,n); };
  const jours=new Set(parsed.meta.days), ex={};
  if(extract) for(const [k,v] of Object.entries(extract)) if(jours.has(k.slice(k.lastIndexOf('|')+1))) ex[k]=v;
  return {sheetName:sheetName||'',rows:rows.map(trim),extract:extract?ex:null,lu:new Date().toISOString()};
}
function weekPayload(parsed,view,fileName,size,source){
  const agences=[...new Set(parsed.agents.map(a=>a.agence))].sort();
  const byAgence={};
  for(const [k,list] of groupBy(view.agents,a=>a.agence+'||'+a.metier)){
    const [ag,me]=k.split('||'); byAgence[ag]=byAgence[ag]||{};
    const g=agg(list), o={nbAgents:g.nbAgents};
    for(const f of FIELDS) o[f.k]=g[f.k];
    byAgence[ag][me]=o;
  }
  return {
    resume:{...parsed.meta,agences,byAgence,fileName:fileName||'',taille:size??null,importedAt:new Date().toISOString(),controle:controleOf(parsed),
      metiers:[...new Set(parsed.agents.map(a=>a.metier))].sort()},
    details:[...agences.map(ag=>({weekId:parsed.meta.weekId,agence:ag,agenceSlug:slug(ag),meta:parsed.meta,
      agents:parsed.agents.filter(a=>a.agence===ag)})),
      ...(source?[{weekId:parsed.meta.weekId,agenceSlug:'~source',source}]:[])],
  };
}
async function saveAll(){
  if(S.busy) return;
  S.busy=true; render();
  let n=0;
  for(const q of S.queue){
    if(q.state!=='pret') continue;
    q.state='envoi'; render();
    try{
      const p=weekPayload(q.parsed,q.view,q.name,q.size,q.source);
      await api.saveSemaine(p.resume,p.details);
      const id=q.parsed.meta.weekId;
      S.parsedCache.set(id,{meta:q.parsed.meta,agents:q.parsed.agents});
      const v=applyRules(S.parsedCache.get(id),effRules()); v.agents.forEach(a=>a.weekId=id);
      S.loaded.set(id,v);
      q.state='enregistre'; n++;
    }catch(e){ q.state='erreur'; q.err=`${q.name} — ${e.message||e}`; }
    render();
  }
  S.busy=false;

async function actionComptes(b){
  const v=id=>el(id)?.value||'';
  try{
    if(b.id==='cpGo'){ if(v('cpN')!==v('cpN2')) throw new Error('Les deux nouveaux mots de passe ne correspondent pas.');
      await withLoad(api.post('auth/mdp',{ancien:v('cpA'),nouveau:v('cpN')})); S.msg={m:'Mot de passe changé.'}; render(); return; }
    if(b.dataset.uval!=null){ const email=b.dataset.uval, on=!!b.dataset.v;
      if(!on&&!confirm(`Suspendre le compte ${email} ? La personne est déconnectée et ne peut plus se connecter.`)) return;
      await withLoad(api.userSet({email,valide:on})); S.msg={m:on?`Compte ${email} validé${Object.keys((S.users.utilisateurs.find(u=>u.email===email)||{}).droits||{}).length?'':' — cochez maintenant ses droits'}.`:`Compte ${email} suspendu.`}; }
    if(b.dataset.ureinit!=null){ const email=b.dataset.ureinit;
      const r=await withLoad(api.userSet({email,action:'reinit'})); S.uLien={email,lien:r.lien,envoye:r.envoye,duree:'valable 24 h'}; }
    if(b.dataset.udel!=null){ const email=b.dataset.udel; if(!confirm(`Supprimer définitivement le compte ${email} ?`)) return;
      await withLoad(api.userDel(email)); S.msg={m:`Compte ${email} supprimé.`}; }
    if(b.id==='uiGo'){ const email=v('uiMail').trim(), nom=v('uiNom').trim(), droits={};
      document.querySelectorAll('[data-uinv]').forEach(c=>{ if(c.checked) droits[c.dataset.uinv]=true; });
      if(!email) throw new Error('Indiquez l’e-mail de la personne à inviter.');
      const r=await withLoad(api.userInvite({email,nom,droits})); S.uLien={email,lien:r.lien,envoye:r.envoye,duree:'valable 3 jours'}; }
    await loadUsers();
  }catch(e){ S.msg={m:e.message,t:'c'}; render(); }
}

async function login(code){
  const v=code||el('codeIn')?.value||'';
  if(!v.trim()) return;
  S.busy=true; S.err=null; render();
  api.code=v.trim(); api.jeton='';
  try{
    ouvrir(await withLoad(api.session()));
    savePrefs(); await boot();
  }catch(e){
    S.busy=false; api.code=''; S.role=null;
    S.err=e.status===401?"Code d'accès non reconnu.":('Connexion impossible : '+e.message);
    render();
  }
}
/** Session ouverte (code ou compte) : rôle d'affichage, droits, utilisateur */
function ouvrir(s){ S.role=s.role; S.caps=s.caps||null; S.user=s.user||null; S.busy=false; S.err=null; S.lgInfo=null; }
async function loginMail(){
  const mdp=el('lgMdp')?.value||'';
  if(!S.lgMail||!mdp){ S.err='Indiquez votre e-mail et votre mot de passe.'; render(); return; }
  S.busy=true; S.err=null; S.lgInfo=null; render();
  try{ const r=await withLoad(api.post('auth/login',{email:S.lgMail,mdp}));
    api.jeton=r.jeton; api.code=''; ouvrir(r); savePrefs(); await boot(); }
  catch(e){ S.busy=false; S.err=e.message; render(); }
}
/** Reprise d'une session de compte mémorisée (30 jours) */
async function reprendre(j){
  api.jeton=j; api.code='';
  try{ ouvrir(await withLoad(api.session())); await boot(); }
  catch(e){ S.role=null; S.busy=false;
    if(e.status===401){ api.jeton=''; savePrefs(); S.err='Session expirée : reconnectez-vous.'; } else S.err='Connexion impossible : '+e.message;
    render(); }
}

  if(S.role==='aucun'){ S.tab='compte'; render(); return; }
  if(!TABS.some(t=>t.k===S.tab&&tabVisible(t))) S.tab=S.role==='admin'?'synthese':S.role==='covoit'?'coco':'vitrine';

    const et=await withLoad(api.etat()), {weeks,regles,suivi,journal,coco}=et; S.sig=sigEtat(et);
    S.coco=coco&&Array.isArray(coco.agents)?coco:{agents:[]};

    if(S.role==='admin'&&backend.mode==='web') cacheSem.nettoyer().catch(()=>{});   // semaines supprimées : retirées du cache local
    S.rules=loadRules(regles);
    const p=prefs();
    if(p.selAgences) S.selAgences=p.selAgences.filter(a=>allAgences().includes(a));
    if(S.selAgences&&!S.selAgences.length) S.selAgences=null;
    if(p.selMetiers) S.selMetiers=p.selMetiers.filter(m=>allMetiers().includes(m));
    if(S.selMetiers&&!S.selMetiers.length) S.selMetiers=null;

    if(S.selAgences&&S.selAgences.length===2&&S.selAgences.includes('Hendaye')&&S.selAgences.includes('Bordeaux-St-Jean')&&!p.agDefHE){ S.selAgences=['Hendaye']; S.agDefHE=true; savePrefs(); }
    if(!S.selAgences){ const pr=['Hendaye'].filter(a=>allAgences().includes(a)); if(pr.length) S.selAgences=pr; }
    if(S.weeks.length&&S.selWeek==='__all__') S.selWeek=S.weeks[0].weekId;
    S.mentions=await api.mentions().catch(()=>({}))||{}; S.mnDraft=null;
    if(backend.mode==='web'&&peut('admin')) api.users().then(u=>{ S.users=u; renderTabs(); }).catch(()=>{});   // compteur : inscriptions à valider, mots de passe oubliés
    if(S.tab==='compte'){ render(); if(S.role==='admin') await ensureLoaded(toLoad()); }
    else if(S.tab==='utilisateurs'){ render(); await loadUsers(); }
    else if(S.role==='covoit'){ S.tab='coco'; render(); await loadCoco(); }
    else if(S.role==='mixte'&&S.tab==='coco'){ render(); await loadCoco(); }
    else if(S.role!=='admin'){ if(!['lecture','mentions'].includes(S.tab)) S.tab='vitrine'; render(); await loadVitrine(true); }
    else if(S.tab==='coco'){ render(); await loadCoco(); }
    else if(S.tab==='planif'){ await ensureLoaded(toLoad()); render(); await loadPlanif(); }
    else if(S.tab==='mentions'){ S.tab='reglages'; await ensureLoaded(toLoad()); }
    else if(S.tab==='vitrine'){ render(); await loadVitrine(true); }
    else await ensureLoaded(toLoad());
  }catch(e){ S.msg={m:'Chargement impossible : '+e.message,t:'c'}; }
  render();
}
/* Actualisation automatique (demandée par l'utilisateur) : pas de tâche sur le serveur, la page ouverte vérifie
   toutes les 2 minutes si une semaine a été importée / supprimée ou si un réglage a changé, et recharge alors les chiffres.
   Rien n'est fait si l'onglet est caché, pendant une saisie, un import ou dans Réglages / Import (saisies non enregistrées).
   Chaque minute, la vue Coco et la Synthèse sont redessinées (pastille « en service », trait « maintenant »). */
const sigEtat=d=>JSON.stringify([d.weeks||[],d.regles||null,d.coco||null]);
const saisieEnCours=()=>{ const a=document.activeElement; return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||!!S.mnDraft; };
let rafEnCours=false;
async function rafraichir(){
  if(rafEnCours||document.hidden||!S.role||S.busy||S.queue.length||saisieEnCours()) return;
  if(S.role==='admin'&&['reglages','import','planif'].includes(S.tab)||['compte','utilisateurs'].includes(S.tab)||S.role==='aucun') return;
  rafEnCours=true;
  try{
    if(S.role==='covoit'||S.role==='mixte'&&S.tab==='coco'){ const r=await api.coco(S.cocoW); if(JSON.stringify(r)!==JSON.stringify(S.cocoData)&&!saisieEnCours()){ S.cocoData=r; if(r&&Array.isArray(r.agents)) S.coco={agents:r.agents}; render(); } return; }
    const et=await api.etat(), sig=sigEtat(et);
    if(sig===S.sig||saisieEnCours()||S.busy||S.queue.length) return;
    S.sig=sig; S.weeks=et.weeks||[]; if(S.role==='admin'&&backend.mode==='web') cacheSem.nettoyer().catch(()=>{});
    if(S.role!=='admin'){ S.vit=null; await loadVitrine(true); render(); return; }
    S.rules=loadRules(et.regles); S.suivi=et.suivi||{alertes:{}}; S.journal=et.journal||[]; S.coco=et.coco&&Array.isArray(et.coco.agents)?et.coco:{agents:[]};
    S.loaded=new Map(); S.parsedCache=new Map(); S.vit=null;
    if(S.tab==='coco') await loadCoco(); else if(S.tab==='vitrine') await loadVitrine(true); else await ensureLoaded(toLoad());
    S.msg={m:'Données mises à jour automatiquement (nouvelle semaine ou réglage modifié).'}; render();
    setTimeout(()=>{ if(S.msg&&/automatiquement/.test(S.msg.m)){ S.msg=null; render(); } },6000);
  }catch(e){ /* réseau coupé ou serveur en veille : on réessaiera au prochain passage */ }
  finally{ rafEnCours=false; }
}
setInterval(rafraichir,120000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) rafraichir(); });
setInterval(()=>{ if(!document.hidden&&S.role&&['coco','synthese'].includes(S.tab)&&!saisieEnCours()&&!S.busy&&!document.querySelector('[data-tip]:hover')) render(); },60000);
(async function start(){
  const p=prefs();
  const qs=new URLSearchParams(location.search).get('semaine');
  if(qs&&/^\d{4}-S\d{2}$/.test(qs)){ S.vf.w=qs; p.tab='vitrine'; }
  if(p.theme) document.documentElement.dataset.theme=p.theme;
  if(p.mini) el('shell').classList.add('mini');
  if(p.cols) S.cols={...S.cols,...p.cols};
  if(p.chart) S.chart={...S.chart,...p.chart};
  if(p.st) S.st={...S.st,...p.st};
  if(p.auteur) S.auteur=p.auteur;
  if(p.mode) S.mode=p.mode;
  if(p.tab) S.tab=p.tab;
  render();
  await backend.detect();
  if(backend.mode==='artifact'){
    document.getElementById('btnOut')?.remove();
    S.role='admin'; await boot(); return;
  }
  const rj=new URLSearchParams(location.search).get('reinit');   // lien « mot de passe oublié » / invitation reçu par e-mail
  if(rj&&/^[A-Za-z0-9_-]{30,100}$/.test(rj)){ S.reinit=rj; S.lg='reinit'; render(); return; }
  try{ const pg=await (await fetch(backend.url('ping'))).json(); S.codesOff=pg&&pg.codes===false; S.mailOn=!!(pg&&pg.mail); }catch(e){}   // codes d'accès retirés du principal
  if(S.codesOff&&p.code){ try{ const q=prefs(); delete q.code; localStorage.setItem(LSK,JSON.stringify(q)); }catch(e){} }
  if(p.jeton) reprendre(p.jeton); else if(p.code&&!S.codesOff) login(p.code); else render();
})();
