<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Extraction hebdomadaire des fichiers Récap National Corridor : repos hors résidence, journées blanches, heures, paniers et données par agent, métier et agence.">
<title>Récap Corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23175E82'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round'%3E%3Crect x='8' y='6' width='16' height='15' rx='4'/%3E%3Cpath d='M8 14h16M12 25l-2 2M20 25l2 2M11 21v2M21 21v2'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --ground:#EBEEF2; --surface:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#EAEEF3;
  --line:#D5DCE5; --line-2:#BAC5D2;
  --ink:#0E1620; --ink-2:#46546A; --ink-3:#74859A;
  --accent:#175E82; --accent-2:#0E4460; --accent-soft:#E0EDF4; --accent-line:#A3C9DD;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#1B7A4B; --good-soft:#E1F1E8;
  --warn:#9C6209; --warn-soft:#FBEEDA; --warn-line:#E0AE5F;
  --crit:#A8231C; --crit-soft:#FBE6E4;
  --shadow:0 1px 2px rgba(16,32,48,.07), 0 4px 14px rgba(16,32,48,.05);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F141A; --surface:#19202A; --surface-2:#202834; --surface-3:#28323F;
  --line:#2D3846; --line-2:#3D4B5C;
  --ink:#E9EEF4; --ink-2:#A4B3C4; --ink-3:#74859A;
  --accent:#6FB6D9; --accent-2:#9AD0EA; --accent-soft:#12303E; --accent-line:#27546C;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#5FC48D; --good-soft:#12301F;
  --warn:#E0A53E; --warn-soft:#31240F; --warn-line:#66491A;
  --crit:#F08A83; --crit-soft:#381513;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 4px 16px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0F141A; --surface:#19202A; --surface-2:#202834; --surface-3:#28323F;
  --line:#2D3846; --line-2:#3D4B5C;
  --ink:#E9EEF4; --ink-2:#A4B3C4; --ink-3:#74859A;
  --accent:#6FB6D9; --accent-2:#9AD0EA; --accent-soft:#12303E; --accent-line:#27546C;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#5FC48D; --good-soft:#12301F;
  --warn:#E0A53E; --warn-soft:#31240F; --warn-line:#66491A;
  --crit:#F08A83; --crit-soft:#381513;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 4px 16px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{padding:0;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sm{font-size:12.5px}.mut{color:var(--ink-3)}.mt{margin-top:12px}.mb{margin-bottom:13px}
.nb{font-weight:400}.z{color:var(--ink-3);opacity:.5}
.mono{font-family:var(--mono);font-size:12px}

/* shell */
.app{max-width:1560px;margin:0 auto;padding:0 18px 60px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ground);
  margin:0 -18px;padding:14px 18px 0;border-bottom:1px solid var(--line)}
.hdr-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:33px;height:33px;border-radius:8px;background:var(--accent);flex:none;display:grid;place-items:center}
.mark svg{width:20px;height:20px;display:block}
.brand h1{font-size:17px;letter-spacing:-.012em;line-height:1.15}
.brand p{margin-top:1px;font-size:11.5px;color:var(--ink-3);font-family:var(--cond);letter-spacing:.02em}
.hdr-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-pri{color:#0B1219}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-pri{color:#0B1219}}
.btn-pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dgr{border-color:var(--crit);color:var(--crit)}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* filtres */
.fbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;padding:12px 0 11px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.grow{flex:1}
.flabel{font-family:var(--cond);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
select,input[type=text],input[type=search],input[type=password]{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;max-width:100%}
input[type=search]{width:180px}
.sel{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:6px 10px;font-size:13px;
  display:inline-flex;align-items:center;gap:8px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel .car{color:var(--ink-3);font-size:10px}
.sel[aria-expanded=true]{border-color:var(--accent);color:var(--accent)}
.badge{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  background:var(--surface-3);color:var(--ink-2);border-radius:999px;padding:5px 11px}
.scope{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:12px;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sgrp{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;
  font-weight:500;color:var(--ink-2);transition:all .12s;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip:hover{border-color:var(--ink-3)}
.chip-mini{font-size:11px;padding:2px 9px}
.chipset{display:flex;gap:4px;flex-wrap:wrap}

/* onglets */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 13px 10px;font-size:13.5px;font-weight:500;color:var(--ink-2);
  border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--ink)}
.tab .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px}

/* cartes */
.stack{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:14px 17px 0}
.card-h h2{font-size:14.5px;letter-spacing:-.005em}
.card-s{font-size:12px;color:var(--ink-3);margin-top:2px}
.card-b{padding:12px 17px 17px}
.prose{max-width:76ch}
.prose p{margin-bottom:11px}.prose p:last-child{margin-bottom:0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:820px){.cols2{grid-template-columns:1fr}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:13px 15px 14px;min-width:0}
.kpi .k{font-family:var(--cond);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.028em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:3px}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.kpi .n{font-size:11.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.hot .v{color:var(--warn)}

/* tableaux */
.tw{overflow:auto;border-radius:8px;border:1px solid var(--line)}
.tw.tall{max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums;background:var(--surface)}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--cond);font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  background:var(--surface-2);position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line-2)}
tr.grp th{top:0;z-index:4;background:var(--surface-3);color:var(--ink-2);border-right:1px solid var(--line);
  font-size:10px;letter-spacing:.1em;padding-block:4px}
table.sticky1 thead tr:nth-child(2) th{top:23px}
table.sticky1 thead tr:only-child th{top:0}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--ink)}
th.s[data-dir]{color:var(--accent)}
th.s[data-dir]::after{content:"▾";margin-left:3px;font-size:9px}
th.s[data-dir=asc]::after{content:"▴"}
td.l,th.l{text-align:left}
th.st,td.st{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
th.st{z-index:5;background:var(--surface-2)}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tbody tr:nth-child(even) td.st{background:var(--surface-2)}
tbody tr:hover td,tbody tr:hover td.st{background:var(--accent-soft)}
tbody tr.clk{cursor:pointer}
.tot td{font-weight:600;background:var(--surface-3)!important;border-top:1px solid var(--line-2)}
.nm{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;font-family:var(--cond);letter-spacing:.03em}
.pill-w{background:var(--warn-soft);color:var(--warn)}
.pill-c{background:var(--crit-soft);color:var(--crit)}
.pill-g{background:var(--good-soft);color:var(--good)}
.pill-a{background:var(--accent-soft);color:var(--accent)}
.pill-n{background:var(--surface-3);color:var(--ink-2)}

/* bande semaine */
.band{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.bd{border:1px solid var(--line);border-radius:6px;padding:5px 7px 7px;min-height:66px;background:var(--surface-2);overflow:hidden}
.bd .dn{font-family:var(--cond);font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  display:flex;justify-content:space-between;gap:4px}
.bd .ml{font-family:var(--mono);font-size:10.5px;line-height:1.3;margin-top:3px;word-break:break-word}
.bd .od{font-size:10.5px;color:var(--ink-2);font-family:var(--cond);letter-spacing:.02em}
.bd .od.mt{margin-top:6px}
.bd .hr{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.bd .sep{border-top:1px solid var(--accent-line);margin:4px 0}
.bd-svc{background:var(--accent-soft);border-color:var(--accent-line)}
.bd-code .cd{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:6px;font-weight:500}
.bd-vide{background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--surface-3) 5px,var(--surface-3) 10px)}
.bd-blanche{background:var(--surface);border:1.5px dashed var(--warn-line)}
.bd-blanche .cd{color:var(--warn);font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.03em;margin-top:6px}
.bd-hors{box-shadow:inset 0 -3px 0 var(--warn)}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);padding-top:11px}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;border-radius:3px;border:1px solid var(--line-2);flex:none}
.sw-svc{background:var(--accent-soft);border-color:var(--accent-line)}
.sw-code{background:var(--surface-2)}
.sw-bl{background:var(--surface);border:1.5px dashed var(--warn-line)}
.sw-hr{background:var(--surface);box-shadow:inset 0 -3px 0 var(--warn)}

/* graphiques */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.chart{max-width:720px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ct{font-family:var(--cond);font-size:11px;fill:var(--ink-3);letter-spacing:.04em}
.cv{font-family:var(--mono);font-size:11px;fill:var(--ink-3)}
.cvb{font-family:var(--mono);font-size:11px;fill:var(--ink);font-weight:600}
.grid-l{stroke:var(--line);stroke-width:1}
.axis-l{stroke:var(--line-2);stroke-width:1}
.hovz{fill:transparent;cursor:crosshair}
.clg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding-top:10px}
.cdot{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none;margin-right:5px}
.ch{font-size:13px;font-family:var(--cond);letter-spacing:.03em;color:var(--ink-2);margin:4px 0 11px;font-weight:600}
.ctrls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding-bottom:14px;margin-bottom:13px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.sg{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;color:var(--ink-2)}
.sg[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(86px,1.2fr) 3fr auto;gap:11px;align-items:center;font-size:12.5px;cursor:default}
.bar:hover .bt{outline:1px solid var(--line-2)}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bt{background:var(--surface-3);border-radius:3px;height:15px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:3px;min-width:2px}
.bv{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;min-width:30px}
.tip{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;
  box-shadow:var(--shadow);padding:8px 11px;font-size:12px;pointer-events:none;max-width:280px;color:var(--ink)}
.tip .tr{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums;margin-top:3px}

/* import / listes */
.drop{border:2px dashed var(--line-2);border-radius:10px;padding:34px 20px;text-align:center;background:var(--surface-2);transition:all .15s}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop h3{font-size:15px;margin-bottom:5px}
.drop p{color:var(--ink-3);font-size:12.5px}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;
  padding:10px 14px;font-size:12.5px;color:var(--ink-2)}
.note.w{border-left-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.note.c{border-left-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.note b{color:var(--ink)}
.note.w b,.note.c b{color:inherit}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 13px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;flex-wrap:wrap}
.row .rl{min-width:0;flex:1}
.row .rt{font-weight:600;font-size:13.5px}
.row .rs{font-size:12px;color:var(--ink-3);margin-top:1px}
.ract{display:flex;gap:6px;flex-wrap:wrap}
.rules-l{display:flex;flex-direction:column;gap:10px}
.rule{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.rule input[type=checkbox]{margin:3px 0 0;flex:none;width:15px;height:15px;accent-color:var(--accent)}
.rule .sp{width:15px;flex:none}
.rule .rn{font-weight:600;font-size:13px;display:block}
.rule .rd{font-size:12.5px;color:var(--ink-2);margin-top:2px;display:block}
.rule .inl{display:inline-flex;gap:7px;align-items:center;margin-top:8px}
.rule .inl input{width:70px}
.sm-i{width:110px}
.empty{text-align:center;padding:54px 20px;color:var(--ink-3)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:7px}
.empty p{margin:0 auto;max-width:48ch;font-size:13px}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:8px}

/* tiroir */
.ov{position:fixed;inset:0;background:rgba(8,16,24,.5);z-index:60;display:flex;justify-content:flex-end}
.dw{background:var(--ground);width:min(780px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.22);
  padding:0 18px 44px;display:flex;flex-direction:column;gap:14px}
.dw-h{position:sticky;top:0;background:var(--ground);padding:17px 0 12px;border-bottom:1px solid var(--line);z-index:2;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dw-h h2{font-size:17px;letter-spacing:-.01em}
.dw-h .s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.x{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;width:29px;height:29px;flex:none;font-size:17px;line-height:1;display:grid;place-items:center}
.ml2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--surface);
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ml2>div{padding:9px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ml2 .v small{font-size:11.5px;font-weight:500}
.dw>*{flex-shrink:0}
.bd .hc{margin-top:5px;padding-top:4px;border-top:1px dashed var(--warn-line);font-size:10px;color:var(--ink-3);line-height:1.35;word-break:break-word}
.bd .hc s{font-family:var(--mono)}
.card-h .btns{align-items:center}
.rule .inl+.inl{margin-left:18px}

<script>
const MARK=`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14M9 20l-2 2M15 20l2 2M8.5 16v2M15.5 16v2"/><circle cx="8.6" cy="13" r=".9" fill="#fff" stroke="none"/><circle cx="15.4" cy="13" r=".9" fill="#fff" stroke="none"/></svg>`;

<script>
/* ==========================================================================
   1. LECTURE DU FICHIER .XLSX  (ZIP + XML, sans dépendance externe)
   Seules les parties utiles du classeur sont décompressées : les fichiers
   lourds (images, autres feuilles) ne ralentissent plus la lecture.
   ========================================================================== */
async function inflateRaw(bytes){
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function readZip(ab){
  const by=new Uint8Array(ab), dv=new DataView(ab);
  let eo=-1; const max=Math.min(by.length,66000);
  for(let i=by.length-22;i>=by.length-max&&i>=0;i--) if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0) throw new Error("Ce fichier n'est pas un classeur Excel (.xlsx) lisible.");
  let n=dv.getUint16(eo+10,true), cd=dv.getUint32(eo+16,true);
  if(cd===0xffffffff||n===0xffff){
    for(let i=eo-20;i>=0;i--) if(dv.getUint32(i,true)===0x07064b50){
      const z=Number(dv.getBigUint64(i+8,true));
      if(dv.getUint32(z,true)===0x06064b50){n=Number(dv.getBigUint64(z+32,true));cd=Number(dv.getBigUint64(z+48,true));}
      break;}
  }
  const dec=new TextDecoder('utf-8'), ent=[]; let p=cd;
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true); let cs=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    let off=dv.getUint32(p+42,true);
    const name=dec.decode(by.subarray(p+46,p+46+nl));
    if(cs===0xffffffff||off===0xffffffff){
      let e=p+46+nl; const end=e+xl;
      while(e<end){ const hid=dv.getUint16(e,true), hs=dv.getUint16(e+2,true);
        if(hid===1){ let q=e+4;
          if(dv.getUint32(p+24,true)===0xffffffff) q+=8;
          if(cs===0xffffffff){cs=Number(dv.getBigUint64(q,true));q+=8;}
          if(off===0xffffffff){off=Number(dv.getBigUint64(q,true));}
          break;}
        e+=4+hs;}
    }
    ent.push({name,method,cs,off}); p+=46+nl+xl+cl;
  }
  const out=new Map();
  for(const e of ent){
    const nl=dv.getUint16(e.off+26,true), xl=dv.getUint16(e.off+28,true);
    const st=e.off+30+nl+xl;
    out.set(e.name,{method:e.method,raw:by.subarray(st,st+e.cs)});
  }
  return {
    has:k=>out.has(k),
    async text(k){ const e=out.get(k); if(!e) return null;
      return dec.decode(e.method===0?e.raw:await inflateRaw(e.raw)); },
  };
}
const ENT={lt:'<',gt:'>',amp:'&',quot:'"',apos:"'"};
const unesc=s=>s.replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d))
  .replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCharCode(parseInt(h,16)))
  .replace(/&(lt|gt|amp|quot|apos);/g,(_,e)=>ENT[e]);
const normTxt=s=>s.replace(/_x000D_/g,'').replace(/_x000A_/g,'\n').replace(/\r\n?/g,'\n');
function colIdx(r){const m=/^([A-Z]+)/.exec(r);if(!m)return 0;let n=0;for(const c of m[1])n=n*26+(c.charCodeAt(0)-64);return n-1;}
function parseSS(x){const o=[];for(const m of x.matchAll(/<si(?:\s[^>]*)?>([\s\S]*?)<\/si>/g)){let t='';for(const q of m[1].matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g))t+=unesc(q[1]);o.push(normTxt(t));}return o;}
/** Lecture ligne par ligne, bornée aux 60 premières colonnes (les jours sont bien avant) */
function parseSheet(x,ss,maxCols=60){
  const rows=[];
  const reRow=/<row\b([^>]*)>([\s\S]*?)<\/row>|<row\b([^>]*)\/>/g;
  const reCell=/<c\b([^>]*?)\/>|<c\b([^>]*)>([\s\S]*?)<\/c>/g;
  let r;
  while((r=reRow.exec(x))){
    const attrs=r[1]||r[3]||'';
    const rm=/\br="(\d+)"/.exec(attrs);
    const ri=rm?+rm[1]-1:rows.length, cells=[], body=r[2]||'';
    reCell.lastIndex=0; let c;
    while((c=reCell.exec(body))){
      const at=c[1]||c[2]||'', bd=c[3]||'';
      const cm=/\br="([A-Z]+)\d+"/.exec(at), tm=/\bt="([^"]+)"/.exec(at);
      const ix=cm?colIdx(cm[1]):cells.length;
      if(ix>=maxCols) continue;
      const ty=tm?tm[1]:'n';
      let v=null;
      if(ty==='inlineStr'){let t='';for(const q of bd.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g))t+=unesc(q[1]);v=normTxt(t);}
      else{const vm=/<v[^>]*>([\s\S]*?)<\/v>/.exec(bd);
        if(vm){const raw=unesc(vm[1]);
          v = ty==='s' ? (ss[+raw]??'') : (ty==='str'||ty==='e') ? normTxt(raw) : (raw===''?null:Number(raw));}}
      cells[ix]=(typeof v==='string'&&v.trim()==='')?null:v;
    }
    rows[ri]=cells;
  }
  for(let i=0;i<rows.length;i++) if(!rows[i]) rows[i]=[];
  return rows;
}
const serialDate=n=>{ if(typeof n!=='number'||!isFinite(n))return null;
  const d=new Date(Math.round((n-25569)*864e5));
  return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); };
const deacc=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'');

async function readRecapSheet(ab){
  const zip=await readZip(ab);
  const wb=await zip.text('xl/workbook.xml');
  if(!wb) throw new Error("Classeur Excel (.xlsx) attendu — le fichier ne contient pas de feuille.");
  const rels=(await zip.text('xl/_rels/workbook.xml.rels'))||'', rm={};
  for(const m of rels.matchAll(/<Relationship\b([^>]*)\/?>/g)){
    const id=/\bId="([^"]+)"/.exec(m[1])?.[1], tg=/\bTarget="([^"]+)"/.exec(m[1])?.[1];
    if(id&&tg) rm[id]=tg.replace(/^\/?xl\//,'').replace(/^\//,'');
  }
  const sheets=[];
  for(const m of wb.matchAll(/<sheet\b([^>]*)\/?>/g))
    sheets.push({name:unesc(/\bname="([^"]*)"/.exec(m[1])?.[1]??''), path:rm[/\br:id="([^"]+)"/.exec(m[1])?.[1]]});
  const tgt=sheets.find(s=>deacc(s.name).toLowerCase().trim().startsWith('recap'))||sheets[0];
  if(!tgt) throw new Error("Aucune feuille trouvée dans le classeur.");
  const ss=zip.has('xl/sharedStrings.xml')?parseSS(await zip.text('xl/sharedStrings.xml')):[];
  const sx=(await zip.text('xl/'+tgt.path))||(await zip.text(tgt.path));
  if(!sx) throw new Error(`La feuille « ${tgt.name} » est introuvable dans le fichier.`);
  return {sheetName:tgt.name, rows:parseSheet(sx,ss)};
}

/* ==========================================================================
   2. LECTURE MÉTIER — indépendante des règles de calcul
   ========================================================================== */
const JN=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const JS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const CODEF=[
  {k:'RP',t:c=>/^RP(-|\b)/i.test(c)}, {k:'CP',t:c=>/^CP$/i.test(c)}, {k:'CPAT',t:c=>/^CPAT/i.test(c)},
  {k:'RCL',t:c=>/^RCL/i.test(c)}, {k:'RCC',t:c=>/^RCC/i.test(c)}, {k:'MAL',t:c=>/^MAL/i.test(c)},
];
const CODEL={RP:'Repos périodique',CP:'Congé payé',CPAT:'Congé CPAT',RCL:'RCL',RCC:'RCC',MAL:'Maladie',AUTRE:'Autre code',HORS:'Mission datée hors de sa colonne'};
const codeFam=c=>{const s=String(c).trim();for(const f of CODEF)if(f.t(s))return f.k;return 'AUTRE';};
const RE_P=/^P(\d?)\s*:/i;
const RE_H=/^(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*-\s*(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*$/;
const RE_PF=/^P\d?\s*:\s*(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*-\s*(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*$/i;
const H=36e5, DAY=864e5;
function resolveDay(d,mon){for(let o=-2;o<=9;o++){const x=new Date(mon.getTime()+o*864e5);if(x.getUTCDate()===d)return x;}return null;}
function mk(d,h,mi,mon){const x=resolveDay(d,mon);return x?new Date(x.getTime()+h*H+mi*6e4):null;}
const r2=n=>Math.round(n*100)/100;
function missionType(l){const s=String(l).trim();const m=/^(.*?)[-_]\s*\d{2,4}\b/.exec(s);return ((m?m[1]:s).trim().replace(/\s+/g,' '))||s;}

/** Une cellule jour -> {kind:'VIDE'|'CODE'|'SERVICE'}
    Les pauses « P: » sont conservées avec leurs horaires : les heures de nuit,
    du dimanche et les paniers se calculent sur le temps réellement travaillé. */
function parseDayCell(raw,mon){
  if(raw==null) return {kind:'VIDE'};
  const t=normTxt(String(raw)).trim();
  if(!t) return {kind:'VIDE'};
  if(!t.includes('\n')) return {kind:'CODE',code:t,family:codeFam(t)};
  const lines=t.split('\n').map(x=>x.trim()).filter(Boolean);
  const ms=[]; let cur=null; const anom=[];
  for(const line of lines){
    if(RE_P.test(line)){
      if(!cur) continue;
      const m=RE_PF.exec(line);
      if(m){const s=mk(+m[1],+m[2],+m[3],mon); let e=mk(+m[4],+m[5],+m[6],mon);
        if(s&&e){ if(e<s)e=new Date(e.getTime()+864e5); cur.pauses.push([s,e]); }}
      continue;
    }
    const h=RE_H.exec(line);
    if(h&&cur){
      const s=mk(+h[1],+h[2],+h[3],mon); let e=mk(+h[4],+h[5],+h[6],mon);
      if(s&&e){ if(e<s)e=new Date(e.getTime()+864e5); cur.start=s; cur.end=e; }
      else anom.push(`horaire illisible « ${line} »`);
      continue;
    }
    if(cur&&!cur.od&&/ - /.test(line)){
      const i=line.indexOf(' - '); cur.od=true; cur.from=line.slice(0,i).trim(); cur.to=line.slice(i+3).trim(); continue;
    }
    cur={label:line,from:null,to:null,od:false,start:null,end:null,pauses:[]}; ms.push(cur);
  }
  for(const m of ms) if(!m.start||!m.end) anom.push(`mission sans horaire « ${m.label} »`);
  const ok=ms.filter(m=>m.start&&m.end).sort((a,b)=>a.start-b.start);
  if(!ok.length) return {kind:'CODE',code:lines[0],family:'AUTRE',anom};
  return {kind:'SERVICE', anom, missions: ok.map(m=>{
    const amp=(m.end-m.start)/H;
    const ps=m.pauses.map(([s,e])=>[new Date(Math.max(s,m.start)),new Date(Math.min(e,m.end))]).filter(([s,e])=>e>s);
    const pm=Math.round(ps.reduce((acc,[s,e])=>acc+(e-s),0)/6e4);
    return {label:m.label,type:missionType(m.label),from:m.from,to:m.to,
      start:m.start.toISOString(),end:m.end.toISOString(),
      amplitude:r2(amp),pauseMin:pm,travail:r2(amp-pm/60),nbPauses:ps.length,
      pauses:ps.map(([s,e])=>[s.toISOString(),e.toISOString()])};
  })};
}
function isoWeek(dt){
  const d=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()));
  d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+3);
  const ft=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  ft.setUTCDate(ft.getUTCDate()-((ft.getUTCDay()+6)%7)+3);
  return {year:d.getUTCFullYear(), week:1+Math.round((d-ft)/(7*864e5))};
}
const isoD=d=>d.toISOString().slice(0,10);
const slug=s=>deacc(s).replace(/[^A-Za-z0-9._~:@+-]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()||'x';

/** Feuille Récap -> structure de semaine brute (sans règles) */
function parseWeek(rows){
  if(!rows.length) throw new Error('Feuille vide.');
  const r1=rows[0]||[], r2r=rows[1]||[];
  const hd=r2r.map(c=>c?deacc(String(c)).toLowerCase().trim():'');
  const fc=(...n)=>{for(const x of n){const i=hd.indexOf(x);if(i>=0)return i;}return -1;};
  let cMat=fc('matricule'), cNom=fc('nom'), cPre=fc('prenom'), cCor=fc('corridor'),
      cAge=fc('agence'), cMet=fc('metier'), cLun=fc('lundi');
  if(cMat<0||cNom<0||cLun<0)
    throw new Error("En-têtes introuvables en ligne 2. Attendu : Matricule, Nom, Prénom, Corridor, Agence, Metier, puis Lundi…Dimanche.");
  if(cPre<0)cPre=cNom+1; if(cCor<0)cCor=cNom+2; if(cAge<0)cAge=cNom+3; if(cMet<0)cMet=cNom+4;

  let mon=serialDate(r1[cLun]);
  if(!mon) for(let i=cLun;i<cLun+7;i++){const d=serialDate(r1[i]); if(d){mon=new Date(d.getTime()-(i-cLun)*864e5);break;}}
  if(!mon) throw new Error("Date du lundi introuvable en ligne 1 (cellule juste au-dessus de « Lundi »).");
  const ex=serialDate(r1[2])||serialDate(r1[1])||null;
  const days=Array.from({length:7},(_,i)=>new Date(mon.getTime()+i*864e5));
  const {year,week}=isoWeek(mon);

  const anomalies=[], agents=[];
  for(let i=2;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.length) continue;
    const mat=r[cMat], nom=r[cNom];
    if((mat==null)&&(nom==null)) continue;
    if(!nom&&!mat) continue;
    const jours=[];
    for(let d=0;d<7;d++){
      const c=parseDayCell(r[cLun+d],mon);
      (c.anom||[]).forEach(a=>anomalies.push({agent:`${nom??''} ${r[cPre]??''}`.trim(),jour:JN[d],message:a}));
      delete c.anom; jours.push(c);
    }
    agents.push({
      matricule: mat==null?'':String(mat).trim(),
      nom:String(nom??'').trim(), prenom:String(r[cPre]??'').trim(),
      corridor:String(r[cCor]??'').trim(),
      agence:String(r[cAge]??'').trim()||'(sans agence)',
      metier:String(r[cMet]??'').trim().toUpperCase()||'(SANS MÉTIER)',
      jours
    });
  }
  if(!agents.length) throw new Error("Aucune ligne d'agent trouvée sous les en-têtes.");
  return {
    meta:{format:2, weekId:`${year}-S${String(week).padStart(2,'0')}`, year, week,
      monday:isoD(mon), sunday:isoD(days[6]), days:days.map(isoD),
      extractDate:ex?isoD(ex):null, nbAgents:agents.length,
      corridors:[...new Set(agents.map(a=>a.corridor).filter(Boolean))]},
    agents, anomalies};
}

/* ==========================================================================
   3. RÈGLES DE CALCUL — rejouées à chaque affichage
   ========================================================================== */
const DEFAULT_RULES={
  rhrMetiers:['CONDUCTEUR'],
  rhrMinHours:0,
  rhrCountPending:true,
  jbExcludeNightOverlap:true,
  jbRequireFramed:true,
  residences:{},
  seuilHebdo:35,              // heures sup au-delà, par agent et par semaine
  heuresATCMD:5,              // une ATCMD compte pour 5 h de travail
  nuitAFR:[22,7],             // heures de nuit des AFR
  nuitCDR:[22,5],             // heures de nuit des conducteurs
  trajetTypes:['VOY','VS'],   // « trajet seul » : mission dont l'intitulé se réduit à l'un de ces types
  panierMidi:[11.5,13.5,1],   // plage horaire, heures travaillées minimum
  panierSoir:[18.5,20.5,1],
  panierNuit:[22,5,3],
  panierRHR:true,             // un RHR qui englobe la plage midi ou soir donne un panier
  horsColonne:'ecarter',      // mission datée hors de sa colonne : 'ecarter' ou 'garder'
  horsColonneTolerance:6,     // un service qui démarre le lendemain avant cette heure reste rattaché à sa colonne
};
/** Une personne = son matricule (à défaut, nom + prénom) */
const personKey=a=>a.matricule?'m:'+a.matricule:'n:'+deacc(`${a.nom}|${a.prenom}`).toUpperCase();
const isAFR=m=>/AFR/i.test(m||'');

/** Missions dont la date écrite dans la case ne correspond pas à la colonne
    (lignes d'une autre semaine recopiées dans le fichier) */
function splitHorsColonne(agents,days,rules){
  const tol=(Number(rules.horsColonneTolerance)||0)*H, liste=[];
  const out=agents.map(a=>{
    let touched=false;
    const jours=a.jours.map((j,d)=>{
      if(j.kind!=='SERVICE') return j;
      const D=days[d], ok=[], hors=[];
      for(const m of j.missions){ const S=Date.parse(m.start), E=Date.parse(m.end); (S<D+DAY+tol&&E>D?ok:hors).push(m); }
      if(!hors.length) return j;
      touched=true;
      const hc=hors.map(m=>({label:m.label,start:m.start,end:m.end}));
      hc.forEach(m=>liste.push({agent:`${a.nom} ${a.prenom}`.trim(),agence:a.agence,jour:JN[d],...m}));
      return ok.length?{kind:'SERVICE',missions:ok,horsColonne:hc}:{kind:'CODE',code:'Hors colonne',family:'HORS',horsColonne:hc};
    });
    return touched?{...a,jours}:a;
  });
  return {agents:out,liste};
}
function withHC(cell,cells){
  const seen=new Set(), hc=[];
  for(const c of cells) for(const m of c.horsColonne||[]){const k=m.label+'|'+m.start; if(!seen.has(k)){seen.add(k);hc.push(m);}}
  const {horsColonne,...rest}=cell;
  return hc.length?{...rest,horsColonne:hc}:rest;
}
/** Une personne présente sur plusieurs lignes du fichier : fusion jour par jour
    (un service l'emporte sur un code, un code sur une case vide) */
function mergeDuplicates(agents){
  const groups=new Map(), order=[];
  for(const a of agents){ const k=personKey(a); if(!groups.has(k)){groups.set(k,[]);order.push(k);} groups.get(k).push(a); }
  const out=[];
  for(const k of order){
    const rows=groups.get(k);
    if(rows.length===1){ out.push({...rows[0],fusion:null}); continue; }
    const svcDays=a=>a.jours.filter(j=>j.kind==='SERVICE').length;
    const main=rows.reduce((b,a)=>svcDays(a)>svcDays(b)?a:b,rows[0]);
    const jours=[];
    for(let d=0;d<7;d++){
      const cells=rows.map(r=>r.jours[d]);
      const svcs=cells.filter(c=>c.kind==='SERVICE'), codes=cells.filter(c=>c.kind==='CODE');
      if(svcs.length){

      }else if(codes.length){
        const mc=main.jours[d];

      for(const l of [m.from,m.to]) if(l) cnt[a.agence][l]=(cnt[a.agence][l]||0)+1;
  }

    if(rules.residences&&rules.residences[ag]){res[ag]=rules.residences[ag];src[ag]='manuel';}
    else{const b=Object.entries(cnt[ag]||{}).sort((x,y)=>y[1]-x[1])[0];

function applyRules(parsed, rulesIn){
  const rules={...DEFAULT_RULES,...rulesIn};
  const days=parsed.meta.days.map(d=>new Date(d+'T00:00:00Z'));
  const hc=rules.horsColonne==='garder'?{agents:parsed.agents,liste:[]}:splitHorsColonne(parsed.agents,days.map(d=>d.getTime()),rules);
  const merged=mergeDuplicates(hc.agents);

  const agents=merged.map(a=>computeAgent(a,days,rules,residences[a.agence]));

function dayIndexOf(t,days){for(let i=0;i<7;i++)if(t>=days[i].getTime()&&t<days[i].getTime()+864e5)return i;return t<days[0].getTime()?-1:7;}
function nights(a,b){

/* temps travaillé : la mission moins ses pauses, en intervalles [début, fin] (ms) */

function workSegments(m){

  const out=[]; let cur=S;
  for(const [s,e] of ps){ if(s>cur) out.push([cur,Math.min(s,E)]); cur=Math.max(cur,e); }

/** Plage [de, à) d'une date, en heures décimales (à < de : plage à cheval sur minuit) */

function computeAgent(a,days,rules,residence){
  const rhrOk=rules.rhrMetiers.includes(a.metier);
  const nuitW=isAFR(a.metier)?rules.nuitAFR:rules.nuitCDR;
  const reTrajet=new Set((rules.trajetTypes||[]).map(x=>String(x).toUpperCase().trim()));
  const jours=a.jours.map((j,d)=>({...j,d,date:isoD(days[d])}));
  const all=[];
  let joursService=0,nbMissions=0,amp=0,pauseMin=0,plan=0,nuit=0,dim=0,ampMax=0,wk=0,priseMin=null,finMax=null;
  let nbMHIS=0,nbDISPO=0,nbATCMD=0,nbTrajetsSeuls=0,pausesInconnues=0;
  const codeCounts={}, types={}, dests={};
  const sun0=days[6].getTime(), sun1=sun0+DAY;
  for(const j of jours){
    if(j.kind==='CODE') codeCounts[j.family]=(codeCounts[j.family]||0)+1;
    else if(j.kind==='SERVICE'){
      joursService++; if(j.d>=5) wk++;
      j.amplitude=r2(j.missions.reduce((s,m)=>s+m.amplitude,0));
      let hj=0;
      for(const m of j.missions){
        const S=new Date(m.start), E=new Date(m.end), Sm=S.getTime(), Em=E.getTime();
        const atcmd=/ATCMD/i.test(m.label), segs=workSegments(m);
        if(m.pauseMin>0&&!(m.pauses&&m.pauses.length&&Array.isArray(m.pauses[0]))) pausesInconnues++;
        const hPlan=atcmd?rules.heuresATCMD:Math.max(0,m.amplitude-(m.pauseMin||0)/60);
        const hNuit=hoursInDailyWindow(segs,nuitW[0],nuitW[1],Math.floor(Sm/DAY)*DAY-DAY,Math.floor(Em/DAY)*DAY);
        const hDim=atcmd?(Em>Sm?rules.heuresATCMD*ovl(Sm,Em,sun0,sun1)/(Em-Sm):0):segOvl(segs,sun0,sun1)/H;
        all.push({...m,S,E,segs,atcmd});
        nbMissions++; amp+=m.amplitude; pauseMin+=m.pauseMin||0; plan+=hPlan; nuit+=hNuit; dim+=hDim; hj+=hPlan;
        if(m.amplitude>ampMax) ampMax=m.amplitude;
        const sh=S.getUTCHours()+S.getUTCMinutes()/60, eh=E.getUTCHours()+E.getUTCMinutes()/60;
        if(priseMin===null||sh<priseMin) priseMin=sh;
        if(finMax===null||eh>finMax) finMax=eh;
        types[m.type]=(types[m.type]||0)+1;
        if(m.to) dests[m.to]=(dests[m.to]||0)+1;
        if(/MHIS/i.test(m.label)) nbMHIS++;
        if(/DISPO/i.test(m.label)) nbDISPO++;
        if(atcmd) nbATCMD++;

  all.sort((x,y)=>x.S-y.S);

    for(let i=0;i<all.length;i++){
      const m=all[i]; if(!m.to||m.to===residence) continue;
      const nx=all[i+1];
      if(nx){
        const dur=(nx.S-m.E)/H;
        if(dur<rules.rhrMinHours) continue;
        if(nx.from&&nx.from!==m.to) warn.push(`reprise à ${nx.from} après une fin de service à ${m.to}`);
        rhr.push({lieu:m.to,debut:m.end,fin:nx.start,dureeH:r2(dur),nuits:nights(m.E,nx.S),
          jourDebut:dayIndexOf(m.E.getTime(),days),aller:m.label,retour:nx.label,enCours:false});

      }
    }
  }

  /* --- Journées blanches : case vide entre deux services --- */
  const svcIdx=jours.filter(j=>j.kind==='SERVICE').map(j=>j.d);

    if(j.kind!=='VIDE') continue;

    const ds=days[j.d].getTime(), de=ds+864e5;

    if(enService){ j.nuitDebordante=true; if(rules.jbExcludeNightOverlap) continue; }
    const hors=rhr.some(x=>{const s=new Date(x.debut).getTime(), e=x.fin?new Date(x.fin).getTime():Infinity;return s<de&&e>ds;});

    const next=jours.find(y=>y.d>j.d&&y.kind==='SERVICE');

      finPrec:prev?prev.missions[prev.missions.length-1].end:null,

    const s=new Date(x.debut).getTime(), e=x.fin?new Date(x.fin).getTime():days[6].getTime()+864e5;
    for(const j of jours){const ds=days[j.d].getTime();if(s<ds+864e5&&e>ds) j.horsResidence=true;}

    matricule:a.matricule,nom:a.nom,prenom:a.prenom,agence:a.agence,metier:a.metier,corridor:a.corridor,
    residence:residence||null, rhrApplicable:rhrOk, jours, fusion:a.fusion||null,
    joursService, nbMissions,
    joursRepos:codeCounts.RP||0,
    joursCP:(codeCounts.CP||0)+(codeCounts.CPAT||0),
    joursAbsence:Object.entries(codeCounts).reduce((s,[k,v])=>s+(k==='RP'||k==='HORS'?0:v),0),

    pauseTotaleMin:pauseMin,
    heuresPlanifiees, heuresSup:r2(Math.max(0,heuresPlanifiees-rules.seuilHebdo)),
    heuresNuit:r2(nuit), heuresDimanche:r2(dim),
    nbMHIS, nbDISPO, nbATCMD, nbTrajetsSeuls,
    paniers, nbPaniers:paniers.length,
    paniersMidi:paniers.filter(p=>p.plage==='midi').length, paniersSoir:paniers.filter(p=>p.plage==='soir').length,
    paniersNuit:paniers.filter(p=>p.plage==='nuit').length, paniersRHR:paniers.filter(p=>p.source==='RHR').length,
    priseServicePlusTot:priseMin===null?null:r2(priseMin), finServicePlusTard:finMax===null?null:r2(finMax),
    nbRHR:rhr.length, rhrEnCours:pending, rhrHeures:r2(rhr.reduce((s,x)=>s+(x.dureeH||0),0)),
    rhrNuits:rhr.reduce((s,x)=>s+(x.nuits||0),0), rhrLieux:[...new Set(rhr.map(x=>x.lieu))], rhr,
    warnings:warn, typesMission:types, destinations:dests, pausesInconnues,
    nbHorsColonne:jours.reduce((s,j)=>s+(j.horsColonne?j.horsColonne.length:0),0),
    jamaisEnResidence: rhrOk&&!!residence&&all.length>0&&!toucheRes,

/** Paniers : 1 h travaillée entre 11h30 et 13h30, 1 h entre 18h30 et 20h30, 3 h entre 22h et 5h,

function computePaniers(all,rhr,days,rules){
  const got=new Map();

  const t1=all.length?Math.floor(Math.max(...all.map(m=>m.E.getTime()))/DAY)*DAY:days[6].getTime();
  const plages=[['midi',rules.panierMidi],['soir',rules.panierSoir],['nuit',rules.panierNuit]];
  for(let d=t0;d<=t1;d+=DAY) for(const [nom,[de,a,min]] of plages){
    const [w0,w1]=windowOf(d,de,a); if(segOvl(segs,w0,w1)/H>=min-1e-9) add(d,nom,'travail');

    const s=Date.parse(x.debut), e=x.fin?Date.parse(x.fin):days[6].getTime()+DAY;

/** Clôture les RHR ouverts grâce à la première mission de la semaine suivante */
function reconcile(weeks,rulesIn){
  const rules={...DEFAULT_RULES,...rulesIn};
  const ids=[...weeks.keys()].sort();
  for(let i=0;i<ids.length-1;i++){
    const c=weeks.get(ids[i]), n=weeks.get(ids[i+1]);
    if(!c||!n) continue;
    if(new Date(n.meta.monday+'T00:00:00Z')-new Date(c.meta.sunday+'T00:00:00Z')!==864e5) continue;
    const idx=new Map(n.agents.map(a=>[personKey(a),a]));
    for(const a of c.agents){
      const p=a.rhr.find(x=>x.enCours&&!x.fin);
      if(!p) continue;
      const pm=(idx.get(personKey(a))||{}).premiereMission;
      if(!pm) continue;
      const fin=new Date(pm.start), deb=new Date(p.debut);
      if(fin<=deb) continue;
      p.fin=pm.start; p.dureeH=r2((fin-deb)/H); p.nuits=nights(deb,fin); p.retour=pm.label; p.cloturee=true;
      a.rhrHeures=r2(a.rhr.reduce((s,x)=>s+(x.dureeH||0),0));
      a.rhrNuits=a.rhr.reduce((s,x)=>s+(x.nuits||0),0);
      if(rules.panierRHR){   // paniers pris pendant la partie du RHR qui déborde sur la semaine suivante
        const seen=new Set(a.paniers.map(q=>q.date+'|'+q.plage));
        const sun1=new Date(c.meta.sunday+'T00:00:00Z').getTime()+DAY, e=fin.getTime(), s=deb.getTime();
        for(let d=sun1;d<=e;d+=DAY) for(const [nom,[de,aa]] of [['midi',rules.panierMidi],['soir',rules.panierSoir]]){

          if(s<=w0&&e>=w1&&!seen.has(k)){ a.paniers.push({date:isoD(new Date(d)),plage:nom,source:'RHR'}); seen.add(k); }
        }
        a.nbPaniers=a.paniers.length; a.paniersMidi=a.paniers.filter(q=>q.plage==='midi').length;
        a.paniersSoir=a.paniers.filter(q=>q.plage==='soir').length; a.paniersRHR=a.paniers.filter(q=>q.source==='RHR').length;
      }
    }
  }
}

const FIELDS=[

  {k:'nbMissions',l:'Missions',u:''},
  {k:'nbTrajetsSeuls',l:'Trajets seuls',u:''},
  {k:'nbMHIS',l:'MHIS',u:''},
  {k:'nbDISPO',l:'DISPO',u:''},
  {k:'nbATCMD',l:'ATCMD',u:''},
  {k:'nbRHR',l:'RHR',u:''},
  {k:'rhrNuits',l:'Nuits hors résidence',u:''},
  {k:'rhrHeures',l:'Heures hors résidence',u:'h'},
  {k:'journeesBlanches',l:'Journées blanches',u:''},
  {k:'joursRepos',l:'Repos (RP)',u:''},
  {k:'joursCP',l:'Congés',u:''},
  {k:'joursAbsence',l:'Jours d’absence',u:''},
  {k:'weekendTravaille',l:'Jours de week-end',u:''},
  {k:'amplitudeTotale',l:'Amplitude',u:'h'},
  {k:'heuresPlanifiees',l:'Heures planifiées',u:'h'},
  {k:'heuresSup',l:'Heures sup',u:'h'},
  {k:'heuresNuit',l:'Heures de nuit',u:'h'},
  {k:'heuresDimanche',l:'Heures du dimanche',u:'h'},

  {k:'paniersMidi',l:'Paniers midi',u:''},
  {k:'paniersSoir',l:'Paniers soir',u:''},
  {k:'paniersNuit',l:'Paniers nuit',u:''},
  {k:'paniersRHR',l:'Paniers en RHR',u:''},

/** Mesures RHR : moyennées uniquement sur les agents qui ont eu au moins un RHR (ni AFR, ni agents à 0) */
const RHR_KEYS=new Set(['nbRHR','rhrNuits','rhrHeures']);
function agg(list){
  const persons=new Set(list.map(personKey)), withRHR=list.filter(a=>a.nbRHR>0);
  const o={nbLignes:list.length, nbAgents:persons.size,
    nbSemaines:new Set(list.map(a=>a.weekId)).size||1,
    agentsAvecRHR:new Set(withRHR.map(personKey)).size, lignesAvecRHR:withRHR.length,
    agentsAvecBlanche:new Set(list.filter(a=>a.journeesBlanches>0).map(personKey)).size,
    agentsHeuresSup:new Set(list.filter(a=>a.heuresSup>0).map(personKey)).size,
    rhrEnCours:list.reduce((s,a)=>s+a.rhr.filter(x=>x.enCours&&!x.fin).length,0)};
  for(const f of FIELDS){
    const v=list.map(a=>a[f.k]||0), t=v.reduce((s,x)=>s+x,0);
    const den=RHR_KEYS.has(f.k)?withRHR.length:list.length;
    o[f.k]=r2(t); o[f.k+'_moy']=den?r2(t/den):0; o[f.k+'_max']=v.length?r2(Math.max(...v)):0;
    o[f.k+'_sem']=r2(t/o.nbSemaines);
  }
  const svc=list.filter(a=>a.joursService>0);
  o.amplitudeParJour=svc.length?r2(svc.reduce((s,a)=>s+a.amplitudeTotale,0)/svc.reduce((s,a)=>s+a.joursService,0)):0;
  o.ratioPanierJS=o.joursService?r2(o.nbPaniers/o.joursService):0;

}
/** Valeur d'une mesure selon le mode choisi : total, moyenne par agent (par ligne agent-semaine), moyenne par semaine */
const modeVal=(g,k,mode)=>mode==='agent'?g[k+'_moy']:mode==='semaine'?g[k+'_sem']:g[k];
const groupBy=(l,f)=>{const m=new Map();for(const x of l){const k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x);}return m;};
/** Une ligne par personne sur toutes les semaines sélectionnées : un nom n'apparaît jamais deux fois */
function mergeAcrossWeeks(rows){
  const out=[];
  for(const [,list] of groupBy(rows,personKey)){
    list.sort((a,b)=>String(a.weekId).localeCompare(String(b.weekId)));
    const last=list[list.length-1];
    const p={...last, parSemaine:list, nbSemaines:list.length, semaines:list.map(a=>a.weekId),
      agences:[...new Set(list.map(a=>a.agence))],
      rhr:list.flatMap(a=>a.rhr.map(r=>({...r,weekId:a.weekId}))),
      blanches:list.flatMap(a=>a.blanches.map(b=>({...b,weekId:a.weekId}))),
      rhrLieux:[...new Set(list.flatMap(a=>a.rhrLieux))],
      rhrApplicable:list.some(a=>a.rhrApplicable), fusion:list.some(a=>a.fusion)?list.find(a=>a.fusion).fusion:null,
      jamaisEnResidence:list.every(a=>a.jamaisEnResidence), warnings:list.flatMap(a=>a.warnings)};
    for(const f of FIELDS) p[f.k]=r2(list.reduce((s,a)=>s+(a[f.k]||0),0));
    for(const k of ['pauseTotaleMin','joursVides','nbHorsColonne','pausesInconnues']) p[k]=list.reduce((s,a)=>s+(a[k]||0),0);
    p.rhrEnCours=p.rhr.filter(x=>x.enCours&&!x.fin).length;
    p.amplitudeMoyenne=p.joursService?r2(p.amplitudeTotale/p.joursService):0;
    p.amplitudeMax=r2(Math.max(0,...list.map(a=>a.amplitudeMax||0)));
    const pr=list.map(a=>a.priseServicePlusTot).filter(x=>x!=null), fi=list.map(a=>a.finServicePlusTard).filter(x=>x!=null);
    p.priseServicePlusTot=pr.length?Math.min(...pr):null; p.finServicePlusTard=fi.length?Math.max(...fi):null;
    const sumObj=k=>list.reduce((o,a)=>{for(const [x,v] of Object.entries(a[k]||{})) o[x]=(o[x]||0)+v; return o;},{});
    p.codeCounts=sumObj('codeCounts'); p.typesMission=sumObj('typesMission'); p.destinations=sumObj('destinations');
    p.ratioPanierJS=p.joursService?r2(p.nbPaniers/p.joursService):0;
    out.push(p);
  }
  return out;
}

const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; }
  return t;
})();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }

/** ZIP « stored » (sans compression) — suffisant et parfaitement lisible par Excel */
function zipFiles(files){
  const parts=[], cd=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  for(const f of files){
    const name=te.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  }
  let cdLen=0; for(const c of cd) cdLen+=c.length;
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),
    ...u32(cdLen),...u32(off),...u16(0)]);
  const all=[...parts,...cd,eocd];
  let total=0; for(const a of all) total+=a.length;
  const out=new Uint8Array(total); let p=0;
  for(const a of all){ out.set(a,p); p+=a.length; }
  return out;
}

/**

function buildXlsx(sheets){
  const STY={txt:0,int:2,dec:3,h:3};
  const sheetXml=(sh)=>{
    const nc=sh.cols.length;
    const cols=`<cols>${sh.cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w||14}" customWidth="1"/>`).join('')}</cols>`;
    const head=`<row r="1" ht="22" customHeight="1">${sh.cols.map((c,i)=>
      `<c r="${colName(i)}1" s="1" t="inlineStr"><is><t xml:space="preserve">${xe(c.t)}</t></is></c>`).join('')}</row>`;
    const body=sh.rows.map((r,ri)=>`<row r="${ri+2}">${r.map((v,i)=>{
      const f=sh.cols[i]?.fmt||'txt';
      if(v==null||v==='') return '';
      if(f!=='txt'&&typeof v==='number'&&isFinite(v))
        return `<c r="${colName(i)}${ri+2}" s="${STY[f]}"><v>${v}</v></c>`;
      return `<c r="${colName(i)}${ri+2}" s="0" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${colName(nc-1)}${sh.rows.length+1}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${head}${body}</sheetData><autoFilter ref="A1:${colName(nc-1)}${sh.rows.length+1}"/></worksheet>`;
  };
  const files=[
    {name:'[Content_Types].xml',data:te.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`)},
    {name:'_rels/.rels',data:te.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`)},
    {name:'xl/workbook.xml',data:te.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`)},
    {name:'xl/_rels/workbook.xml.rels',data:te.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`)},
    {name:'xl/styles.xml',data:te.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="0"/><numFmt numFmtId="165" formatCode="0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF175E82"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>`)},
  ];
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:te.encode(sheetXml(s))}));
  return zipFiles(files);
}

let ADB=null;
const backend={
  mode:'web', code:'',
  async detect(){
    try{ ADB = await window.claude?.use?.('db'); }catch(e){ ADB=null; }
    backend.mode = ADB ? 'artifact' : 'web';
    return backend.mode;
  },
  url(p){
    const i=p.indexOf('?'), route=i<0?p:p.slice(0,i), qs=i<0?'':p.slice(i+1);
    return window.__API__ ? window.__API__+route+(qs?'&'+qs:'') : '/api/'+p;
  },
  async call(path,opt={}){
    const r=await fetch(backend.url(path),{...opt,headers:{...(opt.headers||{}),'x-acces':backend.code,
      ...(opt.body?{'content-type':'application/json'}:{})}});
    let d=null; try{ d=await r.json(); }catch(e){}
    if(!r.ok) throw Object.assign(new Error((d&&d.error)||`Erreur ${r.status}`),{status:r.status});
    return d;
  },
  async session(){
    if(backend.mode==='artifact') return {role:'admin'};
    return backend.call('session');
  },
  async etat(){
    if(backend.mode!=='artifact') return backend.call('etat');
    const s=await ADB.collection('semaines').get();
    const weeks=s.docs.map(d=>d.data()).sort((a,b)=>String(b.weekId).localeCompare(String(a.weekId)));
    const rg=await ADB.doc('config/regles').get();
    return {role:'admin',weeks,regles:rg.exists?rg.data():null};
  },
  async semaine(id){
    if(backend.mode!=='artifact') return backend.call('semaine?id='+encodeURIComponent(id));
    const s=await ADB.collection('detail').where('weekId','==',id).get();
    return {docs:s.docs.map(d=>d.data())};
  },
  async saveSemaine(resume,details){
    if(backend.mode!=='artifact') return backend.call('semaine',{method:'PUT',body:JSON.stringify({resume,details})});
    for(const d of details) await ADB.doc(`detail/${resume.weekId}__${d.agenceSlug}`).set(d);
    await ADB.doc(`semaines/${resume.weekId}`).set(resume);
    return {ok:true};
  },
  async delSemaine(id){
    if(backend.mode!=='artifact') return backend.call('semaine?id='+encodeURIComponent(id),{method:'DELETE'});
    const s=await ADB.collection('detail').where('weekId','==',id).get();
    for(const d of s.docs) await ADB.doc('detail/'+d.id).delete();
    await ADB.doc('semaines/'+id).delete();
    return {ok:true};
  },
  async saveRegles(r){
    if(backend.mode!=='artifact') return backend.call('regles',{method:'PUT',body:JSON.stringify(r)});
    await ADB.doc('config/regles').set({...r,majLe:new Date().toISOString()});
    return {ok:true};
  },
};

/** Lignes agent-semaine du périmètre (une par personne et par semaine, doublons du fichier déjà fusionnés) */
function scopeAgents(opts={}){
  const out=[];
  for(const id of (opts.allWeeks?S.weeks.map(w=>w.weekId):activeWeeks())){
    const w=S.loaded.get(id); if(!w) continue;
    for(const a of w.agents){
      if(S.selAgences&&!S.selAgences.includes(a.agence)) continue;
      if(S.selMetiers&&!S.selMetiers.includes(a.metier)) continue;
      if(S.search&&!deacc(`${a.nom} ${a.prenom} ${a.matricule}`).toLowerCase().includes(deacc(S.search).toLowerCase())) continue;
      out.push(a.weekId?a:Object.assign(a,{weekId:id}));
    }
  }
  return out;
}

async function ensureLoaded(ids){
  for(const id of ids){
    if(S.loaded.has(id)) continue;
    const {docs}=await api.semaine(id);
    if(!docs||!docs.length) continue;
    const meta=docs[0].meta;
    const agents=docs.flatMap(d=>d.agents);
    S.parsedCache.set(id,{meta,agents});
    const v=applyRules({meta,agents},S.rules); v.agents.forEach(a=>a.weekId=id);
    S.loaded.set(id,v);
  }
  reconcile(new Map([...S.loaded.entries()].sort((a,b)=>a[0].localeCompare(b[0]))),S.rules);
}
function recomputeLoaded(){
  for(const [id,p] of S.parsedCache){ const v=applyRules(p,S.rules); v.agents.forEach(a=>a.weekId=id); S.loaded.set(id,v); }
  reconcile(new Map([...S.loaded.entries()].sort((a,b)=>a[0].localeCompare(b[0]))),S.rules);
}

const niceStep=m=>{const raw=m/4,p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p;};

/** Courbes multi-séries avec repère et infobulle */
function lineChart(series,labels,fmt){
  if(!labels.length||!series.length) return '<p class="mut sm">Pas encore assez de semaines pour tracer une évolution.</p>';
  const W=520,Hh=190,ml=46,mr=58,mt=14,mb=28;
  const maxV=Math.max(1,...series.flatMap(s=>s.values.filter(v=>v!=null)));
  const step=niceStep(maxV), top=Math.ceil(maxV/step)*step||step;
  const X=i=>ml+(labels.length===1?(W-ml-mr)/2:i*(W-ml-mr)/(labels.length-1));
  const Y=v=>mt+(1-v/top)*(Hh-mt-mb);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step)
    g+=`<line class="grid-l" x1="${ml}" y1="${Y(v).toFixed(1)}" x2="${W-mr}" y2="${Y(v).toFixed(1)}"/>`
      +`<text class="cv" x="${ml-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${nf(v)}</text>`;
  labels.forEach((l,i)=>{ if(labels.length>10&&i%Math.ceil(labels.length/10)!==0&&i!==labels.length-1) return;
    g+=`<text class="ct" x="${X(i).toFixed(1)}" y="${Hh-9}" text-anchor="middle">${esc(l)}</text>`;});
  let p='';
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length) return;
    p+=`<path d="${pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(q=>p+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`);
    const last=pts[pts.length-1];
    p+=`<text class="cvb" x="${(last[0]+8).toFixed(1)}" y="${(last[1]+4).toFixed(1)}">${esc(s.short||s.name)}</text>`;
  });
  let hz='';
  labels.forEach((l,i)=>{
    const w=(W-ml-mr)/Math.max(1,labels.length-1);
    const rows=series.map(s=>({n:s.name,c:s.color,v:s.values[i]})).filter(r=>r.v!=null);
    hz+=`<rect class="hovz" x="${(X(i)-w/2).toFixed(1)}" y="${mt}" width="${w.toFixed(1)}" height="${Hh-mt-mb}"
      data-tip="${esc(`<b>${l}</b>`+rows.map(r=>`<span class="tr"><span><i class="cdot" style="background:${r.c}"></i>${r.n}</span><b>${fmt?fmt(r.v):nf(r.v)}</b></span>`).join(''))}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" preserveAspectRatio="xMidYMid meet">
    ${g}<line class="axis-l" x1="${ml}" y1="${mt}" x2="${ml}" y2="${Hh-mb}"/>${p}${hz}</svg></div>`;
}

function barChart(items,opts={}){
  if(!items.length) return '<p class="mut sm">Aucune donnée sur ce périmètre.</p>';
  const max=Math.max(1,...items.map(i=>i.v));
  const f=opts.fmt||(v=>nf(v,opts.dec||0));
  return `<div class="bars">${items.map(i=>`
    <div class="bar" data-tip="${esc(`<b>${i.l}</b><span class="tr"><span>${opts.label||'Valeur'}</span><b>${f(i.v)}</b></span>${i.sub?`<span class="tr"><span>${i.sub2||''}</span><b>${i.sub}</b></span>`:''}`)}">
      <span class="bl">${esc(i.l)}</span>
      <span class="bt"><i style="width:${(i.v/max*100).toFixed(1)}%;background:${i.c||'var(--s1)'}"></i></span>
      <span class="bv">${f(i.v)}</span></div>`).join('')}</div>`;
}

/* ---------- journées blanches ---------- */
function viewBlanches(){
  const sc=scopeAgents(); if(!sc.length) return emptyScope();
  const rows=[]; sc.forEach(a=>a.blanches.forEach(b=>rows.push({a,b})));
  const byAg=[...groupBy(rows,x=>x.a.agence+'||'+x.a.metier)].sort((a,b)=>a[0].localeCompare(b[0]));
  const parJour=JS.map((j,i)=>({l:j,v:rows.filter(x=>x.b.d===i).length}));
  const persons=mergeAcrossWeeks(sc).filter(p=>p.journeesBlanches>0);
  const cols=[
    {k:'nom',l:'Agent',cls:'l',st:1,v:p=>p.nom+' '+p.prenom,f:p=>`<span class="nm">${esc(p.nom)}</span> ${esc(p.prenom)}`},
    {k:'agence',l:'Agence',cls:'l',f:p=>esc(p.agence)},
    {k:'metier',l:'Métier',cls:'l',f:p=>esc(p.metier)},
    {k:'journeesBlanches',l:'Journées blanches',f:p=>`<b>${nf(p.journeesBlanches)}</b>`},
    {k:'dates',l:'Dates',cls:'l mono',v:p=>p.blanches[0]?.date||'',f:p=>p.blanches.map(b=>`${JS[b.d]} ${dISO(b.date)}`).join(' · ')},
    {k:'hr',l:'Hors résidence',v:p=>p.blanches.filter(b=>b.horsResidence).length,f:p=>{const n=p.blanches.filter(b=>b.horsResidence).length;return n?`<span class="pill pill-w">${n}</span>`:'<span class="z">0</span>';}},
  ];
  return `<section class="card">
    <div class="card-h"><div><h2>Journées blanches</h2><p class="card-s">${nf(rows.length)} journée${rows.length>1?'s':''} sur le périmètre</p></div>
      <button class="btn btn-sm" data-goto="exports">Exporter</button></div>
    <div class="card-b">
      <div class="note mb">Journée sans mission ni code — ni RP, ni congé — encadrée par deux services dans la semaine. Les lendemains de service de nuit, où l'agent est encore en service jusqu'au matin, sont exclus.</div>
      ${rows.length?`<div class="cols2 mb">
        <div class="tw"><table><thead><tr><th class="l">Agence</th><th class="l">Métier</th><th>Journées</th><th>Agents</th></tr></thead>
          <tbody>${byAg.map(([k,l])=>{const[ag,me]=k.split('||');
            return `<tr><td class="l nm">${esc(ag)}</td><td class="l">${esc(me)}</td><td>${l.length}</td>
            <td>${new Set(l.map(x=>personKey(x.a))).size}</td></tr>`;}).join('')}</tbody></table></div>
        <div>${barChart(parJour,{label:'Journées blanches'})}</div></div>
      ${stable('jbag',cols,persons,{sort:{k:'journeesBlanches',dir:'desc'},tall:true,sticky:true,onRow:true})}`:'<p class="mut">Aucune journée blanche sur ce périmètre.</p>'}
    </div></section>`;
}

/* ---------- graphiques ---------- */
function viewGraphiques(){
  if(!S.weeks.length) return emptyScope();
  const sc=scopeAgents(); if(!sc.length) return emptyScope();
  const c=S.chart, M=METRICS.find(m=>m.k===c.metric)||METRICS[0], k=M.k, mode=S.mode;
  const isRHR=k==='nbRHR';
  const base=l=>isRHR?l.filter(a=>a.rhrApplicable):l;     // les AFR n'entrent pas dans les statistiques RHR
  const fm=v=>M.f(v);
  const rows=base(sc);
  const byAg=[...groupBy(rows,a=>a.agence)].map(([l,list])=>{const g=agg(list);return {l,v:modeVal(g,k,mode),c:agenceColor(l),sub:nf(g.nbAgents),sub2:'Agents'};}).sort((a,b)=>b.v-a.v);
  const byMe=[...groupBy(rows,a=>a.metier)].map(([l,list])=>{const g=agg(list);return {l,v:modeVal(g,k,mode),sub:nf(g.nbAgents),sub2:'Agents'};}).sort((a,b)=>b.v-a.v);
  // répartition par agent : une ligne par personne (pour le RHR, uniquement ceux qui en ont eu)
  const persons=mergeAcrossWeeks(rows).filter(p=>!isRHR||p.nbRHR>0);
  const pers=persons.map(p=>({l:`${p.nom} ${p.prenom.slice(0,1)}.`,v:mode==='total'?p[k]:r2(p[k]/(p.nbSemaines||1)),c:agenceColor(p.agence),sub:p.agence,sub2:'Agence'})).sort((a,b)=>b.v-a.v);
  const avgP=pers.length?pers.reduce((s,x)=>s+x.v,0)/pers.length:0;
  // évolution hebdomadaire et moyennes par semaine : toutes les semaines enregistrées
  const all=base(scopeAgents({allWeeks:true}));
  const ids=S.weeks.map(w=>w.weekId).sort();
  const labels=ids.map(id=>`S${String(S.weeks.find(x=>x.weekId===id).week).padStart(2,'0')}`);
  const shown=scopeAgences().slice(0,8);
  const series=shown.map(ag=>({name:ag,short:ag.slice(0,3).toUpperCase(),color:agenceColor(ag),
    values:ids.map(id=>{const l=all.filter(a=>a.weekId===id&&a.agence===ag); return l.length?modeVal(agg(l),k,mode==='agent'?'agent':'total'):null;})}));
  const legend=shown.map(ag=>`<span class="lg"><span class="cdot" style="background:${agenceColor(ag)}"></span>${esc(ag)}</span>`).join('');
  // moyennes par semaine : tous métiers du périmètre ; le RHR ne porte que sur les conducteurs
  const allRows=scopeAgents({allWeeks:true}), nWall=new Set(allRows.map(a=>a.weekId)).size;
  const wval=(l,mk)=>{ if(mk!=='nbRHR') return agg(l)[mk+'_sem']; const w=new Set(l.map(a=>a.weekId)).size||1;
    return r2(l.filter(a=>a.rhrApplicable).reduce((s,a)=>s+a.nbRHR,0)/w); };
  const wk=[...groupBy(allRows,a=>a.agence)].map(([agence,l])=>{const g=agg(l),o={agence,ag:r2(g.nbLignes/g.nbSemaines)}; METRICS.forEach(m=>o[m.k]=wval(l,m.k)); return o;});
  const gW=(()=>{const g=agg(allRows),o={ag:r2(g.nbLignes/g.nbSemaines)}; METRICS.forEach(m=>o[m.k]=wval(allRows,m.k)); return o;})();
  const wCols=[{k:'agence',l:'Agence',cls:'l nm',f:r=>esc(r.agence)},
    {k:'ag',l:'Agents / sem.',f:r=>nf(r.ag,1)},
    ...METRICS.map(m=>({k:m.k,l:m.c+' / sem.',f:r=>m.f(r[m.k])}))];
  const tops=[15,25,50,100,0];
  return `
  <section class="card"><div class="card-b"><div class="ctrls" style="margin-bottom:0;border-bottom:0;padding-bottom:0">
    <div class="fld"><span class="flabel">Mesure</span><div class="seg">${METRICS.map(m=>`<button class="sg" data-cm="${m.k}" aria-pressed="${m.k===k}">${m.c}</button>`).join('')}</div></div>
    <div class="fld"><span class="flabel">Valeur</span>${modeSeg()}</div></div>
    <p class="hint">${esc(modeHint())} · les filtres de semaine, d'agence et de métier s'appliquent${isRHR?' · RHR : conducteurs uniquement':''}</p></div></section>
  <div class="charts">
    <section class="card"><div class="card-h"><div><h2>${esc(M.l)} par agence</h2><p class="card-s">${esc(modeHint())}</p></div></div>
      <div class="card-b">${barChart(byAg,{fmt:fm,label:M.l})}</div></section>
    <section class="card"><div class="card-h"><div><h2>${esc(M.l)} par métier</h2><p class="card-s">${esc(modeHint())}</p></div></div>
      <div class="card-b">${barChart(byMe,{fmt:fm,label:M.l})}</div></section>
  </div>
  <section class="card"><div class="card-h"><div><h2>Répartition par agent</h2>
    <p class="card-s">${esc(M.l)}${mode==='total'?'':' par semaine'} · ${nf(pers.length)} agent${pers.length>1?'s':''}${isRHR?' ayant eu au moins un RHR':''} · moyenne ${fm(avgP)}</p></div>
    <label class="fld"><span class="flabel">Afficher</span><select id="cTop">${tops.map(n=>`<option value="${n}"${c.top===n?' selected':''}>${n?n+' premiers':'tous'}</option>`).join('')}</select></label></div>
    <div class="card-b">${barChart(c.top?pers.slice(0,c.top):pers,{fmt:fm,label:M.l})}</div></section>
  <section class="card"><div class="card-h"><div><h2>Évolution hebdomadaire</h2>
    <p class="card-s">${esc(M.l)} — une courbe par agence${mode==='agent'?', moyenne par agent':''} · toutes les semaines enregistrées</p></div></div>
    <div class="card-b">${lineChart(series,labels,fm)}<div class="clg">${legend}</div>
    ${S.weeks.length<2?'<p class="hint">Une seule semaine enregistrée : la courbe prendra son sens dès la deuxième.</p>':''}</div></section>
  <section class="card"><div class="card-h"><div><h2>Moyennes par semaine</h2><p class="card-s">sur ${nf(nWall)} semaine${nWall>1?'s':''} enregistrée${nWall>1?'s':''} — cliquez un en-tête pour trier</p></div></div>
    <div class="card-b">${stable('wk',wCols,wk,{sort:{k:'agence',dir:'asc'},foot:cc=>cc.k==='agence'?'Total':cc.k==='ag'?nf(gW.ag,1):METRICS.find(m=>m.k===cc.k).f(gW[cc.k])})}</div></section>`;
}

async function dl(name,data,mime){
  if(backend.mode==='artifact'){
    const d=await window.claude?.use?.('downloads');
    if(!d){ S.msg={m:"Le téléchargement n'est pas disponible dans cette vue.",t:'w'}; render(); return; }
    try{ await d.save({filename:name,data:new Blob([data],{type:mime})}); }
    catch(e){ if(e&&e.code!=='declined'){ S.msg={m:'Export impossible : '+(e.message||e.code),t:'c'}; render(); } }
    return;
  }
  const u=URL.createObjectURL(new Blob([data],{type:mime})), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const scopeTag=()=>{

      <p><b>Agents en double.</b> Une personne présente sur plusieurs lignes d'un fichier est fusionnée jour par jour : un service l'emporte sur un code, un code sur une case vide. Sur plusieurs semaines, chaque agent n'apparaît qu'une fois dans les tableaux.</p>
      <p><b>Semaine.</b> Identifiée par la date du lundi en ligne 1 du fichier, pas par son nom. Réimporter une semaine déjà présente remplace ses données.</p>
    </div></section>`;

async function handleFiles(list){
  S.err=null; S.msg=null;
  const files=[...list].filter(Boolean);
  if(!files.length) return;
  for(const f of files){
    const q={name:f.name,size:f.size,state:'lecture'}; S.queue.push(q); render();
    if(!/\.xlsx$/i.test(f.name)){ q.state='erreur'; q.err=`${f.name} — seuls les .xlsx sont lus.`; render(); continue; }
    try{
      const {rows}=await readRecapSheet(await f.arrayBuffer());
      const parsed=parseWeek(rows);
      const view=applyRules(parsed,S.rules);
      view.agents.forEach(a=>a.weekId=parsed.meta.weekId);
      q.parsed=parsed; q.view=view; q.anom=parsed.anomalies.length;
      q.stats=agg(view.agents);
      q.existe=S.weeks.some(w=>w.weekId===parsed.meta.weekId);
      const dup=S.queue.find(o=>o!==q&&o.view&&o.view.meta.weekId===parsed.meta.weekId);
      if(dup){ q.state='erreur'; q.err=`${f.name} — ${weekLabel(parsed.meta)} est déjà dans la liste.`; }
      else q.state='pret';
    }catch(e){ q.state='erreur'; q.err=`${f.name} — ${e.message||e}`; }
    render();
  }
}
function weekPayload(parsed,view,fileName,size){
  const agences=[...new Set(parsed.agents.map(a=>a.agence))].sort();
  const byAgence={};
  for(const [k,list] of groupBy(view.agents,a=>a.agence+'||'+a.metier)){
    const [ag,me]=k.split('||'); byAgence[ag]=byAgence[ag]||{};
    const g=agg(list), o={nbAgents:g.nbAgents};
    for(const f of FIELDS) o[f.k]=g[f.k];
    byAgence[ag][me]=o;
  }
  return {
    resume:{...parsed.meta,agences,byAgence,fileName:fileName||'',taille:size??null,importedAt:new Date().toISOString(),
      metiers:[...new Set(parsed.agents.map(a=>a.metier))].sort()},
    details:agences.map(ag=>({weekId:parsed.meta.weekId,agence:ag,agenceSlug:slug(ag),meta:parsed.meta,
      agents:parsed.agents.filter(a=>a.agence===ag)})),
  };
}
async function saveAll(){
  if(S.busy) return;
  S.busy=true; render();
  let n=0;
  for(const q of S.queue){
    if(q.state!=='pret') continue;
    q.state='envoi'; render();
    try{
      const p=weekPayload(q.parsed,q.view,q.name,q.size);
      await api.saveSemaine(p.resume,p.details);
      const id=q.parsed.meta.weekId;
      S.parsedCache.set(id,{meta:q.parsed.meta,agents:q.parsed.agents});
      const v=applyRules(S.parsedCache.get(id),S.rules); v.agents.forEach(a=>a.weekId=id);
      S.loaded.set(id,v);
      q.state='enregistre'; n++;
    }catch(e){ q.state='erreur'; q.err=`${q.name} — ${e.message||e}`; }
    render();
  }
  S.busy=false;
  const {weeks}=await api.etat(); S.weeks=weeks;
  if(!S.selAgences){ const p=['Hendaye','Bordeaux-St-Jean'].filter(a=>allAgences().includes(a)); if(p.length) S.selAgences=p; }
  await ensureLoaded(toLoad());
  S.queue=S.queue.filter(q=>q.state!=='enregistre');
  S.msg={m:`${n} semaine${n>1?'s':''} enregistrée${n>1?'s':''}.`};
  if(!S.queue.length&&n) S.tab='synthese';
  savePrefs(); render();
  setTimeout(()=>{S.msg=null;render();},5000);
}

async function login(code){
  const v=code||el('codeIn')?.value||'';
  if(!v.trim()) return;
  S.busy=true; S.err=null; render();
  api.code=v.trim();
  try{
    const {role}=await api.session();
    S.role=role; S.busy=false; S.err=null;
    savePrefs(); await boot();
  }catch(e){
    S.busy=false; api.code=''; S.role=null;
    S.err=e.status===401?"Code d'accès non reconnu.":('Connexion impossible : '+e.message);
    render();
  }
}
async function boot(){
  try{
    const {weeks,regles}=await api.etat();
    S.weeks=weeks||[];
    if(regles) S.rules={...DEFAULT_RULES,...regles};
    const p=prefs();
    if(p.selAgences) S.selAgences=p.selAgences.filter(a=>allAgences().includes(a));
    if(S.selAgences&&!S.selAgences.length) S.selAgences=null;
    if(p.selMetiers) S.selMetiers=p.selMetiers.filter(m=>allMetiers().includes(m));
    if(S.selMetiers&&!S.selMetiers.length) S.selMetiers=null;
    if(!S.selAgences){ const pr=['Hendaye','Bordeaux-St-Jean'].filter(a=>allAgences().includes(a)); if(pr.length) S.selAgences=pr; }
    if(S.weeks.length&&S.selWeek==='__all__') S.selWeek=S.weeks[0].weekId;
    if(S.role!=='admin'&&['import','reglages'].includes(S.tab)) S.tab='synthese';
    await ensureLoaded(toLoad());
  }catch(e){ S.msg={m:'Chargement impossible : '+e.message,t:'c'}; }
  render();
}
(async function start(){
  const p=prefs();
  if(p.theme) document.documentElement.dataset.theme=p.theme;
  if(p.cols) S.cols={...S.cols,...p.cols};
  if(p.chart) S.chart={...S.chart,...p.chart};
  if(p.mode) S.mode=p.mode;

  if(p.code) login(p.code); else render();
})();

h1{font-size:19px;margin:0;letter-spacing:-.015em}h2{font-size:14.5px;margin:0}
.hd{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;
  padding-bottom:15px;margin-bottom:18px;border-bottom:1px solid var(--l)}
.hd .sub{font-size:12.5px;color:var(--i3);margin-top:4px}
.mk{width:32px;height:32px;border-radius:7px;background:var(--a);flex:none}
.bd{display:flex;gap:11px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--l);
  border:1px solid var(--l);border-radius:10px;overflow:hidden;margin-bottom:18px}
.kpi{background:var(--s);padding:13px 15px}
.kpi .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--i3)}
.kpi .v{font-size:25px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi.h .v{color:var(--w)}
.kpi .n{font-size:11.5px;color:var(--i3);margin-top:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--l);margin-bottom:14px}
.tb{border:0;background:none;padding:9px 13px 10px;font:inherit;font-size:13.5px;font-weight:500;color:var(--i2);
  border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px;cursor:pointer}
.tb[aria-selected=true]{color:var(--a);border-bottom-color:var(--a);font-weight:600}
.card{background:var(--s);border:1px solid var(--l);border-radius:10px;padding:15px 17px 17px}
.tw{overflow:auto;border:1px solid var(--l);border-radius:8px;max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;background:var(--s)}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--l);white-space:nowrap}
th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--i3);background:var(--s2);
  position:sticky;top:0;z-index:2;border-bottom:1px solid var(--l2);text-align:right}
th.l,td.l{text-align:left}
tbody tr:nth-child(even) td{background:var(--s2)}
tbody tr:hover td{background:var(--asoft)}
.tot td{font-weight:700;background:var(--s3)!important}
.z{color:var(--i3);opacity:.5}.mut{color:var(--i3)}
.srch{font:inherit;font-size:13px;background:var(--s);color:var(--i);border:1px solid var(--l2);border-radius:7px;padding:6px 10px;width:220px;margin-bottom:11px}
.ft{margin-top:20px;font-size:11.5px;color:var(--i3);line-height:1.6;max-width:90ch}
.note{background:var(--s2);border:1px solid var(--l);border-left:3px solid var(--a);border-radius:7px;padding:10px 14px;font-size:12.5px;color:var(--i2);margin-bottom:16px}
@media print{.tabs,.srch{display:none}.tw{max-height:none;overflow:visible}th{position:static}
 .card{break-inside:auto;border:0;padding:0}.sec{display:block!important;break-before:page}body{background:#fff}}
</style></head><body><div class="wrap">
<div class="hd"><div class="bd"><span class="mk"></span><div><h1>Récap Corridor</h1>
  <div class="sub">${esc(periode)}</div></div></div>
  <div class="sub" style="text-align:right">${esc(ags.length===allAgences().length?'Toutes les agences':ags.join(' · '))}<br>${esc(mets.join(' · '))}<br>Édité le ${genere}</div></div>
<div class="note">Rapport figé, extrait de l'outil Récap Corridor. Les chiffres sont ceux du périmètre indiqué ci-dessus. Un repos hors résidence est compté à chaque coupure passée ailleurs qu'à la résidence de l'agence, de jour comme de nuit ; les AFR en sont exclus. Une journée blanche est une journée sans mission ni code, encadrée par deux services.</div>
<div class="kpis">${kpis.map(k=>`<div class="kpi${k[3]?' h':''}"><div class="k">${esc(k[0])}</div><div class="v">${esc(k[1])}</div><div class="n">${esc(k[2])}</div></div>`).join('')}</div>
<div class="tabs" role="tablist">${SH.map(([k,l],i)=>`<button class="tb" role="tab" data-s="${k}" aria-selected="${i===0}">${l}<span class="mut" style="font-size:11px;margin-left:5px">${t[k].rows.length}</span></button>`).join('')}</div>
<div class="card">${SH.map(([k],i)=>`<div class="sec" data-s="${k}"${i?' style="display:none"':''}>
  ${k==='agents'?'<input class="srch" type="search" placeholder="Filtrer par nom ou matricule" data-f="agents">':''}
  ${tbl(k)}</div>`).join('')}</div>
<p class="ft">Document de travail contenant des données nominatives d'agents. À diffuser uniquement aux personnes habilitées.<br>
Produit automatiquement à partir de l'extraction ARP « Récap National Corridor ».</p>
</div><script>
document.addEventListener('click',e=>{const b=e.target.closest('.tb');if(!b)return;
 document.querySelectorAll('.tb').forEach(x=>x.setAttribute('aria-selected',x===b));
 document.querySelectorAll('.sec').forEach(s=>s.style.display=s.dataset.s===b.dataset.s?'':'none');});
document.addEventListener('input',e=>{const f=e.target.closest('[data-f]');if(!f)return;
 const q=f.value.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');
 f.closest('.sec').querySelectorAll('tbody tr').forEach(tr=>{
  tr.style.display=!q||tr.textContent.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').includes(q)?'':'none';});});
<\/script></body></html>`;
}

</script>
</body>
</html>
