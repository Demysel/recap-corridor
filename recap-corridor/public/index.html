<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Extraction hebdomadaire des fichiers Récap National Corridor : repos hors résidence, journées blanches, heures, paniers et données par agent, métier et agence.">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1118" media="(prefers-color-scheme: dark)">
<title>Récap Corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=Overpass+Mono:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23175E82'/%3E%3Cpath d='M16 5v22' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='10' r='3.4' fill='%23175E82' stroke='%23fff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='22' r='3.4' fill='%23F2B233'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Jetons de conception
   Identité : la « ligne » ferroviaire — navigation en stations, signal ambre
   pour ce qui demande attention, chiffres en police à chasse fixe.
   ========================================================================== */
:root{
  --ground:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#E8ECF1;
  --line:#DCE2EA; --line-2:#C2CBD6;
  --ink:#0E1826; --ink-2:#44536A; --ink-3:#6E7E93;
  --accent:#175E82; --accent-2:#0E4460; --accent-soft:#E2EEF5; --accent-line:#A9CCE0; --on-accent:#fff;
  --signal:#F2B233; --signal-ink:#8A5A00; --signal-soft:#FDF3DE; --signal-line:#EDC77A;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#1B7A4B; --good-soft:#E1F1E8;
  --warn:#8A5A00; --warn-soft:#FDF3DE; --warn-line:#EDC77A;
  --crit:#A8231C; --crit-soft:#FBE6E4;
  --night:rgba(34,52,94,.10);
  --shadow:0 1px 2px rgba(14,24,38,.06), 0 6px 22px -8px rgba(14,24,38,.14);
  --shadow-lg:0 24px 60px -18px rgba(14,24,38,.35);
  --r:14px; --r-s:10px;
  --sans:"Overpass",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --cond:"Overpass",-apple-system,"Segoe UI",sans-serif;
  --mono:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1118; --surface:#131B26; --surface-2:#18222F; --surface-3:#212C3A;
  --line:#253141; --line-2:#344357;
  --ink:#E8EEF5; --ink-2:#A6B4C6; --ink-3:#7A8BA1;
  --accent:#6FB6D9; --accent-2:#9AD0EA; --accent-soft:#13303F; --accent-line:#2A5870; --on-accent:#08121A;
  --signal:#F2B233; --signal-ink:#F5C766; --signal-soft:#2D2310; --signal-line:#6A5020;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#5FC48D; --good-soft:#12301F;
  --warn:#F5C766; --warn-soft:#2D2310; --warn-line:#6A5020;
  --crit:#F08A83; --crit-soft:#381513;
  --night:rgba(120,150,220,.10);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0B1118; --surface:#131B26; --surface-2:#18222F; --surface-3:#212C3A;
  --line:#253141; --line-2:#344357;
  --ink:#E8EEF5; --ink-2:#A6B4C6; --ink-3:#7A8BA1;
  --accent:#6FB6D9; --accent-2:#9AD0EA; --accent-soft:#13303F; --accent-line:#2A5870; --on-accent:#08121A;
  --signal:#F2B233; --signal-ink:#F5C766; --signal-soft:#2D2310; --signal-line:#6A5020;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#5FC48D; --good-soft:#12301F;
  --warn:#F5C766; --warn-soft:#2D2310; --warn-line:#6A5020;
  --crit:#F08A83; --crit-soft:#381513;
  --night:rgba(120,150,220,.10);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{padding:0;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px);transition:background .25s}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
.sm{font-size:12.5px}.mut{color:var(--ink-3)}.mt{margin-top:12px}.mb{margin-bottom:14px}
.nb{font-weight:400}.z{color:var(--ink-3);opacity:.5}
.mono{font-family:var(--mono);font-size:12px}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink-3);background:var(--surface)}

/* ---------- ossature : ligne latérale + contenu ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:22px 18px 18px 22px;
  border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:36px;height:36px;border-radius:11px;background:var(--accent);flex:none;display:grid;place-items:center;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.mark svg{width:22px;height:22px;display:block}
.brand h1{font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand p{margin-top:2px;font-size:11.5px;color:var(--ink-3)}
.side-f{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.side-f .btns{gap:6px}
.side-f .btn{flex:1;justify-content:center}
.main{min-width:0;padding:0 28px 70px}

/* navigation « ligne » : chaque onglet est une station */
.tabs{position:relative;display:flex;flex-direction:column;gap:2px;margin:0;padding:0}
.tabs::before{content:"";position:absolute;left:10px;top:16px;bottom:16px;width:2px;border-radius:2px;background:var(--line-2)}
.tab{position:relative;display:flex;align-items:center;gap:12px;border:0;background:none;padding:8px 10px 8px 0;
  font-size:14px;font-weight:500;color:var(--ink-2);border-radius:10px;text-align:left;transition:color .15s,background .15s}
.tab .stn{position:relative;z-index:1;width:22px;height:22px;flex:none;display:grid;place-items:center}
.tab .stn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);
  transition:transform .25s var(--ease),background .2s,border-color .2s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab:hover .stn::before{transform:scale(1.15);border-color:var(--ink-3)}
.tab[aria-selected=true]{color:var(--ink);font-weight:700}
.tab[aria-selected=true] .stn::before{width:12px;height:12px;background:var(--accent);border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft)}
.tab .tl{flex:1;min-width:0}
.tab .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--surface-3);border-radius:999px;padding:1px 7px}
.tab[aria-selected=true] .cnt{background:var(--accent-soft);color:var(--accent)}
.tab.adm{margin-top:4px}
.tsep{height:10px}

/* barre de filtres */
.top{position:sticky;top:0;z-index:40;margin:0 -28px;padding:14px 28px 12px;
  background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.top.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 20px -18px rgba(0,0,0,.5)}
.crumb{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.crumb h2{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.crumb .ctx{font-size:12.5px;color:var(--ink-3)}
.fbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.grow{flex:1}
.flabel{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
select,input[type=text],input[type=search],input[type=password]{font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:10px;padding:7px 11px;max-width:100%;transition:border-color .15s,box-shadow .15s}
select:hover,input:hover{border-color:var(--ink-3)}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.srch{position:relative}
.srch input{width:230px;padding-left:32px;padding-right:34px}
.srch::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;margin-top:-7px;border:2px solid var(--ink-3);border-radius:50%}
.srch::after{content:"";position:absolute;left:21px;top:50%;width:6px;height:2px;margin-top:4px;background:var(--ink-3);transform:rotate(45deg);border-radius:2px}
.srch kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.srch input:focus+kbd,.srch input:not(:placeholder-shown)+kbd{display:none}
.sel{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:7px 12px;font-size:13.5px;
  display:inline-flex;align-items:center;gap:9px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color .15s}
.sel:hover{border-color:var(--ink-3)}
.sel .car{color:var(--ink-3);font-size:10px;transition:transform .2s}
.sel[aria-expanded=true]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel[aria-expanded=true] .car{transform:rotate(180deg)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--surface-3);color:var(--ink-2);border-radius:999px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.badge.ro::before{background:var(--ink-3)}
.scope{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);animation:drop .22s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.sgrp{display:flex;flex-direction:column;gap:7px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;
  font-weight:500;color:var(--ink-2);transition:all .15s var(--ease);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.chip:active{transform:none}
.chip-mini{font-size:11.5px;padding:3px 10px}
.chip.ghost{border-style:dashed}
.chipset{display:flex;gap:5px;flex-wrap:wrap}

/* boutons */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 4px 14px -6px var(--accent)}
.btn-pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.dgr{border-color:var(--crit);color:var(--crit)}
.btn.dgr:hover{background:var(--crit-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn .ic{width:15px;height:15px;flex:none}

/* ---------- cartes & vue ---------- */
.stack{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:16px 19px 0}
.card-h h2{font-size:15.5px;letter-spacing:-.015em}
.card-s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.card-b{padding:13px 19px 19px}
.card-h .btns{align-items:center}
.prose{max-width:78ch}
.prose p{margin-bottom:11px}.prose p:last-child{margin-bottom:0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.cols2{grid-template-columns:1fr}}
/* entrée d'onglet : les blocs arrivent en cascade, une seule fois par changement d'onglet */
.enter>*{animation:rise .42s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}
.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 15px;min-width:0;
  box-shadow:var(--shadow);overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 14px 30px -18px rgba(14,24,38,.4)}
.kpi .k{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.kpi .v small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.kpi .n{font-size:12px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.35}
.kpi.hot{border-color:var(--signal-line)}
.kpi.hot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--signal)}
.kpi.hot .k{color:var(--signal-ink)}

/* tableaux */
.tw{overflow:auto;border-radius:var(--r-s);border:1px solid var(--line);overscroll-behavior:contain}
.tw.tall{max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums;background:var(--surface)}
th,td{text-align:right;padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-feature-settings:"tnum"}
th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  background:var(--surface-2);position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line-2)}
tr.grp th{top:0;z-index:4;background:var(--surface-3);color:var(--ink-2);border-right:1px solid var(--line);
  font-size:10px;letter-spacing:.1em;padding-block:5px}
table.sticky1 thead tr:nth-child(2) th{top:25px}
table.sticky1 thead tr:only-child th{top:0}
th.s{cursor:pointer;user-select:none;transition:color .15s}
th.s:hover{color:var(--ink)}
th.s[data-dir]{color:var(--accent)}
th.s[data-dir]::after{content:"▾";margin-left:3px;font-size:9px}
th.s[data-dir=asc]::after{content:"▴"}
td.l,th.l{text-align:left}
th.st,td.st{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
th.st{z-index:5;background:var(--surface-2)}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tbody tr:nth-child(even) td.st{background:var(--surface-2)}
tbody tr td{transition:background .1s}
tbody tr:hover td,tbody tr:hover td.st{background:var(--accent-soft)}
tbody tr.clk{cursor:pointer}
tbody tr.clk td:first-child{box-shadow:inset 3px 0 0 transparent;transition:box-shadow .15s,background .1s}
tbody tr.clk:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tot td{font-weight:700;background:var(--surface-3)!important;border-top:1px solid var(--line-2)}
.nm{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:baseline}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;line-height:1.6}
.pill-w{background:var(--signal-soft);color:var(--signal-ink)}
.pill-c{background:var(--crit-soft);color:var(--crit)}
.pill-g{background:var(--good-soft);color:var(--good)}
.pill-a{background:var(--accent-soft);color:var(--accent)}
.pill-n{background:var(--surface-3);color:var(--ink-2)}

/* bande semaine (détail des cases) */
.band{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.bd{border:1px solid var(--line);border-radius:9px;padding:6px 8px 8px;min-height:70px;background:var(--surface-2);overflow:hidden}
.bd .dn{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:4px}
.bd .ml{font-family:var(--mono);font-size:10.5px;line-height:1.3;margin-top:3px;word-break:break-word}
.bd .od{font-size:10.5px;color:var(--ink-2)}
.bd .od.mt{margin-top:6px}
.bd .hr{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.bd .sep{border-top:1px solid var(--accent-line);margin:4px 0}
.bd-svc{background:var(--accent-soft);border-color:var(--accent-line)}
.bd-code .cd{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:6px;font-weight:500}
.bd-vide{background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--surface-3) 5px,var(--surface-3) 10px)}
.bd-blanche{background:var(--surface);border:1.5px dashed var(--signal)}
.bd-blanche .cd{color:var(--signal-ink);font-size:11px;font-weight:700;margin-top:6px}
.bd-hors{box-shadow:inset 0 -3px 0 var(--signal)}
.bd .hc{margin-top:5px;padding-top:4px;border-top:1px dashed var(--warn-line);font-size:10px;color:var(--ink-3);line-height:1.35;word-break:break-word}
.bd .hc s{font-family:var(--mono)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding-top:11px}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line-2);flex:none}
.sw-svc{background:var(--accent-soft);border-color:var(--accent-line)}
.sw-code{background:var(--surface-2)}
.sw-bl{background:var(--surface);border:1.5px dashed var(--signal)}
.sw-hr{background:var(--surface);box-shadow:inset 0 -3px 0 var(--signal)}
.sw-bar{background:var(--accent);border-color:var(--accent)}
.sw-pause{background:repeating-linear-gradient(135deg,var(--surface) 0 2px,var(--accent-line) 2px 4px);border-color:var(--accent-line)}
.sw-rhr{background:var(--signal-soft);border:1.5px dashed var(--signal)}
.sw-nuit{background:var(--night);border-color:var(--line)}

/* frise horaire d'une semaine (lecture de la semaine) */
.tl-w{position:relative;overflow-x:auto;overscroll-behavior-x:contain}
.tl-w svg{display:block;width:100%;height:auto;overflow:visible}
.tl-day{font-size:11px;font-weight:700;fill:var(--ink-2);letter-spacing:.02em}
.tl-date{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}
.tl-h{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}
.tl-row{fill:var(--surface-2)}
.tl-g{stroke:var(--line);stroke-width:1}
.tl-nuit{fill:var(--night)}
.tl-svc{fill:var(--accent);transition:opacity .15s}
.tl-svc:hover{opacity:.8}
.tl-pause{fill:url(#tlHatch)}
.tl-rhr{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.2;stroke-dasharray:4 3}
.tl-code{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2);font-weight:600}
.tl-bl{fill:none;stroke:var(--signal);stroke-width:1.4;stroke-dasharray:5 4}
.tl-blt{font-size:10.5px;font-weight:700;fill:var(--signal-ink)}
.tl-lab{font-family:var(--mono);font-size:9.5px;fill:var(--on-accent);pointer-events:none;font-weight:600}
.tl-hc{fill:none;stroke:var(--crit);stroke-width:1.2;stroke-dasharray:2 2}

/* graphiques */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.chart{max-width:760px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ct{font-size:11px;fill:var(--ink-3);letter-spacing:.02em}
.cv{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.cvb{font-family:var(--mono);font-size:11px;fill:var(--ink);font-weight:600}
.grid-l{stroke:var(--line);stroke-width:1}
.axis-l{stroke:var(--line-2);stroke-width:1}
.hovz{fill:transparent;cursor:crosshair}
.hovz:hover{fill:var(--accent-soft);opacity:.45}
.clg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding-top:10px}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;margin-right:5px}
.ch{font-size:13px;color:var(--ink-2);margin:4px 0 11px;font-weight:700}
.ctrls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;padding-bottom:14px;margin-bottom:13px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.sg{border:0;background:none;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);border-radius:8px;transition:background .18s,color .18s,box-shadow .18s}
.sg:hover{color:var(--ink)}
.sg[aria-pressed=true]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(14,24,38,.14)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:12px;align-items:center;font-size:12.5px;cursor:default;border-radius:6px}
.bar:hover .bl{color:var(--ink)}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);transition:color .15s}
.bt{background:var(--surface-3);border-radius:4px;height:14px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px;transform-origin:left;animation:grow .6s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.bar:hover .bt i{filter:brightness(1.08)}
.bv{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;min-width:32px}
.tip{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:var(--shadow-lg);padding:9px 12px;font-size:12px;pointer-events:none;max-width:290px;color:var(--ink)}
.tip .tr{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums;margin-top:3px}

/* import / listes */
.drop{position:relative;border:2px dashed var(--line-2);border-radius:var(--r);padding:40px 20px;text-align:center;background:var(--surface-2);transition:all .2s var(--ease)}
.drop.on{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.01)}
.drop .dic{width:44px;height:44px;margin:0 auto 12px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.drop h3{font-size:16px;margin-bottom:5px}
.drop p{color:var(--ink-3);font-size:13px}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;
  padding:11px 14px;font-size:13px;color:var(--ink-2)}
.note.w{border-left-color:var(--signal);background:var(--signal-soft);color:var(--signal-ink)}
.note.c{border-left-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.note b{color:var(--ink)}
.note.w b,.note.c b{color:inherit}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 14px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:12px;flex-wrap:wrap;transition:border-color .15s}
.row:hover{border-color:var(--line-2)}
.row .rl{min-width:0;flex:1}
.row .rt{font-weight:700;font-size:14px}
.row .rs{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.ract{display:flex;gap:6px;flex-wrap:wrap}
.qd{width:100%;font-size:12.5px;color:var(--ink-2)}
.lienf{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.lienf select{max-width:320px;font-size:12.5px}
.lnk{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.lnk:hover .nm{color:var(--accent);text-decoration:underline}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 8px}
.qd summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
.qd summary::-webkit-details-marker{display:none}
.qd summary::before{content:"▸";transition:transform .15s}
.qd[open] summary::before{transform:rotate(90deg)}
.qd ul{margin:8px 0 0;padding-left:18px;max-height:220px;overflow:auto}
.qd li{margin:2px 0}
.gauge{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.gauge .gt{width:70px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.gauge .gt i{display:block;height:100%;border-radius:99px}
.rules-l{display:flex;flex-direction:column;gap:10px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 15px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;transition:border-color .15s}
.rule:hover{border-color:var(--line-2)}
.rule input[type=checkbox]{margin:2px 0 0;flex:none;width:17px;height:17px;accent-color:var(--accent)}
.rule .sp{width:17px;flex:none}
.rule .rn{font-weight:700;font-size:13.5px;display:block}
.rule .rd{font-size:12.5px;color:var(--ink-2);margin-top:2px;display:block}
.rule .inl{display:inline-flex;gap:7px;align-items:center;margin-top:9px}
.rule .inl input{width:70px}
.rule .inl+.inl{margin-left:18px}
.sm-i{width:120px}
.empty{text-align:center;padding:58px 20px;color:var(--ink-3)}
.empty .eic{width:60px;height:60px;margin:0 auto 14px;opacity:.9}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:7px}
.empty p{margin:0 auto;max-width:50ch;font-size:13.5px}
.hint{font-size:12px;color:var(--ink-3);margin-top:8px}

/* guide de lecture */
.gd{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
.gd .card-b{display:flex;flex-direction:column;gap:12px}
.dg svg{display:block;width:100%;max-width:760px;height:auto;overflow:visible}
.dg text{font-family:var(--sans)}
.dg .t{font-size:11.5px;fill:var(--ink-2)}
.dg .tb{font-size:12px;fill:var(--ink);font-weight:700}
.dg .tm{font-family:var(--mono);font-size:11px;fill:var(--ink-2)}
.dg .tmu{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}
.dg .ts{font-size:11px;fill:var(--signal-ink);font-weight:700}
.dg .ta{font-size:11px;fill:var(--accent);font-weight:700}
.dg .box{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1}
.dg .boxa{fill:var(--accent-soft);stroke:var(--accent-line);stroke-width:1}
.dg .svc{fill:var(--accent)}
.dg .pz{fill:url(#dgHatch);stroke:var(--accent-line)}
.dg .rhr{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.3;stroke-dasharray:5 3}
.dg .nuit{fill:var(--night)}
.dg .ln{stroke:var(--line-2);stroke-width:1.2;fill:none}
.dg .lna{stroke:var(--accent);stroke-width:2;fill:none}
.dg .lns{stroke:var(--signal);stroke-width:2;fill:none}
.dg .bl{fill:var(--surface);stroke:var(--signal);stroke-width:1.5;stroke-dasharray:5 4}
.dg .vide{fill:url(#dgVide);stroke:var(--line)}
.dg .flow{stroke-dasharray:6 6;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.cap{font-size:13px;color:var(--ink-2);line-height:1.55}
.cap b{color:var(--ink)}
.qual{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.qi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.qi .qh{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px}
.qi p{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.lvl{width:9px;height:9px;border-radius:50%;flex:none}
.lvl.ok{background:var(--good)}.lvl.mid{background:var(--signal)}.lvl.lo{background:var(--crit)}

/* tiroir agent */
.ov{position:fixed;inset:0;background:rgba(6,12,20,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60;display:flex;justify-content:flex-end;animation:fade .2s ease both}
.ov.out{animation:fade .18s ease reverse both}
.ov.out .dw{animation:slide .2s var(--ease) reverse both}
@keyframes fade{from{opacity:0}}
.dw{background:var(--ground);width:min(860px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow-lg);
  padding:0 22px 48px;display:flex;flex-direction:column;gap:16px;animation:slide .32s var(--ease) both;overscroll-behavior:contain}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.dw-h{position:sticky;top:0;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:18px 0 13px;border-bottom:1px solid var(--line);z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dw-h h2{font-size:21px;font-weight:800;letter-spacing:-.025em}
.dw-h .s{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.x{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;width:34px;height:34px;flex:none;font-size:19px;line-height:1;display:grid;place-items:center;transition:background .15s,transform .15s}
.x:hover{background:var(--surface-2);transform:rotate(90deg)}
.ml2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ml2>div{padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ml2 .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ml2 .v{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.02em}
.ml2 .v small{font-size:11.5px;font-weight:500}
.dw>*{flex-shrink:0}

/* messages éphémères */
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;max-width:420px;background:var(--ink);color:var(--surface);
  border-radius:12px;padding:11px 15px;font-size:13px;box-shadow:var(--shadow-lg);animation:toast .35s var(--ease) both}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);margin-top:6px;flex:none}
.toast.w::before{background:var(--signal)}.toast.c::before{background:var(--crit)}
@keyframes toast{from{opacity:0;transform:translateY(12px) scale(.97)}}

/* chargement */
.loadbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:100;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .2s}
.loading .loadbar{opacity:1}
.loadbar::before{content:"";position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,var(--accent),var(--signal));animation:load 1.1s ease-in-out infinite}
@keyframes load{from{left:-35%}to{left:100%}}

/* connexion */
.lgw{min-height:100dvh;display:grid;place-items:center;padding:24px 18px;
  background:radial-gradient(1200px 600px at 10% -10%,var(--accent-soft),transparent 60%),var(--ground)}
.lg-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);
  padding:28px 28px 24px;width:min(430px,100%);display:flex;flex-direction:column;gap:16px;animation:rise .5s var(--ease) both}
.lg-line{height:50px;margin:-4px 0 0}
.lg-line svg{width:100%;height:100%;display:block;overflow:visible}
.lgrun{stroke-dasharray:360;stroke-dashoffset:360;animation:run 1.6s var(--ease) .2s forwards}
@keyframes run{to{stroke-dashoffset:0}}
.lg-h{display:flex;gap:13px;align-items:flex-start}
.lg-h h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
.lg-h p{font-size:13px;color:var(--ink-3);margin-top:4px}
.lg-card input{width:100%;font-family:var(--mono);letter-spacing:.08em;padding:11px 13px;font-size:15px}
.lg-b{justify-content:center;padding:11px;font-size:14.5px}
.lg-n{font-size:12px;color:var(--ink-3);line-height:1.5}

/* ---------- petits écrans : la ligne passe à l'horizontale ---------- */
@media (max-width:1080px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:45;height:auto;flex-direction:column;gap:10px;padding:12px 16px 0;border-right:0;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .side-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .side-f{display:none}
  .tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:0;margin:0 -16px;padding:0 16px 2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs::before{left:16px;right:16px;top:auto;bottom:13px;width:auto;height:2px}
  .tab{flex-direction:column-reverse;gap:4px;padding:6px 12px 3px;font-size:12.5px;white-space:nowrap;border-radius:8px}
  .tab .cnt{display:none}
  .tab.adm{margin-top:0}
  .tsep{display:none}
  .main{padding:0 16px 60px}
  .top{position:static;margin:0 -16px;padding:14px 16px 4px;background:none;backdrop-filter:none}
  .m-act{display:flex!important}
}
.m-act{display:none;gap:6px}
@media (min-width:1081px){.side-top{display:block}}
@media (max-width:640px){
  .crumb h2{font-size:20px}
  .fbar{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fbar>.fld:nth-child(3){grid-column:1/-1}
  .fld.grow,.fbar .btn-pri{display:none}
  .fbar>.fld:last-child:not(:nth-child(-n+3)){display:none}
  .srch input,.sel,select{width:100%;max-width:none}
  .tl-w svg{min-width:620px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .kpi{padding:12px 13px}
  .kpi .v{font-size:22px}
  .band{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dw{padding-inline:15px}
  .tw.tall{max-height:66vh}
  .gd{grid-template-columns:1fr}
  .charts{grid-template-columns:1fr}
  .toasts{left:16px;right:16px;align-items:stretch}
  .card-h{padding:14px 15px 0}.card-b{padding:12px 15px 16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
  .side,.top,.fbar,.scope,.ract,.chipset,.btn,.ov,.toasts,.loadbar,.seg{display:none!important}
  .app{display:block}
  body{background:#fff}
  .main{padding:0}
  .card,.kpi{box-shadow:none;break-inside:avoid;border-color:#bbb}
  .tw,.tw.tall{max-height:none;overflow:visible}
  th{position:static}
  .kpis{break-inside:avoid}
  .enter>*{animation:none}
}

<script>
/* ==========================================================================
   1. LECTURE DU FICHIER .XLSX  (ZIP + XML, sans dépendance externe)
   Seules les parties utiles du classeur sont décompressées : les fichiers
   lourds (images, autres feuilles) ne ralentissent plus la lecture.
   ========================================================================== */
async function inflateRaw(bytes){
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function readZip(ab){
  const by=new Uint8Array(ab), dv=new DataView(ab);
  let eo=-1; const max=Math.min(by.length,66000);
  for(let i=by.length-22;i>=by.length-max&&i>=0;i--) if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0) throw new Error("Ce fichier n'est pas un classeur Excel (.xlsx) lisible.");
  let n=dv.getUint16(eo+10,true), cd=dv.getUint32(eo+16,true);
  if(cd===0xffffffff||n===0xffff){
    for(let i=eo-20;i>=0;i--) if(dv.getUint32(i,true)===0x07064b50){
      const z=Number(dv.getBigUint64(i+8,true));
      if(dv.getUint32(z,true)===0x06064b50){n=Number(dv.getBigUint64(z+32,true));cd=Number(dv.getBigUint64(z+48,true));}
      break;}
  }
  const dec=new TextDecoder('utf-8'), ent=[]; let p=cd;
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true); let cs=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    let off=dv.getUint32(p+42,true);
    const name=dec.decode(by.subarray(p+46,p+46+nl));
    if(cs===0xffffffff||off===0xffffffff){
      let e=p+46+nl; const end=e+xl;
      while(e<end){ const hid=dv.getUint16(e,true), hs=dv.getUint16(e+2,true);
        if(hid===1){ let q=e+4;
          if(dv.getUint32(p+24,true)===0xffffffff) q+=8;
          if(cs===0xffffffff){cs=Number(dv.getBigUint64(q,true));q+=8;}

function parseWeek(rows){

  if(!L) throw new Error("En-têtes introuvables : aucune ligne ne contient « Matricule » et « Nom » dans les 15 premières lignes de la feuille.");
  if(L.err==='jours') throw new Error(`Colonnes des jours introuvables : ni « Lundi »…« Dimanche », ni sept dates qui se suivent autour de la ligne ${L.h+1}.`);
  if(L.err==='date') throw new Error(`Date du lundi introuvable : aucune date au-dessus ou en dessous de « Lundi » (lignes ${L.h}–${L.h+2}).`);
  if(L.cMat<0||L.cNom<0) throw new Error("Colonnes Matricule ou Nom introuvables.");
  let {cMat,cNom,cPre,cCor,cAge,cMet,cLun,mon}=L;
  if(cPre<0)cPre=cNom+1;
  const ex=L.ex;
  const days=Array.from({length:7},(_,i)=>new Date(mon.getTime()+i*864e5));
  const {year,week}=isoWeek(mon);

  const anomalies=[], agents=[];
  for(let i=L.start;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.length) continue;
    const mat=r[cMat], nom=r[cNom];
    if((mat==null)&&(nom==null)) continue;
    if(!nom&&!mat) continue;
    if(mat==null&&!r.slice(cLun,cLun+7).some(v=>v!=null)) continue;   // lignes de légende ou de totaux en bas de feuille
    const jours=[];
    for(let d=0;d<7;d++){
      const c=parseDayCell(r[cLun+d],mon);
      (c.anom||[]).forEach(a=>anomalies.push({agent:`${nom??''} ${r[cPre]??''}`.trim(),jour:JN[d],message:a}));
      delete c.anom; jours.push(c);
    }
    agents.push({
      matricule: mat==null?'':String(mat).trim(),
      nom:String(nom??'').trim(), prenom:String(r[cPre]??'').trim(),
      corridor:cCor>=0?String(r[cCor]??'').trim():'',
      agence:(cAge>=0?String(r[cAge]??'').trim():'')||'(sans agence)',
      metier:(cMet>=0?normMetier(r[cMet]):'')||'(SANS MÉTIER)',
      jours
    });
  }
  if(!agents.length) throw new Error("Aucune ligne d'agent trouvée sous les en-têtes.");

    meta:{format:2, weekId:`${year}-S${String(week).padStart(2,'0')}`, year, week,
      monday:isoD(mon), sunday:isoD(days[6]), days:days.map(isoD),
      extractDate:ex?isoD(ex):null, nbAgents:agents.length,
      corridors:[...new Set(agents.map(a=>a.corridor).filter(Boolean))]},
    agents, anomalies};
}

      if(cp){ cp.fin=pm.start; cp.dureeH=p.dureeH; cp.retour=pm.label; if(cp.statut==='ouvert') cp.statut='rhr'; }
      // la durée n'est connue qu'ici : un arrêt plus court que le minimum n'est pas un RHR
      const na=idx.get(personKey(a));
      const reposApres=rules.rhrCoupeParRepos&&(na.jours||[]).some((j,d)=>j.kind==='CODE'&&j.family!=='HORS'&&new Date(n.meta.monday+'T00:00:00Z').getTime()+d*DAY<fin.getTime());
      const court=p.dureeH<rules.rhrMinHours&&p.manuel!=='oui';
      const repos=!court&&reposApres&&p.manuel!=='oui';
      if(court||repos){ a.rhr.splice(a.rhr.indexOf(p),1); a.nbRHR=a.rhr.length; a.rhrLieux=[...new Set(a.rhr.map(x=>x.lieu))]; if(cp){cp.statut=court?'court':'repos';cp.compte=false;} }

      a.rhrNuits=a.rhr.reduce((s,x)=>s+(x.nuits||0),0);
      if(court||repos) continue;
      if(rules.panierRHR){   // paniers pris pendant la partie du RHR qui déborde sur la semaine suivante
        const seen=new Set(a.paniers.map(q=>q.date+'|'+q.plage));
        const sun1=new Date(c.meta.sunday+'T00:00:00Z').getTime()+DAY, e=fin.getTime(), s=deb.getTime();
        for(let d=sun1;d<=e;d+=DAY) for(const [nom,[de,aa]] of [['midi',rules.panierMidi],['soir',rules.panierSoir]]){
          const [w0,w1]=windowOf(d,de,aa), k=isoD(new Date(d))+'|'+nom;

        }
        a.nbPaniers=a.paniers.length; a.paniersMidi=a.paniers.filter(q=>q.plage==='midi').length;
        a.paniersSoir=a.paniers.filter(q=>q.plage==='soir').length; a.paniersRHR=a.paniers.filter(q=>q.source==='RHR').length;
      }
    }
  }
}

function agg(list){
  const persons=new Set(list.map(personKey)), withRHR=list.filter(a=>a.nbRHR>0);
  const o={nbLignes:list.length, nbAgents:persons.size,
    nbSemaines:new Set(list.map(a=>a.weekId)).size||1,
    agentsAvecRHR:new Set(withRHR.map(personKey)).size, lignesAvecRHR:withRHR.length,
    agentsAvecBlanche:new Set(list.filter(a=>a.journeesBlanches>0).map(personKey)).size,
    agentsHeuresSup:new Set(list.filter(a=>a.heuresSup>0).map(personKey)).size,
    rhrEnCours:list.reduce((s,a)=>s+a.rhr.filter(x=>x.enCours&&!x.fin).length,0)};

  o.ratioPanierJS=o.joursService?r2(o.nbPaniers/o.joursService):0;

function mergeAcrossWeeks(rows){
  const out=[];
  for(const [,list] of groupBy(rows,personKey)){
    list.sort((a,b)=>String(a.weekId).localeCompare(String(b.weekId)));
    const last=list[list.length-1];
    const p={...last, parSemaine:list, nbSemaines:list.length, semaines:list.map(a=>a.weekId),
      agences:[...new Set(list.map(a=>a.agence))],
      rhr:list.flatMap(a=>a.rhr.map(r=>({...r,weekId:a.weekId}))),
      blanches:list.flatMap(a=>a.blanches.map(b=>({...b,weekId:a.weekId}))),
      rhrLieux:[...new Set(list.flatMap(a=>a.rhrLieux))],
      rhrApplicable:list.some(a=>a.rhrApplicable), fusion:list.some(a=>a.fusion)?list.find(a=>a.fusion).fusion:null,
      jamaisEnResidence:list.every(a=>a.jamaisEnResidence), warnings:list.flatMap(a=>a.warnings)};
    for(const f of FIELDS) p[f.k]=r2(list.reduce((s,a)=>s+(a[f.k]||0),0));
    for(const k of ['pauseTotaleMin','joursVides','nbHorsColonne','pausesInconnues']) p[k]=list.reduce((s,a)=>s+(a[k]||0),0);
    p.rhrEnCours=p.rhr.filter(x=>x.enCours&&!x.fin).length;
    p.amplitudeMoyenne=p.joursService?r2(p.amplitudeTotale/p.joursService):0;
    p.amplitudeMax=r2(Math.max(0,...list.map(a=>a.amplitudeMax||0)));
    const pr=list.map(a=>a.priseServicePlusTot).filter(x=>x!=null), fi=list.map(a=>a.finServicePlusTard).filter(x=>x!=null);
    p.priseServicePlusTot=pr.length?Math.min(...pr):null; p.finServicePlusTard=fi.length?Math.max(...fi):null;
    const sumObj=k=>list.reduce((o,a)=>{for(const [x,v] of Object.entries(a[k]||{})) o[x]=(o[x]||0)+v; return o;},{});
    p.codeCounts=sumObj('codeCounts'); p.typesMission=sumObj('typesMission'); p.destinations=sumObj('destinations');
    p.ratioPanierJS=p.joursService?r2(p.nbPaniers/p.joursService):0;
    out.push(p);

const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; }
  return t;
})();

function zipFiles(files){
  const parts=[], cd=[]; let off=0;

  for(const f of files){
    const name=te.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  }
  let cdLen=0; for(const c of cd) cdLen+=c.length;
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),
    ...u32(cdLen),...u32(off),...u16(0)]);
  const all=[...parts,...cd,eocd];
  let total=0; for(const a of all) total+=a.length;
  const out=new Uint8Array(total); let p=0;
  for(const a of all){ out.set(a,p); p+=a.length; }
  return out;
}

    {name:'xl/workbook.xml',data:te.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

function autoAlias(extra=[]){
  const raw=[...new Set([...S.weeks.flatMap(w=>w.agences||[]),...extra])];
  const known=raw.filter(a=>!/^agence\s/i.test(a)), out={};
  for(const a of raw){ if(!/^agence\s/i.test(a)) continue;
    const base=a.replace(/^agence\s+/i,'').trim(), k=normAg(base);
    const c=known.filter(x=>normAg(x).startsWith(k));
    out[a]=c.length===1?c[0]:base; }
  return out;
}
/** Règles effectivement appliquées : réglages + correspondances d'agences automatiques */
const effRules=(extra)=>({...S.rules,agencesAlias:{...autoAlias(extra),...(S.rules.agencesAlias||{})}});

const allMetiers=()=>[...new Set(S.weeks.flatMap(w=>w.metiers||[]).map(m=>normMetier(m)||m))].sort();
/** Règles lues sur le serveur : complète les champs récents ; la durée minimale d'un RHR passe à 4 h (septembre 2026) */
function loadRules(r){
  const o={...structuredClone(DEFAULT_RULES),...(r||{})};
  o.corrections={rhr:{},jb:{},liens:[],...(r&&r.corrections||{})};
  // version 3 (accord d'entreprise, art. 18 et annexe 1) : un RHR dure au moins 8 h
  if(!r||!(r.rulesVersion>=3)){ o.rhrMinHours=8; o.rulesVersion=3; }
  return o;
}

/** Lignes agent-semaine du périmètre (une par personne et par semaine, doublons du fichier déjà fusionnés) */
function scopeAgents(opts={}){
  const out=[];
  for(const id of (opts.allWeeks?S.weeks.map(w=>w.weekId):activeWeeks())){
    const w=S.loaded.get(id); if(!w) continue;
    for(const a of w.agents){
      if(S.selAgences&&!S.selAgences.includes(a.agence)) continue;
      if(S.selMetiers&&!S.selMetiers.includes(a.metier)) continue;
      if(S.search&&!deacc(`${a.nom} ${a.prenom} ${a.matricule}`).toLowerCase().includes(deacc(S.search).toLowerCase())) continue;
      out.push(a.weekId?a:Object.assign(a,{weekId:id}));
    }
  }
  return out;
}

async function ensureLoaded(ids){
  for(const id of ids){
    if(S.loaded.has(id)) continue;
    const {docs}=await withLoad(api.semaine(id));
    if(!docs||!docs.length) continue;
    const meta=docs[0].meta;
    const agents=docs.flatMap(d=>d.agents);
    S.parsedCache.set(id,{meta,agents});
    const v=applyRules({meta,agents},effRules()); v.agents.forEach(a=>a.weekId=id);
    S.loaded.set(id,v);
  }
  reconcile(new Map([...S.loaded.entries()].sort((a,b)=>a[0].localeCompare(b[0]))),S.rules);
}
function recomputeLoaded(){
  const R=effRules();
  for(const [id,p] of S.parsedCache){ const v=applyRules(p,R); v.agents.forEach(a=>a.weekId=id); S.loaded.set(id,v); }
  reconcile(new Map([...S.loaded.entries()].sort((a,b)=>a[0].localeCompare(b[0]))),S.rules);
}
/** L'évolution hebdomadaire et l'historique portent sur toutes les semaines enregistrées */
const needsAll=()=>['graphiques','exports'].includes(S.tab);
/** Semaines à charger : celles affichées, plus leurs voisines — un RHR ouvert le dimanche se referme avec la
    semaine suivante, quel que soit l'affichage, pour que les chiffres d'une semaine ne dépendent pas de la vue */
const toLoad=()=>{ if(needsAll()) return S.weeks.map(w=>w.weekId);
  const ids=S.weeks.map(w=>w.weekId).sort(), out=new Set(activeWeeks());
  for(const id of activeWeeks()){ const i=ids.indexOf(id); if(i>0) out.add(ids[i-1]); if(i>=0&&i<ids.length-1) out.add(ids[i+1]); }
  return [...out]; };

const niceStep=m=>{const raw=m/4,p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p;};

/** Courbes multi-séries avec repère et infobulle */
function lineChart(series,labels,fmt){
  if(!labels.length||!series.length) return '<p class="mut sm">Pas encore assez de semaines pour tracer une évolution.</p>';
  const W=720,Hh=240,ml=46,mr=58,mt=14,mb=28;
  const maxV=Math.max(1,...series.flatMap(s=>s.values.filter(v=>v!=null)));
  const step=niceStep(maxV), top=Math.ceil(maxV/step)*step||step;
  const X=i=>ml+(labels.length===1?(W-ml-mr)/2:i*(W-ml-mr)/(labels.length-1));
  const Y=v=>mt+(1-v/top)*(Hh-mt-mb);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step)
    g+=`<line class="grid-l" x1="${ml}" y1="${Y(v).toFixed(1)}" x2="${W-mr}" y2="${Y(v).toFixed(1)}"/>`
      +`<text class="cv" x="${ml-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${nf(v)}</text>`;
  labels.forEach((l,i)=>{ if(labels.length>10&&i%Math.ceil(labels.length/10)!==0&&i!==labels.length-1) return;
    g+=`<text class="ct" x="${X(i).toFixed(1)}" y="${Hh-9}" text-anchor="middle">${esc(l)}</text>`;});
  let p='';
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length) return;
    p+=`<path d="${pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(q=>p+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`);
    const last=pts[pts.length-1];
    p+=`<text class="cvb" x="${(last[0]+8).toFixed(1)}" y="${(last[1]+4).toFixed(1)}">${esc(s.short||s.name)}</text>`;
  });
  let hz='';
  labels.forEach((l,i)=>{
    const w=(W-ml-mr)/Math.max(1,labels.length-1);
    const rows=series.map(s=>({n:s.name,c:s.color,v:s.values[i]})).filter(r=>r.v!=null);
    hz+=`<rect class="hovz" x="${(X(i)-w/2).toFixed(1)}" y="${mt}" width="${w.toFixed(1)}" height="${Hh-mt-mb}"
      data-tip="${esc(`<b>${l}</b>`+rows.map(r=>`<span class="tr"><span><i class="cdot" style="background:${r.c}"></i>${r.n}</span><b>${fmt?fmt(r.v):nf(r.v)}</b></span>`).join(''))}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" preserveAspectRatio="xMidYMid meet">
    ${g}<line class="axis-l" x1="${ml}" y1="${mt}" x2="${ml}" y2="${Hh-mb}"/>${p}${hz}</svg></div>`;
}
/** Barres horizontales avec infobulle */
function barChart(items,opts={}){
  if(!items.length) return '<p class="mut sm">Aucune donnée sur ce périmètre.</p>';
  const max=Math.max(1,...items.map(i=>i.v));
  const f=opts.fmt||(v=>nf(v,opts.dec||0));
  return `<div class="bars">${items.map(i=>`
    <div class="bar" data-tip="${esc(`<b>${i.l}</b><span class="tr"><span>${opts.label||'Valeur'}</span><b>${f(i.v)}</b></span>${i.sub?`<span class="tr"><span>${i.sub2||''}</span><b>${i.sub}</b></span>`:''}`)}">
      <span class="bl">${esc(i.l)}</span>
      <span class="bt"><i style="width:${(i.v/max*100).toFixed(1)}%;background:${i.c||'var(--s1)'}"></i></span>
      <span class="bv">${f(i.v)}</span></div>`).join('')}</div>`;
}

function stable(id,cols,rows,opt={}){
  const st=S.sorts[id]||opt.sort||{k:cols[0].k,dir:'asc'};
  const col=cols.find(c=>c.k===st.k)||cols[0];
  const val=r=>col.v?col.v(r):r[col.k];
  const list=[...rows].sort((a,b)=>{const x=val(a),y=val(b);
    const r=(typeof x==='number'&&typeof y==='number')?x-y:String(x??'').localeCompare(String(y??''),'fr');
    return st.dir==='asc'?r:-r;});
  S['rows_'+id]=list;
  const cell=(c,r)=>c.f?c.f(r):(typeof r[c.k]==='number'?(r[c.k]?nfa(r[c.k]):'<span class="z">0</span>'):esc(r[c.k]));
  return `<div class="tw${opt.tall?' tall':''}"><table class="${opt.sticky?'sticky1':''}">
    <thead><tr>${cols.map(c=>`<th class="s ${c.cls||''}${c.st?' st':''}" data-tsort="${id}|${c.k}"${st.k===c.k?` data-dir="${st.dir}"`:''}>${c.l}</th>`).join('')}</tr></thead>
    <tbody>${list.map((r,i)=>`<tr${opt.onRow?` class="clk" data-trow="${id}|${i}"`:''}>${cols.map(c=>`<td class="${c.cls||''}${c.st?' st':''}">${cell(c,r)}</td>`).join('')}</tr>`).join('')}

}

/** Frise horaire d'une semaine d'agent : une ligne par jour, de 0 h à 24 h.
    Services pleins, pauses hachurées, plage de nuit ombrée, repos hors résidence en pointillés ambre. */
function weekTimeline(x){
  const W=760, L=78, R=12, top=22, rh=24, gap=6, n=x.jours.length;
  const Hh=top+n*(rh+gap)+4, cw=W-L-R, X=h=>L+h/24*cw;
  const D0=x.jours.map(j=>Date.parse(j.date+'T00:00:00Z'));
  const nuit=isAFR(x.metier)?S.rules.nuitAFR:S.rules.nuitCDR;
  const Y=d=>top+d*(rh+gap);
  /** découpe un intervalle [a,b] (ms) sur les lignes jour */
  const cut=(a,b)=>{const o=[];D0.forEach((d0,i)=>{const s=Math.max(a,d0),e=Math.min(b,d0+DAY);if(e>s)o.push([i,(s-d0)/H,(e-d0)/H]);});return o;};
  let g=`<defs><pattern id="tlHatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><rect width="2" height="5" fill="var(--accent-line)"/></pattern></defs>`;
  for(let h=0;h<=24;h+=3) g+=`<text class="tl-h" x="${X(h).toFixed(1)}" y="12" text-anchor="middle">${String(h).padStart(2,'0')}h</text>`;
  x.jours.forEach((j,i)=>{
    const y=Y(i);
    g+=`<rect class="tl-row" x="${L}" y="${y}" width="${cw}" height="${rh}" rx="5"/>`;
    const [n0,n1]=nuit; const bands=n1>n0?[[n0,n1]]:[[0,n1],[n0,24]];
    bands.forEach(([a,b])=>g+=`<rect class="tl-nuit" x="${X(a).toFixed(1)}" y="${y}" width="${(X(b)-X(a)).toFixed(1)}" height="${rh}"/>`);
    for(let h=6;h<24;h+=6) g+=`<line class="tl-g" x1="${X(h).toFixed(1)}" y1="${y}" x2="${X(h).toFixed(1)}" y2="${y+rh}"/>`;
    g+=`<text class="tl-day" x="0" y="${y+11}">${JS[i]}</text><text class="tl-date" x="0" y="${y+22}">${dISO(j.date)}</text>`;
  });
  const end=D0[n-1]+DAY;
  for(const r of x.rhr||[]){
    const a=Date.parse(r.debut), b=r.fin?Date.parse(r.fin):end;
    cut(a,b).forEach(([i,h0,h1],k)=>{ g+=`<rect class="tl-rhr" x="${X(h0).toFixed(1)}" y="${Y(i)+2}" width="${(X(h1)-X(h0)).toFixed(1)}" height="${rh-4}" rx="4"
      data-tip="${esc(`<b>Repos hors résidence</b><span class="tr"><span>Lieu</span><b>${esc(r.lieu)}</b></span><span class="tr"><span>Du</span><b>${dtISO(r.debut)}</b></span><span class="tr"><span>Au</span><b>${r.fin?dtISO(r.fin):'semaine suivante'}</b></span>${r.dureeH!=null?`<span class="tr"><span>Durée</span><b>${fmtH(r.dureeH)}</b></span>`:''}`)}"/>`;
      if(k===0&&X(h1)-X(h0)>70) g+=`<text class="ts" x="${(X(h0)+6).toFixed(1)}" y="${Y(i)+rh/2+4}" style="font-size:10px;font-weight:700;fill:var(--signal-ink)">RHR · ${esc(r.lieu)}</text>`;
    });
  }
  x.jours.forEach((j,i)=>{
    const y=Y(i);
    if(j.kind==='CODE') g+=`<text class="tl-code" x="${X(12).toFixed(1)}" y="${y+rh/2+4}" text-anchor="middle">${esc(j.family==='HORS'?'Non compté (hors colonne)':j.code)}${j.family!=='HORS'&&CODEL[j.family]&&j.family!=='AUTRE'?' · '+CODEL[j.family]:''}</text>`;
    else if(j.kind==='VIDE'&&j.blanche) g+=`<rect class="tl-bl" x="${L+1}" y="${y+1}" width="${cw-2}" height="${rh-2}" rx="5"/><text class="tl-blt" x="${X(12).toFixed(1)}" y="${y+rh/2+4}" text-anchor="middle">Journée blanche${j.horsResidence?' · hors résidence':''}</text>`;
    else if(j.kind==='VIDE') g+=`<text class="tl-h" x="${X(12).toFixed(1)}" y="${y+rh/2+4}" text-anchor="middle">case vide${j.jbRaison?' · '+esc(j.jbRaison):''}</text>`;
    if(j.kind==='SERVICE') for(const m of j.missions){
      const a=Date.parse(m.start), b=Date.parse(m.end);
      const tip=esc(`<b>${esc(m.label)}</b><span class="tr"><span>${esc(m.from||'?')} → ${esc(m.to||'?')}</span></span><span class="tr"><span>Horaire</span><b>${dtISO(m.start)} – ${hm(m.end)}</b></span><span class="tr"><span>Amplitude</span><b>${fmtH(m.amplitude)}</b></span>${m.pauseMin?`<span class="tr"><span>Pauses</span><b>${m.pauseMin} min</b></span>`:''}`);
      cut(a,b).forEach(([ii,h0,h1],k)=>{
        const yy=Y(ii)+4, w=X(h1)-X(h0);
        g+=`<rect class="tl-pause" x="${X(h0).toFixed(1)}" y="${yy}" width="${w.toFixed(1)}" height="${rh-8}" rx="3" data-tip="${tip}"/>`;
        workSegments(m).forEach(([s0,s1])=>cut(s0,s1).filter(c=>c[0]===ii).forEach(([,p0,p1])=>{ if(p1>h0-1e-9&&p0<h1+1e-9)
          g+=`<rect class="tl-svc" x="${X(p0).toFixed(1)}" y="${yy}" width="${Math.max(1.5,X(p1)-X(p0)).toFixed(1)}" height="${rh-8}" rx="3" data-tip="${tip}"/>`; }));
        if(k===0&&w>56) g+=`<text class="tl-lab" x="${(X(h0)+5).toFixed(1)}" y="${yy+rh/2}">${esc(String(m.label).slice(0,Math.floor(w/6.4)))}</text>`;
      });
    }
    if(j.horsColonne) g+=`<rect class="tl-hc" x="${L-3}" y="${y-2}" width="${cw+6}" height="${rh+4}" rx="6"><title>Mission datée hors de sa colonne, non comptée</title></rect>`;
  });
  return `<div class="tl-w"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Frise horaire de la semaine">${g}</svg></div>`;
}

    {k:'rhr24',l:'24 h et +',v:r=>r.g.rhr24,f:r=>nf(r.g.rhr24)},
    {k:'rhrSuccessifs',l:'Successifs',v:r=>r.g.rhrSuccessifs,f:r=>nf(r.g.rhrSuccessifs)},
    {k:'nbDISPO',l:'DISPO',v:r=>r.g.nbDISPO,f:r=>nf(r.g.nbDISPO)},
    {k:'nbATCMD',l:'ATCMD',v:r=>r.g.nbATCMD,f:r=>nf(r.g.nbATCMD)},
    {k:'heuresSup',l:'Heures sup',v:r=>r.g.heuresSup,f:r=>r.g.heuresSup?fmtH(r.g.heuresSup):'<span class="z">—</span>'},
  ];
  const foot=c=>({agence:'Total',nbAgents:nf(gT.nbAgents),agentsAvecRHR:nf(gT.agentsAvecRHR),nbRHR:nf(gT.nbRHR),
    rhrParAgent:gT.agentsAvecRHR?nf(gT.nbRHR/gT.agentsAvecRHR,2):'—',rhrHeures:fmtH(gT.rhrHeures),
    tpsAgent:gT.agentsAvecRHR?fmtH(gT.rhrHeures/gT.agentsAvecRHR):'—',tpsSem:fmtH(gT.rhrHeures/nW),rhrNuits:nf(gT.rhrNuits),
    nbDISPO:nf(gT.nbDISPO),nbATCMD:nf(gT.nbATCMD),heuresSup:fmtH(gT.heuresSup),
    rhr8_12:nf(gT.rhr8_12),rhr12_24:nf(gT.rhr12_24),rhr24:nf(gT.rhr24),rhrSuccessifs:nf(gT.rhrSuccessifs)})[c.k];
  const persons=mergeAcrossWeeks(cdr).filter(p=>p.nbRHR>0);
  const perCols=[
    {k:'nom',l:'Agent',cls:'l',st:1,v:p=>p.nom+' '+p.prenom,f:p=>`<span class="nm">${esc(p.nom)}</span> ${esc(p.prenom)}`},
    {k:'agence',l:'Agence',cls:'l',f:p=>`<span class="dot" style="background:${agenceColor(p.agence)}"></span>${esc(p.agence)}`},
    {k:'nbSemaines',l:'Semaines',f:p=>nf(p.nbSemaines)},
    {k:'nbRHR',l:'RHR',f:p=>`<b>${nf(p.nbRHR)}</b>${p.rhrEnCours?' <span class="pill pill-w">en cours</span>':''}`},
    {k:'rhrHeures',l:'Temps en RHR',f:p=>fmtH(p.rhrHeures)},
    {k:'tpsMoy',l:'Temps moyen / RHR',v:p=>p.rhrHeures/p.nbRHR,f:p=>fmtH(p.rhrHeures/p.nbRHR)},
    {k:'tpsSem',l:'Temps RHR / semaine',v:p=>p.rhrHeures/p.nbSemaines,f:p=>fmtH(p.rhrHeures/p.nbSemaines)},
    {k:'rhrNuits',l:'Nuits HR'},
    {k:'rhr8_12',l:'8–12 h'},{k:'rhr12_24',l:'12–24 h'},{k:'rhr24',l:'24 h et +'},{k:'rhrSuccessifs',l:'Successifs'},
    {k:'rhrLieux',l:'Lieux',cls:'l mono',v:p=>p.rhrLieux.join(' '),f:p=>esc(p.rhrLieux.join(' '))},
    {k:'nbDISPO',l:'DISPO'},{k:'nbATCMD',l:'ATCMD'},
    {k:'heuresSup',l:'Heures sup',f:p=>p.heuresSup?`<b>${fmtH(p.heuresSup)}</b>`:'<span class="z">—</span>'},
  ];
  return `<section class="card">
    <div class="card-h"><div><h2>Repos hors résidence par agence</h2>
      <p class="card-s">conducteurs uniquement · les moyennes par agent ne portent que sur les agents qui ont eu au moins un RHR — cliquez un en-tête pour trier</p></div>
      <button class="btn btn-sm" data-goto="exports">Exporter</button></div>
    <div class="card-b">
      <div class="note mb">Un RHR est un repos journalier pris hors résidence (accord d'entreprise, art. 18) : une mission se termine ailleurs qu'à la résidence et la suivante commence au moins ${nfa(S.rules.rhrMinHours)} h plus tard, de jour comme de nuit${S.rules.rhrCoupeParRepos?', sans jour de repos ni d’absence entre les deux':''}. Tranches de l'annexe 1 : 8–12 h, 12–24 h, 24 h et plus ; « successifs » : deux RHR sans retour à résidence entre eux. Chaque coupure peut être corrigée depuis la fiche de l'agent. Les AFR sont exclus du décompte. Le temps en RHR est la durée entre la fin d'un service et le début du suivant. DISPO et ATCMD sont comptés séparément ; une ATCMD compte pour ${nf(S.rules.heuresATCMD)} h de travail.</div>
      ${cdr.length?stable('rhrag',sumCols,byAg,{sort:{k:'nbRHR',dir:'desc'},foot}):'<p class="mut">Aucun conducteur sur ce périmètre.</p>'}
    </div></section>
  <section class="card">
    <div class="card-h"><div><h2>Par agent</h2><p class="card-s">${nf(persons.length)} agent${persons.length>1?'s':''} ayant eu au moins un RHR, une ligne par personne — cliquez une ligne pour le détail des coupures</p></div></div>
    <div class="card-b">${persons.length?stable('rhrag2',perCols,persons,{sort:{k:'nbRHR',dir:'desc'},tall:true,sticky:true,onRow:true}):'<p class="mut">Aucun repos hors résidence sur ce périmètre.</p>'}</div></section>`;
}
/* ---------- journées blanches ---------- */
function viewBlanches(){
  const sc=scopeAgents(); if(!sc.length) return emptyScope();
  const rows=[]; sc.forEach(a=>a.blanches.forEach(b=>rows.push({a,b})));
  const byAg=[...groupBy(rows,x=>x.a.agence+'||'+x.a.metier)].sort((a,b)=>a[0].localeCompare(b[0]));
  const parJour=JS.map((j,i)=>({l:j,v:rows.filter(x=>x.b.d===i).length}));
  // toutes les cases vides du périmètre, pour vérifier et corriger
  const all=[]; sc.forEach(a=>(a.casesVides||[]).forEach(c=>all.push({a,c})));
  const F=[['comptees','Journées blanches',x=>x.c.compte],['manuelles','Corrigées à la main',x=>!!x.c.manuel],
    ['non','Cases vides non comptées',x=>!x.c.compte],['toutes','Toutes les cases vides',()=>true]];
  const fl=F.find(f=>f[0]===S.jbFiltre)||F[0];
  const list=all.filter(fl[2]).sort((x,y)=>x.a.nom.localeCompare(y.a.nom,'fr')||String(x.c.date).localeCompare(String(y.c.date)));
  S.rows_jbl=list;
  const mis=(m,t)=>m?`<span class="mono">${esc(m.label)}</span> <span class="mut sm">${t==='a'?`fin ${hmD(m.end)} à ${esc(m.to||'?')}`:`début ${hmD(m.start)} de ${esc(m.from||'?')}`}</span>`:'<span class="z">—</span>';
  return `<section class="card">
    <div class="card-h"><div><h2>Journées blanches</h2><p class="card-s">${nf(rows.length)} journée${rows.length>1?'s':''} sur le périmètre</p></div>
      <button class="btn btn-sm" data-goto="exports">Exporter</button></div>
    <div class="card-b">
      <div class="note mb">Journée sans mission ni code — ni RP, ni congé — encadrée par deux services dans la semaine. Les lendemains de service de nuit, où l'agent est encore en service jusqu'au matin, sont exclus. Chaque case peut être corrigée ci-dessous ; la correction est mémorisée.</div>
      ${rows.length?`<div class="cols2">
        <div class="tw"><table><thead><tr><th class="l">Agence</th><th class="l">Métier</th><th>Journées</th><th>Agents</th></tr></thead>
          <tbody>${byAg.map(([k,l])=>{const[ag,me]=k.split('||');
            return `<tr><td class="l nm">${esc(ag)}</td><td class="l">${esc(me)}</td><td>${l.length}</td>
            <td>${new Set(l.map(x=>personKey(x.a))).size}</td></tr>`;}).join('')}</tbody></table></div>
        <div>${barChart(parJour,{label:'Journées blanches'})}</div></div>`:''}
    </div></section>
  <section class="card">
    <div class="card-h"><div><h2>Vérifier jour par jour</h2><p class="card-s">${nf(list.length)} case${list.length>1?'s':''} · missions qui encadrent chaque jour · filtrez un agent avec la recherche en haut · cliquez un nom pour sa fiche</p></div>
      <div class="seg">${F.map(([k,l])=>`<button class="sg" data-jbf="${k}" aria-pressed="${fl[0]===k}">${l}</button>`).join('')}</div></div>
    <div class="card-b">${list.length?`<div class="tw tall"><table class="sticky1"><thead><tr><th class="l st">Agent</th><th class="l">Agence</th><th class="l">Jour</th><th class="l">Mission avant</th><th class="l">Mission après</th><th class="l">Statut</th>${admin()?'<th class="l">Correction</th>':''}</tr></thead><tbody>
      ${list.map(({a,c},i)=>{const k=kJour(personKey(a),c.date);
        return `<tr><td class="l st"><button class="lnk" data-jbl="${i}"><span class="nm">${esc(a.nom)}</span> ${esc(a.prenom)}</button></td><td class="l">${esc(a.agence)}</td>
        <td class="l"><b>${JS[c.d]}</b> <span class="mono mut">${dISO(c.date)}</span></td>
        <td class="l">${mis(c.avant,'a')}</td><td class="l">${mis(c.apres,'p')}</td>
        <td class="l">${c.compte?'<span class="pill pill-w">journée blanche</span>':'<span class="pill pill-n">non comptée</span>'}${c.horsResidence?' <span class="pill pill-a">hors résidence</span>':''} <span class="mut sm">${esc(c.raison||'')}</span></td>
        ${admin()?`<td class="l">${c.manuel?`<button class="btn btn-sm" data-cjb="${esc(k)}" data-v="">Annuler</button>`
          :c.compte?`<button class="btn btn-sm" data-cjb="${esc(k)}" data-v="non">Pas une journée blanche</button>`
          :`<button class="btn btn-sm" data-cjb="${esc(k)}" data-v="oui">Journée blanche</button>`}</td>`:''}</tr>`;}).join('')}
      </tbody></table></div>`:'<p class="mut">Aucune case pour ce filtre.</p>'}</div></section>`;
}

/* ---------- graphiques ---------- */
function viewGraphiques(){
  if(!S.weeks.length) return emptyScope();
  const sc=scopeAgents(); if(!sc.length) return emptyScope();
  const c=S.chart, M=METRICS.find(m=>m.k===c.metric)||METRICS[0], k=M.k, mode=S.mode;
  const isRHR=k==='nbRHR';
  const base=l=>isRHR?l.filter(a=>a.rhrApplicable):l;     // les AFR n'entrent pas dans les statistiques RHR
  const fm=v=>M.f(v);
  const rows=base(sc);
  const byAg=[...groupBy(rows,a=>a.agence)].map(([l,list])=>{const g=agg(list);return {l,v:modeVal(g,k,mode),c:agenceColor(l),sub:nf(g.nbAgents),sub2:'Agents'};}).sort((a,b)=>b.v-a.v);
  const byMe=[...groupBy(rows,a=>a.metier)].map(([l,list])=>{const g=agg(list);return {l,v:modeVal(g,k,mode),sub:nf(g.nbAgents),sub2:'Agents'};}).sort((a,b)=>b.v-a.v);
  // répartition par agent : une ligne par personne (pour le RHR, uniquement ceux qui en ont eu)
  const persons=mergeAcrossWeeks(rows).filter(p=>!isRHR||p.nbRHR>0);
  const pers=persons.map(p=>({l:`${p.nom} ${p.prenom.slice(0,1)}.`,v:mode==='total'?p[k]:r2(p[k]/(p.nbSemaines||1)),c:agenceColor(p.agence),sub:p.agence,sub2:'Agence'})).sort((a,b)=>b.v-a.v);
  const avgP=pers.length?pers.reduce((s,x)=>s+x.v,0)/pers.length:0;
  // évolution hebdomadaire et moyennes par semaine : toutes les semaines enregistrées
  const all=base(scopeAgents({allWeeks:true}));
  const ids=S.weeks.map(w=>w.weekId).sort();
  const labels=ids.map(id=>`S${String(S.weeks.find(x=>x.weekId===id).week).padStart(2,'0')}`);
  const shown=scopeAgences().slice(0,8);
  const series=shown.map(ag=>({name:ag,short:ag.slice(0,3).toUpperCase(),color:agenceColor(ag),
    values:ids.map(id=>{const l=all.filter(a=>a.weekId===id&&a.agence===ag); return l.length?modeVal(agg(l),k,mode==='agent'?'agent':'total'):null;})}));
  const legend=shown.map(ag=>`<span class="lg"><span class="cdot" style="background:${agenceColor(ag)}"></span>${esc(ag)}</span>`).join('');
  // moyennes par semaine : tous métiers du périmètre ; le RHR ne porte que sur les conducteurs
  const allRows=scopeAgents({allWeeks:true}), nWall=new Set(allRows.map(a=>a.weekId)).size;
  const wval=(l,mk)=>{ if(mk!=='nbRHR') return agg(l)[mk+'_sem']; const w=new Set(l.map(a=>a.weekId)).size||1;
    return r2(l.filter(a=>a.rhrApplicable).reduce((s,a)=>s+a.nbRHR,0)/w); };
  const wk=[...groupBy(allRows,a=>a.agence)].map(([agence,l])=>{const g=agg(l),o={agence,ag:r2(g.nbLignes/g.nbSemaines)}; METRICS.forEach(m=>o[m.k]=wval(l,m.k)); return o;});
  const gW=(()=>{const g=agg(allRows),o={ag:r2(g.nbLignes/g.nbSemaines)}; METRICS.forEach(m=>o[m.k]=wval(allRows,m.k)); return o;})();
  const wCols=[{k:'agence',l:'Agence',cls:'l nm',f:r=>esc(r.agence)},
    {k:'ag',l:'Agents / sem.',f:r=>nf(r.ag,1)},
    ...METRICS.map(m=>({k:m.k,l:m.c+' / sem.',f:r=>m.f(r[m.k])}))];
  const tops=[15,25,50,100,0];
  return `
  <section class="card"><div class="card-b"><div class="ctrls" style="margin-bottom:0;border-bottom:0;padding-bottom:0">
    <div class="fld"><span class="flabel">Mesure</span><div class="seg">${METRICS.map(m=>`<button class="sg" data-cm="${m.k}" aria-pressed="${m.k===k}">${m.c}</button>`).join('')}</div></div>
    <div class="fld"><span class="flabel">Valeur</span>${modeSeg()}</div></div>
    <p class="hint">${esc(modeHint())} · les filtres de semaine, d'agence et de métier s'appliquent${isRHR?' · RHR : conducteurs uniquement':''}</p></div></section>
  <div class="charts">
    <section class="card"><div class="card-h"><div><h2>${esc(M.l)} par agence</h2><p class="card-s">${esc(modeHint())}</p></div></div>
      <div class="card-b">${barChart(byAg,{fmt:fm,label:M.l})}</div></section>
    <section class="card"><div class="card-h"><div><h2>${esc(M.l)} par métier</h2><p class="card-s">${esc(modeHint())}</p></div></div>
      <div class="card-b">${barChart(byMe,{fmt:fm,label:M.l})}</div></section>
  </div>
  <section class="card"><div class="card-h"><div><h2>Répartition par agent</h2>
    <p class="card-s">${esc(M.l)}${mode==='total'?'':' par semaine'} · ${nf(pers.length)} agent${pers.length>1?'s':''}${isRHR?' ayant eu au moins un RHR':''} · moyenne ${fm(avgP)}</p></div>
    <label class="fld"><span class="flabel">Afficher</span><select id="cTop">${tops.map(n=>`<option value="${n}"${c.top===n?' selected':''}>${n?n+' premiers':'tous'}</option>`).join('')}</select></label></div>
    <div class="card-b">${barChart(c.top?pers.slice(0,c.top):pers,{fmt:fm,label:M.l})}</div></section>
  <section class="card"><div class="card-h"><div><h2>Évolution hebdomadaire</h2>
    <p class="card-s">${esc(M.l)} — une courbe par agence${mode==='agent'?', moyenne par agent':''} · toutes les semaines enregistrées</p></div></div>
    <div class="card-b">${lineChart(series,labels,fm)}<div class="clg">${legend}</div>
    ${S.weeks.length<2?'<p class="hint">Une seule semaine enregistrée : la courbe prendra son sens dès la deuxième.</p>':''}</div></section>
  <section class="card"><div class="card-h"><div><h2>Moyennes par semaine</h2><p class="card-s">sur ${nf(nWall)} semaine${nWall>1?'s':''} enregistrée${nWall>1?'s':''} — cliquez un en-tête pour trier</p></div></div>
    <div class="card-b">${stable('wk',wCols,wk,{sort:{k:'agence',dir:'asc'},foot:cc=>cc.k==='agence'?'Total':cc.k==='ag'?nf(gW.ag,1):METRICS.find(m=>m.k===cc.k).f(gW[cc.k])})}</div></section>`;
}

/* ---------- corrections : coupures entre missions, cases vides, missions liées ---------- */
const ST_COUP={rhr:['RHR','pill-w'],force:['RHR (à la main)','pill-w'],lien:['RHR (missions liées)','pill-w'],ouvert:['RHR ouvert','pill-w'],
  residence:['à la résidence','pill-n'],court:['arrêt trop court','pill-n'],repos:['repos pendant l’arrêt','pill-n'],ecarte:['écarté à la main','pill-c']};
const admin=()=>S.role==='admin';
const hmD=s=>{const d=new Date(s);return `${JS[(d.getUTCDay()+6)%7]} ${hm(s)}`;};
/** Tableau des coupures d'une semaine d'agent, avec les boutons de correction */
function coupuresView(x){
  const pk=personKey(x), cs=x.coupures||[];
  if(!x.rhrApplicable) return '<p class="hint">Métier sans repos hors résidence (règle des Réglages).</p>';
  if(!x.residence) return '<p class="hint">Résidence de l’agence inconnue : à renseigner dans les Réglages.</p>';
  const lieux=[...new Set((x.missions||[]).flatMap(m=>[m.from,m.to]).filter(Boolean).map(normLieu))];
  const ratt=admin()?`<div class="lienf" style="margin:0 0 10px"><span class="flabel">Résidence retenue cette semaine : ${esc(x.residence)}${x.rattachement?' (rattachement temporaire, accord art. 8)':''}</span>
    <div class="btns" style="align-items:center">${x.rattachement
      ?`<button class="btn btn-sm" data-ratt="${esc(pk+'|'+x.weekId)}" data-lieu="">Annuler le rattachement temporaire</button>`
      :`<select id="rt-${esc(x.weekId)}">${lieux.filter(l=>l!==normLieu(x.residence)).map(l=>`<option${l===x.lieuHabituel?' selected':''}>${esc(l)}</option>`).join('')}</select>
        <button class="btn btn-sm" data-ratt="${esc(pk+'|'+x.weekId)}" data-sel="rt-${esc(x.weekId)}">Rattacher temporairement cette semaine</button>`}</div></div>`
    :(x.rattachement?`<p class="hint">Rattachement temporaire à ${esc(x.rattachement)} cette semaine.</p>`:'');
  const btn=(c)=>{ if(!admin()) return '';
    if(c.statut==='lien') return `<button class="btn btn-sm" data-lien-del="${esc(JSON.stringify(c.lien))}">Supprimer le lien</button>`;
    if(c.manuel) return `<button class="btn btn-sm" data-crhr="${esc(c.key)}" data-v="">Annuler la correction</button>`;
    return c.compte
      ? `<button class="btn btn-sm" data-crhr="${esc(c.key)}" data-v="non">Pas un RHR</button>${c.lieu?`<button class="btn btn-sm" data-lieures="${esc(x.agence)}" data-lieu="${esc(c.lieu)}" title="Mémorise ce lieu comme la résidence de ${esc(x.agence)} pour tous les agents">${esc(c.lieu)} = résidence</button>`:''}`
      : `<button class="btn btn-sm" data-crhr="${esc(c.key)}" data-v="oui">Compter en RHR</button>`; };
  const ms=x.missions||[];
  const opt=(m,i)=>`<option value="${i}">${JS[m.d]??''} ${hm(m.start)}–${hm(m.end)} · ${esc(m.label)} (${esc(m.from||'?')} → ${esc(m.to||'?')})</option>`;
  return `${ratt}${cs.length?`<div class="tw"><table><thead><tr><th class="l">Fin de mission</th><th class="l">Lieu</th><th class="l">Reprise</th><th>Arrêt</th><th class="l">Statut</th>${admin()?'<th class="l">Correction</th>':''}</tr></thead><tbody>
    ${cs.map(c=>{const [l,cl]=ST_COUP[c.statut]||[c.statut,'pill-n'];
      return `<tr><td class="l mono">${hmD(c.debut)} <span class="mut">${esc(c.aller)}</span></td><td class="l mono">${esc(c.lieu||'?')}</td>
      <td class="l mono">${c.fin?`${hmD(c.fin)} <span class="mut">${esc(c.retour)}</span>`:'<span class="mut">semaine suivante</span>'}</td>
      <td>${c.dureeH!=null?fmtH(c.dureeH):'—'}</td><td class="l"><span class="pill ${cl}">${l}</span>${c.long?` <span class="pill pill-c" title="L'accord limite l'absence du domicile à ${nfa(S.rules.rhrMaxAbsence)} h (art. 18)">plus de ${nfa(S.rules.rhrMaxAbsence)} h : à vérifier</span>`:''}</td>
      ${admin()?`<td class="l"><span class="btns" style="gap:5px">${btn(c)}</span></td>`:''}</tr>`;}).join('')}</tbody></table></div>`
    :'<p class="hint">Aucune coupure cette semaine.</p>'}
    ${admin()&&ms.length>1?`<div class="lienf"><span class="flabel">Lier deux missions (un seul RHR de la fin de la première au début de la seconde)</span>
      <div class="btns" style="align-items:center"><select id="lA-${x.weekId}">${ms.map(opt).join('')}</select><span class="mut">→</span>
      <select id="lB-${x.weekId}">${ms.map((m,i)=>opt(m,i)).join('').replace(`value="1"`,`value="1" selected`)}</select>
      <button class="btn btn-sm btn-pri" data-lien="${esc(x.weekId)}" data-pk="${esc(pk)}">Lier</button></div></div>`:''}`;
}
/** Cases vides d'une semaine d'agent : journée blanche ou non, avec la raison et les missions qui l'encadrent */
function videsView(x){
  const cv=x.casesVides||[];
  if(!cv.length) return '<p class="hint">Aucune case vide cette semaine.</p>';
  const pk=personKey(x);
  return `<div class="tw"><table><thead><tr><th class="l">Jour</th><th class="l">Mission avant</th><th class="l">Mission après</th><th class="l">Statut</th>${admin()?'<th class="l">Correction</th>':''}</tr></thead><tbody>
    ${cv.map(c=>`<tr><td class="l"><b>${JS[c.d]}</b> <span class="mono mut">${dISO(c.date)}</span></td>
      <td class="l mono">${c.avant?`${esc(c.avant.label)} <span class="mut">fin ${hmD(c.avant.end)} à ${esc(c.avant.to||'?')}</span>`:'<span class="z">—</span>'}</td>
      <td class="l mono">${c.apres?`${esc(c.apres.label)} <span class="mut">début ${hmD(c.apres.start)} de ${esc(c.apres.from||'?')}</span>`:'<span class="z">—</span>'}</td>

/** Contrôle de la lecture, calculé sur les semaines chargées */
function qualite(){
  const ids=activeWeeks().filter(id=>S.loaded.has(id)), out=[];
  const res=S.weeks.filter(w=>ids.includes(w.weekId));
  const withC=res.filter(w=>w.controle);
  if(withC.length){
    const cel=withC.reduce((s,w)=>s+w.controle.cellules,0), bad=withC.reduce((s,w)=>s+w.controle.illisibles,0);
    const pc=cel?100*(1-bad/cel):100;
    out.push({lvl:bad===0?'ok':pc>=99?'mid':'lo',t:`Cases lues : ${nf(pc,pc===100?0:1)} %`,d:bad?`${nf(bad)} case${bad>1?'s':''} sur ${nf(cel)} contien${bad>1?'nent':'t'} un horaire illisible ou une mission sans horaire. Le détail est dans l’onglet Import.`:`Les ${nf(cel)} cases jour ont été lues sans anomalie.`});
  } else out.push({lvl:'mid',t:'Cases lues : non mesuré',d:'Les semaines affichées ont été importées avant le contrôle de lecture. Les réimporter donne la mesure.'});
  const ags=scopeAgences(), src={};
  for(const id of ids){ const m=S.loaded.get(id).meta; for(const a of ags) if(m.residenceSource[a]) src[a]=src[a]==='auto'||!src[a]?m.residenceSource[a]:src[a]; }
  const auto=ags.filter(a=>src[a]==='auto'), ind=ags.filter(a=>src[a]==='indéterminée');
  out.push({lvl:ind.length?'lo':auto.length?'mid':'ok',t:`Résidences : ${auto.length+ind.length?`${auto.length+ind.length} à confirmer`:'toutes confirmées'}`,
    d:auto.length+ind.length?`${[...auto,...ind].slice(0,4).join(', ')}${auto.length+ind.length>4?'…':''} : résidence déduite automatiquement${ind.length?' ou introuvable':''}. Tout le calcul des RHR en dépend — à fixer dans les Réglages.`:'Chaque agence a une résidence saisie à la main.'});
  const sc=scopeAgents(), hc=sc.reduce((s,a)=>s+a.nbHorsColonne,0), jr=mergeAcrossWeeks(sc).filter(a=>a.jamaisEnResidence).length;
  const open=sc.reduce((s,a)=>s+a.rhr.filter(x=>x.enCours&&!x.fin).length,0);
  out.push({lvl:hc?'mid':'ok',t:`Missions hors colonne : ${nf(hc)}`,d:hc?'Missions dont la date ne correspond pas au jour de la colonne : écartées du calcul, à vérifier dans le fichier source.':'Aucune ligne d’une autre semaine recopiée.'});
  const ail=sc.filter(a=>a.basAilleurs).length, lg=sc.reduce((n,a)=>n+(a.coupures||[]).filter(c=>c.long).length,0);
  out.push({lvl:lg?'lo':'ok',t:`RHR de plus de ${nfa(S.rules.rhrMaxAbsence)} h : ${nf(lg)}`,d:lg?'L’accord limite l’absence du domicile à 44 h : ces arrêts cachent sans doute un retour à la résidence. À vérifier dans la fiche de l’agent.':'Aucun repos hors résidence ne dépasse la limite de l’accord.'});
  out.push({lvl:ail?'mid':'ok',t:`Semaines passées surtout hors résidence : ${nf(ail)}`,d:ail?'Le lieu le plus fréquent de l’agent n’est pas la résidence de son agence : détachement ou résidence mal réglée. Voir les Points de vigilance de la Synthèse.':'Chaque conducteur passe surtout par sa résidence.'});
  out.push({lvl:jr?'lo':'ok',t:`Agents jamais en résidence : ${nf(jr)}`,d:jr?'Tous leurs services comptent comme hors résidence : le signe le plus fréquent d’une résidence mal réglée.':'Tous les conducteurs passent au moins une fois par leur résidence.'});
  out.push({lvl:open?'mid':'ok',t:`Coupures sans fin connue : ${nf(open)}`,d:open?'Départs en fin de semaine dont le retour est dans une semaine non importée : comptés, mais sans durée.':'Toutes les coupures ont une durée.'});
  return `<div class="qual">${out.map(q=>`<div class="qi"><div class="qh"><span class="lvl ${q.lvl}"></span>${q.t}</div><p>${q.d}</p></div>`).join('')}</div>`;
}

async function dl(name,data,mime){
  if(backend.mode==='artifact'){
    const d=await window.claude?.use?.('downloads');
    if(!d){ S.msg={m:"Le téléchargement n'est pas disponible dans cette vue.",t:'w'}; render(); return; }
    try{ await d.save({filename:name,data:new Blob([data],{type:mime})}); }
    catch(e){ if(e&&e.code!=='declined'){ S.msg={m:'Export impossible : '+(e.message||e.code),t:'c'}; render(); } }
    return;
  }
  const u=URL.createObjectURL(new Blob([data],{type:mime})), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
