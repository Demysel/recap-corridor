}

/* ==========================================================================
   5. VITRINE — statistiques anonymes du code visiteur (calculées sur le serveur)
   Aucun nom, matricule ni ligne individuelle ne sort : chaque cellule publiée réunit au moins
   VITRINE_K agents d'une même semaine. Les petits groupes sont fusionnés (« Autres métiers »,
   « Tous métiers », « Autres agences ») ou écartés s'ils restent trop petits.
   ========================================================================== */
const VITRINE_K=5;
const V_AMP=[6,8,9,10,11], V_HP=[20,30,35,40,45];
const binOf=(v,b)=>{let i=0; while(i<b.length&&v>=b[i]) i++; return i;};
const H24=()=>Array(24).fill(0), D7=()=>Array.from({length:7},H24);
function cellStats(list,w,ag,me){
  const c={w,ag,me,n:list.length,rhrApp:0,avecRHR:0,avecJB:0,avecSup:0,s:{},
    heat:{presence:H24(),prise:H24(),fin:H24(),rhr:H24()}, dow:{presence:D7(),prise:D7()},
    dist:{amp:Array(6).fill(0),hp:Array(6).fill(0),rhrB:[0,0,0],rhrN:Array(5).fill(0),jbN:Array(4).fill(0)}};
  for(const f of FIELDS) c.s[f.k]=0;
  for(const a of list){
    for(const f of FIELDS) c.s[f.k]+=a[f.k]||0;
    if(a.rhrApplicable){ c.rhrApp++; if(a.nbRHR>0) c.avecRHR++; c.dist.rhrN[Math.min(4,a.nbRHR)]++;
      for(const x of a.rhr){ if(x.dureeH!=null) c.dist.rhrB[x.dureeH<12?0:x.dureeH<24?1:2]++; c.heat.rhr[new Date(x.debut).getUTCHours()]++; } }
    if(a.journeesBlanches>0) c.avecJB++; if(a.heuresSup>0) c.avecSup++;
    c.dist.jbN[Math.min(3,a.journeesBlanches)]++;
    if(a.joursService) c.dist.hp[binOf(a.heuresPlanifiees,V_HP)]++;
    for(const j of a.jours){ if(j.kind!=='SERVICE') continue;
      c.dist.amp[binOf(j.amplitude,V_AMP)]++;
      const p=new Date(j.missions[0].start), e=new Date(j.missions[j.missions.length-1].end);
      c.heat.prise[p.getUTCHours()]++; c.dow.prise[(p.getUTCDay()+6)%7][p.getUTCHours()]++; c.heat.fin[e.getUTCHours()]++;
      for(const m of j.missions) for(const [s0,s1] of workSegments(m)) for(let t=Math.floor(s0/H)*H;t<s1;t+=H){
        const o=ovl(t,t+H,s0,s1)/H; if(o<=0) continue; const d=new Date(t);
        c.heat.presence[d.getUTCHours()]+=o; c.dow.presence[(d.getUTCDay()+6)%7][d.getUTCHours()]+=o; } }
  }
  for(const f of FIELDS) c.s[f.k]=r2(c.s[f.k]);
  c.heat.presence=c.heat.presence.map(r2); c.dow.presence=c.dow.presence.map(r=>r.map(r2));
  return c;
}
/** weeks : lectures brutes [{meta, agents}] ; rules : règles chargées (loadRules) */
function vitrineData(weeks,rulesIn,K=VITRINE_K){
  const rules={...rulesIn,agencesAlias:{...autoAliasFrom(weeks.flatMap(w=>w.agents.map(a=>a.agence))),...(rulesIn.agencesAlias||{})}};
  const map=new Map();
  for(const w of [...weeks].sort((a,b)=>a.meta.weekId.localeCompare(b.meta.weekId))){
    const v=applyRules(w,rules); v.agents.forEach(a=>a.weekId=w.meta.weekId); map.set(w.meta.weekId,v); }
  reconcile(map,rules);
  const cells=[], flux=[]; let ecartes=0;
  for(const [id,v] of map){
    const autres=[];
    v.agents=v.agents.filter(a=>!a.exclu);
    for(const [ag,l] of groupBy(v.agents,a=>a.agence)){
      if(l.length<K){ autres.push(...l); continue; }
      const byMe=[...groupBy(l,a=>a.metier)], big=byMe.filter(([,x])=>x.length>=K), small=byMe.filter(([,x])=>x.length<K).flatMap(([,x])=>x);
      if(!small.length) big.forEach(([me,x])=>cells.push(cellStats(x,id,ag,me)));
      else if(small.length>=K){ big.forEach(([me,x])=>cells.push(cellStats(x,id,ag,me))); cells.push(cellStats(small,id,ag,'Autres métiers')); }
      else cells.push(cellStats(l,id,ag,'Tous métiers'));
    }
    if(autres.length>=K) cells.push(cellStats(autres,id,'Autres agences','Tous métiers')); else ecartes+=autres.length;
    // flux entre lieux et lieux de RHR : publiés seulement si au moins K agents différents y passent
    const E=new Map(), R=new Map(), RS=new Set(Object.values(v.meta.residences||{}).filter(Boolean).map(normLieu));
    for(const a of v.agents){ const pk=personKey(a);
      for(const j of a.jours) if(j.kind==='SERVICE') for(const m of j.missions){ if(!m.from||!m.to) continue;
        const x=normLieu(m.from), y=normLieu(m.to); if(x===y) continue; const k=x<y?x+'|'+y:y+'|'+x;
        if(!E.has(k)) E.set(k,{n:0,p:new Set()}); const e=E.get(k); e.n++; e.p.add(pk); }
      for(const x of a.rhr){ const l=normLieu(x.lieu); if(!R.has(l)) R.set(l,{n:0,p:new Set()}); const r=R.get(l); r.n++; r.p.add(pk); } }
    flux.push({w:id,res:[...RS],edges:[...E].filter(([,e])=>e.p.size>=K).map(([k,e])=>{const [a,b]=k.split('|');return {a,b,n:e.n};}),
      rhr:[...R].filter(([,r])=>r.p.size>=K).map(([l,r])=>({l,n:r.n}))});
  }
  return {k:K, ecartes, cells, flux,
    semaines:[...map.values()].map(v=>({weekId:v.meta.weekId,year:v.meta.year,week:v.meta.week,monday:v.meta.monday,sunday:v.meta.sunday})),
    regles:{rhrMinHours:rules.rhrMinHours,seuilHebdo:rules.seuilHebdo,heuresATCMD:rules.heuresATCMD,nuitAFR:rules.nuitAFR,nuitCDR:rules.nuitCDR}};
}

   ========================================================================== */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; }
  return t;
})();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }

/** ZIP « stored » (sans compression) — suffisant et parfaitement lisible par Excel */
function zipFiles(files){
  const parts=[], cd=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  for(const f of files){
    const name=te.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  }
  let cdLen=0; for(const c of cd) cdLen+=c.length;
  const eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),
    ...u32(cdLen),...u32(off),...u16(0)]);
  const all=[...parts,...cd,eocd];
  let total=0; for(const a of all) total+=a.length;
  const out=new Uint8Array(total); let p=0;
  for(const a of all){ out.set(a,p); p+=a.length; }
  return out;
}
const xe=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))

function buildXlsx(sheets){

    {name:'xl/workbook.xml',data:te.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`)},
    {name:'xl/_rels/workbook.xml.rels',data:te.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="0"/><numFmt numFmtId="165" formatCode="0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF175E82"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>`)},
  ];

    Une correspondance saisie dans les Réglages l'emporte toujours. */
function autoAlias(extra=[]){ return autoAliasFrom([...S.weeks.flatMap(w=>w.agences||[]),...extra]); }
/** Règles effectivement appliquées : réglages + correspondances d'agences automatiques */
const effRules=(extra)=>({...S.rules,agencesAlias:{...autoAlias(extra),...(S.rules.agencesAlias||{})}});
const agName=a=>effRules().agencesAlias[a]||a;
const allAgences=()=>{const al=effRules().agencesAlias;return [...new Set(S.weeks.flatMap(w=>w.agences||[]).map(a=>al[a]||a))].sort();};
const allMetiers=()=>[...new Set(S.weeks.flatMap(w=>w.metiers||[]).map(m=>normMetier(m)||m))].sort();
const activeWeeks=()=>S.selWeek==='__all__'?S.weeks.map(w=>w.weekId):[S.selWeek];
const SER=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const agenceColor=ag=>`var(${SER[Math.max(0,allAgences().indexOf(ag))%8]})`;

/** Lignes agent-semaine du périmètre (une par personne et par semaine, doublons du fichier déjà fusionnés) */
function scopeAgents(opts={}){
  const out=[];
  for(const id of (opts.allWeeks?S.weeks.map(w=>w.weekId):activeWeeks())){
    const w=S.loaded.get(id); if(!w) continue;
    for(const a of w.agents){
      if(a.exclu&&!opts.exclus) continue;
      if(S.selAgences&&!S.selAgences.includes(a.agence)) continue;
      if(S.selMetiers&&!S.selMetiers.includes(a.metier)) continue;
      if(S.search&&!deacc(`${a.nom} ${a.prenom} ${a.matricule}`).toLowerCase().includes(deacc(S.search).toLowerCase())) continue;
      out.push(a.weekId?a:Object.assign(a,{weekId:id}));
    }
  }
  return out;
}
/** Une ligne par personne : un nom n'apparaît jamais deux fois */
const scopePersons=(opts)=>mergeAcrossWeeks(scopeAgents(opts));
const scopeAgences=()=>S.selAgences||allAgences();
const scopeMetiers=()=>S.selMetiers||allMetiers();
const nbWeeksLoaded=()=>activeWeeks().filter(id=>S.loaded.has(id)).length;

async function ensureLoaded(ids){
  for(const id of ids){
    if(S.loaded.has(id)) continue;
    const {docs}=await withLoad(api.semaine(id));
    if(!docs||!docs.length) continue;
    const meta=docs[0].meta;
    const agents=docs.flatMap(d=>d.agents);
    S.parsedCache.set(id,{meta,agents});
    const v=applyRules({meta,agents},effRules()); v.agents.forEach(a=>a.weekId=id);
    S.loaded.set(id,v);
  }
  reconcile(new Map([...S.loaded.entries()].sort((a,b)=>a[0].localeCompare(b[0]))),S.rules);
}
function recomputeLoaded(){
  const R=effRules();
  for(const [id,p] of S.parsedCache){ const v=applyRules(p,R); v.agents.forEach(a=>a.weekId=id); S.loaded.set(id,v); }
  reconcile(new Map([...S.loaded.entries()].sort((a,b)=>a[0].localeCompare(b[0]))),S.rules);
}
/** L'évolution hebdomadaire et l'historique portent sur toutes les semaines enregistrées */
const needsAll=()=>['graphiques','exports','stats','verifier','comparer'].includes(S.tab);
/** Semaines à charger : celles affichées, plus leurs voisines — un RHR ouvert le dimanche se referme avec la
    semaine suivante, quel que soit l'affichage, pour que les chiffres d'une semaine ne dépendent pas de la vue */
const toLoad=()=>{ if(needsAll()) return S.weeks.map(w=>w.weekId);
  const ids=S.weeks.map(w=>w.weekId).sort(), out=new Set(activeWeeks());
  for(const id of activeWeeks()){ const i=ids.indexOf(id); if(i>0) out.add(ids[i-1]); if(i>=0&&i<ids.length-1) out.add(ids[i+1]); }
  return [...out]; };

let TIP=null;
function tipShow(html,x,y){
  if(!TIP){ TIP=document.createElement('div'); TIP.className='tip'; document.body.appendChild(TIP); }
  TIP.innerHTML=html; TIP.hidden=false;
  const r=TIP.getBoundingClientRect();
  TIP.style.left=Math.min(Math.max(8,x+14),innerWidth-r.width-8)+'px';
  TIP.style.top=Math.max(8,y-r.height-12)+'px';
}
function tipHide(){ if(TIP) TIP.hidden=true; }
const niceStep=m=>{const raw=m/4,p=Math.pow(10,Math.floor(Math.log10(raw||1)));const n=raw/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p;};

/** Courbes multi-séries avec repère et infobulle */
function lineChart(series,labels,fmt){
  if(!labels.length||!series.length) return '<p class="mut sm">Pas encore assez de semaines pour tracer une évolution.</p>';
  const W=720,Hh=240,ml=46,mr=58,mt=14,mb=28;
  const maxV=Math.max(1,...series.flatMap(s=>s.values.filter(v=>v!=null)));
  const step=niceStep(maxV), top=Math.ceil(maxV/step)*step||step;
  const X=i=>ml+(labels.length===1?(W-ml-mr)/2:i*(W-ml-mr)/(labels.length-1));
  const Y=v=>mt+(1-v/top)*(Hh-mt-mb);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step)
    g+=`<line class="grid-l" x1="${ml}" y1="${Y(v).toFixed(1)}" x2="${W-mr}" y2="${Y(v).toFixed(1)}"/>`
      +`<text class="cv" x="${ml-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${nf(v)}</text>`;
  labels.forEach((l,i)=>{ if(labels.length>10&&i%Math.ceil(labels.length/10)!==0&&i!==labels.length-1) return;
    g+=`<text class="ct" x="${X(i).toFixed(1)}" y="${Hh-9}" text-anchor="middle">${esc(l)}</text>`;});
  let p='';
  series.forEach(s=>{
    const pts=s.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length) return;
    p+=`<path d="${pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(q=>p+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`);
    const last=pts[pts.length-1];
    p+=`<text class="cvb" x="${(last[0]+8).toFixed(1)}" y="${(last[1]+4).toFixed(1)}">${esc(s.short||s.name)}</text>`;
  });
  let hz='';
  labels.forEach((l,i)=>{
    const w=(W-ml-mr)/Math.max(1,labels.length-1);
    const rows=series.map(s=>({n:s.name,c:s.color,v:s.values[i]})).filter(r=>r.v!=null);
    hz+=`<rect class="hovz" x="${(X(i)-w/2).toFixed(1)}" y="${mt}" width="${w.toFixed(1)}" height="${Hh-mt-mb}"
      data-tip="${esc(`<b>${l}</b>`+rows.map(r=>`<span class="tr"><span><i class="cdot" style="background:${r.c}"></i>${r.n}</span><b>${fmt?fmt(r.v):nf(r.v)}</b></span>`).join(''))}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" preserveAspectRatio="xMidYMid meet">
    ${g}<line class="axis-l" x1="${ml}" y1="${mt}" x2="${ml}" y2="${Hh-mb}"/>${p}${hz}</svg></div>`;
}
/** Barres horizontales avec infobulle */
function barChart(items,opts={}){
  if(!items.length) return '<p class="mut sm">Aucune donnée sur ce périmètre.</p>';
  const max=Math.max(1,...items.map(i=>i.v));
  const f=opts.fmt||(v=>nf(v,opts.dec||0));
  return `<div class="bars">${items.map(i=>`
    <div class="bar" data-tip="${esc(`<b>${i.l}</b><span class="tr"><span>${opts.label||'Valeur'}</span><b>${f(i.v)}</b></span>${i.sub?`<span class="tr"><span>${i.sub2||''}</span><b>${i.sub}</b></span>`:''}`)}">
      <span class="bl">${esc(i.l)}</span>
      <span class="bt"><i style="width:${(i.v/max*100).toFixed(1)}%;background:${i.c||'var(--s1)'}"></i></span>
      <span class="bv">${f(i.v)}</span></div>`).join('')}</div>`;
}

/** Tableau triable : cliquez un en-tête pour ordonner la colonne */
function stable(id,cols,rows,opt={}){
  const st=S.sorts[id]||opt.sort||{k:cols[0].k,dir:'asc'};
  const col=cols.find(c=>c.k===st.k)||cols[0];
  const val=r=>col.v?col.v(r):r[col.k];
  const list=[...rows].sort((a,b)=>{const x=val(a),y=val(b);
    const r=(typeof x==='number'&&typeof y==='number')?x-y:String(x??'').localeCompare(String(y??''),'fr');
    return st.dir==='asc'?r:-r;});
  S['rows_'+id]=list;
  const cell=(c,r)=>c.f?c.f(r):(typeof r[c.k]==='number'?(r[c.k]?nfa(r[c.k]):'<span class="z">0</span>'):esc(r[c.k]));
  return `<div class="tw${opt.tall?' tall':''}"><table class="${opt.sticky?'sticky1':''}">
    <thead><tr>${cols.map(c=>`<th class="s ${c.cls||''}${c.st?' st':''}" data-tsort="${id}|${c.k}"${st.k===c.k?` data-dir="${st.dir}"`:''}>${c.l}</th>`).join('')}</tr></thead>
    <tbody>${list.map((r,i)=>`<tr${opt.onRow?` class="clk" data-trow="${id}|${i}"`:''}>${cols.map(c=>`<td class="${c.cls||''}${c.st?' st':''}">${cell(c,r)}</td>`).join('')}</tr>`).join('')}
    ${opt.foot?`<tr class="tot">${cols.map(c=>`<td class="${c.cls||''}${c.st?' st':''}">${opt.foot(c)??''}</td>`).join('')}</tr>`:''}</tbody></table></div>`;
}

/** Frise horaire d'une semaine d'agent : une ligne par jour, de 0 h à 24 h.
    Services pleins, pauses hachurées, plage de nuit ombrée, repos hors résidence en pointillés ambre. */
function weekTimeline(x){
  const W=760, L=78, R=12, top=22, rh=24, gap=6, n=x.jours.length;
  const Hh=top+n*(rh+gap)+4, cw=W-L-R, X=h=>L+h/24*cw;
  const D0=x.jours.map(j=>Date.parse(j.date+'T00:00:00Z'));
  const nuit=isAFR(x.metier)?S.rules.nuitAFR:S.rules.nuitCDR;
  const Y=d=>top+d*(rh+gap);
  /** découpe un intervalle [a,b] (ms) sur les lignes jour */
  const cut=(a,b)=>{const o=[];D0.forEach((d0,i)=>{const s=Math.max(a,d0),e=Math.min(b,d0+DAY);if(e>s)o.push([i,(s-d0)/H,(e-d0)/H]);});return o;};
  let g=`<defs><pattern id="tlHatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--surface)"/><rect width="2" height="5" fill="var(--accent-line)"/></pattern></defs>`;
  for(let h=0;h<=24;h+=3) g+=`<text class="tl-h" x="${X(h).toFixed(1)}" y="12" text-anchor="middle">${String(h).padStart(2,'0')}h</text>`;
  x.jours.forEach((j,i)=>{
    const y=Y(i);
    g+=`<rect class="tl-row" x="${L}" y="${y}" width="${cw}" height="${rh}" rx="5"/>`;
    const [n0,n1]=nuit; const bands=n1>n0?[[n0,n1]]:[[0,n1],[n0,24]];
    bands.forEach(([a,b])=>g+=`<rect class="tl-nuit" x="${X(a).toFixed(1)}" y="${y}" width="${(X(b)-X(a)).toFixed(1)}" height="${rh}"/>`);
    for(let h=6;h<24;h+=6) g+=`<line class="tl-g" x1="${X(h).toFixed(1)}" y1="${y}" x2="${X(h).toFixed(1)}" y2="${y+rh}"/>`;
    g+=`<text class="tl-day" x="0" y="${y+11}">${JS[i]}</text><text class="tl-date" x="0" y="${y+22}">${dISO(j.date)}</text>`;
  });
  const end=D0[n-1]+DAY;
  for(const r of x.rhr||[]){
    const a=Date.parse(r.debut), b=r.fin?Date.parse(r.fin):end;
    cut(a,b).forEach(([i,h0,h1],k)=>{ g+=`<rect class="tl-rhr" x="${X(h0).toFixed(1)}" y="${Y(i)+2}" width="${(X(h1)-X(h0)).toFixed(1)}" height="${rh-4}" rx="4"
      data-tip="${esc(`<b>Repos hors résidence</b><span class="tr"><span>Lieu</span><b>${esc(r.lieu)}</b></span><span class="tr"><span>Du</span><b>${dtISO(r.debut)}</b></span><span class="tr"><span>Au</span><b>${r.fin?dtISO(r.fin):'semaine suivante'}</b></span>${r.dureeH!=null?`<span class="tr"><span>Durée</span><b>${fmtH(r.dureeH)}</b></span>`:''}`)}"/>`;
      if(k===0&&X(h1)-X(h0)>70) g+=`<text class="ts" x="${(X(h0)+6).toFixed(1)}" y="${Y(i)+rh/2+4}" style="font-size:10px;font-weight:700;fill:var(--signal-ink)">RHR · ${esc(r.lieu)}</text>`;
    });
  }
  x.jours.forEach((j,i)=>{
    const y=Y(i);
    if(j.kind==='CODE') g+=`<text class="tl-code" x="${X(12).toFixed(1)}" y="${y+rh/2+4}" text-anchor="middle">${esc(j.family==='HORS'?'Non compté (hors colonne)':j.code)}${j.family!=='HORS'&&CODEL[j.family]&&j.family!=='AUTRE'?' · '+CODEL[j.family]:''}</text>`;
    else if(j.kind==='VIDE'&&j.blanche) g+=`<rect class="tl-bl" x="${L+1}" y="${y+1}" width="${cw-2}" height="${rh-2}" rx="5"/><text class="tl-blt" x="${X(12).toFixed(1)}" y="${y+rh/2+4}" text-anchor="middle">Journée blanche${j.horsResidence?' · hors résidence':''}</text>`;
    else if(j.kind==='VIDE') g+=`<text class="tl-h" x="${X(12).toFixed(1)}" y="${y+rh/2+4}" text-anchor="middle">case vide${j.jbRaison?' · '+esc(j.jbRaison):''}</text>`;
    if(j.kind==='SERVICE') for(const m of j.missions){
      const a=Date.parse(m.start), b=Date.parse(m.end);
      const tip=esc(`<b>${esc(m.label)}</b><span class="tr"><span>${esc(m.from||'?')} → ${esc(m.to||'?')}</span></span><span class="tr"><span>Horaire</span><b>${dtISO(m.start)} – ${hm(m.end)}</b></span><span class="tr"><span>Amplitude</span><b>${fmtH(m.amplitude)}</b></span>${m.pauseMin?`<span class="tr"><span>Pauses</span><b>${m.pauseMin} min</b></span>`:''}`);
      cut(a,b).forEach(([ii,h0,h1],k)=>{
        const yy=Y(ii)+4, w=X(h1)-X(h0);
        g+=`<rect class="tl-pause" x="${X(h0).toFixed(1)}" y="${yy}" width="${w.toFixed(1)}" height="${rh-8}" rx="3" data-tip="${tip}"/>`;
        workSegments(m).forEach(([s0,s1])=>cut(s0,s1).filter(c=>c[0]===ii).forEach(([,p0,p1])=>{ if(p1>h0-1e-9&&p0<h1+1e-9)
          g+=`<rect class="tl-svc" x="${X(p0).toFixed(1)}" y="${yy}" width="${Math.max(1.5,X(p1)-X(p0)).toFixed(1)}" height="${rh-8}" rx="3" data-tip="${tip}"/>`; }));
        if(k===0&&w>56) g+=`<text class="tl-lab" x="${(X(h0)+5).toFixed(1)}" y="${yy+rh/2}">${esc(String(m.label).slice(0,Math.floor(w/6.4)))}</text>`;
      });
    }
    if(j.horsColonne) g+=`<rect class="tl-hc" x="${L-3}" y="${y-2}" width="${cw+6}" height="${rh+4}" rx="6"><title>Mission datée hors de sa colonne, non comptée</title></rect>`;
  });
  return `<div class="tl-w"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Frise horaire de la semaine">${g}</svg></div>`;
}

    {k:'tpsAgent',l:'Temps RHR / agent',v:r=>r.g.agentsAvecRHR?r.g.rhrHeures/r.g.agentsAvecRHR:0,f:r=>r.g.agentsAvecRHR?fmtH(r.g.rhrHeures/r.g.agentsAvecRHR):'<span class="z">—</span>'},
    {k:'tpsSem',l:'Temps RHR / semaine',v:r=>r.g.rhrHeures/nW,f:r=>r.g.rhrHeures?fmtH(r.g.rhrHeures/nW):'<span class="z">—</span>'},
    {k:'rhrNuits',l:'Nuits HR',v:r=>r.g.rhrNuits,f:r=>nf(r.g.rhrNuits)},
    {k:'rhr8_12',l:'8–12 h',v:r=>r.g.rhr8_12,f:r=>nf(r.g.rhr8_12)},
    {k:'rhr12_24',l:'12–24 h',v:r=>r.g.rhr12_24,f:r=>nf(r.g.rhr12_24)},
    {k:'rhr24',l:'24 h et +',v:r=>r.g.rhr24,f:r=>nf(r.g.rhr24)},
    {k:'rhrSuccessifs',l:'Successifs',v:r=>r.g.rhrSuccessifs,f:r=>nf(r.g.rhrSuccessifs)},
    {k:'nbDISPO',l:'DISPO',v:r=>r.g.nbDISPO,f:r=>nf(r.g.nbDISPO)},
    {k:'nbATCMD',l:'ATCMD',v:r=>r.g.nbATCMD,f:r=>nf(r.g.nbATCMD)},
    {k:'heuresSup',l:'Heures sup',v:r=>r.g.heuresSup,f:r=>r.g.heuresSup?fmtH(r.g.heuresSup):'<span class="z">—</span>'},
  ];
  const foot=c=>({agence:'Total',nbAgents:nf(gT.nbAgents),agentsAvecRHR:nf(gT.agentsAvecRHR),nbRHR:nf(gT.nbRHR),
    rhrParAgent:gT.agentsAvecRHR?nf(gT.nbRHR/gT.agentsAvecRHR,2):'—',rhrHeures:fmtH(gT.rhrHeures),
    tpsAgent:gT.agentsAvecRHR?fmtH(gT.rhrHeures/gT.agentsAvecRHR):'—',tpsSem:fmtH(gT.rhrHeures/nW),rhrNuits:nf(gT.rhrNuits),
    nbDISPO:nf(gT.nbDISPO),nbATCMD:nf(gT.nbATCMD),heuresSup:fmtH(gT.heuresSup),
    rhr8_12:nf(gT.rhr8_12),rhr12_24:nf(gT.rhr12_24),rhr24:nf(gT.rhr24),rhrSuccessifs:nf(gT.rhrSuccessifs)})[c.k];
  const persons=mergeAcrossWeeks(cdr).filter(p=>p.nbRHR>0);
  const perCols=[
    {k:'nom',l:'Agent',cls:'l',st:1,v:p=>p.nom+' '+p.prenom,f:p=>`<span class="nm">${esc(p.nom)}</span> ${esc(p.prenom)}`},
    {k:'agence',l:'Agence',cls:'l',f:p=>`<span class="dot" style="background:${agenceColor(p.agence)}"></span>${esc(p.agence)}`},
    {k:'nbSemaines',l:'Semaines',f:p=>nf(p.nbSemaines)},
    {k:'nbRHR',l:'RHR',f:p=>`<b>${nf(p.nbRHR)}</b>${p.rhrEnCours?' <span class="pill pill-w">en cours</span>':''}`},
    {k:'rhrHeures',l:'Temps en RHR',f:p=>fmtH(p.rhrHeures)},
    {k:'tpsMoy',l:'Temps moyen / RHR',v:p=>p.rhrHeures/p.nbRHR,f:p=>fmtH(p.rhrHeures/p.nbRHR)},
    {k:'tpsSem',l:'Temps RHR / semaine',v:p=>p.rhrHeures/p.nbSemaines,f:p=>fmtH(p.rhrHeures/p.nbSemaines)},
    {k:'rhrNuits',l:'Nuits HR'},
    {k:'rhr8_12',l:'8–12 h'},{k:'rhr12_24',l:'12–24 h'},{k:'rhr24',l:'24 h et +'},{k:'rhrSuccessifs',l:'Successifs'},
    {k:'rhrLieux',l:'Lieux',cls:'l mono',v:p=>p.rhrLieux.join(' '),f:p=>esc(p.rhrLieux.join(' '))},
    {k:'nbDISPO',l:'DISPO'},{k:'nbATCMD',l:'ATCMD'},
    {k:'heuresSup',l:'Heures sup',f:p=>p.heuresSup?`<b>${fmtH(p.heuresSup)}</b>`:'<span class="z">—</span>'},
  ];
  return `<section class="card">
    <div class="card-h"><div><h2>Repos hors résidence par agence</h2>
      <p class="card-s">conducteurs uniquement · les moyennes par agent ne portent que sur les agents qui ont eu au moins un RHR — cliquez un en-tête pour trier</p></div>
      <button class="btn btn-sm" data-goto="exports">Exporter</button></div>
    <div class="card-b">
      <div class="note mb">Un RHR est un repos journalier pris hors résidence (accord d'entreprise, art. 18) : une mission se termine ailleurs qu'à la résidence et la suivante commence au moins ${nfa(S.rules.rhrMinHours)} h plus tard, de jour comme de nuit${S.rules.rhrCoupeParRepos?', sans jour de repos ni d’absence entre les deux':''}. Tranches de l'annexe 1 : 8–12 h, 12–24 h, 24 h et plus ; « successifs » : deux RHR sans retour à résidence entre eux. Chaque coupure peut être corrigée depuis la fiche de l'agent. Les AFR sont exclus du décompte. Le temps en RHR est la durée entre la fin d'un service et le début du suivant. DISPO et ATCMD sont comptés séparément ; une ATCMD compte pour ${nf(S.rules.heuresATCMD)} h de travail.</div>
      ${cdr.length?stable('rhrag',sumCols,byAg,{sort:{k:'nbRHR',dir:'desc'},foot}):'<p class="mut">Aucun conducteur sur ce périmètre.</p>'}
    </div></section>
  <section class="card">
    <div class="card-h"><div><h2>Par agent</h2><p class="card-s">${nf(persons.length)} agent${persons.length>1?'s':''} ayant eu au moins un RHR, une ligne par personne — cliquez une ligne pour le détail des coupures</p></div></div>
    <div class="card-b">${persons.length?stable('rhrag2',perCols,persons,{sort:{k:'nbRHR',dir:'desc'},tall:true,sticky:true,onRow:true}):'<p class="mut">Aucun repos hors résidence sur ce périmètre.</p>'}</div></section>`;
}
/* ---------- journées blanches ---------- */
function viewBlanches(){
  const sc=scopeAgents(); if(!sc.length) return emptyScope();
  const rows=[]; sc.forEach(a=>a.blanches.forEach(b=>rows.push({a,b})));
  const byAg=[...groupBy(rows,x=>x.a.agence+'||'+x.a.metier)].sort((a,b)=>a[0].localeCompare(b[0]));
  const parJour=JS.map((j,i)=>({l:j,v:rows.filter(x=>x.b.d===i).length}));
  // toutes les cases vides du périmètre, pour vérifier et corriger
  const all=[]; sc.forEach(a=>(a.casesVides||[]).forEach(c=>all.push({a,c})));
  const F=[['comptees','Journées blanches',x=>x.c.compte],['manuelles','Corrigées à la main',x=>!!x.c.manuel],
    ['non','Cases vides non comptées',x=>!x.c.compte],['toutes','Toutes les cases vides',()=>true]];
  const fl=F.find(f=>f[0]===S.jbFiltre)||F[0];
  const list=all.filter(fl[2]).sort((x,y)=>x.a.nom.localeCompare(y.a.nom,'fr')||String(x.c.date).localeCompare(String(y.c.date)));
  S.rows_jbl=list;
  const mis=(m,t)=>m?`<span class="mono">${esc(m.label)}</span> <span class="mut sm">${t==='a'?`fin ${hmD(m.end)} à ${esc(m.to||'?')}`:`début ${hmD(m.start)} de ${esc(m.from||'?')}`}</span>`:'<span class="z">—</span>';
  return `<section class="card">
    <div class="card-h"><div><h2>Journées blanches</h2><p class="card-s">${nf(rows.length)} journée${rows.length>1?'s':''} sur le périmètre</p></div>
      <button class="btn btn-sm" data-goto="exports">Exporter</button></div>
    <div class="card-b">
      <div class="note mb">Journée sans mission ni code — ni RP, ni congé — encadrée par deux services dans la semaine. Les lendemains de service de nuit, où l'agent est encore en service jusqu'au matin, sont exclus. Chaque case peut être corrigée ci-dessous ; la correction est mémorisée.</div>
      ${rows.length?`<div class="cols2">
        <div class="tw"><table><thead><tr><th class="l">Agence</th><th class="l">Métier</th><th>Journées</th><th>Agents</th></tr></thead>
          <tbody>${byAg.map(([k,l])=>{const[ag,me]=k.split('||');
            return `<tr><td class="l nm">${esc(ag)}</td><td class="l">${esc(me)}</td><td>${l.length}</td>
            <td>${new Set(l.map(x=>personKey(x.a))).size}</td></tr>`;}).join('')}</tbody></table></div>
        <div>${barChart(parJour,{label:'Journées blanches'})}</div></div>`:''}
    </div></section>
  <section class="card">
    <div class="card-h"><div><h2>Vérifier jour par jour</h2><p class="card-s">${nf(list.length)} case${list.length>1?'s':''} · missions qui encadrent chaque jour · filtrez un agent avec la recherche en haut · cliquez un nom pour sa fiche</p></div>
      <div class="seg">${F.map(([k,l])=>`<button class="sg" data-jbf="${k}" aria-pressed="${fl[0]===k}">${l}</button>`).join('')}</div></div>
    <div class="card-b">${list.length?`<div class="tw tall"><table class="sticky1"><thead><tr><th class="l st">Agent</th><th class="l">Agence</th><th class="l">Jour</th><th class="l">Mission avant</th><th class="l">Mission après</th><th class="l">Statut</th>${admin()?'<th class="l">Correction</th>':''}</tr></thead><tbody>
      ${list.map(({a,c},i)=>{const k=kJour(personKey(a),c.date);
        return `<tr><td class="l st"><button class="lnk" data-jbl="${i}"><span class="nm">${esc(a.nom)}</span> ${esc(a.prenom)}</button></td><td class="l">${esc(a.agence)}</td>
        <td class="l"><b>${JS[c.d]}</b> <span class="mono mut">${dISO(c.date)}</span></td>
        <td class="l">${mis(c.avant,'a')}</td><td class="l">${mis(c.apres,'p')}</td>
        <td class="l">${c.compte?'<span class="pill pill-w">journée blanche</span>':'<span class="pill pill-n">non comptée</span>'}${c.horsResidence?' <span class="pill pill-a">hors résidence</span>':''} <span class="mut sm">${esc(c.raison||'')}</span></td>
        ${admin()?`<td class="l">${c.manuel?`<button class="btn btn-sm" data-cjb="${esc(k)}" data-v="">Annuler</button>`
          :c.compte?`<button class="btn btn-sm" data-cjb="${esc(k)}" data-v="non">Pas une journée blanche</button>`
          :`<button class="btn btn-sm" data-cjb="${esc(k)}" data-v="oui">Journée blanche</button>`}</td>`:''}</tr>`;}).join('')}
      </tbody></table></div>`:'<p class="mut">Aucune case pour ce filtre.</p>'}</div></section>`;
}

/* ---------- graphiques ---------- */
function viewGraphiques(){
  if(!S.weeks.length) return emptyScope();
  const sc=scopeAgents(); if(!sc.length) return emptyScope();
  const c=S.chart, M=METRICS.find(m=>m.k===c.metric)||METRICS[0], k=M.k, mode=S.mode;
  const isRHR=k==='nbRHR';
  const base=l=>isRHR?l.filter(a=>a.rhrApplicable):l;     // les AFR n'entrent pas dans les statistiques RHR
  const fm=v=>M.f(v);
  const rows=base(sc);
  const byAg=[...groupBy(rows,a=>a.agence)].map(([l,list])=>{const g=agg(list);return {l,v:modeVal(g,k,mode),c:agenceColor(l),sub:nf(g.nbAgents),sub2:'Agents'};}).sort((a,b)=>b.v-a.v);
  const byMe=[...groupBy(rows,a=>a.metier)].map(([l,list])=>{const g=agg(list);return {l,v:modeVal(g,k,mode),sub:nf(g.nbAgents),sub2:'Agents'};}).sort((a,b)=>b.v-a.v);
  // répartition par agent : une ligne par personne (pour le RHR, uniquement ceux qui en ont eu)
  const persons=mergeAcrossWeeks(rows).filter(p=>!isRHR||p.nbRHR>0);
  const pers=persons.map(p=>({l:`${p.nom} ${p.prenom.slice(0,1)}.`,v:mode==='total'?p[k]:r2(p[k]/(p.nbSemaines||1)),c:agenceColor(p.agence),sub:p.agence,sub2:'Agence'})).sort((a,b)=>b.v-a.v);
  const avgP=pers.length?pers.reduce((s,x)=>s+x.v,0)/pers.length:0;
  // évolution hebdomadaire et moyennes par semaine : toutes les semaines enregistrées
  const all=base(scopeAgents({allWeeks:true}));
  const ids=S.weeks.map(w=>w.weekId).sort();
  const labels=ids.map(id=>`S${String(S.weeks.find(x=>x.weekId===id).week).padStart(2,'0')}`);
  const shown=scopeAgences().slice(0,8);
  const series=shown.map(ag=>({name:ag,short:ag.slice(0,3).toUpperCase(),color:agenceColor(ag),
    values:ids.map(id=>{const l=all.filter(a=>a.weekId===id&&a.agence===ag); return l.length?modeVal(agg(l),k,mode==='agent'?'agent':'total'):null;})}));
  const legend=shown.map(ag=>`<span class="lg"><span class="cdot" style="background:${agenceColor(ag)}"></span>${esc(ag)}</span>`).join('');
  // moyennes par semaine : tous métiers du périmètre ; le RHR ne porte que sur les conducteurs
  const allRows=scopeAgents({allWeeks:true}), nWall=new Set(allRows.map(a=>a.weekId)).size;
  const wval=(l,mk)=>{ if(mk!=='nbRHR') return agg(l)[mk+'_sem']; const w=new Set(l.map(a=>a.weekId)).size||1;
    return r2(l.filter(a=>a.rhrApplicable).reduce((s,a)=>s+a.nbRHR,0)/w); };
  const wk=[...groupBy(allRows,a=>a.agence)].map(([agence,l])=>{const g=agg(l),o={agence,ag:r2(g.nbLignes/g.nbSemaines)}; METRICS.forEach(m=>o[m.k]=wval(l,m.k)); return o;});
  const gW=(()=>{const g=agg(allRows),o={ag:r2(g.nbLignes/g.nbSemaines)}; METRICS.forEach(m=>o[m.k]=wval(allRows,m.k)); return o;})();
  const wCols=[{k:'agence',l:'Agence',cls:'l nm',f:r=>esc(r.agence)},
    {k:'ag',l:'Agents / sem.',f:r=>nf(r.ag,1)},
    ...METRICS.map(m=>({k:m.k,l:m.c+' / sem.',f:r=>m.f(r[m.k])}))];
  const tops=[15,25,50,100,0];
  return `
  <section class="card"><div class="card-b"><div class="ctrls" style="margin-bottom:0;border-bottom:0;padding-bottom:0">
    <div class="fld"><span class="flabel">Mesure</span><div class="seg">${METRICS.map(m=>`<button class="sg" data-cm="${m.k}" aria-pressed="${m.k===k}">${m.c}</button>`).join('')}</div></div>
    <div class="fld"><span class="flabel">Valeur</span>${modeSeg()}</div></div>
    <p class="hint">${esc(modeHint())} · les filtres de semaine, d'agence et de métier s'appliquent${isRHR?' · RHR : conducteurs uniquement':''}</p></div></section>
  <div class="charts">
    <section class="card"><div class="card-h"><div><h2>${esc(M.l)} par agence</h2><p class="card-s">${esc(modeHint())}</p></div></div>
      <div class="card-b">${barChart(byAg,{fmt:fm,label:M.l})}</div></section>
    <section class="card"><div class="card-h"><div><h2>${esc(M.l)} par métier</h2><p class="card-s">${esc(modeHint())}</p></div></div>
      <div class="card-b">${barChart(byMe,{fmt:fm,label:M.l})}</div></section>
  </div>
  <section class="card"><div class="card-h"><div><h2>Répartition par agent</h2>
    <p class="card-s">${esc(M.l)}${mode==='total'?'':' par semaine'} · ${nf(pers.length)} agent${pers.length>1?'s':''}${isRHR?' ayant eu au moins un RHR':''} · moyenne ${fm(avgP)}</p></div>
    <label class="fld"><span class="flabel">Afficher</span><select id="cTop">${tops.map(n=>`<option value="${n}"${c.top===n?' selected':''}>${n?n+' premiers':'tous'}</option>`).join('')}</select></label></div>
    <div class="card-b">${barChart(c.top?pers.slice(0,c.top):pers,{fmt:fm,label:M.l})}</div></section>
  <section class="card"><div class="card-h"><div><h2>Évolution hebdomadaire</h2>
    <p class="card-s">${esc(M.l)} — une courbe par agence${mode==='agent'?', moyenne par agent':''} · toutes les semaines enregistrées</p></div></div>
    <div class="card-b">${lineChart(series,labels,fm)}<div class="clg">${legend}</div>
    ${S.weeks.length<2?'<p class="hint">Une seule semaine enregistrée : la courbe prendra son sens dès la deuxième.</p>':''}</div></section>
  <section class="card"><div class="card-h"><div><h2>Moyennes par semaine</h2><p class="card-s">sur ${nf(nWall)} semaine${nWall>1?'s':''} enregistrée${nWall>1?'s':''} — cliquez un en-tête pour trier</p></div></div>
    <div class="card-b">${stable('wk',wCols,wk,{sort:{k:'agence',dir:'asc'},foot:cc=>cc.k==='agence'?'Total':cc.k==='ag'?nf(gW.ag,1):METRICS.find(m=>m.k===cc.k).f(gW[cc.k])})}</div></section>`;
}

/* ---------- corrections : coupures entre missions, cases vides, missions liées ---------- */
const ST_COUP={rhr:['RHR','pill-w'],force:['RHR (à la main)','pill-w'],lien:['RHR (missions liées)','pill-w'],ouvert:['RHR ouvert','pill-w'],
  residence:['à la résidence','pill-n'],court:['arrêt trop court','pill-n'],repos:['repos pendant l’arrêt','pill-n'],ecarte:['écarté à la main','pill-c']};
const admin=()=>S.role==='admin';
const hmD=s=>{const d=new Date(s);return `${JS[(d.getUTCDay()+6)%7]} ${hm(s)}`;};
/** Tableau des coupures d'une semaine d'agent, avec les boutons de correction */
function coupuresView(x){
  const pk=personKey(x), cs=x.coupures||[];
  if(!x.rhrApplicable) return '<p class="hint">Métier sans repos hors résidence (règle des Réglages).</p>';
  if(!x.residence) return '<p class="hint">Résidence de l’agence inconnue : à renseigner dans les Réglages.</p>';
  const lieux=[...new Set((x.missions||[]).flatMap(m=>[m.from,m.to]).filter(Boolean).map(normLieu))];
  const ratt=admin()?`<div class="lienf" style="margin:0 0 10px"><span class="flabel">Résidence retenue cette semaine : ${esc(x.residence)}${x.rattachement?' (rattachement temporaire, accord art. 8)':''}</span>
    <div class="btns" style="align-items:center">${x.rattachement
      ?`<button class="btn btn-sm" data-ratt="${esc(pk+'|'+x.weekId)}" data-lieu="">Annuler le rattachement temporaire</button>`
      :`<select id="rt-${esc(x.weekId)}">${lieux.filter(l=>l!==normLieu(x.residence)).map(l=>`<option${l===x.lieuHabituel?' selected':''}>${esc(l)}</option>`).join('')}</select>
        <button class="btn btn-sm" data-ratt="${esc(pk+'|'+x.weekId)}" data-sel="rt-${esc(x.weekId)}">Rattacher temporairement cette semaine</button>`}</div></div>`
    :(x.rattachement?`<p class="hint">Rattachement temporaire à ${esc(x.rattachement)} cette semaine.</p>`:'');
  const btn=(c)=>{ if(!admin()) return '';
    if(c.statut==='lien') return `<button class="btn btn-sm" data-lien-del="${esc(JSON.stringify(c.lien))}">Supprimer le lien</button>`;
    if(c.manuel) return `<button class="btn btn-sm" data-crhr="${esc(c.key)}" data-v="">Annuler la correction</button>`;
    return c.compte
      ? `<button class="btn btn-sm" data-crhr="${esc(c.key)}" data-v="non">Pas un RHR</button>${c.lieu?`<button class="btn btn-sm" data-lieures="${esc(x.agence)}" data-lieu="${esc(c.lieu)}" title="Mémorise ce lieu comme la résidence de ${esc(x.agence)} pour tous les agents">${esc(c.lieu)} = résidence</button>`:''}`
      : `<button class="btn btn-sm" data-crhr="${esc(c.key)}" data-v="oui">Compter en RHR</button>`; };
  const ms=x.missions||[];
  const opt=(m,i)=>`<option value="${i}">${JS[m.d]??''} ${hm(m.start)}–${hm(m.end)} · ${esc(m.label)} (${esc(m.from||'?')} → ${esc(m.to||'?')})</option>`;
  return `${ratt}${cs.length?`<div class="tw"><table><thead><tr><th class="l">Fin de mission</th><th class="l">Lieu</th><th class="l">Reprise</th><th>Arrêt</th><th class="l">Statut</th>${admin()?'<th class="l">Correction</th>':''}</tr></thead><tbody>
    ${cs.map(c=>{const [l,cl]=ST_COUP[c.statut]||[c.statut,'pill-n'];
      return `<tr><td class="l mono">${hmD(c.debut)} <span class="mut">${esc(c.aller)}</span></td><td class="l mono">${esc(c.lieu||'?')}</td>
      <td class="l mono">${c.fin?`${hmD(c.fin)} <span class="mut">${esc(c.retour)}</span>`:'<span class="mut">semaine suivante</span>'}</td>
      <td>${c.dureeH!=null?fmtH(c.dureeH):'—'}</td><td class="l"><span class="pill ${cl}">${l}</span>${c.long?` <span class="pill pill-c" title="L'accord limite l'absence du domicile à ${nfa(S.rules.rhrMaxAbsence)} h (art. 18)">plus de ${nfa(S.rules.rhrMaxAbsence)} h : à vérifier</span>`:''}</td>
      ${admin()?`<td class="l"><span class="btns" style="gap:5px">${btn(c)}</span></td>`:''}</tr>`;}).join('')}</tbody></table></div>`
    :'<p class="hint">Aucune coupure cette semaine.</p>'}
    ${admin()&&ms.length>1?`<div class="lienf"><span class="flabel">Lier deux missions (un seul RHR de la fin de la première au début de la seconde)</span>
      <div class="btns" style="align-items:center"><select id="lA-${x.weekId}">${ms.map(opt).join('')}</select><span class="mut">→</span>
      <select id="lB-${x.weekId}">${ms.map((m,i)=>opt(m,i)).join('').replace(`value="1"`,`value="1" selected`)}</select>
      <button class="btn btn-sm btn-pri" data-lien="${esc(x.weekId)}" data-pk="${esc(pk)}">Lier</button></div></div>`:''}`;
}
/** Cases vides d'une semaine d'agent : journée blanche ou non, avec la raison et les missions qui l'encadrent */
function videsView(x){
  const cv=x.casesVides||[];
  if(!cv.length) return '<p class="hint">Aucune case vide cette semaine.</p>';
  const pk=personKey(x);

/** Enregistre une correction : recalcul immédiat, puis mémorisation sur le serveur pour tous les utilisateurs */

    trajetTypes:'Trajet seul',rhrMetiers:'Métiers avec RHR',residences:'Résidences',agencesAlias:'Noms d’agence',lieuxResidence:'Lieux reconnus comme résidence'};

/* ---------- à vérifier : toutes les alertes au même endroit, avec leur suivi ---------- */
const AL_TYPES={lecture:'Lecture du fichier',horscol:'Mission hors colonne',long:'RHR de plus de 44 h',ailleurs:'Agent basé ailleurs',
  jamais:'Jamais en résidence',residence:'Résidence à confirmer',ecart:'Écart inhabituel (agent)',ecartag:'Écart inhabituel (agence)',fichier:'Fichier suspect'};
const AL_NIV={haute:['Haute','pill-c'],moyenne:['Moyenne','pill-w'],info:['Info','pill-n']};
/** Écarts à sa propre habitude : valeur d'une semaine à plus de 2 écarts-types de la moyenne, avec un écart minimal */
const ECARTS=[['nbRHR','RHR',2,nf],['heuresSup','Heures sup',4,fmtH],['heuresPlanifiees','TTE',8,fmtH],['journeesBlanches','Journées blanches',2,nf]];
function ecartsDe(series,key,label,minD,f){
  if(series.length<4) return [];
  const v=series.map(x=>x.v), m=v.reduce((s,x)=>s+x,0)/v.length, sd=Math.sqrt(v.reduce((s,x)=>s+(x-m)**2,0)/v.length);
  return series.filter(x=>sd>0&&Math.abs(x.v-m)>2*sd&&Math.abs(x.v-m)>=minD).map(x=>({...x,m,txt:`${label} : ${f(x.v)} cette semaine, ${f(r2(m))} en moyenne sur ${series.length} semaines`}));
}
/** Comparaison d'une semaine importée à la précédente : fichier incomplet ou inhabituel */
function suspicions(cur,prev){
  const out=[], nA=cur.nbAgents, pA=prev&&prev.nbAgents;
  if(pA&&Math.abs(nA-pA)/pA>0.2) out.push(`effectif ${nA>pA?'en hausse':'en baisse'} de ${nf(Math.abs(100*(nA-pA)/pA),0)} % (${nf(pA)} → ${nf(nA)} lignes)`);
  if(prev&&prev.agences&&cur.agences){ const miss=prev.agences.filter(a=>!cur.agences.includes(a)), neu=cur.agences.filter(a=>!prev.agences.includes(a));
    if(miss.length) out.push(`agence${miss.length>1?'s':''} absente${miss.length>1?'s':''} : ${miss.join(', ')}`);
    if(neu.length&&prev.agences.length) out.push(`nouvelle${neu.length>1?'s':''} agence${neu.length>1?'s':''} : ${neu.join(', ')}`); }
  if(cur.fusions&&cur.nbAgents&&cur.fusions/cur.nbAgents>0.05) out.push(`${cur.fusions} agents sur plusieurs lignes (${nf(100*cur.fusions/cur.nbAgents,0)} %)`);
  if(cur.vides!=null&&cur.nbAgents&&cur.vides/cur.nbAgents>0.1) out.push(`${cur.vides} lignes entièrement vides (${nf(100*cur.vides/cur.nbAgents,0)} %)`);
  if(cur.extractDate&&cur.monday){ const d=(Date.parse(cur.extractDate)-Date.parse(cur.monday))/DAY; if(d>14||d<-60) out.push(`date d’extraction ${dFull(cur.extractDate)} éloignée de la semaine`); }
  return out;
}
function collectAlertes(){
  const out=[], add=a=>out.push(a);
  const ids=[...S.loaded.keys()].sort(), W=id=>S.weeks.find(w=>w.weekId===id);
  for(const w of S.weeks){ const c=w.controle; if(!c||!c.anomalies) continue;
    for(const a of c.anomalies) add({key:`lec|${w.weekId}|${a.agent}|${a.jour}|${a.message}`,type:'lecture',niv:'moyenne',w:w.weekId,titre:`${a.agent} · ${a.jour}`,detail:a.message}); }
  let prevR=null;
  for(const id of ids){ const v=S.loaded.get(id), w=W(id);
    for(const h of v.meta.horsColonne||[]) add({key:`hc|${id}|${h.agent}|${h.start}`,type:'horscol',niv:'moyenne',w:id,ag:h.agence,titre:`${h.agent} · ${h.jour}`,detail:`${h.label} daté du ${dtISO(h.start)} : écartée du calcul`});
    for(const a of v.agents){ if(a.exclu) continue; const pk=personKey(a), nm=`${a.nom} ${a.prenom}`;
      for(const c of a.coupures||[]) if(c.long) add({key:`long|${c.key}`,type:'long',niv:'haute',w:id,ag:a.agence,pk,titre:nm,detail:`arrêt de ${fmtH(c.dureeH)} à ${c.lieu} (${dtISO(c.debut)} → ${dtISO(c.fin)}) : au-delà de l’absence maximale de l’accord`});
      if(a.jamaisEnResidence) add({key:`jr|${pk}|${id}`,type:'jamais',niv:'haute',w:id,ag:a.agence,pk,titre:nm,detail:`aucune mission ne passe par la résidence ${a.residence} : tous ses arrêts comptent en RHR`});
      else if(a.basAilleurs) add({key:`ail|${pk}|${id}`,type:'ailleurs',niv:'moyenne',w:id,ag:a.agence,pk,titre:nm,detail:`surtout à ${a.lieuHabituel}, résidence ${a.residence} : détachement ou rattachement temporaire ?`}); }
    for(const [ag,src] of Object.entries(v.meta.residenceSource||{})) if(src==='manuel'){
      // résidence saisie à la main mais absente des missions de cette semaine (ex. « BORDEAUX » saisi, fichier écrit « BX »)
      const lc=(v.meta.locCounts||{})[ag]||{}, res=[v.meta.residences[ag],...((S.rules.lieuxResidence||{})[ag]||[])].map(normLieu);
      const top=Object.entries(lc).sort((x,y)=>y[1]-x[1])[0];
      if(top&&!res.some(r=>lc[r])) add({key:`resman|${ag}|${id}`,type:'residence',niv:'haute',w:id,ag,titre:ag,detail:`la résidence saisie « ${v.meta.residences[ag]} » n’apparaît dans aucune mission de la semaine ; le lieu le plus fréquent est « ${top[0]} » : s’il s’agit de la même résidence, ajoutez cette écriture (fiche d’un agent, bouton « … = résidence ») ; sinon corrigez la résidence dans les Réglages. D’ici là, les RHR de cette agence sont surestimés.`}); }
    for(const [ag,src] of Object.entries(v.meta.residenceSource||{})) if(src==='indéterminée') add({key:`res|${ag}`,type:'residence',niv:'haute',w:id,ag,titre:ag,detail:'aucune résidence connue : aucun RHR ne peut être compté'});
    const cur={...(w||{}),nbAgents:v.agents.length,agences:[...new Set(v.agents.map(a=>a.agence))],fusions:v.meta.fusions,
      vides:v.agents.filter(a=>a.jours.every(j=>j.kind==='VIDE')).length,extractDate:v.meta.extractDate,monday:v.meta.monday};
    const prevW=prevR&&Date.parse(cur.monday)-Date.parse(prevR.monday)===7*DAY?prevR:null;
    for(const m of suspicions(cur,prevW)) add({key:`susp|${id}|${m.replace(/\d+/g,'#')}`,type:'fichier',niv:'moyenne',w:id,titre:w?weekLabel(w):id,detail:m});
    prevR=cur; }
  // écarts inhabituels : chaque agent comparé à ses propres semaines, chaque agence à ses propres semaines
  const rows=[...S.loaded.entries()].flatMap(([id,v])=>v.agents.filter(a=>!a.exclu).map(a=>({id,a})));
  for(const [pk,l] of groupBy(rows,x=>personKey(x.a))) for(const [k,lab,minD,f] of ECARTS){
    if(k==='nbRHR'&&!l[0].a.rhrApplicable) continue;
    for(const e of ecartsDe(l.map(x=>({w:x.id,v:x.a[k]||0,a:x.a})),k,lab,minD,f))
      add({key:`ecart|${pk}|${e.w}|${k}`,type:'ecart',niv:'info',w:e.w,ag:e.a.agence,pk,titre:`${e.a.nom} ${e.a.prenom}`,detail:e.txt}); }
  for(const [ag,l] of groupBy(rows,x=>x.a.agence)) for(const [k,lab,,f] of ECARTS){
    const per=[...groupBy(l,x=>x.id)].map(([w,x])=>({w,v:r2(x.reduce((s,y)=>s+(y.a[k]||0),0)/x.length)}));
    for(const e of ecartsDe(per,k,lab+' par agent',k==='nbRHR'||k==='journeesBlanches'?0.5:1,f)) add({key:`ecartag|${ag}|${e.w}|${k}`,type:'ecartag',niv:'info',w:e.w,ag,titre:ag,detail:e.txt}); }
  const st=S.suivi.alertes||{};
  return out.map(a=>({...a,suivi:st[a.key]||null}));
}

    title='Repos hors résidence'; rule=`Un RHR est un repos journalier pris hors résidence (accord, art. 18) : une mission se termine ailleurs qu’à la résidence de l’agence et la suivante commence au moins ${nfa(r.rhrMinHours)} h plus tard${r.rhrCoupeParRepos?', sans jour de repos ni d’absence entre les deux':''}. Les AFR sont exclus. Les nuits comptent les passages de minuit pendant le repos.`;

    html=tbl([['Agent','l'],['Sem.','l'],['Jours'],['Amplitude'],['Pauses'],['ATCMD'],['TTE'],['Heures sup']],(k==='heuresSup'?l.filter(a=>a.heuresSup>0):l).slice(0,lim).map(a=>`<tr><td class="l">${nm(a)}</td><td class="l mono">${wk(a)}</td>

  } else if(k==='heuresNuit'){

  openPanel(title,'Comment ce chiffre est obtenu, et ce qui le compose sur le périmètre affiché',`<div class="note">${rule}</div>${html}<p class="hint">Cliquez un agent dans les onglets Agents ou RHR pour sa fiche et ses corrections.</p>`);

/* ---------- 1. recherche globale : agents, agences, lieux, missions, onglets ---------- */
function paletteData(){
  const all=[...S.loaded.values()].flatMap(v=>v.agents);
  const persons=new Map(); all.forEach(a=>persons.set(personKey(a),a));
  const lieux=new Map(), codes=new Map();
  for(const a of all) for(const m of a.missions||[]){ for(const l of [m.from,m.to]) if(l){const k=normLieu(l); lieux.set(k,(lieux.get(k)||0)+1);} const t=missionType(m.label); codes.set(t,(codes.get(t)||0)+1); }
  return {all,persons:[...persons.values()],lieux,codes};
}
function openPalette(){
  if(!S.role) return;
  document.querySelector('.pal')?.remove();
  const d=document.createElement('div'); d.className='ov pal';

}
function palRender(q){
  const Q=deacc(q).toLowerCase().trim(), D=S.pal.data, res=[];
  const has=s=>deacc(String(s)).toLowerCase().includes(Q);
  for(const t of TABS.filter(t=>S.role==='admin'||['vitrine','lecture'].includes(t.k))) if(!Q||has(t.l)) res.push({g:'Aller à',l:t.l,go:()=>{S.tab=t.k;savePrefs();document.querySelector('[data-tab="'+t.k+'"]')?.click();}});
  if(Q.length>=2){
    D.persons.filter(a=>has(`${a.nom} ${a.prenom} ${a.matricule}`)).slice(0,8).forEach(a=>res.push({g:'Agents',l:`${a.nom} ${a.prenom}`,s:`${a.matricule} · ${a.agence} · ${a.metier}`,go:()=>{S.drawer=a;renderDrawer();}}));
    allAgences().filter(has).slice(0,5).forEach(ag=>res.push({g:'Agences',l:ag,s:'filtrer le périmètre sur cette agence',go:()=>{S.selAgences=[ag];savePrefs();S.tab='synthese';render();}}));
    [...D.lieux].filter(([l])=>has(l)).slice(0,6).forEach(([l,n])=>res.push({g:'Lieux',l,s:`${nf(n)} passages`,go:()=>searchPanel('lieu',l)}));
    [...D.codes].filter(([c])=>has(c)).slice(0,6).forEach(([c,n])=>res.push({g:'Missions',l:c,s:`${nf(n)} missions`,go:()=>searchPanel('code',c)}));
    if(D.all.some(a=>(a.missions||[]).some(m=>has(m.label)))) res.push({g:'Missions',l:`Toutes les missions contenant « ${q} »`,go:()=>searchPanel('texte',q)});
  }
  S.pal.res=res; S.pal.i=Math.min(S.pal.i,Math.max(0,res.length-1));
  let g=''; el('palR').innerHTML=res.length?res.map((r,i)=>`${r.g!==g?`<div class="pal-g">${esc(g=r.g)}</div>`:''}<button class="pal-i${i===S.pal.i?' on':''}" data-pi="${i}"><span>${esc(r.l)}</span>${r.s?`<span class="mut sm">${esc(r.s)}</span>`:''}</button>`).join(''):'<p class="mut" style="padding:12px 16px">Aucun résultat.</p>';
}
function palGo(){ const r=S.pal&&S.pal.res[S.pal.i]; document.querySelector('.pal')?.remove(); if(r) r.go(); }
/** Liste des missions d'un lieu, d'un code ou d'un texte, sur toutes les semaines chargées */
function searchPanel(kind,q){
  const D=paletteData(), Q=deacc(q).toLowerCase();
  const ok=m=>kind==='lieu'?[m.from,m.to].some(l=>l&&normLieu(l)===q):kind==='code'?missionType(m.label)===q:deacc(m.label).toLowerCase().includes(Q);
  const rows=D.all.flatMap(a=>(a.missions||[]).filter(ok).map(m=>({a,m}))).sort((x,y)=>y.m.start.localeCompare(x.m.start));
  const rhr=kind==='lieu'?D.all.flatMap(a=>a.rhr.filter(x=>normLieu(x.lieu)===q)).length:null;
  openPanel(kind==='lieu'?`Lieu ${q}`:kind==='code'?`Missions ${q}`:`Missions « ${q} »`,`${nf(rows.length)} mission${rows.length>1?'s':''}${rhr!=null?` · ${nf(rhr)} RHR à ce lieu`:''} · semaines chargées`,
    tbl([['Agent','l'],['Agence','l'],['Mission','l'],['Trajet','l'],['Horaire','l']],rows.slice(0,500).map(({a,m})=>`<tr class="clk" data-pnag="${esc(personKey(a))}"><td class="l"><span class="nm">${esc(a.nom)}</span> ${esc(a.prenom)}</td><td class="l">${esc(a.agence)}</td><td class="l mono">${esc(m.label)}</td><td class="l mono">${esc(m.from||'?')} → ${esc(m.to||'?')}</td><td class="l mono">${dtISO(m.start)} – ${hm(m.end)}</td></tr>`)));
}
/* ---------- 3. en bref : la semaine racontée en quelques phrases ---------- */
function enBref(){
  const sc=scopeAgents(); if(!sc.length) return '';
  const ids=[...new Set(sc.map(a=>a.weekId))].sort(), g=agg(sc), P=[];
  const nW=ids.length, wl=nW===1?(()=>{const w=S.weeks.find(x=>x.weekId===ids[0]);return w?weekLabel(w):ids[0];})():`${nW} semaines`;
  let evo='';
  if(nW===1){ const all=S.weeks.map(w=>w.weekId).sort(), i=all.indexOf(ids[0]), pid=all[i-1], pv=pid&&S.loaded.get(pid);
    if(pv){ const pl=pv.agents.filter(a=>(!S.selAgences||S.selAgences.includes(a.agence))&&(!S.selMetiers||S.selMetiers.includes(a.metier))), pg=agg(pl);
      if(pg.nbRHR){ const d=100*(g.nbRHR-pg.nbRHR)/pg.nbRHR; evo=` (${d>=0?'+':''}${nf(d,0)} % par rapport à la semaine précédente)`; } } }
  const byAg=[...groupBy(sc.filter(a=>a.rhrApplicable),a=>a.agence)].map(([ag,l])=>[ag,agg(l)]).sort((x,y)=>y[1].nbRHR-x[1].nbRHR);
  P.push(`<b>${esc(wl)}</b> : ${nf(g.nbAgents)} agents, ${nf(g.joursService)} journées de service et <b>${nf(g.nbRHR)} repos hors résidence</b>${evo}.`);
  if(byAg[0]&&byAg[0][1].nbRHR) P.push(`${esc(byAg[0][0])} en compte le plus (${nf(byAg[0][1].nbRHR)}, soit ${nf(byAg[0][1].nbRHR_moy,1)} par conducteur concerné)${byAg[1]&&byAg[1][1].nbRHR?`, devant ${esc(byAg[1][0])} (${nf(byAg[1][1].nbRHR)})`:''}.`);
  P.push(`${g.journeesBlanches?`<b>${nf(g.journeesBlanches)} journée${g.journeesBlanches>1?'s':''} blanche${g.journeesBlanches>1?'s':''}</b> pour ${nf(g.agentsAvecBlanche)} agent${g.agentsAvecBlanche>1?'s':''}`:'Aucune journée blanche'} ; ${g.heuresSup?`<b>${fmtH(g.heuresSup)} d’heures sup</b> pour ${nf(g.agentsHeuresSup)} agent${g.agentsHeuresSup>1?'s':''}`:'aucune heure sup'} ; TTE moyen ${fmtH(g.heuresPlanifiees/(sc.filter(a=>a.joursService).length||1))} par agent en service et par semaine.`);
  const h=H24(); for(const a of sc) for(const j of a.jours) if(j.kind==='SERVICE') for(const m of j.missions) for(const [s0,s1] of workSegments(m)) for(let t=Math.floor(s0/H)*H;t<s1;t+=H) h[new Date(t).getUTCHours()]+=ovl(t,t+H,s0,s1)/H;
  const pk=h.indexOf(Math.max(...h));
  P.push(`Heure la plus chargée : ${String(pk).padStart(2,'0')}h–${String(pk+1).padStart(2,'0')}h ; ${nf(100*g.heuresNuit/(g.heuresPlanifiees||1),0)} % du temps de travail se fait de nuit.`);
  if(S.alN) P.push(`<a href="#" data-goto="verifier">${nf(S.alN)} alerte${S.alN>1?'s':''} à vérifier</a>.`);
  return `<section class="card bref"><div class="card-b"><span class="flabel">En bref</span><p>${P.join(' ')}</p></div></section>`;
}

/** Détail des paniers d'une semaine : jour, plage, et ce qui l'a produit (travail dans la plage ou RHR) */

function dgFlux(){

    ['Règles de calcul','onglet Réglages','rejouées à l’affichage'],['Chiffres','tableaux, graphiques','exports Excel, CSV, rapport']];
  const w=150,gap=13;

/* ---------- 4. carte des flux : lieux reliés par les missions, taille = passages, anneau ambre = RHR ---------- */
function fluxLayout(nodes,edges,W,Hh){
  const N=nodes.length, idx=new Map(nodes.map((n,i)=>[n.id,i]));
  const P=nodes.map((n,i)=>{const a=2*Math.PI*i/N;return {x:W/2+Math.cos(a)*W/3,y:Hh/2+Math.sin(a)*Hh/3};});
  const k=Math.sqrt(W*Hh/Math.max(1,N))*0.55, E=edges.map(e=>[idx.get(e.a),idx.get(e.b),Math.log(1+e.n)]).filter(e=>e[0]!=null&&e[1]!=null);
  for(let it=0;it<400;it++){
    const t=(1-it/400)*W/12, D=P.map(()=>({x:0,y:0}));
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){ let dx=P[i].x-P[j].x, dy=P[i].y-P[j].y, d=Math.max(1,Math.hypot(dx,dy)), f=k*k/d;
      D[i].x+=dx/d*f; D[i].y+=dy/d*f; D[j].x-=dx/d*f; D[j].y-=dy/d*f; }
    for(const [i,j,w] of E){ const dx=P[i].x-P[j].x, dy=P[i].y-P[j].y, d=Math.max(1,Math.hypot(dx,dy)), f=d*d/k*(0.4+w/4);
      D[i].x-=dx/d*f; D[i].y-=dy/d*f; D[j].x+=dx/d*f; D[j].y+=dy/d*f; }
    for(let i=0;i<N;i++){ D[i].x+=(W/2-P[i].x)*0.02*k; D[i].y+=(Hh/2-P[i].y)*0.02*k;
      const l=Math.max(1,Math.hypot(D[i].x,D[i].y)); P[i].x+=D[i].x/l*Math.min(l,t); P[i].y+=D[i].y/l*Math.min(l,t); }
  }
  const xs=P.map(p=>p.x), ys=P.map(p=>p.y), x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys), m=60;
  return P.map(p=>({x:m+(x1>x0?(p.x-x0)/(x1-x0):.5)*(W-2*m),y:m*.7+(y1>y0?(p.y-y0)/(y1-y0):.5)*(Hh-1.4*m)}));
}
function fluxMap(edges,rhr,res,opt={}){
  if(!edges.length) return `<p class="mut">${opt.vide||'Aucun trajet entre deux lieux sur ce périmètre.'}</p>`;
  const W=780, Hh=440, deg=new Map(), R=new Map(rhr.map(r=>[r.l,r.n])), RS=new Set(res);
  for(const e of edges){ deg.set(e.a,(deg.get(e.a)||0)+e.n); deg.set(e.b,(deg.get(e.b)||0)+e.n); }
  const nodes=[...deg].map(([id,n])=>({id,n,rhr:R.get(id)||0,res:RS.has(id)})).sort((a,b)=>b.n-a.n).slice(0,28);
  const ids=new Set(nodes.map(n=>n.id)), E=edges.filter(e=>ids.has(e.a)&&ids.has(e.b));
  const P=fluxLayout(nodes,E,W,Hh), at=new Map(nodes.map((n,i)=>[n.id,P[i]]));
  const maxN=Math.max(...nodes.map(n=>n.n)), maxE=Math.max(...E.map(e=>e.n)), maxR=Math.max(1,...nodes.map(n=>n.rhr));
  const rad=n=>6+14*Math.sqrt(n.n/maxN);
  let g='';
  for(const e of E.sort((a,b)=>a.n-b.n)){ const a=at.get(e.a), b=at.get(e.b);
    g+=`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="var(--accent)" stroke-opacity="${(0.18+0.6*e.n/maxE).toFixed(2)}" stroke-width="${(1+7*e.n/maxE).toFixed(1)}" stroke-linecap="round"
      data-tip="${esc(`<b>${esc(e.a)} ↔ ${esc(e.b)}</b><span class="tr"><span>Missions</span><b>${nf(e.n)}</b></span>`)}"/>`; }
  for(const n of nodes){ const p=at.get(n.id), r=rad(n);
    if(n.rhr) g+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(r+3+9*Math.sqrt(n.rhr/maxR)).toFixed(1)}" fill="var(--signal-soft)" stroke="var(--signal)" stroke-width="1.5"/>`;
    g+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${n.res?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"
      data-tip="${esc(`<b>${esc(n.id)}</b>${n.res?' <span class="mut">résidence</span>':''}<span class="tr"><span>Passages</span><b>${nf(n.n)}</b></span><span class="tr"><span>RHR à ce lieu</span><b>${nf(n.rhr)}</b></span>`)}"${opt.click?` data-flieu="${esc(n.id)}" style="cursor:pointer"`:''}/>`;
    g+=`<text x="${p.x.toFixed(1)}" y="${(p.y+r+14).toFixed(1)}" text-anchor="middle" class="fx-l">${esc(n.id)}</text>`; }
  return `<div class="fx"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Carte des flux entre lieux">${g}</svg>
    <div class="legend"><span class="lg"><span class="sw" style="background:var(--accent);border-radius:50%"></span>Résidence d’agence</span><span class="lg"><span class="sw" style="border-radius:50%;border:2px solid var(--accent)"></span>Autre lieu · taille = passages</span>
    <span class="lg"><span class="sw" style="border-radius:50%;background:var(--signal-soft);border:1.5px solid var(--signal)"></span>Anneau = repos hors résidence</span><span class="lg">Trait = missions entre deux lieux</span></div></div>`;
}
/** Carte des flux du périmètre administrateur */
function fluxAdmin(sc){
  const E=new Map(), R=new Map(), res=new Set();
  for(const a of sc){ if(a.residence) res.add(normLieu(a.residence));
    for(const m of a.missions||[]){ if(!m.from||!m.to) continue; const x=normLieu(m.from), y=normLieu(m.to); if(x===y) continue; const k=x<y?x+'|'+y:y+'|'+x; E.set(k,(E.get(k)||0)+1); }
    for(const x of a.rhr) R.set(normLieu(x.lieu),(R.get(normLieu(x.lieu))||0)+1); }
  return fluxMap([...E].map(([k,n])=>{const [a,b]=k.split('|');return {a,b,n};}),[...R].map(([l,n])=>({l,n})),[...res],{click:true});

const RHR_ALL=new Set(['nbRHR','rhrNuits','rhrHeures','rhr8_12','rhr12_24','rhr24','rhrSuccessifs']);

function statVal(list,k,mode){
  if(!list.length) return null;
  const rh=RHR_ALL.has(k), base=rh?list.filter(a=>a.rhrApplicable):list;
  if(rh&&!base.length) return null;
  const t=base.reduce((s,a)=>s+(a[k]||0),0);
  if(mode==='total') return r2(t);
  if(mode==='semaine') return r2(t/(new Set(list.map(a=>a.weekId)).size||1));
  if(mode==='jour'){ const js=base.reduce((s,a)=>s+a.joursService,0); return js?r2(t/js):0; }
  const pop=rh?base.filter(a=>a.nbRHR>0):base, v=pop.map(a=>a[k]||0);
  if(mode==='agent') return v.length?r2(v.reduce((s,x)=>s+x,0)/v.length):0;

const stGroup=g=>g==='metier'?a=>a.metier:g==='agmet'?a=>a.agence+' · '+a.metier:a=>a.agence;
function perKey(weekId,e){
  const w=S.weeks.find(x=>x.weekId===weekId), m=w?w.monday:String(weekId);
  return e==='semaine'?weekId:e==='mois'?m.slice(0,7):e==='trimestre'?`${m.slice(0,4)}-T${Math.floor((+m.slice(5,7)-1)/3)+1}`:m.slice(0,4);
}
function perLabel(k,e){

}
/** Carte de chaleur : lignes × 24 heures, cellules colorées sur une seule teinte */
function heatmap(rows,unit,fmt){

    <div class="hm-r hm-h"><span class="hm-l"></span>${Array.from({length:24},(_,h)=>`<span class="hm-x">${h%3===0?String(h).padStart(2,'0'):''}</span>`).join('')}</div>
    ${rows.map(r=>{ const pk=r.v.indexOf(Math.max(...r.v));
      return `<div class="hm-r"><span class="hm-l" title="${esc(r.l)}">${esc(r.l)}</span>${r.v.map((v,h)=>{const q=v/max;
        return `<span class="hm-c${h===pk&&v>0?' pk':''}" style="background:color-mix(in srgb,var(--accent) ${Math.round(q*100)}%,var(--surface-2))" data-tip="${esc(`<b>${esc(r.l)}</b><span class="tr"><span>${String(h).padStart(2,'0')}h–${String(h+1).padStart(2,'0')}h</span><b>${fmt(v)}</b></span><span class="tr"><span>${unit}</span></span>`)}"></span>`;}).join('')}</div>`;}).join('')}
    <div class="hm-lg"><span>0</span><span class="hm-sc"></span><span>${fmt(max)}</span><span class="mut">· ${unit} · cadre = heure de pointe</span></div></div>`;
}
/** Histogramme vertical */
function histo(bins,label,fmt=nf){

}

function vAgg(cells){
  const o={n:0,rhrApp:0,avecRHR:0,avecJB:0,avecSup:0,s:{},w:new Set(cells.map(c=>c.w)).size||1,
    heat:{presence:H24(),prise:H24(),fin:H24(),rhr:H24()},dow:{presence:D7(),prise:D7()},dist:{amp:Array(6).fill(0),hp:Array(6).fill(0),rhrB:[0,0,0],rhrN:Array(5).fill(0),jbN:Array(4).fill(0)}};
  for(const f of FIELDS) o.s[f.k]=0;
  for(const c of cells){ o.n+=c.n; o.rhrApp+=c.rhrApp; o.avecRHR+=c.avecRHR; o.avecJB+=c.avecJB; o.avecSup+=c.avecSup;
    for(const f of FIELDS) o.s[f.k]+=c.s[f.k]||0;
    for(const k in o.heat) o.heat[k]=o.heat[k].map((v,i)=>v+c.heat[k][i]);
    for(const k in o.dow) o.dow[k]=o.dow[k].map((r,d)=>r.map((v,i)=>v+c.dow[k][d][i]));
    for(const k in o.dist) o.dist[k]=o.dist[k].map((v,i)=>v+c.dist[k][i]); }
  return o;
}

/* ---------- 15. une carte de la page en image PNG ---------- */
async function nodeToPng(node,scale=2){
  const z=parseFloat(getComputedStyle(node).zoom)||1;   // les diapositives sont affichées réduites : l'image, elle, est en taille réelle
  const w=Math.round(node.getBoundingClientRect().width/z), h=Math.round(node.getBoundingClientRect().height/z), cs=getComputedStyle(document.documentElement);
  const q=v=>String(v).replace(/"/g,"'");   // valeurs placées dans un attribut style="…"
  const vars=[...cs].filter(p=>p.startsWith('--')).map(p=>`${p}:${q(cs.getPropertyValue(p))}`).join(';');
  const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const clone=node.cloneNode(true); clone.querySelectorAll('.pngb,button[data-png]').forEach(b=>b.remove());
  clone.style.margin='0'; clone.style.width=w+'px'; clone.style.zoom='1';
  const html=`<div xmlns="http://www.w3.org/1999/xhtml" style="${vars};background:${getComputedStyle(document.body).backgroundColor};color:${cs.getPropertyValue('--ink')};font-family:${q(getComputedStyle(document.body).fontFamily)};font-size:14px;line-height:1.5;padding:0"><style>${css}
*,*::before,*::after{animation:none!important;transition:none!important}</style>${new XMLSerializer().serializeToString(clone)}</div>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%">${html}</foreignObject></svg>`;
  const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); await img.decode();
  const c=document.createElement('canvas'); c.width=Math.round(w*scale); c.height=Math.round(h*scale);
  const x=c.getContext('2d'); x.fillStyle=getComputedStyle(document.body).backgroundColor; x.fillRect(0,0,c.width,c.height); x.scale(scale,scale); x.drawImage(img,0,0);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}

async function dl(name,data,mime){
  if(backend.mode==='artifact'){
    const d=await window.claude?.use?.('downloads');
    if(!d){ S.msg={m:"Le téléchargement n'est pas disponible dans cette vue.",t:'w'}; render(); return; }
    try{ await d.save({filename:name,data:new Blob([data],{type:mime})}); }
    catch(e){ if(e&&e.code!=='declined'){ S.msg={m:'Export impossible : '+(e.message||e.code),t:'c'}; render(); } }
    return;
  }
  const u=URL.createObjectURL(new Blob([data],{type:mime})), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const scopeTag=()=>{
  const w=S.selWeek==='__all__'?'toutes-semaines':S.selWeek;

};
function exportXlsx(which){
  if(which==='detail'){ dl(`recap-corridor-detail-${scopeTag()}.xlsx`,buildXlsx(detailSheets()),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); return; }
  const t=tables();
  const sheets=(which==='tout'?['synthese','agents','rhr','blanches','historique']:[which]).map(k=>t[k]);
  dl(`recap-corridor-${which}-${scopeTag()}.xlsx`, buildXlsx(sheets),
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function exportCsv(which){
  const t=tables()[which];
  const q=v=>{const s=v==null?'':(typeof v==='number'?String(v).replace('.',','):String(v));
    return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const csv='﻿'+[t.cols.map(c=>q(c.t)).join(';'),...t.rows.map(r=>r.map(q).join(';'))].join('\r\n');
  dl(`recap-corridor-${which}-${scopeTag()}.csv`,csv,'text/csv;charset=utf-8');
}

/** Part des cases jour lues sans anomalie */
function gauge(c){
  if(!c||!c.cellules) return '<span class="gauge mut">Contrôle de lecture non mesuré — réimporter la semaine pour l’obtenir</span>';
  const pc=100*(1-c.illisibles/c.cellules), col=c.illisibles===0?'var(--good)':pc>=99?'var(--signal)':'var(--crit)';
  return `<span class="gauge"><span class="gt"><i style="width:${pc.toFixed(1)}%;background:${col}"></i></span>${nf(pc,pc===100?0:1)} % des cases lues sans anomalie${c.illisibles?` · ${nf(c.illisibles)} à vérifier`:''}</span>`;
}
const anomList=l=>`<details class="qd" style="margin-top:6px"><summary>Voir les ${nf(l.length)} anomalie${l.length>1?'s':''} de lecture</summary>
  <ul>${l.slice(0,300).map(a=>`<li><b>${esc(a.agent)}</b> · ${esc(a.jour)} — ${esc(a.message)}</li>`).join('')}${l.length>300?'<li>…</li>':''}</ul></details>`;
/** Mesure de lecture enregistrée avec la semaine (aucun changement de schéma : elle voyage dans le résumé) */
function controleOf(parsed){
  const cells=new Set(parsed.anomalies.map(a=>a.agent+'|'+a.jour));
  return {cellules:parsed.agents.length*7, illisibles:cells.size, anomalies:parsed.anomalies.slice(0,300)};
}

/** Liste des corrections mémorisées, avec suppression */
function correctionsCard(){

  const nm=pk=>{for(const w of S.loaded.values()){const a=w.agents.find(x=>personKey(x)===pk); if(a) return `${a.nom} ${a.prenom}`;} return pk.replace(/^[mn]:/,'');};
  const when=s=>s?dtISO(s):'fin de semaine';
  const rows=[...rh.map(([k,v])=>{const [pk,a,b]=k.split('|');return {t:v==='oui'?'Coupure comptée en RHR':'Coupure écartée',q:nm(pk),d:`${when(a)} → ${when(b)}`,del:['rhr',k]};}),
    ...li.map((l,i)=>({t:'Missions liées',q:nm(l.p),d:`${dtISO(l.a)} → ${dtISO(l.b)}`,del:['liens',i]})),
    ...jb.map(([k,v])=>{const [pk,d]=k.split('|');return {t:v==='oui'?'Journée blanche ajoutée':'Journée blanche écartée',q:nm(pk),d:dFull(d),del:['jb',k]};}),
    ...Object.entries(c.residenceSemaine||{}).map(([k,v])=>{const [pk,w]=k.split('|');return {t:`Rattachement temporaire à ${v}`,q:nm(pk),d:w,del:['residenceSemaine',k]};}),
    ...Object.entries(c.residenceAgent||{}).map(([k,v])=>{const [pk,w]=k.split('|');return {t:`Résidence propre : ${v}`,q:nm(pk),d:'à partir de '+w,del:['residenceAgent',k]};}),
    ...Object.entries(c.exclus||{}).map(([k,v])=>{const [pk,w]=k.split('|');return {t:`Exclu des chiffres${v.motif?' — '+v.motif:''}`,q:nm(pk),d:w||'toutes les semaines',del:['exclus',k]};})];
  return `<section class="card"><div class="card-h"><div><h2>Corrections mémorisées</h2>
    <p class="card-s">${nf(rows.length)} correction${rows.length>1?'s':''} — rejouées à chaque affichage, même après un réimport</p></div></div>
    <div class="card-b">${rows.length?`<div class="tw"><table><thead><tr><th class="l">Correction</th><th class="l">Agent</th><th class="l">Quand</th>${admin()?'<th></th>':''}</tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="l">${esc(r.t)}</td><td class="l nm">${esc(r.q)}</td><td class="l mono">${esc(r.d)}</td>${admin()?`<td><button class="btn btn-sm" data-corrdel="${esc(JSON.stringify(r.del))}">Supprimer</button></td>`:''}</tr>`).join('')}

}

  ${correctionsCard()}

  <section class="card"><div class="card-h"><h2>Comment les chiffres sont calculés</h2></div>
    <div class="card-b prose">
      <p><b>Repos hors résidence.</b> Les missions de chaque agent sont remises dans l'ordre chronologique. Quand une mission se termine ailleurs qu'à la résidence de son agence et que la suivante commence au moins ${nfa(r.rhrMinHours)} h plus tard, cet arrêt compte pour un RHR (repos journalier hors résidence, accord d'entreprise art. 18), de jour comme de nuit — même si les deux missions sont dans la même case${r.rhrCoupeParRepos?'. Un arrêt qui contient un jour de repos ou d’absence n’en est pas un : le repos périodique se prend à résidence (art. 19)':''}. Les lieux sont comparés sans tenir compte des majuscules ni des accents. Un séjour de deux nuits avec un service sur place au milieu compte donc deux coupures. Les AFR sont exclus, et les moyennes RHR ne portent que sur les agents qui en ont eu au moins un.</p>
      <p><b>Journée blanche.</b> Une journée sans mission et sans code, située entre deux services de la semaine. Le lendemain d'un service de nuit terminé au petit matin n'en est pas une${r.jbExcludeHorsResidence?", ni une journée passée hors résidence (pendant un RHR)":''}. La veille d'une reprise juste après minuit en est une si l'agent est à sa résidence.</p>
      <p><b>Amplitude.</b> De la prise de service à la fin de service, coupures incluses.</p>
      <p><b>TTE (temps de travail effectif) et heures sup.</b> Amplitude moins les pauses « P: » et « P2: » ; une ATCMD compte ${nf(r.heuresATCMD)} h. Les absences ne comptent aucune heure. Les heures sup sont le TTE au-delà de ${nf(r.seuilHebdo)} h, agent par agent et semaine par semaine.</p>
      <p><b>Heures de nuit.</b> Temps travaillé hors pauses entre ${r.nuitAFR[0]}h et ${r.nuitAFR[1]}h pour les AFR, entre ${r.nuitCDR[0]}h et ${r.nuitCDR[1]}h pour les conducteurs. Heures du dimanche : temps travaillé hors pauses le dimanche.</p>
      <p><b>Comptages.</b> MHIS, DISPO et ATCMD : toute mission dont l'intitulé contient ces lettres, même combinées à autre chose (« VS+MHIS » compte comme MHIS). DISPO et ATCMD sont comptés séparément. Trajet seul : mission dont l'intitulé se réduit à ${esc((r.trajetTypes||[]).join(' ou '))}.</p>
      <p><b>Paniers repas.</b> ${nf(r.panierMidi[2])} h travaillée entre ${h(r.panierMidi[0])} et ${h(r.panierMidi[1])}, ${nf(r.panierSoir[2])} h entre ${h(r.panierSoir[0])} et ${h(r.panierSoir[1])}, ${nf(r.panierNuit[2])} h entre ${h(r.panierNuit[0])} et ${h(r.panierNuit[1])}${r.panierRHR?', ou un RHR qui touche la plage du midi et/ou du soir (un panier par plage)':''}. Un panier au plus par plage et par jour. Le ratio rapporte les paniers aux jours de service travaillés.</p>
      <p><b>Agents en double.</b> Une personne présente sur plusieurs lignes d'un fichier est fusionnée jour par jour : un service l'emporte sur un code, un code sur une case vide. Sur plusieurs semaines, chaque agent n'apparaît qu'une fois dans les tableaux.</p>
      <p><b>Semaine.</b> Identifiée par la date du lundi en ligne 1 du fichier, pas par son nom. Réimporter une semaine déjà présente remplace ses données.</p>
    </div></section>`;
}

/** Messages éphémères : S.msg reste la source, affichée en bas à droite */
function renderToasts(){
  const box=el('toasts'); if(!box) return;
  const key=S.msg?S.msg.m+'|'+(S.msg.t||''):'';
  if(box.dataset.key===key) return;
  box.dataset.key=key;
  box.innerHTML=S.msg?`<div class="toast ${S.msg.t||''}" role="status">${esc(S.msg.m)}</div>`:'';
}
/** Les chiffres clés défilent jusqu'à leur valeur à l'arrivée sur un onglet */
function countUp(root){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('[data-count]').forEach(n=>{
    const to=+n.dataset.count; if(!isFinite(to)||to<=0||!Number.isInteger(to)) return;
    const t0=performance.now(), d=650;
    const f=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); n.textContent=nf(Math.round(to*e)); if(k<1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

async function handleFiles(list){
  S.err=null; S.msg=null;
  const files=[...list].filter(Boolean);
  if(!files.length) return;
  for(const f of files){
    const q={name:f.name,size:f.size,state:'lecture'}; S.queue.push(q); render();
    if(!/\.xlsx$/i.test(f.name)){ q.state='erreur'; q.err=`${f.name} — seuls les .xlsx sont lus.`; render(); continue; }
    try{
      const {rows}=await readRecapSheet(await f.arrayBuffer());
      const parsed=parseWeek(rows);
      const view=applyRules(parsed,effRules([...new Set(parsed.agents.map(a=>a.agence))]));
      view.agents.forEach(a=>a.weekId=parsed.meta.weekId);
      q.parsed=parsed; q.view=view; q.anom=parsed.anomalies.length;
      q.stats=agg(view.agents);
      q.existe=S.weeks.some(w=>w.weekId===parsed.meta.weekId);
      // fichier suspect : comparé à la semaine précédente enregistrée (effectif, agences, doublons, lignes vides, date)
      const pm=isoD(new Date(Date.parse(parsed.meta.monday)-7*DAY)), prevW=S.weeks.find(w=>w.monday===pm);
      q.susp=suspicions({nbAgents:parsed.agents.length,agences:[...new Set(parsed.agents.map(a=>a.agence))],fusions:view.meta.fusions,
        vides:parsed.agents.filter(a=>a.jours.every(j=>j.kind==='VIDE')).length,extractDate:parsed.meta.extractDate,monday:parsed.meta.monday},prevW||null);
      const dup=S.queue.find(o=>o!==q&&o.view&&o.view.meta.weekId===parsed.meta.weekId);
      if(dup){ q.state='erreur'; q.err=`${f.name} — ${weekLabel(parsed.meta)} est déjà dans la liste.`; }
      else q.state='pret';
    }catch(e){ q.state='erreur'; q.err=`${f.name} — ${e.message||e}`; }
    render();
  }
}
function weekPayload(parsed,view,fileName,size){
  const agences=[...new Set(parsed.agents.map(a=>a.agence))].sort();
  const byAgence={};
  for(const [k,list] of groupBy(view.agents,a=>a.agence+'||'+a.metier)){
    const [ag,me]=k.split('||'); byAgence[ag]=byAgence[ag]||{};
    const g=agg(list), o={nbAgents:g.nbAgents};
    for(const f of FIELDS) o[f.k]=g[f.k];
    byAgence[ag][me]=o;
  }
  return {
    resume:{...parsed.meta,agences,byAgence,fileName:fileName||'',taille:size??null,importedAt:new Date().toISOString(),controle:controleOf(parsed),
      metiers:[...new Set(parsed.agents.map(a=>a.metier))].sort()},
    details:agences.map(ag=>({weekId:parsed.meta.weekId,agence:ag,agenceSlug:slug(ag),meta:parsed.meta,
      agents:parsed.agents.filter(a=>a.agence===ag)})),
  };
}
async function saveAll(){
  if(S.busy) return;
  S.busy=true; render();
  let n=0;
  for(const q of S.queue){
    if(q.state!=='pret') continue;
    q.state='envoi'; render();
    try{
      const p=weekPayload(q.parsed,q.view,q.name,q.size);
      await api.saveSemaine(p.resume,p.details);
      const id=q.parsed.meta.weekId;
      S.parsedCache.set(id,{meta:q.parsed.meta,agents:q.parsed.agents});
      const v=applyRules(S.parsedCache.get(id),effRules()); v.agents.forEach(a=>a.weekId=id);
      S.loaded.set(id,v);
      q.state='enregistre'; n++;
    }catch(e){ q.state='erreur'; q.err=`${q.name} — ${e.message||e}`; }
    render();
  }
  S.busy=false;
  const {weeks}=await api.etat(); S.weeks=weeks;
  recomputeLoaded();   // les noms d'agence des anciens fichiers se rattachent aux semaines désormais connues
  if(!S.selAgences){ const p=['Hendaye','Bordeaux-St-Jean'].filter(a=>allAgences().includes(a)); if(p.length) S.selAgences=p; }
  await ensureLoaded(toLoad());
  S.queue=S.queue.filter(q=>q.state!=='enregistre'); S.vit=null;
  S.msg={m:`${n} semaine${n>1?'s':''} enregistrée${n>1?'s':''}. Le rapport à diffuser est prêt dans l’onglet Exports.`};
  if(!S.queue.length&&n) S.tab='synthese';
  savePrefs(); render();
  setTimeout(()=>{S.msg=null;render();},5000);
}
