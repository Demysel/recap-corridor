<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Extraction hebdomadaire des fichiers Récap National Corridor : repos hors résidence, journées blanches, heures, paniers et données par agent, métier et agence.">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1118" media="(prefers-color-scheme: dark)">
<title>Récap Corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;500;600;700;800&family=Overpass+Mono:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23175E82'/%3E%3Cpath d='M16 5v22' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='10' r='3.4' fill='%23175E82' stroke='%23fff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='22' r='3.4' fill='%23F2B233'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Jetons de conception
   Identité : la « ligne » ferroviaire — navigation en stations, signal ambre
   pour ce qui demande attention, chiffres en police à chasse fixe.
   ========================================================================== */
:root{
  --ground:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#E8ECF1;
  --line:#DCE2EA; --line-2:#C2CBD6;
  --ink:#0E1826; --ink-2:#44536A; --ink-3:#6E7E93;
  --accent:#175E82; --accent-2:#0E4460; --accent-soft:#E2EEF5; --accent-line:#A9CCE0; --on-accent:#fff;
  --signal:#F2B233; --signal-ink:#8A5A00; --signal-soft:#FDF3DE; --signal-line:#EDC77A;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#1B7A4B; --good-soft:#E1F1E8;
  --warn:#8A5A00; --warn-soft:#FDF3DE; --warn-line:#EDC77A;
  --crit:#A8231C; --crit-soft:#FBE6E4;
  --night:rgba(34,52,94,.10);
  --shadow:0 1px 2px rgba(14,24,38,.06), 0 6px 22px -8px rgba(14,24,38,.14);
  --shadow-lg:0 24px 60px -18px rgba(14,24,38,.35);
  --r:14px; --r-s:10px;
  --sans:"Overpass",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --cond:"Overpass",-apple-system,"Segoe UI",sans-serif;
  --mono:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1118; --surface:#131B26; --surface-2:#18222F; --surface-3:#212C3A;
  --line:#253141; --line-2:#344357;
  --ink:#E8EEF5; --ink-2:#A6B4C6; --ink-3:#7A8BA1;
  --accent:#6FB6D9; --accent-2:#9AD0EA; --accent-soft:#13303F; --accent-line:#2A5870; --on-accent:#08121A;
  --signal:#F2B233; --signal-ink:#F5C766; --signal-soft:#2D2310; --signal-line:#6A5020;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#5FC48D; --good-soft:#12301F;
  --warn:#F5C766; --warn-soft:#2D2310; --warn-line:#6A5020;
  --crit:#F08A83; --crit-soft:#381513;
  --night:rgba(120,150,220,.10);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0B1118; --surface:#131B26; --surface-2:#18222F; --surface-3:#212C3A;
  --line:#253141; --line-2:#344357;
  --ink:#E8EEF5; --ink-2:#A6B4C6; --ink-3:#7A8BA1;
  --accent:#6FB6D9; --accent-2:#9AD0EA; --accent-soft:#13303F; --accent-line:#2A5870; --on-accent:#08121A;
  --signal:#F2B233; --signal-ink:#F5C766; --signal-soft:#2D2310; --signal-line:#6A5020;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#5FC48D; --good-soft:#12301F;
  --warn:#F5C766; --warn-soft:#2D2310; --warn-line:#6A5020;
  --crit:#F08A83; --crit-soft:#381513;
  --night:rgba(120,150,220,.10);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{padding:0;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px);transition:background .25s}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}
.sm{font-size:12.5px}.mut{color:var(--ink-3)}.mt{margin-top:12px}.mb{margin-bottom:14px}
.nb{font-weight:400}.z{color:var(--ink-3);opacity:.5}
.mono{font-family:var(--mono);font-size:12px}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink-3);background:var(--surface)}

/* ---------- ossature : ligne latérale + contenu ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:22px 18px 18px 22px;
  border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:36px;height:36px;border-radius:11px;background:var(--accent);flex:none;display:grid;place-items:center;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.mark svg{width:22px;height:22px;display:block}
.brand h1{font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand p{margin-top:2px;font-size:11.5px;color:var(--ink-3)}
.side-f{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.side-f .btns{gap:6px}
.side-f .btn{flex:1;justify-content:center}
.main{min-width:0;padding:0 28px 70px}

/* navigation « ligne » : chaque onglet est une station */
.tabs{position:relative;display:flex;flex-direction:column;gap:2px;margin:0;padding:0}
.tabs::before{content:"";position:absolute;left:10px;top:16px;bottom:16px;width:2px;border-radius:2px;background:var(--line-2)}
.tab{position:relative;display:flex;align-items:center;gap:12px;border:0;background:none;padding:8px 10px 8px 0;
  font-size:14px;font-weight:500;color:var(--ink-2);border-radius:10px;text-align:left;transition:color .15s,background .15s}
.tab .stn{position:relative;z-index:1;width:22px;height:22px;flex:none;display:grid;place-items:center}
.tab .stn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);
  transition:transform .25s var(--ease),background .2s,border-color .2s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab:hover .stn::before{transform:scale(1.15);border-color:var(--ink-3)}
.tab[aria-selected=true]{color:var(--ink);font-weight:700}
.tab[aria-selected=true] .stn::before{width:12px;height:12px;background:var(--accent);border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft)}
.tab .tl{flex:1;min-width:0}
.tab .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--surface-3);border-radius:999px;padding:1px 7px}
.tab[aria-selected=true] .cnt{background:var(--accent-soft);color:var(--accent)}
.tab.adm{margin-top:4px}
.tsep{height:10px}

/* barre de filtres */
.top{position:sticky;top:0;z-index:40;margin:0 -28px;padding:14px 28px 12px;
  background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.top.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 20px -18px rgba(0,0,0,.5)}
.crumb{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.crumb h2{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.crumb .ctx{font-size:12.5px;color:var(--ink-3)}
.fbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.grow{flex:1}
.flabel{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
select,input[type=text],input[type=search],input[type=password]{font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:10px;padding:7px 11px;max-width:100%;transition:border-color .15s,box-shadow .15s}
select:hover,input:hover{border-color:var(--ink-3)}
select:focus,input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{appearance:none;-webkit-appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.srch{position:relative}
.srch input{width:230px;padding-left:32px;padding-right:34px}
.srch::before{content:"";position:absolute;left:11px;top:50%;width:11px;height:11px;margin-top:-7px;border:2px solid var(--ink-3);border-radius:50%}
.srch::after{content:"";position:absolute;left:21px;top:50%;width:6px;height:2px;margin-top:4px;background:var(--ink-3);transform:rotate(45deg);border-radius:2px}
.srch kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.srch input:focus+kbd,.srch input:not(:placeholder-shown)+kbd{display:none}
.sel{background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:7px 12px;font-size:13.5px;
  display:inline-flex;align-items:center;gap:9px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color .15s}
.sel:hover{border-color:var(--ink-3)}
.sel .car{color:var(--ink-3);font-size:10px;transition:transform .2s}
.sel[aria-expanded=true]{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sel[aria-expanded=true] .car{transform:rotate(180deg)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--surface-3);color:var(--ink-2);border-radius:999px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.badge.ro::before{background:var(--ink-3)}
.scope{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px;
  display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);animation:drop .22s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.sgrp{display:flex;flex-direction:column;gap:7px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;
  font-weight:500;color:var(--ink-2);transition:all .15s var(--ease);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.chip:active{transform:none}
.chip-mini{font-size:11.5px;padding:3px 10px}
.chip.ghost{border-style:dashed}
.chipset{display:flex;gap:5px;flex-wrap:wrap}

/* boutons */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 14px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 4px 14px -6px var(--accent)}
.btn-pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.dgr{border-color:var(--crit);color:var(--crit)}
.btn.dgr:hover{background:var(--crit-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn .ic{width:15px;height:15px;flex:none}

/* ---------- cartes & vue ---------- */
.stack{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:16px 19px 0}
.card-h h2{font-size:15.5px;letter-spacing:-.015em}
.card-s{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.card-b{padding:13px 19px 19px}
.card-h .btns{align-items:center}
.prose{max-width:78ch}
.prose p{margin-bottom:11px}.prose p:last-child{margin-bottom:0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.cols2{grid-template-columns:1fr}}
/* entrée d'onglet : les blocs arrivent en cascade, une seule fois par changement d'onglet */
.enter>*{animation:rise .42s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}
.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 15px;min-width:0;
  box-shadow:var(--shadow);overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 14px 30px -18px rgba(14,24,38,.4)}
.kpi .k{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.kpi .v small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.kpi .n{font-size:12px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.35}
.kpi.hot{border-color:var(--signal-line)}
.kpi.hot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--signal)}
.kpi.hot .k{color:var(--signal-ink)}

/* tableaux */
.tw{overflow:auto;border-radius:var(--r-s);border:1px solid var(--line);overscroll-behavior:contain}
.tw.tall{max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums;background:var(--surface)}
th,td{text-align:right;padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-feature-settings:"tnum"}
th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  background:var(--surface-2);position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line-2)}
tr.grp th{top:0;z-index:4;background:var(--surface-3);color:var(--ink-2);border-right:1px solid var(--line);
  font-size:10px;letter-spacing:.1em;padding-block:5px}
table.sticky1 thead tr:nth-child(2) th{top:25px}
table.sticky1 thead tr:only-child th{top:0}
th.s{cursor:pointer;user-select:none;transition:color .15s}
th.s:hover{color:var(--ink)}
th.s[data-dir]{color:var(--accent)}
th.s[data-dir]::after{content:"▾";margin-left:3px;font-size:9px}
th.s[data-dir=asc]::after{content:"▴"}
td.l,th.l{text-align:left}
th.st,td.st{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
th.st{z-index:5;background:var(--surface-2)}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tbody tr:nth-child(even) td.st{background:var(--surface-2)}
tbody tr td{transition:background .1s}
tbody tr:hover td,tbody tr:hover td.st{background:var(--accent-soft)}
tbody tr.clk{cursor:pointer}
tbody tr.clk td:first-child{box-shadow:inset 3px 0 0 transparent;transition:box-shadow .15s,background .1s}
tbody tr.clk:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tot td{font-weight:700;background:var(--surface-3)!important;border-top:1px solid var(--line-2)}
.nm{font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:baseline}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;line-height:1.6}
.pill-w{background:var(--signal-soft);color:var(--signal-ink)}
.pill-c{background:var(--crit-soft);color:var(--crit)}
.pill-g{background:var(--good-soft);color:var(--good)}
.pill-a{background:var(--accent-soft);color:var(--accent)}
.pill-n{background:var(--surface-3);color:var(--ink-2)}

/* bande semaine (détail des cases) */
.band{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.bd{border:1px solid var(--line);border-radius:9px;padding:6px 8px 8px;min-height:70px;background:var(--surface-2);overflow:hidden}
.bd .dn{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:4px}
.bd .ml{font-family:var(--mono);font-size:10.5px;line-height:1.3;margin-top:3px;word-break:break-word}
.bd .od{font-size:10.5px;color:var(--ink-2)}
.bd .od.mt{margin-top:6px}
.bd .hr{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.bd .sep{border-top:1px solid var(--accent-line);margin:4px 0}
.bd-svc{background:var(--accent-soft);border-color:var(--accent-line)}
.bd-code .cd{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:6px;font-weight:500}
.bd-vide{background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--surface-3) 5px,var(--surface-3) 10px)}
.bd-blanche{background:var(--surface);border:1.5px dashed var(--signal)}
.bd-blanche .cd{color:var(--signal-ink);font-size:11px;font-weight:700;margin-top:6px}
.bd-hors{box-shadow:inset 0 -3px 0 var(--signal)}
.bd .hc{margin-top:5px;padding-top:4px;border-top:1px dashed var(--warn-line);font-size:10px;color:var(--ink-3);line-height:1.35;word-break:break-word}
.bd .hc s{font-family:var(--mono)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding-top:11px}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line-2);flex:none}
.sw-svc{background:var(--accent-soft);border-color:var(--accent-line)}
.sw-code{background:var(--surface-2)}
.sw-bl{background:var(--surface);border:1.5px dashed var(--signal)}
.sw-hr{background:var(--surface);box-shadow:inset 0 -3px 0 var(--signal)}
.sw-bar{background:var(--accent);border-color:var(--accent)}
.sw-pause{background:repeating-linear-gradient(135deg,var(--surface) 0 2px,var(--accent-line) 2px 4px);border-color:var(--accent-line)}
.sw-rhr{background:var(--signal-soft);border:1.5px dashed var(--signal)}
.sw-nuit{background:var(--night);border-color:var(--line)}

/* frise horaire d'une semaine (lecture de la semaine) */
.tl-w{position:relative;overflow-x:auto;overscroll-behavior-x:contain}
.tl-w svg{display:block;width:100%;height:auto;overflow:visible}
.tl-day{font-size:11px;font-weight:700;fill:var(--ink-2);letter-spacing:.02em}
.tl-date{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}
.tl-h{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}
.tl-row{fill:var(--surface-2)}
.tl-g{stroke:var(--line);stroke-width:1}
.tl-nuit{fill:var(--night)}
.tl-svc{fill:var(--accent);transition:opacity .15s}
.tl-svc:hover{opacity:.8}
.tl-pause{fill:url(#tlHatch)}
.tl-rhr{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.2;stroke-dasharray:4 3}
.tl-code{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2);font-weight:600}
.tl-bl{fill:none;stroke:var(--signal);stroke-width:1.4;stroke-dasharray:5 4}
.tl-blt{font-size:10.5px;font-weight:700;fill:var(--signal-ink)}
.tl-lab{font-family:var(--mono);font-size:9.5px;fill:var(--on-accent);pointer-events:none;font-weight:600}
.tl-hc{fill:none;stroke:var(--crit);stroke-width:1.2;stroke-dasharray:2 2}

/* graphiques */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.chart{max-width:760px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ct{font-size:11px;fill:var(--ink-3);letter-spacing:.02em}
.cv{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.cvb{font-family:var(--mono);font-size:11px;fill:var(--ink);font-weight:600}
.grid-l{stroke:var(--line);stroke-width:1}
.axis-l{stroke:var(--line-2);stroke-width:1}
.hovz{fill:transparent;cursor:crosshair}
.hovz:hover{fill:var(--accent-soft);opacity:.45}
.clg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);padding-top:10px}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;margin-right:5px}
.ch{font-size:13px;color:var(--ink-2);margin:4px 0 11px;font-weight:700}
.ctrls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;padding-bottom:14px;margin-bottom:13px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.sg{border:0;background:none;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);border-radius:8px;transition:background .18s,color .18s,box-shadow .18s}
.sg:hover{color:var(--ink)}
.sg[aria-pressed=true]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(14,24,38,.14)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:12px;align-items:center;font-size:12.5px;cursor:default;border-radius:6px}
.bar:hover .bl{color:var(--ink)}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);transition:color .15s}
.bt{background:var(--surface-3);border-radius:4px;height:14px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px;transform-origin:left;animation:grow .6s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.bar:hover .bt i{filter:brightness(1.08)}
.bv{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right;min-width:32px}
.tip{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:var(--shadow-lg);padding:9px 12px;font-size:12px;pointer-events:none;max-width:290px;color:var(--ink)}
.tip .tr{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums;margin-top:3px}

/* import / listes */
.drop{position:relative;border:2px dashed var(--line-2);border-radius:var(--r);padding:40px 20px;text-align:center;background:var(--surface-2);transition:all .2s var(--ease)}
.drop.on{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.01)}
.drop .dic{width:44px;height:44px;margin:0 auto 12px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.drop h3{font-size:16px;margin-bottom:5px}
.drop p{color:var(--ink-3);font-size:13px}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;
  padding:11px 14px;font-size:13px;color:var(--ink-2)}
.note.w{border-left-color:var(--signal);background:var(--signal-soft);color:var(--signal-ink)}
.note.c{border-left-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.note b{color:var(--ink)}
.note.w b,.note.c b{color:inherit}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 14px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:12px;flex-wrap:wrap;transition:border-color .15s}
.row:hover{border-color:var(--line-2)}
.row .rl{min-width:0;flex:1}
.row .rt{font-weight:700;font-size:14px}
.row .rs{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.ract{display:flex;gap:6px;flex-wrap:wrap}
.qd{width:100%;font-size:12.5px;color:var(--ink-2)}
.lienf{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.lienf select{max-width:320px;font-size:12.5px}
.hm{display:flex;flex-direction:column;gap:2px;overflow-x:auto;padding-bottom:4px}
.hm-r{display:grid;grid-template-columns:150px repeat(24,minmax(18px,1fr));gap:2px;align-items:center;min-width:640px}
.hm-l{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.hm-x{font-family:var(--mono);font-size:9.5px;color:var(--ink-3)}
.hm-c{height:22px;border-radius:3px;transition:transform .12s}
.hm-c:hover{transform:scale(1.18);position:relative;z-index:1;box-shadow:0 0 0 1px var(--ink)}
.hm-c.pk{box-shadow:inset 0 0 0 2px var(--signal)}
.hm-lg{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.hm-sc{width:120px;height:9px;border-radius:99px;background:linear-gradient(90deg,var(--surface-2),var(--accent))}
.hg{display:flex;gap:6px;align-items:flex-end;height:190px;padding-top:6px}
.hg-b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;cursor:default}
.hg-t{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:5px 5px 0 0}
.hg-t i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:1px;transform-origin:bottom;animation:growy .6s var(--ease) both}
@keyframes growy{from{transform:scaleY(0)}}
.hg-b:hover .hg-t i{filter:brightness(1.1)}
.hg-v{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);min-height:14px}
.hg.dense .hg-v{visibility:hidden}.hg.dense{gap:3px}
.hg-l{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
table.cmp td.hi{background:color-mix(in srgb,var(--signal) 22%,var(--surface))!important;font-weight:700}
table.cmp td.lo{background:color-mix(in srgb,var(--accent) 14%,var(--surface))!important}
table.cmp tr.rsel td{box-shadow:inset 0 1px 0 var(--accent),inset 0 -1px 0 var(--accent)}
.hi-k,.lo-k{padding:0 6px;border-radius:4px}.hi-k{background:color-mix(in srgb,var(--signal) 22%,var(--surface))}.lo-k{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.up{color:var(--signal-ink);font-weight:600}.dn{color:var(--accent);font-weight:600}
.vhero{position:relative;overflow:hidden;border-radius:18px;padding:26px 26px 22px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:var(--on-accent);box-shadow:var(--shadow)}
.vhero::after{content:"";position:absolute;right:-40px;top:22px;width:420px;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 14px,transparent 14px 26px);transform:rotate(-8deg)}
.vh-t{position:relative;z-index:1;max-width:62ch}
.vh-e{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.vhero h2{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.vhero p{margin-top:8px;font-size:13.5px;opacity:.9}
.vh-p{position:relative;z-index:1;display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 13px;max-width:440px}
.vfil{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.vkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.vk-r{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.spk{width:110px;height:30px;flex:none;overflow:visible}
.vfoot{font-size:12px;color:var(--ink-3);line-height:1.6;max-width:110ch;padding:4px 2px 0}
.xk{cursor:pointer}.xk:hover{border-color:var(--accent-line)}.xk:hover .k::after{content:" · détail";color:var(--accent);text-transform:none;letter-spacing:0}
.bref p{font-size:14.5px;line-height:1.65;margin-top:6px;max-width:120ch}.bref a{color:var(--accent);font-weight:700}
.srchbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:8px 11px;color:var(--ink-3);font-size:13px;transition:border-color .15s}
.srchbtn:hover{border-color:var(--accent)}
.ov.pal{align-items:flex-start;justify-content:center;padding-top:12vh}
.pal-b{width:min(640px,94vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:rise .2s var(--ease)}
.pal-b input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:16px;box-shadow:none!important}
.pal-r{max-height:52vh;overflow:auto;padding:6px}
.pal-g{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px 4px}
.pal-i{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;font-size:14px}
.pal-i.on,.pal-i:hover{background:var(--accent-soft)}
.pal-f{border-top:1px solid var(--line);padding:8px 14px;font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
@media (max-width:1080px){.srchbtn{display:none}}
.fx svg{display:block;width:100%;height:auto;max-height:520px}
.fx-l{font-family:var(--mono);font-size:11px;fill:var(--ink-2);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.pngb{opacity:.55;transition:opacity .15s}.card:hover .pngb{opacity:1}
.rap{white-space:pre-wrap;font-family:var(--sans);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0;color:var(--ink-2)}
.ov.pres{justify-content:center;align-items:stretch;padding:0}
.pres-b{width:100%;height:100%;display:flex;flex-direction:column;background:var(--ground)}
.pres-t{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.pres-l{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:24px}
.sl{width:1280px;height:720px;flex:none;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:44px 56px 34px;display:flex;flex-direction:column;position:relative;overflow:hidden;zoom:.7}
.sl-h h2{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:4px}.sl-h p{color:var(--ink-3);font-size:16px;margin-top:4px}
.sl-k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sl-b{flex:1;margin-top:22px;min-height:0;overflow:hidden}
.sl-f{position:absolute;left:56px;right:56px;bottom:18px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px}
.sl-t{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);justify-content:center}
.sl-t h1{font-size:54px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:12px}.sl-t p{font-size:22px;margin-top:14px;opacity:.9}.sl-t .sl-s{font-size:16px}
.sl-t .sl-k{color:var(--on-accent);opacity:.85}.sl-t .sl-f{color:var(--on-accent);border-color:rgba(255,255,255,.3)}
.sl-txt{font-size:19px;line-height:1.6;margin-bottom:22px}.sl-k4{grid-template-columns:repeat(4,1fr)}
.sl-2{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.sl .hm-c{height:40px}.sl .hm-l,.sl .bar,.sl .hg-l,.sl .hg-v{font-size:15px}.sl .hm-r{grid-template-columns:200px repeat(24,minmax(18px,1fr))}
.sl .bt{height:24px}.sl .bars{gap:12px}.sl .hg{height:380px}.sl .ch{font-size:16px}.sl .chart{max-width:none}.sl .kpi .v{font-size:34px}.sl .kpi .k{font-size:12px}
@media print{
  body.presenting>*:not(.ov.pres){display:none!important}
  body.presenting .ov.pres{position:static;display:block!important;background:none;backdrop-filter:none}
  body.presenting .pres-t{display:none}
  body.presenting .pres-b,body.presenting .pres-l{display:block;padding:0;overflow:visible;height:auto;background:none}
  body.presenting .sl{zoom:1;box-shadow:none;border-radius:0;break-after:page;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:1280px 720px;margin:0}
}
.gst-r{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.gst-r .rt{font-weight:700}.gst-r .rs{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.card.excl{opacity:.72;border-style:dashed}
.lnk{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.lnk:hover .nm{color:var(--accent);text-decoration:underline}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 8px}
.qd summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
.qd summary::-webkit-details-marker{display:none}
.qd summary::before{content:"▸";transition:transform .15s}
.qd[open] summary::before{transform:rotate(90deg)}
.qd ul{margin:8px 0 0;padding-left:18px;max-height:220px;overflow:auto}
.qd li{margin:2px 0}
.gauge{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.gauge .gt{width:70px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.gauge .gt i{display:block;height:100%;border-radius:99px}
.rules-l{display:flex;flex-direction:column;gap:10px}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 15px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;transition:border-color .15s}
.rule:hover{border-color:var(--line-2)}
.rule input[type=checkbox]{margin:2px 0 0;flex:none;width:17px;height:17px;accent-color:var(--accent)}
.rule .sp{width:17px;flex:none}
.rule .rn{font-weight:700;font-size:13.5px;display:block}
.rule .rd{font-size:12.5px;color:var(--ink-2);margin-top:2px;display:block}
.rule .inl{display:inline-flex;gap:7px;align-items:center;margin-top:9px}
.rule .inl input{width:70px}
.rule .inl+.inl{margin-left:18px}
.sm-i{width:120px}
.empty{text-align:center;padding:58px 20px;color:var(--ink-3)}
.empty .eic{width:60px;height:60px;margin:0 auto 14px;opacity:.9}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:7px}
.empty p{margin:0 auto;max-width:50ch;font-size:13.5px}
.hint{font-size:12px;color:var(--ink-3);margin-top:8px}

/* guide de lecture */
.gd{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
.gd .card-b{display:flex;flex-direction:column;gap:12px}
.dg svg{display:block;width:100%;max-width:760px;height:auto;overflow:visible}
.dg text{font-family:var(--sans)}
.dg .t{font-size:11.5px;fill:var(--ink-2)}
.dg .tb{font-size:12px;fill:var(--ink);font-weight:700}
.dg .tm{font-family:var(--mono);font-size:11px;fill:var(--ink-2)}
.dg .tmu{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}
.dg .ts{font-size:11px;fill:var(--signal-ink);font-weight:700}
.dg .ta{font-size:11px;fill:var(--accent);font-weight:700}
.dg .box{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1}
.dg .boxa{fill:var(--accent-soft);stroke:var(--accent-line);stroke-width:1}
.dg .svc{fill:var(--accent)}
.dg .pz{fill:url(#dgHatch);stroke:var(--accent-line)}
.dg .rhr{fill:var(--signal-soft);stroke:var(--signal);stroke-width:1.3;stroke-dasharray:5 3}
.dg .nuit{fill:var(--night)}
.dg .ln{stroke:var(--line-2);stroke-width:1.2;fill:none}
.dg .lna{stroke:var(--accent);stroke-width:2;fill:none}
.dg .lns{stroke:var(--signal);stroke-width:2;fill:none}
.dg .bl{fill:var(--surface);stroke:var(--signal);stroke-width:1.5;stroke-dasharray:5 4}

.dg .flow{stroke-dasharray:6 6;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.cap{font-size:13px;color:var(--ink-2);line-height:1.55}
.cap b{color:var(--ink)}
.qual{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.qi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.qi .qh{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px}
.qi p{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.lvl{width:9px;height:9px;border-radius:50%;flex:none}
.lvl.ok{background:var(--good)}.lvl.mid{background:var(--signal)}.lvl.lo{background:var(--crit)}

/* tiroir agent */
.ov{position:fixed;inset:0;background:rgba(6,12,20,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60;display:flex;justify-content:flex-end;animation:fade .2s ease both}

@keyframes fade{from{opacity:0}}
.dw{background:var(--ground);width:min(860px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow-lg);
  padding:0 22px 48px;display:flex;flex-direction:column;gap:16px;animation:slide .32s var(--ease) both;overscroll-behavior:contain}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.dw-h{position:sticky;top:0;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:18px 0 13px;border-bottom:1px solid var(--line);z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dw-h h2{font-size:21px;font-weight:800;letter-spacing:-.025em}
.dw-h .s{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.x{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;width:34px;height:34px;flex:none;font-size:19px;line-height:1;display:grid;place-items:center;transition:background .15s,transform .15s}
.x:hover{background:var(--surface-2);transform:rotate(90deg)}
.ml2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ml2>div{padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);margin-top:6px;flex:none}
.toast.w::before{background:var(--signal)}.toast.c::before{background:var(--crit)}

/* chargement */
.loadbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:100;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .2s}
.loading .loadbar{opacity:1}

<script>
/* ==========================================================================
   1. LECTURE DU FICHIER .XLSX  (ZIP + XML, sans dépendance externe)
   Seules les parties utiles du classeur sont décompressées : les fichiers
   lourds (images, autres feuilles) ne ralentissent plus la lecture.
   ========================================================================== */
async function inflateRaw(bytes){
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function readZip(ab){
  const by=new Uint8Array(ab), dv=new DataView(ab);
  let eo=-1; const max=Math.min(by.length,66000);
  for(let i=by.length-22;i>=by.length-max&&i>=0;i--) if(dv.getUint32(i,true)===0x06054b50){eo=i;break;}
  if(eo<0) throw new Error("Ce fichier n'est pas un classeur Excel (.xlsx) lisible.");
  let n=dv.getUint16(eo+10,true), cd=dv.getUint32(eo+16,true);
  if(cd===0xffffffff||n===0xffff){
    for(let i=eo-20;i>=0;i--) if(dv.getUint32(i,true)===0x07064b50){
      const z=Number(dv.getBigUint64(i+8,true));
      if(dv.getUint32(z,true)===0x06064b50){n=Number(dv.getBigUint64(z+32,true));cd=Number(dv.getBigUint64(z+48,true));}
      break;}
  }
  const dec=new TextDecoder('utf-8'), ent=[]; let p=cd;
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true); let cs=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    let off=dv.getUint32(p+42,true);
    const name=dec.decode(by.subarray(p+46,p+46+nl));
    if(cs===0xffffffff||off===0xffffffff){
      let e=p+46+nl; const end=e+xl;
      while(e<end){ const hid=dv.getUint16(e,true), hs=dv.getUint16(e+2,true);
        if(hid===1){ let q=e+4;
          if(dv.getUint32(p+24,true)===0xffffffff) q+=8;
          if(cs===0xffffffff){cs=Number(dv.getBigUint64(q,true));q+=8;}
          if(off===0xffffffff){off=Number(dv.getBigUint64(q,true));}
          break;}
        e+=4+hs;}
    }
    ent.push({name,method,cs,off}); p+=46+nl+xl+cl;
  }
  const out=new Map();
  for(const e of ent){
    const nl=dv.getUint16(e.off+26,true), xl=dv.getUint16(e.off+28,true);
    const st=e.off+30+nl+xl;
    out.set(e.name,{method:e.method,raw:by.subarray(st,st+e.cs)});
  }
  return {
    has:k=>out.has(k),
    async text(k){ const e=out.get(k); if(!e) return null;
      return dec.decode(e.method===0?e.raw:await inflateRaw(e.raw)); },
  };
}
const ENT={lt:'<',gt:'>',amp:'&',quot:'"',apos:"'"};
const unesc=s=>s.replace(/&#(\d+);/g,(_,d)=>String.fromCharCode(+d))
  .replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCharCode(parseInt(h,16)))
  .replace(/&(lt|gt|amp|quot|apos);/g,(_,e)=>ENT[e]);
const normTxt=s=>s.replace(/_x000D_/g,'').replace(/_x000A_/g,'\n').replace(/\r\n?/g,'\n');
function colIdx(r){const m=/^([A-Z]+)/.exec(r);if(!m)return 0;let n=0;for(const c of m[1])n=n*26+(c.charCodeAt(0)-64);return n-1;}
function parseSS(x){const o=[];for(const m of x.matchAll(/<si(?:\s[^>]*)?>([\s\S]*?)<\/si>/g)){let t='';for(const q of m[1].matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g))t+=unesc(q[1]);o.push(normTxt(t));}return o;}
/** Lecture ligne par ligne, bornée aux 60 premières colonnes (les jours sont bien avant) */
function parseSheet(x,ss,maxCols=60){
  const rows=[];
  const reRow=/<row\b([^>]*)>([\s\S]*?)<\/row>|<row\b([^>]*)\/>/g;
  const reCell=/<c\b([^>]*?)\/>|<c\b([^>]*)>([\s\S]*?)<\/c>/g;
  let r;
  while((r=reRow.exec(x))){
    const attrs=r[1]||r[3]||'';
    const rm=/\br="(\d+)"/.exec(attrs);
    const ri=rm?+rm[1]-1:rows.length, cells=[], body=r[2]||'';
    reCell.lastIndex=0; let c;
    while((c=reCell.exec(body))){
      const at=c[1]||c[2]||'', bd=c[3]||'';
      const cm=/\br="([A-Z]+)\d+"/.exec(at), tm=/\bt="([^"]+)"/.exec(at);
      const ix=cm?colIdx(cm[1]):cells.length;
      if(ix>=maxCols) continue;
      const ty=tm?tm[1]:'n';
      let v=null;
      if(ty==='inlineStr'){let t='';for(const q of bd.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g))t+=unesc(q[1]);v=normTxt(t);}
      else{const vm=/<v[^>]*>([\s\S]*?)<\/v>/.exec(bd);
        if(vm){const raw=unesc(vm[1]);
          v = ty==='s' ? (ss[+raw]??'') : (ty==='str'||ty==='e') ? normTxt(raw) : (raw===''?null:Number(raw));}}
      cells[ix]=(typeof v==='string'&&v.trim()==='')?null:v;
    }
    rows[ri]=cells;
  }
  for(let i=0;i<rows.length;i++) if(!rows[i]) rows[i]=[];
  return rows;
}
const serialDate=n=>{ if(typeof n!=='number'||!isFinite(n))return null;
  const d=new Date(Math.round((n-25569)*864e5));
  return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); };
const deacc=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'');

async function readRecapSheet(ab){
  const zip=await readZip(ab);
  const wb=await zip.text('xl/workbook.xml');
  if(!wb) throw new Error("Classeur Excel (.xlsx) attendu — le fichier ne contient pas de feuille.");
  const rels=(await zip.text('xl/_rels/workbook.xml.rels'))||'', rm={};
  for(const m of rels.matchAll(/<Relationship\b([^>]*)\/?>/g)){
    const id=/\bId="([^"]+)"/.exec(m[1])?.[1], tg=/\bTarget="([^"]+)"/.exec(m[1])?.[1];
    if(id&&tg) rm[id]=tg.replace(/^\/?xl\//,'').replace(/^\//,'');
  }
  const sheets=[];
  for(const m of wb.matchAll(/<sheet\b([^>]*)\/?>/g))
    sheets.push({name:unesc(/\bname="([^"]*)"/.exec(m[1])?.[1]??''), path:rm[/\br:id="([^"]+)"/.exec(m[1])?.[1]]});
  if(!sheets.length) throw new Error("Aucune feuille trouvée dans le classeur.");
  /* Les feuilles « Récap… » puis « Corridor… » d'abord, puis les autres dans l'ordre :
     on retient la première dont l'en-tête (Matricule, Nom, jours de la semaine) est reconnu. */
  const nm=s=>deacc(s.name).toLowerCase().trim();
  const order=[...sheets.filter(s=>nm(s).startsWith('recap')),...sheets.filter(s=>!nm(s).startsWith('recap')&&nm(s).includes('corridor')),
    ...sheets.filter(s=>!nm(s).startsWith('recap')&&!nm(s).includes('corridor'))];
  const ss=zip.has('xl/sharedStrings.xml')?parseSS(await zip.text('xl/sharedStrings.xml')):[];
  let first=null;
  for(const tgt of order){
    const sx=(await zip.text('xl/'+tgt.path))||(await zip.text(tgt.path));
    if(!sx) continue;
    const rows=parseSheet(sx,ss);
    if(!first) first={sheetName:tgt.name,rows};
    if(findLayout(rows)) return {sheetName:tgt.name,rows};
  }
  if(!first) throw new Error("Aucune feuille lisible dans le classeur.");
  return first;   // parseWeek expliquera ce qui manque
}

/* ==========================================================================
   2. LECTURE MÉTIER — indépendante des règles de calcul
   ========================================================================== */
const JN=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const JS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const CODEF=[
  {k:'RP',t:c=>/^RP(-|\b)/i.test(c)}, {k:'CP',t:c=>/^CP$/i.test(c)}, {k:'CPAT',t:c=>/^CPAT/i.test(c)},
  {k:'RCL',t:c=>/^RCL/i.test(c)}, {k:'RCC',t:c=>/^RCC/i.test(c)}, {k:'MAL',t:c=>/^MAL/i.test(c)},
  {k:'JF',t:c=>/^JF$/i.test(c)}, {k:'RF',t:c=>/^RF$/i.test(c)}, {k:'AT',t:c=>/^AT$/i.test(c)},
  {k:'CSS',t:c=>/^(CSS|CPAR)$/i.test(c)}, {k:'CFAM',t:c=>/^CFAM$/i.test(c)}, {k:'CPRCL',t:c=>/^CPRCL$/i.test(c)},
];
const CODEL={RP:'Repos périodique',CP:'Congé payé',CPAT:'Congé CPAT',RCL:'Repos compensatoire légal',RCC:'Repos compensateur conventionnel',MAL:'Maladie',JF:'Jour férié',
  RF:'Repos férié',AT:'Accident du travail',CSS:'Congé sans solde',CFAM:'Congé familial',CPRCL:'CPRCL (non défini)',AUTRE:'Autre code',HORS:'Mission datée hors de sa colonne'};
/** Classement validé par l'utilisateur : repos, congés ; tout le reste (MAL, AT, CPRCL, autres) = absences */
const FAM_REPOS=['RP','RF','JF','RCL','RCC'], FAM_CONGES=['CP','CPAT','CFAM','CSS'];
/** Anciens fichiers : « CP/CP », « MAL/MAL » — la famille se lit sur la première partie */
const codeFam=c=>{const s=String(c).trim().split('/')[0].trim();for(const f of CODEF)if(f.t(s))return f.k;return 'AUTRE';};
const codeTxt=c=>{const p=String(c).trim().split('/').map(x=>x.trim());return p.length===2&&p[0]===p[1]?p[0]:String(c).trim();};
/** Lieux comparés sans majuscules, accents ni ponctuation : « Hendaye », « HENDAYE » et « hendaye » sont le même lieu */
const normLieu=s=>deacc(String(s??'')).toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
/** Métiers : les anciens fichiers écrivent CDR, Coordo, « CDR + AFR » */
function normMetier(m){
  const u=deacc(String(m??'')).toUpperCase().replace(/\s+/g,' ').trim();
  if(!u) return '';
  if(/^CDR( ?\+ ?AFR)?$/.test(u)||u==='CONDUCTEUR') return 'CONDUCTEUR';
  if(u==='COORDO') return 'COORDO AFR';
  return u;
}
const RE_P=/^P(\d?)\s*:/i;
const RE_H=/^(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*-\s*(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*$/;
const RE_PF=/^P\d?\s*:\s*(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*-\s*(\d{1,2})\s*\/\s*(\d{1,2}):(\d{2})\s*$/i;
const H=36e5, DAY=864e5;
function resolveDay(d,mon){for(let o=-2;o<=9;o++){const x=new Date(mon.getTime()+o*864e5);if(x.getUTCDate()===d)return x;}return null;}
function mk(d,h,mi,mon){const x=resolveDay(d,mon);return x?new Date(x.getTime()+h*H+mi*6e4):null;}
const r2=n=>Math.round(n*100)/100;
function missionType(l){const s=String(l).trim();const m=/^(.*?)[-_]\s*\d{2,4}\b/.exec(s);return ((m?m[1]:s).trim().replace(/\s+/g,' '))||s;}

/** Une cellule jour -> {kind:'VIDE'|'CODE'|'SERVICE'}
    Les pauses « P: » sont conservées avec leurs horaires : les heures de nuit,
    du dimanche et les paniers se calculent sur le temps réellement travaillé. */
function parseDayCell(raw,mon){
  if(raw==null) return {kind:'VIDE'};
  const t=normTxt(String(raw)).trim();
  if(!t) return {kind:'VIDE'};
  if(!t.includes('\n')) return {kind:'CODE',code:codeTxt(t),family:codeFam(t)};
  const lines=t.split('\n').map(x=>x.trim()).filter(Boolean);
  const ms=[]; let cur=null; const anom=[];
  for(const line of lines){
    if(RE_P.test(line)){
      if(!cur) continue;
      const m=RE_PF.exec(line);
      if(m){const s=mk(+m[1],+m[2],+m[3],mon); let e=mk(+m[4],+m[5],+m[6],mon);
        if(s&&e){ if(e<s)e=new Date(e.getTime()+864e5); cur.pauses.push([s,e]); }}
      continue;
    }
    const h=RE_H.exec(line);
    if(h&&cur){
      const s=mk(+h[1],+h[2],+h[3],mon); let e=mk(+h[4],+h[5],+h[6],mon);
      if(s&&e){ if(e<s)e=new Date(e.getTime()+864e5); cur.start=s; cur.end=e; }
      else anom.push(`horaire illisible « ${line} »`);
      continue;
    }
    if(cur&&!cur.od&&/ - /.test(line)){
      const i=line.indexOf(' - '); cur.od=true; cur.from=line.slice(0,i).trim(); cur.to=line.slice(i+3).trim(); continue;
    }
    if(cur&&!cur.od&&!cur.start&&!cur.note){ cur.note=cur.label; cur.label=line; continue; }
    cur={label:line,from:null,to:null,od:false,start:null,end:null,pauses:[]}; ms.push(cur);
  }
  for(const m of ms) if(!m.start||!m.end) anom.push(`mission sans horaire « ${m.label} »`);
  const ok=ms.filter(m=>m.start&&m.end).sort((a,b)=>a.start-b.start);
  if(!ok.length) return {kind:'CODE',code:lines[0],family:'AUTRE',anom};
  return {kind:'SERVICE', anom, missions: ok.map(m=>{
    const amp=(m.end-m.start)/H;
    const ps=m.pauses.map(([s,e])=>[new Date(Math.max(s,m.start)),new Date(Math.min(e,m.end))]).filter(([s,e])=>e>s);
    const pm=Math.round(ps.reduce((acc,[s,e])=>acc+(e-s),0)/6e4);
    return {label:m.label,type:missionType(m.label),from:m.from,to:m.to,...(m.note?{note:m.note}:{}),
      start:m.start.toISOString(),end:m.end.toISOString(),
      amplitude:r2(amp),pauseMin:pm,travail:r2(amp-pm/60),nbPauses:ps.length,
      pauses:ps.map(([s,e])=>[s.toISOString(),e.toISOString()])};
  })};
}
function isoWeek(dt){
  const d=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()));
  d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+3);
  const ft=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  ft.setUTCDate(ft.getUTCDate()-((ft.getUTCDay()+6)%7)+3);
  return {year:d.getUTCFullYear(), week:1+Math.round((d-ft)/(7*864e5))};
}
const isoD=d=>d.toISOString().slice(0,10);
const slug=s=>deacc(s).replace(/[^A-Za-z0-9._~:@+-]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase()||'x';

const MOIS=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
/** Une cellule date : nombre Excel, ou texte « 29.12.2025 », « 29/12/2025 », « 2025-12-29 », « 28 décembre 2025 » */
function cellDate(v){
  if(typeof v==='number') return v>20000&&v<80000?serialDate(v):null;
  if(v==null) return null;
  const t=deacc(String(v)).toLowerCase().trim();
  let m=/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/.exec(t);
  if(m){const y=+m[3]<100?2000+ +m[3]:+m[3]; return new Date(Date.UTC(y,+m[2]-1,+m[1]));}
  m=/^(\d{4})-(\d{2})-(\d{2})/.exec(t); if(m) return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  m=/(\d{1,2})(?:er)? (janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre) (\d{4})/.exec(t);
  if(m) return new Date(Date.UTC(+m[3],MOIS.indexOf(m[2]),+m[1]));
  return null;
}
/** Repère la disposition de la feuille, quel que soit le format :
    - récent : ligne 1 = dates, ligne 2 = Matricule, Nom… Lundi…Dimanche ;
    - ancien : ligne 1 = Lundi…Dimanche, ligne 2 = Matricule, Prénom, Nom, Région, Résidence, Commentaires, dates.
    Renvoie null si aucun en-tête n'est reconnu. */
function findLayout(rows){
  const low=r=>(r||[]).map(c=>c==null?'':deacc(String(c)).toLowerCase().trim());
  let h=-1;
  for(let i=0;i<Math.min(rows.length,15);i++){ const r=low(rows[i]);
    if(r.some(c=>c.startsWith('matric'))&&r.some(c=>c==='nom'||c.startsWith('nom '))){h=i;break;} }
  if(h<0) return null;
  const hd=low(rows[h]);
  const fc=(...t)=>{for(const x of t){const i=hd.findIndex(c=>typeof x==='string'?c===x:x.test(c));if(i>=0)return i;}return -1;};
  // colonne du lundi : intitulé « Lundi » sur la ligne d'en-tête ou juste autour, sinon 7 dates qui se suivent
  let cLun=-1, dayRow=-1;
  for(const i of [h,h-1,h+1,h-2]){ if(i<0||i>=rows.length) continue; const r=low(rows[i]);
    const j=r.findIndex(c=>c==='lundi'||c.startsWith('lundi '));
    if(j>=0&&(r[j+6]||'').startsWith('dimanche')||j>=0&&r[j+1]&&r[j+1].startsWith('mardi')){cLun=j;dayRow=i;break;} }
  let mon=null, dateRow=-1;
  const scan=(i,c0)=>{ const r=rows[i]||[]; for(let k=0;k<7;k++){const d=cellDate(r[c0+k]); if(d) return new Date(d.getTime()-k*DAY);} return null; };
  if(cLun>=0){ for(const i of [h-1,h,h+1,h-2,h+2]){ if(i<0||i>=rows.length) continue; const d=scan(i,cLun); if(d){mon=d;dateRow=i;break;} } }
  else for(const i of [h,h-1,h+1]){ if(i<0||i>=rows.length) continue; const r=rows[i]||[];
    for(let j=0;j<r.length-6&&cLun<0;j++){ const ds=[0,1,2,3,4,5,6].map(k=>cellDate(r[j+k]));
      if(ds.every(Boolean)&&ds.every((d,k)=>!k||d-ds[k-1]===DAY)){cLun=j;mon=new Date(ds[0].getTime());dateRow=i;} }
    if(cLun>=0) break; }
  if(cLun<0) return {h,err:'jours'};
  if(!mon) return {h,cLun,err:'date'};
  const cMat=fc(/^matric/), cNom=fc('nom',/^nom /);
  let cPre=fc(/^prenom/), cCor=fc(/^corridor/,/^region/), cAge=fc(/^agence/,/^residence/), cMet=fc(/^metier/,/^emploi/,/^fonction/);
  const start=Math.max(h,dayRow,dateRow)+1;
  if(cMet<0){   // ancien format : le métier est dans « Commentaires » — on reconnaît la colonne à ses valeurs
    let best=-1,bn=0;
    for(let j=0;j<cLun;j++){ let n=0; for(let i=start;i<Math.min(rows.length,start+60);i++){const v=rows[i]?.[j]; if(v!=null&&/^(CDR|AFR|CONDUCTEUR|COORDO)/i.test(String(v).trim())) n++;}
      if(n>bn){bn=n;best=j;} }
    cMet=best;
  }
  const ex=cellDate((rows[0]||[]).find((c,j)=>j<cLun&&cellDate(c)))||null;
  return {h,start,cMat,cNom,cPre,cCor,cAge,cMet,cLun,mon,ex};
}
/** Feuille Récap -> structure de semaine brute (sans règles) */
function parseWeek(rows){
  if(!rows.length) throw new Error('Feuille vide.');
  const L=findLayout(rows);
  if(!L) throw new Error("En-têtes introuvables : aucune ligne ne contient « Matricule » et « Nom » dans les 15 premières lignes de la feuille.");
  if(L.err==='jours') throw new Error(`Colonnes des jours introuvables : ni « Lundi »…« Dimanche », ni sept dates qui se suivent autour de la ligne ${L.h+1}.`);
  if(L.err==='date') throw new Error(`Date du lundi introuvable : aucune date au-dessus ou en dessous de « Lundi » (lignes ${L.h}–${L.h+2}).`);
  if(L.cMat<0||L.cNom<0) throw new Error("Colonnes Matricule ou Nom introuvables.");
  let {cMat,cNom,cPre,cCor,cAge,cMet,cLun,mon}=L;
  if(cPre<0)cPre=cNom+1;
  const ex=L.ex;
  const days=Array.from({length:7},(_,i)=>new Date(mon.getTime()+i*864e5));
  const {year,week}=isoWeek(mon);

  const anomalies=[], agents=[];
  for(let i=L.start;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.length) continue;
    const mat=r[cMat], nom=r[cNom];
    if((mat==null)&&(nom==null)) continue;
    if(!nom&&!mat) continue;
    if(mat==null&&!r.slice(cLun,cLun+7).some(v=>v!=null)) continue;   // lignes de légende ou de totaux en bas de feuille
    const jours=[];
    for(let d=0;d<7;d++){
      const c=parseDayCell(r[cLun+d],mon);
      (c.anom||[]).forEach(a=>anomalies.push({agent:`${nom??''} ${r[cPre]??''}`.trim(),jour:JN[d],message:a}));
      delete c.anom; jours.push(c);
    }
    agents.push({
      matricule: mat==null?'':String(mat).trim(),
      nom:String(nom??'').trim(), prenom:String(r[cPre]??'').trim(),
      corridor:cCor>=0?String(r[cCor]??'').trim():'',
      agence:(cAge>=0?String(r[cAge]??'').trim():'')||'(sans agence)',
      metier:(cMet>=0?normMetier(r[cMet]):'')||'(SANS MÉTIER)',
      jours
    });
  }
  if(!agents.length) throw new Error("Aucune ligne d'agent trouvée sous les en-têtes.");
  return {
    meta:{format:2, weekId:`${year}-S${String(week).padStart(2,'0')}`, year, week,
      monday:isoD(mon), sunday:isoD(days[6]), days:days.map(isoD),
      extractDate:ex?isoD(ex):null, nbAgents:agents.length,
      corridors:[...new Set(agents.map(a=>a.corridor).filter(Boolean))]},
    agents, anomalies};
}

/* ==========================================================================
   3. RÈGLES DE CALCUL — rejouées à chaque affichage
   ========================================================================== */
const DEFAULT_RULES={
  rhrMetiers:['CONDUCTEUR'],
  rhrMinHours:8,               // RHR = repos journalier hors résidence : primes dès 8 h, minimum 9 h (accord ECR art. 18, annexe 1)
  rhrCoupeParRepos:true,       // un arrêt qui contient un jour de repos ou d'absence n'est pas un RHR (RP = 24 h + repos à résidence, art. 19)
  rhrMaxAbsence:44,            // au-delà, l'arrêt est signalé : 44 h d'absence du domicile au plus (art. 18)
  lieuxResidence:{},          // par agence : autres écritures de la résidence (HE, HENDAYE…) apprises à la correction
  agencesAlias:{},            // nom d'agence du fichier -> nom retenu (anciens fichiers : « Agence Bordeaux »)
  corrections:{rhr:{},jb:{},liens:[]},   // corrections manuelles, mémorisées et rejouées à chaque affichage
  rulesVersion:3,
  rhrCountPending:true,
  jbExcludeNightOverlap:true,
  jbRequireFramed:true,
  jbExcludeHorsResidence:true, // une case vide passée hors résidence (pendant un RHR) n'est pas une journée blanche
  residences:{},
  seuilHebdo:35,              // heures sup au-delà, par agent et par semaine
  heuresATCMD:5,              // une ATCMD compte pour 5 h de travail
  nuitAFR:[22,7],             // heures de nuit des AFR
  nuitCDR:[22,5],             // heures de nuit des conducteurs
  trajetTypes:['VOY','VS'],   // « trajet seul » : mission dont l'intitulé se réduit à l'un de ces types
  panierMidi:[11.5,13.5,1],   // plage horaire, heures travaillées minimum
  panierSoir:[18.5,20.5,1],
  panierNuit:[22,5,3],
  panierRHR:true,             // un RHR qui touche la plage du midi et/ou du soir donne un panier par plage
  horsColonne:'ecarter',      // mission datée hors de sa colonne : 'ecarter' ou 'garder'
  horsColonneTolerance:6,     // un service qui démarre le lendemain avant cette heure reste rattaché à sa colonne
};
/** Une personne = son matricule (à défaut, nom + prénom) */
const personKey=a=>a.matricule?'m:'+a.matricule:'n:'+deacc(`${a.nom}|${a.prenom}`).toUpperCase();
const isAFR=m=>/AFR/i.test(m||'');

/** Missions dont la date écrite dans la case ne correspond pas à la colonne
    (lignes d'une autre semaine recopiées dans le fichier) */
function splitHorsColonne(agents,days,rules){
  const tol=(Number(rules.horsColonneTolerance)||0)*H, liste=[];
  const out=agents.map(a=>{
    let touched=false;
    const jours=a.jours.map((j,d)=>{
      if(j.kind!=='SERVICE') return j;
      const D=days[d], ok=[], hors=[];
      for(const m of j.missions){ const S=Date.parse(m.start), E=Date.parse(m.end); (S<D+DAY+tol&&E>D?ok:hors).push(m); }
      if(!hors.length) return j;
      touched=true;
      const hc=hors.map(m=>({label:m.label,start:m.start,end:m.end}));
      hc.forEach(m=>liste.push({agent:`${a.nom} ${a.prenom}`.trim(),agence:a.agence,jour:JN[d],...m}));
      return ok.length?{kind:'SERVICE',missions:ok,horsColonne:hc}:{kind:'CODE',code:'Hors colonne',family:'HORS',horsColonne:hc};
    });
    return touched?{...a,jours}:a;
  });
  return {agents:out,liste};
}
function withHC(cell,cells){
  const seen=new Set(), hc=[];
  for(const c of cells) for(const m of c.horsColonne||[]){const k=m.label+'|'+m.start; if(!seen.has(k)){seen.add(k);hc.push(m);}}
  const {horsColonne,...rest}=cell;
  return hc.length?{...rest,horsColonne:hc}:rest;
}
/** Une personne présente sur plusieurs lignes du fichier : fusion jour par jour
    (un service l'emporte sur un code, un code sur une case vide) */
function mergeDuplicates(agents){
  const groups=new Map(), order=[];
  for(const a of agents){ const k=personKey(a); if(!groups.has(k)){groups.set(k,[]);order.push(k);} groups.get(k).push(a); }
  const out=[];
  for(const k of order){
    const rows=groups.get(k);
    if(rows.length===1){ out.push({...rows[0],fusion:null}); continue; }
    const svcDays=a=>a.jours.filter(j=>j.kind==='SERVICE').length;
    const main=rows.reduce((b,a)=>svcDays(a)>svcDays(b)?a:b,rows[0]);
    const jours=[];
    for(let d=0;d<7;d++){
      const cells=rows.map(r=>r.jours[d]);
      const svcs=cells.filter(c=>c.kind==='SERVICE'), codes=cells.filter(c=>c.kind==='CODE');
      if(svcs.length){
        const seen=new Set(), ms=[];
        for(const c of svcs) for(const m of c.missions){const key=m.label+'|'+m.start+'|'+m.end; if(!seen.has(key)){seen.add(key);ms.push(m);}}
        ms.sort((a,b)=>new Date(a.start)-new Date(b.start));
        jours.push(withHC({kind:'SERVICE',missions:ms},cells));
      }else if(codes.length){
        const mc=main.jours[d];
        jours.push(withHC(mc.kind==='CODE'&&mc.family!=='HORS'?mc:(codes.find(c=>c.family!=='HORS')||codes[0]),cells));
      }else jours.push({kind:'VIDE'});
    }
    out.push({...main,jours,fusion:{lignes:rows.length,agences:[...new Set(rows.map(r=>r.agence))]}});
  }
  return out;
}
function deduceResidences(agents,rules){
  const cnt={}, res={}, src={};
  for(const a of agents){
    if(!rules.rhrMetiers.includes(a.metier)) continue;
    cnt[a.agence]=cnt[a.agence]||{};
    for(const j of a.jours) if(j.kind==='SERVICE') for(const m of j.missions)
      for(const l of [m.from,m.to]) if(l){ const k=normLieu(l); cnt[a.agence][k]=(cnt[a.agence][k]||0)+1; }
  }
  for(const ag of new Set(agents.map(a=>a.agence))){
    if(rules.residences&&rules.residences[ag]){res[ag]=normLieu(rules.residences[ag]);src[ag]='manuel';}
    else{const b=Object.entries(cnt[ag]||{}).sort((x,y)=>y[1]-x[1])[0];
      res[ag]=b?b[0]:null; src[ag]=b?'auto':'indéterminée';}
  }
  return {residences:res, residenceSource:src, locCounts:cnt};
}
function applyRules(parsed, rulesIn){
  const rules={...DEFAULT_RULES,...rulesIn};
  const days=parsed.meta.days.map(d=>new Date(d+'T00:00:00Z'));
  const al=rules.agencesAlias||{};
  const src=parsed.agents.map(a=>{const ag=al[a.agence]||a.agence, me=normMetier(a.metier)||a.metier; return ag===a.agence&&me===a.metier?a:{...a,agence:ag,metier:me};});
  const hc=rules.horsColonne==='garder'?{agents:src,liste:[]}:splitHorsColonne(src,days.map(d=>d.getTime()),rules);
  const merged=mergeDuplicates(hc.agents);
  const {residences,residenceSource,locCounts}=deduceResidences(merged,rules);
  const agents=merged.map(a=>computeAgent(a,days,rules,residences[a.agence],parsed.meta.weekId));
  return {meta:{...parsed.meta,residences,residenceSource,locCounts,rules,horsColonne:hc.liste,
    fusions:merged.filter(a=>a.fusion).length}, agents, anomalies:parsed.anomalies||[]};
}
function dayIndexOf(t,days){for(let i=0;i<7;i++)if(t>=days[i].getTime()&&t<days[i].getTime()+864e5)return i;return t<days[0].getTime()?-1:7;}
function nights(a,b){
  const x=Date.UTC(a.getUTCFullYear(),a.getUTCMonth(),a.getUTCDate());
  const y=Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate());
  return Math.round((y-x)/864e5);
}
/* temps travaillé : la mission moins ses pauses, en intervalles [début, fin] (ms) */
const ovl=(a0,a1,b0,b1)=>Math.max(0,Math.min(a1,b1)-Math.max(a0,b0));
const segOvl=(segs,w0,w1)=>segs.reduce((s,[a,b])=>s+ovl(a,b,w0,w1),0);
function workSegments(m){
  const S=Date.parse(m.start), E=Date.parse(m.end);
  const ps=(m.pauses||[]).filter(Array.isArray).map(([s,e])=>[Date.parse(s),Date.parse(e)]).sort((x,y)=>x[0]-y[0]);
  const out=[]; let cur=S;
  for(const [s,e] of ps){ if(s>cur) out.push([cur,Math.min(s,E)]); cur=Math.max(cur,e); }
  if(cur<E) out.push([cur,E]);
  return out.filter(([a,b])=>b>a);
}
/** Plage [de, à) d'une date, en heures décimales (à < de : plage à cheval sur minuit) */
function windowOf(dayMs,de,a){ const w0=dayMs+de*H; return [w0, a>de?dayMs+a*H:dayMs+DAY+a*H]; }
function hoursInDailyWindow(segs,de,a,fromDay,toDay){
  let t=0; for(let d=fromDay;d<=toDay;d+=DAY){ const [w0,w1]=windowOf(d,de,a); t+=segOvl(segs,w0,w1); }
  return t/H;

/** Clés des corrections : une personne + l'heure de début des missions concernées (stables d'un réimport à l'autre) */
const kCoupure=(pk,m,nx)=>pk+'|'+m.start+'|'+(nx?nx.start:'');

/** Tranches de l'annexe 1 de l'accord : 8–12 h, 12–24 h, 24 h et plus ; et RHR successifs (sans retour à résidence entre deux) */
function setBands(a){
  const d=a.rhr.filter(x=>x.dureeH!=null);
  a.rhr8_12=d.filter(x=>x.dureeH<12).length; a.rhr12_24=d.filter(x=>x.dureeH>=12&&x.dureeH<24).length; a.rhr24=d.filter(x=>x.dureeH>=24).length;
  let n=0, prev=false; for(const c of a.coupures||[]){ if(c.compte){ if(prev) n++; prev=true; } else if(c.statut!=='court') prev=false; }
  a.rhrSuccessifs=n;
}
function computeAgent(a,days,rules,residence,weekId){
  const pk=personKey(a), corr=rules.corrections||{}, cR=corr.rhr||{}, cJ=corr.jb||{};
  // rattachement temporaire à une autre zone de résidence (accord art. 8), saisi pour une semaine
  const ratt=(corr.residenceSemaine||{})[pk+'|'+weekId]||null;
  // résidence propre à l'agent à partir d'une semaine (mouvement d'agence), saisie dans sa fiche
  const perso=Object.entries(corr.residenceAgent||{}).filter(([k])=>k.startsWith(pk+'|')&&k.slice(pk.length+1)<=String(weekId))
    .sort((x,y)=>x[0].localeCompare(y[0])).pop();
  const resPerso=perso?{lieu:perso[1],depuis:perso[0].slice(pk.length+1)}:null;
  if(ratt) residence=normLieu(ratt); else if(resPerso) residence=normLieu(resPerso.lieu);

  // agent écarté des chiffres (incohérence) : calculé quand même, pour rester consultable et réintégrable
  const exclu=(corr.exclus||{})[pk]||(corr.exclus||{})[pk+'|'+weekId]||null;
  const isRes=l=>resSet.has(normLieu(l));
  const rhrOk=rules.rhrMetiers.includes(a.metier);
  const nuitW=isAFR(a.metier)?rules.nuitAFR:rules.nuitCDR;
  const reTrajet=new Set((rules.trajetTypes||[]).map(x=>String(x).toUpperCase().trim()));
  const jours=a.jours.map((j,d)=>({...j,d,date:isoD(days[d])}));
  const all=[];
  let joursService=0,nbMissions=0,amp=0,pauseMin=0,plan=0,nuit=0,dim=0,ampMax=0,wk=0,priseMin=null,finMax=null;

  const codeCounts={}, types={}, dests={};
  const sun0=days[6].getTime(), sun1=sun0+DAY;
  for(const j of jours){

    else if(j.kind==='SERVICE'){

        const hNuit=hoursInDailyWindow(segs,nuitW[0],nuitW[1],Math.floor(Sm/DAY)*DAY-DAY,Math.floor(Em/DAY)*DAY);
        const hDim=atcmd?(Em>Sm?rules.heuresATCMD*ovl(Sm,Em,sun0,sun1)/(Em-Sm):0):segOvl(segs,sun0,sun1)/H;
        all.push({...m,S,E,segs,atcmd,d:j.d});
        nbMissions++; amp+=m.amplitude; pauseMin+=m.pauseMin||0; plan+=hPlan; nuit+=hNuit; dim+=hDim; hj+=hPlan;
        if(m.amplitude>ampMax) ampMax=m.amplitude;

        if(priseMin===null||sh<priseMin) priseMin=sh;

        if(m.to) dests[m.to]=(dests[m.to]||0)+1;

        if(/DISPO/i.test(m.label)) nbDISPO++;
        if(atcmd) nbATCMD++;
        if(reTrajet.has(String(m.type||missionType(m.label)).toUpperCase().trim())) nbTrajetsSeuls++;

  const rhr=[], warn=[], coupures=[];

      .filter(x=>x.ia>=0&&x.ib>x.ia);

    const reposDans=(t0,t1)=>rules.rhrCoupeParRepos&&jours.some(j=>j.kind==='CODE'&&j.family!=='HORS'&&ovl(days[j.d].getTime(),days[j.d].getTime()+DAY,t0,t1)>0);

  const heuresPlanifiees=r2(plan);

    codeCounts, joursVides:jours.filter(j=>j.kind==='VIDE').length,

/** Paniers : 1 h travaillée entre 11h30 et 13h30, 1 h entre 18h30 et 20h30, 3 h entre 22h et 5h,
    ou un RHR qui touche la plage du midi et/ou du soir (un panier par plage). Un panier au plus par plage et par jour. */
function computePaniers(all,rhr,days,rules){
  const got=new Map();
  const add=(dayMs,plage,source)=>{const k=isoD(new Date(dayMs))+'|'+plage; if(!got.has(k)) got.set(k,{date:isoD(new Date(dayMs)),plage,source});};
  if(!all.length&&!rhr.length) return [];
  const segs=all.flatMap(m=>m.segs);
  const t0=all.length?Math.floor(all[0].S.getTime()/DAY)*DAY-DAY:days[0].getTime();
  const t1=all.length?Math.floor(Math.max(...all.map(m=>m.E.getTime()))/DAY)*DAY:days[6].getTime();
  const plages=[['midi',rules.panierMidi],['soir',rules.panierSoir],['nuit',rules.panierNuit]];
  for(let d=t0;d<=t1;d+=DAY) for(const [nom,[de,a,min]] of plages){
    const [w0,w1]=windowOf(d,de,a); if(segOvl(segs,w0,w1)/H>=min-1e-9) add(d,nom,'travail');
  }
  if(rules.panierRHR) for(const x of rhr){
    const s=Date.parse(x.debut), e=x.fin?Date.parse(x.fin):days[6].getTime()+DAY;
    for(let d=Math.floor(s/DAY)*DAY;d<=e;d+=DAY) for(const [nom,[de,a]] of [['midi',rules.panierMidi],['soir',rules.panierSoir]]){
      const [w0,w1]=windowOf(d,de,a); if(s<w1&&e>w0) add(d,nom,'RHR');   // le RHR touche la plage
    }
  }

}
/** Clôture les RHR ouverts grâce à la première mission de la semaine suivante */
function reconcile(weeks,rulesIn){
  const rules={...DEFAULT_RULES,...rulesIn};
  const ids=[...weeks.keys()].sort();
  for(let i=0;i<ids.length-1;i++){
    const c=weeks.get(ids[i]), n=weeks.get(ids[i+1]);
    if(!c||!n) continue;
    if(new Date(n.meta.monday+'T00:00:00Z')-new Date(c.meta.sunday+'T00:00:00Z')!==864e5) continue;
    const idx=new Map(n.agents.map(a=>[personKey(a),a]));
    for(const a of c.agents){
      const p=a.rhr.find(x=>x.enCours&&!x.fin);
      if(!p) continue;
      const pm=(idx.get(personKey(a))||{}).premiereMission;
      if(!pm) continue;
      const fin=new Date(pm.start), deb=new Date(p.debut);
      if(fin<=deb) continue;
      p.fin=pm.start; p.dureeH=r2((fin-deb)/H); p.nuits=nights(deb,fin); p.retour=pm.label; p.cloturee=true;
      a.rhrEnCours=0;
      const cp=(a.coupures||[]).find(x=>x.fin==null&&x.debut===p.debut);
      if(cp){ cp.fin=pm.start; cp.dureeH=p.dureeH; cp.retour=pm.label; if(cp.statut==='ouvert') cp.statut='rhr'; }
      // la durée n'est connue qu'ici : un arrêt plus court que le minimum n'est pas un RHR
      const na=idx.get(personKey(a));
      const reposApres=rules.rhrCoupeParRepos&&(na.jours||[]).some((j,d)=>j.kind==='CODE'&&j.family!=='HORS'&&new Date(n.meta.monday+'T00:00:00Z').getTime()+d*DAY<fin.getTime());
      const court=p.dureeH<rules.rhrMinHours&&p.manuel!=='oui';
      const repos=!court&&reposApres&&p.manuel!=='oui';
      if(court||repos){ a.rhr.splice(a.rhr.indexOf(p),1); a.nbRHR=a.rhr.length; a.rhrLieux=[...new Set(a.rhr.map(x=>x.lieu))]; if(cp){cp.statut=court?'court':'repos';cp.compte=false;} }
      else if(cp) cp.long=p.dureeH>(rules.rhrMaxAbsence||44);
      setBands(a);
      a.rhrHeures=r2(a.rhr.reduce((s,x)=>s+(x.dureeH||0),0));
      a.rhrNuits=a.rhr.reduce((s,x)=>s+(x.nuits||0),0);
      if(court||repos) continue;
      if(rules.panierRHR){   // paniers pris pendant la partie du RHR qui déborde sur la semaine suivante
        const seen=new Set(a.paniers.map(q=>q.date+'|'+q.plage));
        const sun1=new Date(c.meta.sunday+'T00:00:00Z').getTime()+DAY, e=fin.getTime(), s=deb.getTime();
        for(let d=sun1;d<=e;d+=DAY) for(const [nom,[de,aa]] of [['midi',rules.panierMidi],['soir',rules.panierSoir]]){
          const [w0,w1]=windowOf(d,de,aa), k=isoD(new Date(d))+'|'+nom;
          if(s<w1&&e>w0&&!seen.has(k)){ a.paniers.push({date:isoD(new Date(d)),plage:nom,source:'RHR'}); seen.add(k); }
        }
        a.nbPaniers=a.paniers.length; a.paniersMidi=a.paniers.filter(q=>q.plage==='midi').length;
        a.paniersSoir=a.paniers.filter(q=>q.plage==='soir').length; a.paniersRHR=a.paniers.filter(q=>q.source==='RHR').length;
      }
    }
  }

}

function reconcileJB(weeks,rules){
  if(!rules.jbRequireFramed) return;
  const ids=[...weeks.keys()].sort(), mon=w=>Date.parse(w.meta.monday+'T00:00:00Z');
  for(let i=0;i<ids.length;i++){
    const c=weeks.get(ids[i]), p=i>0?weeks.get(ids[i-1]):null, n=i<ids.length-1?weeks.get(ids[i+1]):null;
    const P=p&&mon(c)-mon(p)===7*DAY?new Map(p.agents.map(a=>[personKey(a),a])):null;
    const N=n&&mon(n)-mon(c)===7*DAY?new Map(n.agents.map(a=>[personKey(a),a])):null;
    for(const a of c.agents){
      const cvs=(a.casesVides||[]).filter(cv=>cv.horsCadre&&!cv.compte);
      if(!cvs.length) continue;
      const pa=P&&P.get(personKey(a)), na=N&&N.get(personKey(a));
      const lastP=pa&&pa.missions&&pa.missions.length?pa.missions[pa.missions.length-1]:null, firstN=na&&na.missions&&na.missions.length?na.missions[0]:null;
      for(const cv of cvs){
        const ds=Date.parse(cv.date+'T00:00:00Z'), de=ds+DAY;
        const avant=cv.horsCadre==='apres'?true:!!lastP, apres=cv.horsCadre==='avant'?true:!!firstN;
        if(!avant||!apres){
          const manque=[!avant&&(P?'aucun service la semaine précédente':'semaine précédente non importée'),!apres&&(N?'aucun service la semaine suivante':'semaine suivante non importée')].filter(Boolean).join(', ');
          cv.raison=`${cv.raisonBase} — ${manque}`; a.jours[cv.d].jbRaison=cv.raison; continue;
        }
        if(cv.horsCadre!=='apres'&&lastP) cv.avant={label:lastP.label,from:lastP.from,to:lastP.to,start:lastP.start,end:lastP.end};
        if(cv.horsCadre!=='avant'&&firstN) cv.apres={label:firstN.label,from:firstN.from,to:firstN.to,start:firstN.start,end:firstN.end};
        let raison='';
        if(rules.jbExcludeNightOverlap&&lastP&&Date.parse(lastP.end)>ds) raison=`fin du service de nuit à ${hm(lastP.end)}`;
        const span=x=>{const s0=Date.parse(x.debut), e0=x.fin?Date.parse(x.fin):Infinity; return s0<de&&e0>ds;};
        const hors=a.rhr.some(span)||(pa?pa.rhr.some(span):false);
        cv.horsResidence=hors;
        if(!raison&&hors&&rules.jbExcludeHorsResidence) raison='agent hors résidence ce jour-là (RHR)';
        cv.raison=raison||'encadrée par la semaine voisine'; a.jours[cv.d].jbRaison=cv.raison;
        if(raison) continue;
        cv.compte=true; a.blanches.push(cv); a.blanches.sort((x,y)=>x.d-y.d); a.journeesBlanches=a.blanches.length;
        a.jours[cv.d].blanche=true; if(hors) a.jours[cv.d].horsResidence=true;
      }
    }
  }
}

/** Noms d'agence des anciens fichiers (« Agence Bordeaux ») rattachés au nom récent qui commence pareil
    (sans majuscules, accents, ponctuation ; « Saint » = « St ») ; sinon « Agence » est retiré */
const normAg=s=>deacc(String(s)).toUpperCase().replace(/\bSAINTE?\b/g,'ST').replace(/[^A-Z0-9]/g,'');
function autoAliasFrom(names){
  const raw=[...new Set(names)], known=raw.filter(a=>!/^agence\s/i.test(a)), out={};
  for(const a of raw){ if(!/^agence\s/i.test(a)) continue;
    const base=a.replace(/^agence\s+/i,'').trim(), k=normAg(base);
    const c=known.filter(x=>normAg(x).startsWith(k));
    out[a]=c.length===1?c[0]:base; }
  return out;
}
/** Règles lues sur le serveur : complète les champs récents (même fonction côté page et côté serveur) */

}

/** Mesures RHR : moyennées uniquement sur les agents qui ont eu au moins un RHR (ni AFR, ni agents à 0) */
const RHR_KEYS=new Set(['nbRHR','rhrNuits','rhrHeures']);
function agg(list){
  const persons=new Set(list.map(personKey)), withRHR=list.filter(a=>a.nbRHR>0);
  const o={nbLignes:list.length, nbAgents:persons.size,
    nbSemaines:new Set(list.map(a=>a.weekId)).size||1,
    agentsAvecRHR:new Set(withRHR.map(personKey)).size, lignesAvecRHR:withRHR.length,
    agentsAvecBlanche:new Set(list.filter(a=>a.journeesBlanches>0).map(personKey)).size,
    agentsHeuresSup:new Set(list.filter(a=>a.heuresSup>0).map(personKey)).size,
    rhrEnCours:list.reduce((s,a)=>s+a.rhr.filter(x=>x.enCours&&!x.fin).length,0)};
  for(const f of FIELDS){

      blanches:list.flatMap(a=>a.blanches.map(b=>({...b,weekId:a.weekId}))),

      rhrApplicable:list.some(a=>a.rhrApplicable), fusion:list.some(a=>a.fusion)?list.find(a=>a.fusion).fusion:null,
      jamaisEnResidence:list.every(a=>a.jamaisEnResidence), warnings:list.flatMap(a=>a.warnings)};
    for(const f of FIELDS) p[f.k]=r2(list.reduce((s,a)=>s+(a[f.k]||0),0));
    for(const k of ['pauseTotaleMin','joursVides','nbHorsColonne','pausesInconnues']) p[k]=list.reduce((s,a)=>s+(a[k]||0),0);
    p.rhrEnCours=p.rhr.filter(x=>x.enCours&&!x.fin).length;
    p.amplitudeMoyenne=p.joursService?r2(p.amplitudeTotale/p.joursService):0;
    p.amplitudeMax=r2(Math.max(0,...list.map(a=>a.amplitudeMax||0)));
    const pr=list.map(a=>a.priseServicePlusTot).filter(x=>x!=null), fi=list.map(a=>a.finServicePlusTard).filter(x=>x!=null);
    p.priseServicePlusTot=pr.length?Math.min(...pr):null; p.finServicePlusTard=fi.length?Math.max(...fi):null;
    const sumObj=k=>list.reduce((o,a)=>{for(const [x,v] of Object.entries(a[k]||{})) o[x]=(o[x]||0)+v; return o;},{});
    p.codeCounts=sumObj('codeCounts'); p.typesMission=sumObj('typesMission'); p.destinations=sumObj('destinations');
    p.ratioPanierJS=p.joursService?r2(p.nbPaniers/p.joursService):0;
    out.push(p);
