# Ancien réveil du site principal. Remplacé (demandé par l'utilisateur) par une tâche planifiée dans Supabase
# (pg_cron + pg_net, tâche « reveil-recap-corridor ») qui appelle /api/ping toutes les 10 minutes de 6 h à 23 h,
# heure de Paris : GitHub décalait souvent ses passages de plusieurs heures et le site s'endormait.
# Gardé seulement pour un réveil manuel (onglet Actions → « Run workflow »).
name: Garder le site éveillé
on:
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://recap-corridor.onrender.com/api/ping
